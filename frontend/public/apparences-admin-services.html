<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Morex page services</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/src/styles/morex.css">
<link rel="stylesheet" href="/src/styles/admin.css">
<style>
  .switch { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 50; display: flex; gap: 6px; padding: 8px; border-radius: 999px; background: rgb(15 23 42 / .92); border: 1px solid rgb(255 255 255 / .2); box-shadow: 0 10px 30px rgb(0 0 0 / .5); backdrop-filter: blur(12px); }
  .switch span { align-self: center; font-size: 12.5px; color: rgb(255 255 255 / .6); padding: 0 8px; }
  .switch button { font: inherit; font-size: 13px; padding: 8px 15px; border-radius: 999px; border: 0; background: transparent; color: #fff; cursor: pointer; } .switch button.on { background: #fff; color: #1e1b4b; font-weight: 600; }
  .ic { width: var(--s, 44px); height: var(--s, 44px); border-radius: 14px; display: grid; place-items: center; font-size: calc(var(--s, 44px) * .45); flex: none; background: linear-gradient(135deg, color-mix(in srgb, var(--c) 70%, transparent), color-mix(in srgb, var(--c) 25%, transparent)); box-shadow: 0 8px 20px -8px var(--c), inset 0 1px 0 rgb(255 255 255 / .25); }
  .sum { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 24px; }
  .sum > div { padding: 20px 22px; border-radius: 20px; background: rgb(255 255 255 / .08); border: 1px solid rgb(255 255 255 / .14); backdrop-filter: blur(22px); position: relative; overflow: hidden; }
  .sum > div::before { content: ''; position: absolute; inset: 0 0 auto; height: 3px; background: var(--k); box-shadow: 0 0 12px var(--k); }
  .sum b { display: block; font-size: 34px; font-weight: 600; } .sum span { font-size: 13.5px; color: rgb(255 255 255 / .65); }
  .hbar { height: 8px; border-radius: 99px; background: rgb(255 255 255 / .08); overflow: hidden; display: flex; } .hbar i { display: block; height: 100%; } .hbar .g { background: #34d399; } .hbar .r { background: #f87171; }
  /* 1 cartes */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
  .sc { padding: 22px; display: flex; flex-direction: column; gap: 14px; position: relative; overflow: hidden; transition: transform .2s; }
  .sc:hover { transform: translateY(-4px); }
  .sc::after { content: ''; position: absolute; right: -60px; top: -60px; width: 180px; height: 180px; border-radius: 50%; background: radial-gradient(circle, var(--c), transparent 70%); opacity: .3; pointer-events: none; }
  .sc .top { display: flex; align-items: center; gap: 14px; } .sc .top b { font-size: 18px; display: block; } .sc .top small { color: rgb(255 255 255 / .6); font-size: 13px; }
  .sc .nums { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; } .sc .nums div { padding: 10px; border-radius: 14px; background: rgb(255 255 255 / .05); text-align: center; } .sc .nums b { display: block; font-size: 22px; } .sc .nums span { font-size: 11.5px; color: rgb(255 255 255 / .6); }
  .sc code { font-size: 11.5px; color: #fecaca; background: rgb(127 29 29 / .3); padding: 6px 10px; border-radius: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .state { font-size: 13px; font-weight: 600; } .state.ok { color: #6ee7b7; } .state.ko { color: #fca5a5; }
  /* 2 liste + fiche */
  .md { display: grid; grid-template-columns: minmax(300px, 380px) minmax(0, 1fr); gap: 24px; align-items: start; }
  .sl { padding: 12px; display: flex; flex-direction: column; gap: 4px; }
  .sli { display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-radius: 18px; cursor: pointer; border: 1px solid transparent; position: relative; transition: background .2s, transform .2s; }
  .sli:hover { background: rgb(255 255 255 / .06); } .sli.on { background: linear-gradient(90deg, color-mix(in srgb, var(--c) 30%, transparent), transparent); border-color: color-mix(in srgb, var(--c) 50%, transparent); transform: translateX(4px); }
  .sli b { display: block; font-size: 15px; } .sli small { font-size: 12.5px; color: rgb(255 255 255 / .55); } .sli .g { flex: 1; } .sli .n { text-align: right; font-size: 11.5px; color: rgb(255 255 255 / .5); } .sli .n b { font-size: 17px; color: #fff; }
  .sli .dot { width: 10px; height: 10px; border-radius: 50%; background: #34d399; box-shadow: 0 0 8px #34d399; } .sli .dot.ko { background: #f87171; box-shadow: 0 0 8px #f87171; }
  .fs { padding: 34px; position: relative; overflow: hidden; }
  .fs .orb { position: absolute; right: -140px; top: -170px; width: 460px; height: 460px; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--c) 50%, transparent), transparent 68%); pointer-events: none; }
  .fs .id { display: flex; align-items: center; gap: 24px; position: relative; } .fs h3 { margin: 0; font-size: 34px; letter-spacing: -.02em; } .fs .id p { margin: 4px 0 0; color: rgb(255 255 255 / .65); }
  .kv4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin: 28px 0; position: relative; }
  .kv4 > div { padding: 18px 20px; border-radius: 18px; background: rgb(255 255 255 / .05); border: 1px solid rgb(255 255 255 / .08); position: relative; overflow: hidden; } .kv4 > div::before { content: ''; position: absolute; inset: 0 0 auto; height: 3px; background: var(--k); box-shadow: 0 0 12px var(--k); }
  .kv4 b { display: block; font-size: 32px; font-weight: 600; } .kv4 span { font-size: 13px; color: rgb(255 255 255 / .6); }
  .types .t { display: grid; grid-template-columns: 200px 1fr 40px; gap: 14px; align-items: center; margin: 12px 0; font-size: 14.5px; }
  .types .bar { height: 10px; border-radius: 99px; background: rgb(255 255 255 / .08); overflow: hidden; } .types .bar i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--c), color-mix(in srgb, var(--c) 40%, #fff)); box-shadow: 0 0 10px var(--c); }
  .ttl { font-size: 12.5px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--a2, #38bdf8); margin: 6px 0 12px; }
  .errbox { padding: 16px 18px; border-radius: 16px; border: 1px dashed rgb(248 113 113 / .5); background: rgb(127 29 29 / .18); margin-top: 22px; } .errbox code { display: block; margin-top: 6px; font-size: 12.5px; color: #fecaca; }
  .okbox { padding: 16px 18px; border-radius: 16px; background: rgb(52 211 153 / .1); border: 1px solid rgb(52 211 153 / .3); color: #a7f3d0; margin-top: 22px; }
  /* 3 orbite + fiche */
  .os { position: relative; height: 560px; border-radius: 24px; overflow: hidden; background: radial-gradient(ellipse at 50% 50%, rgb(99 102 241 / .3), transparent 65%), rgb(2 6 23 / .65); border: 1px solid rgb(255 255 255 / .1); }
  .os .ring { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); border-radius: 50%; border: 1px dashed rgb(255 255 255 / .1); }
  .os .sun { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 100px; height: 100px; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 35% 30%, #fff7cc, #fde047 50%, #f59e0b); box-shadow: 0 0 60px #fde047; color: #78350f; font-weight: 800; }
  .os .pl { position: absolute; transform: translate(-50%, -50%); border-radius: 50%; display: grid; place-items: center; cursor: pointer; transition: transform .25s; background: radial-gradient(circle at 34% 30%, #fff, var(--c) 40%, color-mix(in srgb, var(--c) 30%, #0f172a)); box-shadow: 0 0 24px var(--c); font-size: 20px; }
  .os .pl:hover, .os .pl.on { transform: translate(-50%, -50%) scale(1.18); } .os .pl.on { box-shadow: 0 0 0 4px rgb(255 255 255 / .4), 0 0 34px var(--c); }
  .os .pl.ko { outline: 2px solid #f87171; outline-offset: 5px; animation: ko 1.6s infinite; } @keyframes ko { 50% { outline-color: rgb(248 113 113 / .2); } }
  .os .pl b { position: absolute; top: 100%; margin-top: 8px; font-size: 12.5px; white-space: nowrap; font-weight: 600; }
  .os .hint { position: absolute; left: 24px; bottom: 18px; font-size: 13px; color: rgb(255 255 255 / .6); }
  .md3 { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 24px; align-items: start; }
</style>
</head>
<body class="morex" data-theme="galaxy">
<div id="app"></div>
<div class="switch" id="switch"></div>
<script>
const S = [
  { k: 'rss', n: 'Actus', i: '📰', c: '#f97316', w: 47, u: 6, e: 4, err: 'Feed https://example.org/rss returned HTTP 404', types: [['Actualités', 47]] },
  { k: 'market_data', n: 'Bourse', i: '₿', c: '#f59e0b', w: 14, u: 5, e: 2, err: 'CoinGecko returned HTTP 429 (too many requests)', types: [['Cours d\'une crypto', 8], ['Historique de prix', 4], ['Taux de change', 2]] },
  { k: 'weather', n: 'Météo', i: '☀️', c: '#0ea5e9', w: 13, u: 8, e: 0, types: [['Météo actuelle', 6], ['Météo de la semaine', 5], ['Météo heure par heure', 2]] },
  { k: 'github', n: 'GitHub', i: '🐙', c: '#a78bfa', w: 12, u: 4, e: 0, types: [['Derniers commits', 5], ['Ce qui a changé', 3], ['Issues ouvertes', 2], ['Statistiques du dépôt', 2]] },
  { k: 'youtube', n: 'YouTube', i: '▶', c: '#ff0033', w: 8, u: 3, e: 0, types: [['Statistiques de la chaîne', 4], ['Dernières vidéos', 3], ['Tendances', 1]] },
  { k: 'wellbeing', n: 'Bien-être', i: '✨', c: '#ec4899', w: 6, u: 4, e: 0, types: [['Horoscope', 3], ['Citation du jour', 2], ['Le savais-tu ?', 1]] },
  { k: 'calendar', n: 'Agenda', i: '📅', c: '#f43f5e', w: 4, u: 2, e: 0, types: [['Prochain événement', 4]] },
  { k: 'custom_api', n: 'API perso', i: '{ }', c: '#10b981', w: 4, u: 2, e: 1, err: 'Request timed out after 10 s', types: [['Une valeur', 3], ['Une liste', 1]] },
  { k: 'worldclock', n: 'Horloge', i: '🌍', c: '#6366f1', w: 3, u: 3, e: 0, types: [['Heure du monde', 3]] },
]
const TOT = S.reduce((n, s) => n + s.w, 0), BAD = S.filter((s) => s.e).length
const ic = (s, size = 44) => `<span class="ic" style="--c:${s.c};--s:${size}px">${s.i}</span>`
const health = (s) => `<div class="hbar"><i class="g" style="width:${(s.w - s.e) / s.w * 100}%"></i><i class="r" style="width:${s.e / s.w * 100}%"></i></div>`
const state = (s) => s.e ? `<span class="state ko">⚠ ${s.e} widget${s.e > 1 ? 's' : ''} en erreur sur ${s.w}</span>` : '<span class="state ok">● tout va bien</span>'
const summary = () => `<div class="sum"><div style="--k:#a78bfa"><b>${S.length}</b><span>services utilisés</span></div><div style="--k:#38bdf8"><b>${TOT}</b><span>widgets au total</span></div><div style="--k:#34d399"><b>${S.length - BAD}</b><span>services en bonne santé</span></div><div style="--k:#f87171"><b>${BAD}</b><span>services avec des erreurs</span></div></div>`
function sheet(s) {
  const mx = Math.max(...s.types.map((t) => t[1]))
  return `<div class="adm-glass fs" style="--c:${s.c}"><div class="orb"></div><div class="id">${ic(s, 96)}<div><h3>${s.n}</h3><p>${s.w} widgets chez ${s.u} comptes · ${Math.round(s.w / TOT * 100)} % de tous les widgets</p></div></div>
    <div class="kv4"><div style="--k:${s.c}"><b>${s.w}</b><span>widgets</span></div><div style="--k:#38bdf8"><b>${s.u}</b><span>comptes qui l'utilisent</span></div><div style="--k:#34d399"><b>${s.w - s.e}</b><span>fonctionnent</span></div><div style="--k:#f87171"><b>${s.e}</b><span>en erreur</span></div></div>
    <p class="ttl">Les widgets les plus utilisés</p><div class="types" style="--c:${s.c}">${s.types.map(([n, v]) => `<div class="t"><span>${n}</span><span class="bar"><i style="width:${v / mx * 100}%"></i></span><b>${v}</b></div>`).join('')}</div>
    ${s.e ? `<div class="errbox"><b style="color:#fecaca">⚠ ${s.e} widget${s.e > 1 ? 's' : ''} n'arrive${s.e > 1 ? 'nt' : ''} plus à se mettre à jour</b><code>Dernière erreur : ${s.err}</code></div>` : '<div class="okbox">● Tous ses widgets se sont mis à jour sans problème</div>'}</div>`
}
let sel = 0, v = +(location.hash.slice(1) || 1)
const V = {
  1: ['Cartes', () => `${summary()}<div class="cards">${S.map((s) => `<div class="adm-glass sc" style="--c:${s.c}"><div class="top">${ic(s, 52)}<div><b>${s.n}</b><small>${s.u} compte${s.u > 1 ? 's' : ''} · ${Math.round(s.w / TOT * 100)} % des widgets</small></div></div>
    <div class="nums"><div><b>${s.w}</b><span>widgets</span></div><div><b>${s.w - s.e}</b><span>ok</span></div><div><b style="color:${s.e ? '#fca5a5' : '#fff'}">${s.e}</b><span>en erreur</span></div></div>${health(s)}${state(s)}${s.e ? `<code title="${s.err}">${s.err}</code>` : ''}</div>`).join('')}</div>`],
  2: ['Liste + fiche', () => `${summary()}<div class="md"><div class="adm-glass sl">${S.map((s, i) => `<div class="sli ${i === sel ? 'on' : ''}" style="--c:${s.c}" data-sel="${i}">${ic(s, 42)}<div class="g"><b>${s.n}</b><small>${s.u} compte${s.u > 1 ? 's' : ''}</small></div><span class="dot ${s.e ? 'ko' : ''}"></span><span class="n"><b>${s.w}</b><br>widgets</span></div>`).join('')}</div>${sheet(S[sel])}</div>`],
  3: ['Orbite + fiche', () => { const mx = Math.max(...S.map((s) => s.w))
    return `${summary()}<div class="md3"><div class="os"><span class="ring" style="width:300px;height:300px"></span><span class="ring" style="width:520px;height:460px"></span><div class="sun">MOREX</div>
      ${S.map((s, i) => { const a = i / S.length * Math.PI * 2 - Math.PI / 2, inner = i % 2 === 0, rx = inner ? 150 : 260, ry = inner ? 150 : 230, sz = 40 + s.w / mx * 40
        return `<span class="pl ${s.e ? 'ko' : ''} ${i === sel ? 'on' : ''}" data-sel="${i}" style="--c:${s.c};width:${sz}px;height:${sz}px;left:calc(50% + ${Math.cos(a) * rx}px);top:calc(50% + ${Math.sin(a) * ry}px)">${s.i}<b>${s.n}</b></span>` }).join('')}
</div>${sheet(S[sel])}</div>` }],
}
const ICON = { overview: '<circle cx="12" cy="12" r="3.2" fill="currentColor"/><ellipse cx="12" cy="12" rx="9.5" ry="3.6" fill="none" stroke="currentColor" stroke-width="1.5" transform="rotate(-20 12 12)"/>', accounts: '<circle cx="7" cy="8" r="2" fill="currentColor"/><circle cx="17" cy="7" r="1.6" fill="currentColor"/><circle cx="13" cy="16" r="2.2" fill="currentColor"/><circle cx="5" cy="17" r="1.3" fill="currentColor"/>', services: '<circle cx="12" cy="12" r="2.6" fill="currentColor"/><circle cx="12" cy="12" r="6" fill="none" stroke="currentColor" opacity=".5"/><circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" opacity=".35"/><circle cx="18" cy="12" r="1.5" fill="currentColor"/>', moderation: '<path d="M12 2.5 19.5 5.5v6c0 4.6-3.2 8.3-7.5 10-4.3-1.7-7.5-5.4-7.5-10v-6Z" fill="none" stroke="currentColor" stroke-width="1.5"/>' }
function draw() {
  const nav = [['overview', 'Vue d’ensemble'], ['accounts', 'Comptes'], ['services', 'Services'], ['moderation', 'Modération']].map(([k, l]) => `<button class="${k === 'services' ? 'on' : ''}"><span><svg viewBox="0 0 24 24">${ICON[k]}</svg><span class="adm-label-txt">${l}</span></span></button>`).join('')
  document.getElementById('app').innerHTML = `<div class="adm"><aside class="adm-glass adm-side"><div class="adm-brand"><img src="/logo.svg" alt=""><span class="adm-label-txt">Morex<small>console admin</small></span><button class="adm-fold"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2"/></svg></button></div>${nav}
    <div class="adm-me"><img src="https://api.dicebear.com/9.x/avataaars/svg?seed=Morayo&backgroundColor=c0aede" alt=""><div class="adm-label-txt"><b>Morayo</b><small>admin</small></div></div><a class="adm-back" href="#"><span>←</span><span class="adm-label-txt">Retour au dashboard</span></a></aside>
    <main class="adm-main"><div class="adm-crumb"><div class="adm-langs"><button class="on">FR</button><button>EN</button><button>ES</button></div></div>${V[v][1]()}</main></div>`
  document.getElementById('switch').innerHTML = '<span>Page Services :</span>' + Object.entries(V).map(([k, [n]]) => `<button class="${+k === v ? 'on' : ''}" data-v="${k}">${k} · ${n}</button>`).join('')
}
document.addEventListener('click', (e) => { const a = e.target.closest('[data-sel]'); if (a) { sel = +a.dataset.sel; draw() } const b = e.target.closest('[data-v]'); if (b) { v = +b.dataset.v; location.hash = v; draw() } })
draw()
</script>
</body>
</html>
