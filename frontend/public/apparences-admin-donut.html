<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Morex donut fun</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; font-family: Poppins, system-ui, sans-serif; color: #fff; background-color: #020617;
    background: linear-gradient(rgb(2 6 23 / .45), rgb(2 6 23 / .7)), url(/accueil_photo.jpg) 50% 28%/cover fixed; }
  h1 { text-align: center; font-weight: 600; margin: 0; padding-top: 28px; }
  .lead { text-align: center; color: rgb(255 255 255 / .75); margin: 8px auto 18px; font-size: 14px; max-width: 860px; padding: 0 16px; }
  .ctl { display: flex; justify-content: center; gap: 8px; margin-bottom: 24px; flex-wrap: wrap; }
  .ctl button { font: inherit; font-size: 13.5px; padding: 8px 18px; border-radius: 999px; border: 1px solid rgb(255 255 255 / .25); background: transparent; color: #fff; cursor: pointer; }
  .ctl button.on { background: #fff; color: #1e1b4b; font-weight: 600; }
  .wrap { max-width: 1500px; margin: 0 auto; padding: 0 28px 80px; display: grid; grid-template-columns: 1fr 1fr; gap: 26px; }
  @media (max-width: 1100px) { .wrap { grid-template-columns: 1fr; } }
  .num { display: inline-block; font-size: 13px; font-weight: 700; padding: 4px 12px; border-radius: 999px; background: #fff; color: #1e1b4b; margin: 0 0 10px 6px; }
  .num span { font-weight: 400; margin-left: 6px; }
  .glass { background: rgb(255 255 255 / .08); border: 1px solid rgb(255 255 255 / .14); border-radius: 24px; backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); }
  .card { padding: 24px 28px; min-height: 360px; position: relative; overflow: hidden; }
  .card h3 { margin: 0 0 10px; font-size: 17px; font-weight: 600; display: flex; gap: 8px; align-items: center; }
  .body { display: flex; align-items: center; gap: 34px; flex-wrap: wrap; }
  .legend { list-style: none; margin: 0; padding: 0; font-size: 15px; flex: 1; min-width: 220px; }
  .legend li { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 14px; cursor: pointer; transition: background .2s, transform .2s; }
  .legend li:hover, .legend li.hl { background: rgb(255 255 255 / .08); transform: translateX(4px); }
  .legend .e { font-size: 18px; width: 24px; text-align: center; } .legend b { margin-left: auto; } .legend em { font-style: normal; color: rgb(255 255 255 / .55); font-size: 13px; width: 48px; text-align: right; }
  .legend li.zero { opacity: .45; }
  svg.d { width: 250px; height: 250px; flex: none; overflow: visible; }
  .arc { transition: stroke-width .25s, filter .25s, opacity .25s; cursor: pointer; }
  .dim .arc:not(.hl) { opacity: .3; }
  .arc.hl { stroke-width: 30; }
  /* entrée : les arcs se dessinent */
  .draw .arc { animation: draw 1.2s cubic-bezier(.2, .8, .2, 1) both; }
  @keyframes draw { from { stroke-dasharray: 0 999; } }
  .center { transition: opacity .2s; }
  /* 1 satellite */
  .sat { transform-origin: 125px 125px; animation: orbit 9s linear infinite; }
  @keyframes orbit { to { transform: rotate(360deg); } }
  /* 2 planète */
  .tilt { transform: perspective(600px) rotateX(64deg); transform-origin: center; }
  .planet { position: relative; width: 300px; height: 260px; flex: none; display: grid; place-items: center; }
  .planet .ball { position: absolute; width: 120px; height: 120px; border-radius: 50%; display: grid; place-items: center; text-align: center; z-index: 2;
    background: radial-gradient(circle at 34% 30%, #fff 0, #c4b5fd 18%, #6366f1 55%, #1e1b4b 100%); box-shadow: 0 0 50px rgb(129 140 248 / .7), inset -14px -16px 30px rgb(0 0 0 / .45); }
  .planet .ball b { font-size: 40px; line-height: 1; } .planet .ball small { font-size: 12px; opacity: .8; }
  .planet svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .planet .front { z-index: 3; } .planet .back { z-index: 1; }
  .spin { transform-origin: 150px 130px; animation: orbit 30s linear infinite; }
  /* 3 bulles */
  .bub { position: absolute; transform: translate(-50%, -50%); width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-size: 18px; background: rgb(15 23 42 / .9); border: 2px solid; box-shadow: 0 6px 16px rgb(0 0 0 / .4); animation: bob 2.6s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translate(-50%, -62%); } }
  .avs { display: flex; justify-content: center; margin-top: 4px; } .avs i { width: 26px; height: 26px; border-radius: 50%; border: 2px solid #1e1b4b; margin-left: -8px; background-size: cover; }
  /* 4 étoiles en orbite */
  .twinkle { animation: tw 2.4s ease-in-out infinite; } @keyframes tw { 50% { opacity: .5; } }
  .ring-spin { transform-origin: 125px 125px; animation: orbit 40s linear infinite; }
  .hint { position: absolute; right: 22px; bottom: 16px; font-size: 12px; color: rgb(255 255 255 / .5); }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #1e1b4b; border: 1px solid rgb(255 255 255 / .2); padding: 10px 18px; border-radius: 14px; font-size: 13px; display: none; }
</style>
</head>
<body>
<h1>Le donut lumineux, en plus fun</h1>
<p class="lead">4 versions animées. Survole une part ou une ligne de la légende : la part grossit et le centre affiche son chiffre. Clique : ça ouvre la page Comptes filtrée. Le bouton « Rejouer » relance l'animation d'entrée, et tu peux tester avec d'autres chiffres.</p>
<div class="ctl" id="ctl"></div>
<div class="wrap" id="w"></div>
<div class="toast" id="toast"></div>
<script>
const SETS = {
  now: { label: 'Tes chiffres (6 comptes)', v: [5, 1, 0, 0] },
  busy: { label: 'Avec du monde (24 comptes)', v: [15, 2, 4, 3] },
}
let set = 'busy'
const META = [['Actifs', '#34d399', '😊'], ['Admins', '#a78bfa', '★'], ['Non confirmés', '#fbbf24', '⏳'], ['Suspendus', '#f87171', '⛔']]
const AV = (seed) => `https://api.dicebear.com/9.x/avataaars/svg?seed=${seed}&backgroundColor=c0aede,b6e3f4,ffd5dc`
const parts = () => META.map(([l, c, e], i) => ({ l, c, e, v: SETS[set].v[i], i }))
const total = () => SETS[set].v.reduce((a, b) => a + b, 0)
const pct = (v) => Math.round(v / (total() || 1) * 100)

// arcs autour de (cx, cy)
function arcs(cx, cy, r, w, gap = 5, cls = 'arc') {
  const C = 2 * Math.PI * r; let off = 0
  return parts().filter((p) => p.v).map((p) => { const len = p.v / total() * C
    const s = `<circle class="${cls}" data-i="${p.i}" cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${p.c}" stroke-width="${w}" stroke-linecap="round" stroke-dasharray="${Math.max(len - gap, 1)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 ${cx} ${cy})" style="filter:drop-shadow(0 0 10px ${p.c}aa)"/>`
    off += len; return s }).join('')
}
const legend = () => `<ul class="legend">${parts().map((p) => `<li data-i="${p.i}" class="${p.v ? '' : 'zero'}"><span class="e">${p.e}</span><i style="width:12px;height:12px;border-radius:4px;background:${p.c};box-shadow:0 0 8px ${p.c}"></i>${p.l}<b>${p.v}</b><em>${pct(p.v)} %</em></li>`).join('')}</ul>`
const center = (cx, cy, big = 46) => `<g class="center"><text class="cv" x="${cx}" y="${cy + 6}" text-anchor="middle" font-size="${big}" font-weight="700" fill="#fff">${total()}</text><text class="cl" x="${cx}" y="${cy + 32}" text-anchor="middle" font-size="14" fill="rgb(255 255 255 / .65)">comptes</text></g>`

const V = [
  ['Le satellite', 'les parts se dessinent à l\'arrivée, un petit satellite fait le tour, le survol met une part en avant', () => `
    <div class="body"><svg class="d" viewBox="0 0 250 250"><circle cx="125" cy="125" r="96" fill="none" stroke="rgb(255 255 255 / .06)" stroke-width="24"/>${arcs(125, 125, 96, 24)}
      <circle cx="125" cy="125" r="122" fill="none" stroke="rgb(255 255 255 / .12)" stroke-dasharray="2 6"/>
      <g class="sat"><circle cx="125" cy="3" r="6" fill="#fff" style="filter:drop-shadow(0 0 8px #fff)"/><path d="M110 3 h-26" stroke="url(#tr)" stroke-width="2" stroke-linecap="round"/></g>
      <defs><linearGradient id="tr"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".8"/></linearGradient></defs>${center(125, 125)}</svg>${legend()}</div>`],
  ['La planète à anneaux', 'le total est une planète, la répartition devient son anneau incliné qui tourne lentement', () => `
    <div class="body"><div class="planet"><svg class="back" viewBox="0 0 300 260"><g class="tilt"><g class="spin">${arcs(150, 130, 120, 18, 6)}</g></g></svg>
      <div class="ball"><div><b class="cvp">${total()}</b><br><small class="clp">comptes</small></div></div>
      <svg class="front" viewBox="0 0 300 260" style="clip-path:inset(50% 0 0 0)"><g class="tilt"><g class="spin">${arcs(150, 130, 120, 18, 6)}</g></g></svg></div>${legend()}</div>`],
  ['Les bulles', 'chaque part porte son emoji qui flotte doucement, et des visages au centre', () => {
    const C = 2 * Math.PI; let off = 0
    const bubbles = parts().filter((p) => p.v).map((p) => { const a = (off + p.v / total() / 2) * C - Math.PI / 2; off += p.v / total()
      return `<span class="bub" style="left:${(125 + Math.cos(a) * 96) / 250 * 100}%;top:${(125 + Math.sin(a) * 96) / 250 * 100}%;border-color:${p.c};animation-delay:${-p.i * .6}s">${p.e}</span>` }).join('')
    return `<div class="body"><div style="position:relative;width:250px;height:250px;flex:none"><svg class="d" viewBox="0 0 250 250"><circle cx="125" cy="125" r="96" fill="none" stroke="rgb(255 255 255 / .06)" stroke-width="28"/>${arcs(125, 125, 96, 28, 8)}${center(125, 112, 42)}</svg>
      <div style="position:absolute;left:0;right:0;top:150px" class="avs">${['Ada', 'Kofi', 'Yuki', 'Lucia'].map((s) => `<i style="background-image:url(${AV(s)})"></i>`).join('')}</div>${bubbles}</div>${legend()}</div>` }],
  ['La galaxie', 'une étoile par compte tourne sur l\'orbite extérieure, de la couleur de son statut', () => {
    const stars = []; parts().forEach((p) => { for (let k = 0; k < p.v; k++) stars.push(p) })
    const dots = stars.map((p, k) => { const a = k / stars.length * 2 * Math.PI - Math.PI / 2; return `<circle class="twinkle st" data-i="${p.i}" cx="${125 + Math.cos(a) * 120}" cy="${125 + Math.sin(a) * 120}" r="${p.i === 1 ? 6 : 4.5}" fill="${p.c}" style="filter:drop-shadow(0 0 6px ${p.c});animation-delay:${-k * .3}s"/>` }).join('')
    return `<div class="body"><svg class="d" viewBox="0 0 250 250"><defs><radialGradient id="neb"><stop offset="0" stop-color="#818cf8" stop-opacity=".45"/><stop offset="1" stop-color="#818cf8" stop-opacity="0"/></radialGradient></defs>
      <circle cx="125" cy="125" r="80" fill="url(#neb)"/><circle cx="125" cy="125" r="88" fill="none" stroke="rgb(255 255 255 / .06)" stroke-width="20"/>${arcs(125, 125, 88, 20)}
      <circle cx="125" cy="125" r="120" fill="none" stroke="rgb(255 255 255 / .1)"/><g class="ring-spin">${dots}</g>${center(125, 125)}</svg>${legend()}</div>` }],
]

function draw() {
  document.getElementById('ctl').innerHTML = Object.entries(SETS).map(([k, s]) => `<button class="${set === k ? 'on' : ''}" data-set="${k}">${s.label}</button>`).join('') + '<button data-replay>↻ Rejouer</button>'
  document.getElementById('w').innerHTML = V.map(([n, why, f], i) => `<section><span class="num">${i + 1} · ${n}<span>${why}</span></span><div class="glass card draw" data-card="${i}"><h3>🍩 Répartition</h3>${f()}<span class="hint">survole une part</span></div></section>`).join('')
}
function focus(card, i) {
  card.classList.toggle('dim', i != null)
  card.querySelectorAll('[data-i]').forEach((el) => el.classList.toggle('hl', i != null && el.dataset.i === String(i)))
  const p = i == null ? null : parts()[i]
  card.querySelectorAll('.cv,.cvp').forEach((el) => (el.textContent = p ? p.v : total()))
  card.querySelectorAll('.cl,.clp').forEach((el) => { el.textContent = p ? p.l.toLowerCase() : 'comptes'; if (el.setAttribute) el.setAttribute('fill', p ? p.c : 'rgb(255 255 255 / .65)'); if (el.style) el.style.color = p ? p.c : '' })
}
document.addEventListener('mouseover', (e) => { const card = e.target.closest('[data-card]'); if (!card) return; const t = e.target.closest('[data-i]'); focus(card, t ? +t.dataset.i : null) })
document.addEventListener('mouseleave', () => document.querySelectorAll('[data-card]').forEach((c) => focus(c, null)), true)
document.addEventListener('click', (e) => {
  const s = e.target.closest('[data-set]'); if (s) { set = s.dataset.set; draw(); return }
  if (e.target.closest('[data-replay]')) { draw(); return }
  const t = e.target.closest('[data-card] [data-i]'); if (t) { const el = document.getElementById('toast'); el.textContent = `→ Comptes, filtre « ${parts()[+t.dataset.i].l} »`; el.style.display = 'block'; setTimeout(() => (el.style.display = 'none'), 1800) }
})
draw()
</script>
</body>
</html>
