<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Morex weather forecast</title>
<link rel="icon" type="image/svg+xml" href="/logo.svg" />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Caveat:wght@600;700&display=swap" rel="stylesheet" />
<style>
  :root { --a1: #818cf8; --a2: #38bdf8; --glow: 99 102 241; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; font-family: Poppins, system-ui, sans-serif; color: #fff; background-color: #020617;
    background: linear-gradient(rgb(2 6 23 / .62), rgb(15 12 50 / .8)), url(/accueil_photo.jpg) 50% 28%/cover fixed; }
  h1 { text-align: center; font-weight: 600; margin: 0; padding-top: 36px; }
  .lead { text-align: center; color: rgb(255 255 255 / .65); margin: 8px auto 26px; max-width: 820px; }
  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 22px; max-width: 1250px; margin: 0 auto; padding: 0 20px 60px; }
  @media (max-width: 1000px) { .grid { grid-template-columns: 1fr; } }
  .opt { min-width: 0; } .opt > p { margin: 10px 0 0; font-size: 13px; color: rgb(255 255 255 / .65); } .opt > p b { color: #fff; }
  .card { position: relative; overflow: hidden; border-radius: 24px; padding: 18px; height: 380px; display: flex; flex-direction: column; gap: 10px;
    background: rgb(255 255 255 / .08); border: 1px solid rgb(255 255 255 / .14); backdrop-filter: blur(22px); }
  .s { font-size: 11.5px; color: rgb(255 255 255 / .65); } .tab { font-variant-numeric: tabular-nums; }
  .ai { display: inline-flex; align-items: center; gap: 5px; font-size: 9.5px; letter-spacing: .16em; text-transform: uppercase; color: #c4b5fd; }
  .ai svg { width: 10px; height: 10px; fill: #a78bfa; }

  /* 1 living sky driven by the weather code */
  .sky { border: 0; }
  .sky.clear { background: linear-gradient(170deg, #0284c7, #38bdf8 60%, #fcd34d 135%); }
  .sky.cloudy { background: linear-gradient(170deg, #475569, #64748b 55%, #94a3b8 130%); }
  .sky.rain { background: linear-gradient(170deg, #1e293b, #334155 60%, #475569 130%); }
  .sky.storm { background: linear-gradient(170deg, #0f172a, #312e81 70%, #4c1d95 130%); }
  .sky .fx { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .sky .sun { position: absolute; right: -40px; top: -40px; width: 170px; height: 170px; border-radius: 50%; background: radial-gradient(circle, #fff7cc 0 30%, #fde047 45%, rgb(253 224 71 / 0) 70%); animation: pulse 4s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.08); } }
  .sky .cloud { position: absolute; width: 140px; height: 46px; border-radius: 999px; background: rgb(255 255 255 / .55); filter: blur(2px); animation: drift 14s ease-in-out infinite alternate; }
  .sky .cloud::before, .sky .cloud::after { content: ""; position: absolute; border-radius: 50%; background: inherit; }
  .sky .cloud::before { width: 60px; height: 60px; left: 22px; top: -28px; } .sky .cloud::after { width: 46px; height: 46px; left: 70px; top: -20px; }
  @keyframes drift { from { translate: -24px 0; } to { translate: 24px 0; } }
  .sky .drop { position: absolute; top: -20px; width: 2px; height: 16px; border-radius: 2px; background: linear-gradient(transparent, rgb(186 230 253 / .8)); animation: fall 1s linear infinite; }
  @keyframes fall { to { transform: translateY(420px); } }
  .sky .body { position: relative; margin-top: auto; }
  .sky .big { font-size: 78px; font-weight: 700; line-height: 1; letter-spacing: -.04em; text-shadow: 0 2px 12px rgb(0 0 0 / .25); }
  .sky .week { position: relative; display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; padding: 10px 6px; border-radius: 16px; background: rgb(0 0 0 / .22); backdrop-filter: blur(8px); text-align: center; font-size: 11px; }
  .sky .week b { display: block; font-size: 13px; } .sky .week .ic { font-size: 18px; display: block; margin: 2px 0; }

  /* 2 chart */
  .bars { width: 100%; flex: 1; min-height: 150px; overflow: visible; }
  /* 3 advice */
  .adv .top { display: flex; align-items: center; gap: 14px; }
  .adv .ic { font-size: 56px; line-height: 1; filter: drop-shadow(0 0 16px rgb(253 224 71 / .45)); }
  .adv .big { font-size: 48px; font-weight: 600; line-height: 1; }
  .adv .note { padding: 12px 14px; border-radius: 16px; background: rgb(139 92 246 / .14); border: 1px solid rgb(167 139 250 / .28); font-size: 13px; line-height: 1.5; }
  .adv .wear { display: flex; gap: 8px; flex-wrap: wrap; }
  .adv .wear span { font-size: 12px; padding: 5px 11px; border-radius: 999px; background: rgb(255 255 255 / .1); }
  .adv .strip { margin-top: auto; display: flex; justify-content: space-between; font-size: 11px; text-align: center; }
  .adv .strip div { display: flex; flex-direction: column; gap: 2px; } .adv .strip .ic2 { font-size: 18px; }
</style>
</head>
<body>
<h1>Météo (widget de ton binôme), 3 propositions</h1>
<p class="lead">Un seul widget qui renvoie : la ville, la température actuelle, un code météo et les 5 prochains jours. Plus, si l’IA est activée, un conseil et quoi porter</p>
<div class="grid" id="app"></div>
<script>
const W = {"city": "Cotonou", "days": [{"max": 28, "min": 25, "date": "2026-09-26", "weatherCode": 51}, {"max": 27, "min": 26, "date": "2026-09-27", "weatherCode": 55}, {"max": 27, "min": 24, "date": "2026-09-28", "weatherCode": 80}, {"max": 27, "min": 25, "date": "2026-09-29", "weatherCode": 51}, {"max": 28, "min": 25, "date": "2026-09-30", "weatherCode": 51}], "country": "Benin", "temperature": 27, "weatherCode": 3}
// WMO code → condition (the backend sends the raw code; the frontend picks the look)
const cond = (c) => c === 0 ? 'clear' : c <= 2 ? 'partly' : c === 3 ? 'cloudy' : c <= 48 ? 'fog' : c <= 57 ? 'drizzle' : c <= 67 ? 'rain' : c <= 77 ? 'snow' : c <= 82 ? 'rain' : 'storm'
const ICON = { clear: '☀️', partly: '⛅', cloudy: '☁️', fog: '🌫️', drizzle: '🌦️', rain: '🌧️', snow: '❄️', storm: '⛈️' }
const LABEL = { clear: 'Ensoleillé', partly: 'Éclaircies', cloudy: 'Couvert', fog: 'Brouillard', drizzle: 'Bruine', rain: 'Averses', snow: 'Neige', storm: 'Orage' }
const day = (d) => new Date(`${d}T12:00`).toLocaleDateString('fr-FR', { weekday: 'short' }).replace('.', '')
const now = cond(W.weatherCode)
const skyKind = { clear: 'clear', partly: 'clear', cloudy: 'cloudy', fog: 'cloudy', drizzle: 'rain', rain: 'rain', snow: 'cloudy', storm: 'storm' }[now]
const hi = Math.max(...W.days.map((d) => d.max)), lo = Math.min(...W.days.map((d) => d.min)), span = Math.max(1, hi - lo)
// AI advice: filled by the backend's `insight` when AI is enabled (example based on the real forecast here)
const AI = { advice: 'Temps gris aujourd’hui, puis bruine et averses toute la semaine : prévois tes sorties le matin', outfit: ['☂️ Parapluie', '👕 Tenue légère', '👟 Chaussures fermées'] }
const aiTag = '<span class="ai"><svg viewBox="0 0 24 24"><path d="M12 2l2.2 7.8L22 12l-7.8 2.2L12 22l-2.2-7.8L2 12l7.8-2.2z"/></svg>Conseil par l’IA</span>'

const fx = () => {
  let h = ''
  if (skyKind === 'clear') h += '<span class="sun"></span>'
  if (skyKind !== 'clear' || now === 'partly') h += '<span class="cloud" style="left:10px;top:60px"></span><span class="cloud" style="left:150px;top:30px;transform:scale(.7);animation-delay:-6s"></span>'
  if (skyKind === 'rain' || skyKind === 'storm') h += Array.from({ length: 26 }, (_, i) => `<i class="drop" style="left:${(i * 37) % 100}%;animation-delay:-${(i * .13) % 1}s;animation-duration:${.8 + (i % 4) * .15}s"></i>`).join('')
  return `<div class="fx">${h}</div>`
}

const cards = [
  ['Ciel vivant + semaine', 'la carte devient le ciel selon le temps qu’il fait (soleil, nuages, pluie qui tombe, orage), avec la semaine en bas', `<div class="card sky ${skyKind}">${fx()}
    <div style="position:relative;font-weight:600">${W.city}, ${W.country}</div>
    <div class="body"><div class="big tab">${W.temperature}°</div><div style="font-weight:600">${ICON[now]} ${LABEL[now]} · demain ↑${W.days[0].max}° ↓${W.days[0].min}°</div></div>
    <div class="week">${W.days.map((d) => `<div><span style="text-transform:capitalize">${day(d.date)}</span><span class="ic">${ICON[cond(d.weatherCode)]}</span><b class="tab">${d.max}°</b><span class="tab" style="opacity:.7">${d.min}°</span></div>`).join('')}</div></div>`],
  ['Graphique', 'celui que tu avais choisi : la température maintenant, puis une barre par jour du min au max', `<div class="card">
    <div style="display:flex;align-items:center;gap:12px"><span style="font-size:44px;line-height:1">${ICON[now]}</span><div><div style="font-size:40px;font-weight:600;line-height:1" class="tab">${W.temperature}°</div><div class="s">${W.city} · ${LABEL[now]}</div></div></div>
    <svg class="bars" viewBox="0 0 300 190" role="img" aria-label="Températures des 5 prochains jours"><defs><linearGradient id="bar" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#fb923c"/></linearGradient></defs>
    ${W.days.map((d, i) => { const x = 30 + i * 60, y = (t) => 132 - ((t - lo) / span) * 92
      return `<rect x="${x - 11}" y="${y(d.max)}" width="22" height="${Math.max(8, y(d.min) - y(d.max))}" rx="11" fill="url(#bar)"/><text x="${x}" y="${y(d.max) - 7}" fill="#fff" font-size="12" text-anchor="middle">${d.max}°</text>
        <text x="${x}" y="${Math.max(y(d.min), y(d.max) + 8) + 15}" fill="rgb(255 255 255 / .6)" font-size="11" text-anchor="middle">${d.min}°</text><text x="${x}" y="168" font-size="16" text-anchor="middle">${ICON[cond(d.weatherCode)]}</text>
        <text x="${x}" y="186" fill="rgb(255 255 255 / .7)" font-size="10" text-anchor="middle">${day(d.date)}</text>` }).join('')}</svg></div>`],
  ['Conseil IA', 'le temps qu’il fait, puis ce que l’IA te conseille pour la journée et quoi emporter, et la semaine en bandeau', `<div class="card adv">
    <div class="s">${W.city}, ${W.country}</div><div class="top"><span class="ic">${ICON[now]}</span><div><div class="big tab">${W.temperature}°</div><div class="s">${LABEL[now]}</div></div></div>
    ${aiTag}<div class="note">${AI.advice}</div><div class="wear">${AI.outfit.map((o) => `<span>${o}</span>`).join('')}</div>
    <div class="strip">${W.days.map((d) => `<div><span class="s" style="text-transform:capitalize">${day(d.date)}</span><span class="ic2">${ICON[cond(d.weatherCode)]}</span><b class="tab">${d.max}°</b></div>`).join('')}</div></div>`],
]
document.getElementById('app').innerHTML = cards.map(([n, d, h], i) => `<div class="opt">${h}<p><b>${i + 1} · ${n}</b> : ${d}</p></div>`).join('')
</script>
</body>
</html>
