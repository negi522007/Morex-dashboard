<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Morex étoile IA</title>
<link rel="icon" type="image/svg+xml" href="/logo.svg" />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; font-family: Poppins, system-ui, sans-serif; color: #fff; background-color: #020617;
    background: linear-gradient(rgb(2 6 23 / .62), rgb(15 12 50 / .82)), url(/accueil_photo.jpg) 50% 28%/cover fixed; }
  h1 { text-align: center; font-weight: 600; margin: 0; padding-top: 36px; }
  .lead { text-align: center; color: rgb(255 255 255 / .7); margin: 8px auto 28px; max-width: 820px; padding: 0 16px; }
  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 22px; max-width: 1250px; margin: 0 auto; padding: 0 20px 60px; }
  @media (max-width: 1000px) { .grid { grid-template-columns: 1fr; } }
  .opt > p { margin: 12px 0 0; font-size: 13px; color: rgb(255 255 255 / .7); } .opt > p b { color: #fff; }
  .stage { position: relative; height: 260px; border-radius: 24px; overflow: hidden; border: 1px solid rgb(255 255 255 / .12);
    background: linear-gradient(rgb(2 6 23 / .3), rgb(2 6 23 / .6)), url(/sahara_night.jpeg) 50% 60%/cover; }
  .ghost { position: absolute; inset: 16px 16px 90px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; opacity: .22; } .ghost i { border-radius: 14px; background: rgb(255 255 255 / .25); }
  .spot { position: absolute; right: 22px; bottom: 22px; display: flex; align-items: center; gap: 10px; }
  /* the current star */
  .star { position: relative; width: 64px; height: 64px; flex: none; cursor: pointer; }
  .core { position: absolute; inset: 14px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff7cc, #fde047 50%, #f59e0b); box-shadow: 0 0 22px #fde047; display: grid; place-items: center; }
  .orbit { position: absolute; inset: 0; border-radius: 50%; border: 1px dashed rgb(253 224 71 / .5); animation: spin 5s linear infinite; }
  .orbit::after { content: '✦'; position: absolute; top: -9px; left: 50%; margin-left: -6px; font-size: 12px; color: #fde047; text-shadow: 0 0 8px #fde047; }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* 1 · chat bubble icon inside */
  .ic svg { width: 18px; height: 18px; } .ic .core { color: #78350f; }
  .typing { position: absolute; right: 4px; top: 2px; display: flex; gap: 2px; padding: 3px 5px; border-radius: 999px; background: #fff; box-shadow: 0 2px 6px rgb(0 0 0 / .3); }
  .typing i { width: 4px; height: 4px; border-radius: 50%; background: #7c3aed; animation: dot 1.2s infinite; } .typing i:nth-child(2) { animation-delay: .2s } .typing i:nth-child(3) { animation-delay: .4s }
  @keyframes dot { 50% { transform: translateY(-2px); opacity: .4; } }
  /* 2 · little face */
  .face .core::before, .face .core::after { content: ''; position: absolute; top: 13px; width: 5px; height: 7px; border-radius: 50%; background: #78350f; animation: blink 4s infinite; }
  .face .core::before { left: 11px; } .face .core::after { right: 11px; }
  .face .mouth { position: absolute; left: 50%; top: 22px; width: 10px; height: 5px; margin-left: -5px; border-bottom: 2px solid #78350f; border-radius: 0 0 10px 10px; }
  .face .cheek { position: absolute; top: 20px; width: 5px; height: 3px; border-radius: 50%; background: #fb7185; opacity: .7; } .face .cheek.l { left: 7px; } .face .cheek.r { right: 7px; }
  @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
  /* 3 · speech bubble that pops */
  .say { max-width: 190px; padding: 9px 13px; border-radius: 16px 16px 4px 16px; background: #fff; color: #1e1b4b; font-size: 12.5px; line-height: 1.4; box-shadow: 0 8px 20px rgb(0 0 0 / .35); animation: pop 5s ease-in-out infinite; transform-origin: bottom right; }
  .say b { color: #7c3aed; }
  @keyframes pop { 0%, 8% { transform: scale(0); opacity: 0; } 14%, 80% { transform: scale(1); opacity: 1; } 88%, 100% { transform: scale(0); opacity: 0; } }
  /* 4 · label pill */
  .pill { display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 14px; border-radius: 999px; background: rgb(15 23 42 / .88); border: 1px solid rgb(253 224 71 / .45); box-shadow: 0 0 18px rgb(253 224 71 / .25); font-size: 13px; font-weight: 500; white-space: nowrap; }
  .pill .star { width: 46px; height: 46px; } .pill .core { inset: 10px; }
  /* 5 · AI badge */
  .badge { position: absolute; right: -2px; top: 2px; padding: 2px 6px; border-radius: 999px; background: linear-gradient(135deg, #a78bfa, #ec4899); font-size: 10px; font-weight: 700; letter-spacing: .04em; box-shadow: 0 2px 8px rgb(0 0 0 / .4); }
  /* 6 · hover label */
  .hov .tip { position: absolute; right: 74px; bottom: 16px; padding: 7px 12px; border-radius: 12px; background: rgb(15 23 42 / .95); border: 1px solid rgb(255 255 255 / .2); font-size: 12.5px; white-space: nowrap; opacity: 0; transform: translateX(8px); transition: .25s; }
  .hov .tip::after { content: ''; position: absolute; right: -6px; top: 50%; margin-top: -6px; border: 6px solid transparent; border-left-color: rgb(15 23 42 / .95); border-right: 0; }
  .hov:hover .tip, .hov.demo .tip { opacity: 1; transform: none; }
  .hint { position: absolute; left: 16px; bottom: 14px; font-size: 11px; opacity: .6; }
</style>
</head>
<body>
<h1>L’étoile de l’IA : dire que c’est un assistant</h1>
<p class="lead">Aujourd’hui l’étoile est belle mais muette : on ne devine pas qu’on peut lui parler. Six idées pour le faire comprendre au premier coup d’œil (on peut en combiner deux)</p>
<div class="grid" id="g"></div>
<script>
const star = (inner = '', extra = '') => `<div class="star ${extra}"><span class="orbit"></span><span class="core">${inner}</span></div>`
const CHAT = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3C6.5 3 2 6.6 2 11c0 2.4 1.3 4.5 3.4 6L4.5 21l4.2-2.2c1 .3 2.1.4 3.3.4 5.5 0 10-3.6 10-8S17.5 3 12 3Z"/></svg>'
const ghost = `<div class="ghost">${'<i></i>'.repeat(6)}</div>`
const P = [
  ['Bulle de discussion', 'une petite icône de message dans l’étoile, et trois points qui « tapent » en haut, comme dans une messagerie', `<div class="spot ic"><div style="position:relative">${star(CHAT)}<span class="typing"><i></i><i></i><i></i></span></div></div>`],
  ['Petite frimousse', 'l’étoile a des yeux qui clignent, un sourire et des joues roses : on comprend que c’est « quelqu’un » à qui parler', `<div class="spot face">${star('<span class="cheek l"></span><span class="cheek r"></span><span class="mouth"></span>')}</div>`],
  ['Elle te parle', 'une bulle apparaît de temps en temps à côté : « Salut ! Une question ? Demande-moi ✨ », puis disparaît', `<div class="spot"><span class="say">Salut Asake ! <b>Une question ?</b> Demande-moi ✨</span>${star()}</div>`],
  ['Étiquette', 'l’étoile est dans une petite pilule avec écrit « Demande à Morex ✨ », toujours visible', `<div class="spot"><div class="pill">Demande à Morex ✨${star()}</div></div>`],
  ['Badge « IA »', 'un petit badge « IA » dégradé collé sur l’étoile, comme une notification : discret mais clair', `<div class="spot"><div style="position:relative">${star()}<span class="badge">IA</span></div></div>`],
  ['Au survol', 'rien ne change au repos, mais quand la souris passe dessus : « Discuter avec l’assistant Morex ✨ »', `<div class="spot hov demo" style="position:absolute"><span class="tip">Discuter avec l’assistant Morex ✨</span>${star()}</div>`],
]
document.getElementById('g').innerHTML = P.map(([n, d, h], i) => `<div class="opt"><div class="stage">${ghost}${h}${i === 5 ? '<span class="hint">(montré en permanence ici pour l’exemple)</span>' : ''}</div><p><b>${i + 1} · ${n}</b> : ${d}</p></div>`).join('')
</script>
</body>
</html>
