<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Morex rafraîchissement</title>
<link rel="icon" type="image/svg+xml" href="/logo.svg" />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; font-family: Poppins, system-ui, sans-serif; color: #fff; background-color: #020617;
    background: linear-gradient(rgb(2 6 23 / .62), rgb(15 12 50 / .82)), url(/accueil_photo.jpg) 50% 28%/cover fixed; }
  h1 { text-align: center; font-weight: 600; margin: 0; padding-top: 34px; }
  .lead { text-align: center; color: rgb(255 255 255 / .7); margin: 8px auto 16px; max-width: 820px; padding: 0 16px; }
  .rates { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-bottom: 26px; }
  .rates button { font: inherit; font-size: 13px; padding: 7px 15px; border-radius: 999px; border: 1px solid rgb(255 255 255 / .25); background: transparent; color: #fff; cursor: pointer; }
  .rates button.on { background: #fff; color: #1e1b4b; font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; max-width: 1150px; margin: 0 auto; padding: 0 20px 60px; }
  @media (max-width: 1000px) { .grid { grid-template-columns: 1fr; max-width: 420px; } }
  .opt > p { margin: 12px 0 0; font-size: 13px; color: rgb(255 255 255 / .7); } .opt > p b { color: #fff; }
  /* a widget card like the dashboard's */
  .w { position: relative; height: 250px; display: flex; flex-direction: column; padding: 18px 20px 16px; border-radius: 26px; overflow: hidden; background: rgb(15 23 42 / .72); border: 1px solid rgb(255 255 255 / .12); backdrop-filter: blur(18px); }
  .w-head { font-size: 13px; opacity: .7; } .w-big { font-size: 46px; font-weight: 600; line-height: 1.1; margin-top: 8px; } .w-sub { opacity: .7; font-size: 13px; }
  .w.flash .w-big { animation: flash .8s; } @keyframes flash { 40% { opacity: .25; transform: translateY(3px); } }
  .foot { margin-top: auto; font-size: 12px; color: rgb(255 255 255 / .55); display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .mono { font-family: 'Space Mono', monospace; }
  .spin { display: inline-block; animation: sp .8s linear infinite; } @keyframes sp { to { transform: rotate(360deg); } }

  /* 1 ring */
  .ring { display: flex; align-items: center; gap: 8px; }
  .ring svg { width: 22px; height: 22px; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 3; } .ring .bg { stroke: rgb(255 255 255 / .15); } .ring .fg { stroke: #a78bfa; stroke-linecap: round; transition: stroke-dashoffset 1s linear; }
  .ring.now .fg { stroke: #34d399; }
  /* 2 thin bar */
  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgb(255 255 255 / .08); }
  .bar i { display: block; height: 100%; background: linear-gradient(90deg, #818cf8, #38bdf8); border-radius: 0 3px 3px 0; transition: width 1s linear; box-shadow: 0 0 8px #38bdf8; }
  /* 3 live pill */
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: rgb(52 211 153 / .12); color: #6ee7b7; font-weight: 500; }
  .pill i { width: 7px; height: 7px; border-radius: 50%; background: #34d399; box-shadow: 0 0 0 0 #34d399; animation: pulse 1.6s infinite; }
  @keyframes pulse { 70% { box-shadow: 0 0 0 7px rgb(52 211 153 / 0); } 100% { box-shadow: 0 0 0 0 rgb(52 211 153 / 0); } }
  .chip { padding: 4px 10px; border-radius: 999px; background: rgb(255 255 255 / .08); }
  /* 4 flip digits */
  .flip { display: flex; gap: 3px; align-items: center; }
  .flip b { position: relative; min-width: 18px; padding: 3px 4px; border-radius: 5px; background: #1e293b; box-shadow: inset 0 -1px 0 rgb(0 0 0 / .5); text-align: center; color: #fff; font: 700 13px 'Space Mono', monospace; }
  .flip b::after { content: ''; position: absolute; left: 0; right: 0; top: 50%; border-top: 1px solid rgb(0 0 0 / .45); }
  .flip b.tick { animation: tick .35s; } @keyframes tick { 0% { transform: rotateX(80deg); } 100% { transform: none; } }
  .flip span { opacity: .6; margin: 0 2px; }
  /* 5 relative sentence */
  .rel { display: flex; align-items: center; gap: 7px; } .rel .ic { font-size: 14px; color: #a78bfa; }
  .rel em { font-style: normal; color: #fff; }
  /* 6 dots */
  .dots { display: flex; gap: 4px; } .dots i { width: 8px; height: 8px; border-radius: 3px; background: rgb(255 255 255 / .14); transition: background .3s; } .dots i.on { background: #fbbf24; box-shadow: 0 0 6px #fbbf24; }
  .note { position: absolute; right: 16px; top: 14px; font-size: 10.5px; opacity: .5; }
</style>
</head>
<body>
<h1>Le compteur de rafraîchissement</h1>
<p class="lead">En bas de chaque widget : combien de temps avant la prochaine mise à jour, et à quelle heure a eu lieu la dernière. Tout est en direct ici : attends la fin du compte à rebours pour voir le widget se mettre à jour</p>
<div class="rates" id="rates"></div>
<div class="grid" id="g"></div>
<script>
const RATES = [[30, 'Toutes les 30 s'], [300, 'Toutes les 5 min'], [3600, 'Toutes les heures']]
let rate = 30, left = 30, last = new Date(), refreshing = 0, temp = 31
const hm = (d) => d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })
const hms = (d) => d.toLocaleTimeString('fr-FR')
const dur = (s) => s >= 3600 ? `${Math.floor(s / 3600)} h ${String(Math.floor(s % 3600 / 60)).padStart(2, '0')}` : s >= 60 ? `${Math.floor(s / 60)} min ${String(s % 60).padStart(2, '0')}` : `${s} s`
const ago = () => { const s = Math.round((Date.now() - last) / 1000); return s < 5 ? 'à l’instant' : s < 60 ? `il y a ${s} s` : `il y a ${Math.floor(s / 60)} min` }
const rateName = () => RATES.find(([r]) => r === rate)[1]
const frac = () => left / rate
const mmss = (s) => { const m = Math.floor(s / 60), x = s % 60; return s >= 3600 ? [String(Math.floor(s / 3600)).padStart(2, '0'), String(Math.floor(s % 3600 / 60)).padStart(2, '0')] : [String(m).padStart(2, '0'), String(x).padStart(2, '0')] }

const P = [
  ['Anneau', 'un petit cercle violet qui se vide jusqu’à la prochaine mise à jour, avec le temps restant ; il devient vert au moment où ça se met à jour', () => {
    const C = 2 * Math.PI * 9
    return `<span class="ring ${refreshing ? 'now' : ''}"><svg viewBox="0 0 22 22"><circle class="bg" cx="11" cy="11" r="9"/><circle class="fg" cx="11" cy="11" r="9" stroke-dasharray="${C}" stroke-dashoffset="${refreshing ? 0 : C * (1 - frac())}"/></svg>${refreshing ? 'Mise à jour…' : `dans ${dur(left)}`}</span><span>à jour à ${hm(last)}</span>`
  }, ''],
  ['Barre fine', 'une ligne lumineuse tout en bas de la carte qui raccourcit ; le texte reste discret, comme aujourd’hui', () =>
    `<span>${refreshing ? '<span class="spin">↻</span> Mise à jour…' : `↻ dans ${dur(left)}`}</span><span>dernière : ${hm(last)}</span>`,
    () => `<div class="bar"><i style="width:${refreshing ? 100 : frac() * 100}%"></i></div>`],
  ['Pastille « en direct »', 'un point vert qui pulse avec l’heure exacte de la dernière mise à jour, et une petite pastille avec le compte à rebours', () =>
    `<span class="pill"><i></i>${hms(last)}</span><span class="chip mono">${refreshing ? '<span class="spin">↻</span>' : dur(left)}</span>`, ''],
  ['Chiffres qui tournent', 'un compte à rebours façon horloge d’aéroport, les chiffres basculent chaque seconde', () => {
    const [a, b] = mmss(left)
    return `<span>${refreshing ? '<span class="spin">↻</span> Mise à jour…' : 'Prochaine'}</span><span class="flip"><b class="${refreshing ? '' : 'tick'}">${a[0]}</b><b>${a[1]}</b><span>:</span><b>${b[0]}</b><b class="${refreshing ? '' : 'tick'}">${b[1]}</b></span>`
  }, ''],
  ['Phrase simple', 'tout est dit en une ligne claire : « Mis à jour il y a 12 s · prochaine dans 18 s » ; au survol on voit l’heure exacte', () =>
    `<span class="rel" title="Dernière mise à jour : ${hms(last)}"><span class="ic ${refreshing ? 'spin' : ''}">↻</span>${refreshing ? 'Mise à jour…' : `Mis à jour <em>${ago()}</em> · prochaine dans <em>${dur(left)}</em>`}</span>`, ''],
  ['Petites cases', 'six cases dorées qui s’allument une à une comme une batterie qui se charge ; pleine = mise à jour', () => {
    const on = refreshing ? 6 : Math.floor((1 - frac()) * 6)
    return `<span class="dots">${Array.from({ length: 6 }, (_, i) => `<i class="${i < on ? 'on' : ''}"></i>`).join('')}</span><span>${refreshing ? 'Mise à jour…' : `${dur(left)} · à jour à ${hm(last)}`}</span>`
  }, ''],
]
function card(i) {
  const [, , foot, extra] = P[i]
  return `<div class="w ${refreshing ? 'flash' : ''}"><span class="note">${rateName()}</span><div class="w-head">☀️ Météo · Cotonou</div><div class="w-big">${temp}°</div><div class="w-sub">Ensoleillé · ressenti ${temp + 3}°</div><div class="foot">${foot()}</div>${extra ? extra() : ''}</div>`
}
function draw() {
  document.getElementById('rates').innerHTML = RATES.map(([r, l]) => `<button class="${r === rate ? 'on' : ''}" data-r="${r}">${l}</button>`).join('')
  document.getElementById('g').innerHTML = P.map((p, i) => `<div class="opt">${card(i)}<p><b>${i + 1} · ${p[0]}</b> : ${p[1]}</p></div>`).join('')
}
setInterval(() => {
  if (refreshing) { refreshing--; if (!refreshing) { last = new Date(); left = rate; temp = 29 + Math.floor(Math.random() * 4) } }
  else if (--left <= 0) refreshing = 1
  draw()
}, 1000)
document.addEventListener('click', (e) => { const b = e.target.closest('[data-r]'); if (!b) return; rate = +b.dataset.r; left = rate === 30 ? 12 : rate - 7; draw() })
left = 12; draw()
</script>
</body>
</html>
