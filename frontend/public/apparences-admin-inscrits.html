<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Morex derniers inscrits</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; font-family: Poppins, system-ui, sans-serif; color: #fff; background-color: #020617;
    background: linear-gradient(rgb(2 6 23 / .45), rgb(2 6 23 / .7)), url(/accueil_photo.jpg) 50% 28%/cover fixed; }
  h1 { text-align: center; font-weight: 600; margin: 0; padding-top: 28px; }
  .lead { text-align: center; color: rgb(255 255 255 / .75); margin: 8px auto 28px; font-size: 14px; max-width: 900px; padding: 0 16px; }
  .wrap { max-width: 1400px; margin: 0 auto; padding: 0 28px 80px; display: flex; flex-direction: column; gap: 30px; }
  .num { display: inline-block; font-size: 13px; font-weight: 700; padding: 4px 12px; border-radius: 999px; background: #fff; color: #1e1b4b; margin: 0 0 10px 6px; }
  .num span { font-weight: 400; margin-left: 6px; }
  .glass { background: rgb(255 255 255 / .08); border: 1px solid rgb(255 255 255 / .14); border-radius: 24px; backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); }
  .card { padding: 26px 28px; position: relative; overflow: hidden; }
  .card h3 { margin: 0 0 20px; font-size: 20px; font-weight: 600; letter-spacing: -.01em; display: flex; align-items: center; gap: 12px; }
  .card h3::before { content: ''; width: 4px; height: 22px; border-radius: 4px; background: linear-gradient(#818cf8, #38bdf8); box-shadow: 0 0 12px rgb(99 102 241 / .7); }
  .card h3 .more { margin-left: auto; font: inherit; font-size: 13.5px; font-weight: 500; padding: 7px 14px; border-radius: 999px; border: 1px solid rgb(255 255 255 / .22); background: rgb(255 255 255 / .06); color: #fff; cursor: pointer; }
  .muted { color: rgb(255 255 255 / .62); }
  .av { border-radius: 50%; display: grid; place-items: center; font-weight: 700; flex: none; }
  .badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .ok { background: rgb(52 211 153 / .16); color: #a7f3d0; } .wait { background: rgb(251 191 36 / .18); color: #fde68a; } .ban { background: rgb(248 113 113 / .2); color: #fecaca; } .adm { background: rgb(167 139 250 / .22); color: #ddd6fe; }
  .btn { font: inherit; font-size: 12.5px; padding: 6px 12px; border-radius: 999px; border: 1px solid rgb(255 255 255 / .22); background: rgb(255 255 255 / .06); color: #fff; cursor: pointer; }

  /* 1 cartes de bienvenue */
  .cards { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; } @media (max-width: 1100px) { .cards { grid-template-columns: repeat(2, 1fr); } }
  .wc { padding: 22px 16px 18px; border-radius: 20px; background: rgb(255 255 255 / .05); border: 1px solid rgb(255 255 255 / .1); text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; position: relative; transition: transform .2s; }
  .wc:hover { transform: translateY(-4px); }
  .wc .av { width: 64px; height: 64px; font-size: 20px; box-shadow: 0 0 0 3px rgb(255 255 255 / .12), 0 0 24px var(--c); }
  .wc b { font-size: 15px; } .wc small { font-size: 12px; } .wc .new { position: absolute; top: 12px; right: 12px; font-size: 10.5px; font-weight: 700; letter-spacing: .08em; padding: 2px 8px; border-radius: 999px; background: linear-gradient(90deg, #818cf8, #38bdf8); }
  .wc .stats { display: flex; gap: 12px; font-size: 12px; color: rgb(255 255 255 / .65); margin-top: 2px; }

  /* 2 frise */
  .tl { position: relative; padding-left: 28px; }
  .tl::before { content: ''; position: absolute; left: 9px; top: 6px; bottom: 6px; width: 2px; background: linear-gradient(#818cf8, #38bdf8, transparent); }
  .day { font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: #38bdf8; font-weight: 600; margin: 14px 0 8px -28px; padding-left: 28px; }
  .day:first-child { margin-top: 0; }
  .ev { position: relative; display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-radius: 16px; background: rgb(255 255 255 / .04); margin-bottom: 8px; }
  .ev::before { content: ''; position: absolute; left: -24px; top: 50%; width: 12px; height: 12px; margin-top: -6px; border-radius: 50%; background: var(--c); box-shadow: 0 0 10px var(--c); }
  .ev .av { width: 40px; height: 40px; font-size: 13px; }
  .ev .t { flex: 1; min-width: 0; } .ev .t b { font-size: 15px; } .ev .t small { display: block; font-size: 12.5px; color: rgb(255 255 255 / .6); }
  .ev .hr { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: rgb(255 255 255 / .6); width: 52px; }

  /* 3 tableau des arrivées */
  .board { border-radius: 18px; overflow: hidden; background: rgb(2 6 23 / .65); border: 1px solid rgb(255 255 255 / .1); font-family: 'JetBrains Mono', monospace; }
  .board .hd, .board .r { display: grid; grid-template-columns: 90px 1.4fr 1.6fr 110px 230px; gap: 14px; align-items: center; padding: 12px 20px; }
  .board .hd { background: rgb(253 224 71 / .1); color: #fde047; font-size: 12px; letter-spacing: .18em; text-transform: uppercase; font-weight: 600; }
  .board .r { border-top: 1px solid rgb(255 255 255 / .06); font-size: 14px; }
  .board .r:nth-child(even) { background: rgb(255 255 255 / .02); }
  .board .time { color: #fde047; font-size: 16px; } .board .name { font-family: Poppins, sans-serif; font-weight: 600; } .board .mail { color: rgb(255 255 255 / .55); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .st { font-size: 12.5px; font-weight: 600; letter-spacing: .06em; } .st.land { color: #6ee7b7; } .st.hold { color: #fde68a; animation: blink 1.4s steps(2) infinite; } .st.stop { color: #fca5a5; }
  @keyframes blink { 50% { opacity: .35; } }
  .flap { display: inline-flex; gap: 2px; } .flap i { font-style: normal; background: #0f172a; border: 1px solid rgb(255 255 255 / .1); border-radius: 3px; padding: 0 3px; }

  /* 4 étoiles nouvelles */
  .sky { position: relative; height: 300px; border-radius: 18px; overflow: hidden; background: radial-gradient(ellipse at 50% 120%, rgb(99 102 241 / .35), transparent 60%), rgb(2 6 23 / .5); }
  .sky .nst { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; animation: rise 1s cubic-bezier(.2, .8, .2, 1) both; }
  .sky .nst .av { width: var(--s); height: var(--s); font-size: calc(var(--s) * .32); background: radial-gradient(circle at 35% 30%, #fff, var(--c) 45%, rgb(15 23 42) 120%); color: #1e1b4b; box-shadow: 0 0 30px var(--c), 0 0 60px var(--c); }
  .sky .nst b { font-size: 14px; } .sky .nst small { font-size: 12px; color: rgb(255 255 255 / .65); }
  @keyframes rise { from { opacity: 0; transform: translate(-50%, 0) scale(.5); } }
  .sky .spark { position: absolute; width: 2px; height: 2px; border-radius: 50%; background: #fff; animation: tw 2.4s ease-in-out infinite; } @keyframes tw { 50% { opacity: .2; } }
</style>
</head>
<body>
<h1>« Derniers inscrits » : propositions</h1>
<p class="lead">4 façons de montrer qui vient d'arriver sur Morex. Uniquement des infos que le serveur renvoie déjà (nom, e-mail, date d'inscription, statut, widgets, comptes liés). Cliquer sur quelqu'un ouvrirait sa ligne dans la page Comptes.</p>
<div class="wrap" id="w"></div>
<script>
const H = 3600e3, NOW = Date.now()
const U = [
  ['Alan', 'Turing', 'alan@example.com', 6, 'wait', 0, 0, '#38bdf8'],
  ['Lucía', 'Gómez', 'lucia@example.com', 22, 'wait', 0, 0, '#f472b6'],
  ['Kofi', 'Mensah', 'kofi@example.com', 30, 'ok', 4, 1, '#34d399'],
  ['Carlos', 'Ruiz', 'carlos@example.com', 50, 'ok', 6, 0, '#fbbf24'],
  ['Tim', 'Berners-Lee', 'tim@example.com', 74, 'ok', 3, 0, '#a78bfa'],
].map(([f, l, e, h, st, w, li, c]) => ({ f, l, e, at: new Date(NOW - h * H), st, w, li, c, h }))
const ini = (u) => u.f[0] + u.l[0]
const rel = (u) => u.h < 24 ? `il y a ${u.h} h` : u.h < 48 ? 'hier' : `il y a ${Math.floor(u.h / 24)} j`
const badge = (u) => u.st === 'ok' ? '<span class="badge ok">● Actif</span>' : u.st === 'wait' ? `<span class="badge wait">⏳ expire dans ${24 - u.h} h</span>` : '<span class="badge ban">⛔ Suspendu</span>'
const hm = (d) => d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })
const dayName = (u) => u.h < new Date().getHours() ? 'Aujourd\'hui' : u.h < new Date().getHours() + 24 ? 'Hier' : u.at.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' })
const head = (title = 'Derniers inscrits') => `<h3>${title}<button class="more">Tous les comptes →</button></h3>`
const sec = (n, name, why, html) => `<section><span class="num">${n} · ${name}<span>${why}</span></span>${html}</section>`

const v1 = () => `<div class="glass card">${head()}<div class="cards">${U.map((u, i) => `<div class="wc" style="--c:${u.c}">${i < 2 ? '<span class="new">NOUVEAU</span>' : ''}<span class="av" style="background:${u.c}33;color:${u.c}">${ini(u)}</span><b>${u.f} ${u.l}</b><small class="muted">${rel(u)}</small>${badge(u)}<div class="stats"><span><b style="color:#fff">${u.w}</b> widget${u.w > 1 ? 's' : ''}</span><span><b style="color:#fff">${u.li}</b> lié${u.li > 1 ? 's' : ''}</span></div></div>`).join('')}</div></div>`

function v2() { let last = ''
  return `<div class="glass card">${head()}<div class="tl">${U.map((u) => { const d = dayName(u), h = d !== last ? `<div class="day">${d}</div>` : ''; last = d
    return `${h}<div class="ev" style="--c:${u.c}"><span class="hr">${hm(u.at)}</span><span class="av" style="background:${u.c}33;color:${u.c}">${ini(u)}</span><div class="t"><b>${u.f} ${u.l}</b><small>${u.e} · ${u.w} widget${u.w > 1 ? 's' : ''}</small></div>${badge(u)}</div>` }).join('')}</div></div>` }

const v3 = () => `<div class="glass card">${head('Arrivées sur Morex')}<div class="board"><div class="hd"><span>Heure</span><span>Passager</span><span>Contact</span><span>Widgets</span><span>Statut</span></div>
  ${U.map((u) => `<div class="r"><span class="time">${hm(u.at)}</span><span class="name">${u.f} ${u.l}</span><span class="mail">${u.e}</span><span class="flap">${String(u.w).padStart(2, '0').split('').map((c) => `<i>${c}</i>`).join('')}</span><span class="st ${u.st === 'ok' ? 'land' : 'hold'}">${u.st === 'ok' ? '✓ ATTERRI' : `⏳ EN ATTENTE · ${24 - u.h} H`}</span></div>`).join('')}</div></div>`

function v4() {
  const pos = [[14, 42], [33, 62], [52, 36], [71, 60], [88, 40]]
  const sparks = Array.from({ length: 40 }, (_, i) => `<span class="spark" style="left:${(i * 37) % 100}%;top:${(i * 53) % 100}%;animation-delay:${-i * .3}s"></span>`).join('')
  return `<div class="glass card">${head('Les nouvelles étoiles')}<div class="sky">${sparks}${U.map((u, i) => `<div class="nst" style="left:${pos[i][0]}%;top:${pos[i][1]}%;--c:${u.c};--s:${i < 2 ? 66 : 54}px;animation-delay:${i * .12}s"><span class="av">${ini(u)}</span><b>${u.f} ${u.l}</b><small>${rel(u)}</small>${badge(u)}</div>`).join('')}</div></div>`
}
const V = [
  ['Cartes de bienvenue', 'une carte par personne, avatar lumineux, « NOUVEAU » sur les plus récents, nombre de widgets et de comptes liés', v1],
  ['La frise', 'une ligne du temps groupée par jour (aujourd\'hui, hier…), avec l\'heure exacte d\'arrivée', v2],
  ['Le tableau des arrivées', 'comme un panneau d\'aéroport spatial : heure, passager, widgets en chiffres à volets, « atterri » ou « en attente » qui clignote', v3],
  ['Les nouvelles étoiles', 'chaque inscrit apparaît comme une étoile qui monte dans le ciel, les plus récents plus gros', v4],
]
document.getElementById('w').innerHTML = V.map(([n, w, f], i) => sec(i + 1, n, w, f())).join('')
</script>
</body>
</html>
