<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Morex weather widgets</title>
<link rel="icon" type="image/svg+xml" href="/logo.svg" />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root { --a1: #818cf8; --a2: #38bdf8; --glow: 99 102 241; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; font-family: Poppins, system-ui, sans-serif; color: #fff; background-color: #020617;
    background: linear-gradient(rgb(2 6 23 / .62), rgb(15 12 50 / .8)), url(/accueil_photo.jpg) 50% 28%/cover fixed; }
  h1 { text-align: center; font-weight: 600; margin: 0; padding-top: 36px; }
  .lead { text-align: center; color: rgb(255 255 255 / .65); margin: 8px auto 6px; max-width: 760px; }
  section { max-width: 1250px; margin: 0 auto; padding: 26px 20px 8px; }
  h2 { font-size: 19px; font-weight: 600; margin: 0 0 14px; } h2 code { font-size: 12px; font-weight: 400; color: rgb(255 255 255 / .55); margin-left: 8px; }
  .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  @media (max-width: 1000px) { .row { grid-template-columns: 1fr; } }
  .opt { min-width: 0; }
  .opt > p { margin: 10px 0 0; font-size: 13px; color: rgb(255 255 255 / .65); } .opt > p b { color: #fff; }
  .card { position: relative; overflow: hidden; border-radius: 24px; padding: 18px; height: 290px; display: flex; flex-direction: column; gap: 10px;
    background: rgb(255 255 255 / .08); border: 1px solid rgb(255 255 255 / .14); backdrop-filter: blur(22px); }
  .t { font-weight: 600; font-size: 14px; } .s { font-size: 11.5px; color: rgb(255 255 255 / .6); } .tab { font-variant-numeric: tabular-nums; }
  .foot { margin-top: auto; display: flex; justify-content: space-between; font-size: 11px; color: rgb(255 255 255 / .45); }

  /* ----- current 1: living sky ----- */
  .c1 { border: 0; color: #0c2a4a; }
  .c1.day { background: linear-gradient(170deg, #38bdf8, #7dd3fc 55%, #fde68a 130%); }
  .c1.night { background: linear-gradient(170deg, #0b1026, #312e81 70%, #7c3aed 140%); color: #fff; }
  .c1 .orb { position: absolute; right: -36px; top: -36px; width: 170px; height: 170px; border-radius: 50%; animation: pulse 4s ease-in-out infinite; }
  .c1.day .orb { background: radial-gradient(circle, #fff7cc 0 30%, #fde047 45%, rgb(253 224 71 / 0) 70%); }
  .c1.night .orb { background: radial-gradient(circle, #f8fafc 0 22%, rgb(226 232 240 / .35) 40%, rgb(226 232 240 / 0) 70%); }
  @keyframes pulse { 50% { transform: scale(1.08); } }
  .c1 .cloud { position: absolute; font-size: 46px; animation: drift 12s ease-in-out infinite alternate; }
  @keyframes drift { from { translate: -22px 0; } to { translate: 22px 0; } }
  .c1 .star { position: absolute; width: 2px; height: 2px; border-radius: 50%; background: #fff; animation: tw 2s ease-in-out infinite; }
  @keyframes tw { 50% { opacity: .2; } }
  .c1 .big { margin-top: auto; font-size: 80px; font-weight: 700; line-height: 1; letter-spacing: -.04em; position: relative; }
  .c1 .line { font-weight: 600; position: relative; }
  /* ----- current 2: glass details ----- */
  .c2 .top { display: flex; align-items: center; gap: 14px; }
  .c2 .ic { font-size: 62px; line-height: 1; filter: drop-shadow(0 0 18px rgb(253 224 71 / .55)); }
  .c2 .temp { font-size: 50px; font-weight: 600; line-height: 1; }
  .c2 .grid4 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: auto; }
  .c2 .grid4 div { padding: 10px 12px; border-radius: 14px; background: rgb(255 255 255 / .06); }
  .c2 .grid4 b { display: block; font-size: 17px; }
  /* ----- current 3: thermometer ----- */
  .c3 .body { flex: 1; display: grid; grid-template-columns: 70px 1fr; gap: 16px; align-items: center; }
  .c3 .thermo { position: relative; width: 28px; height: 180px; margin: 0 auto; border-radius: 14px; background: rgb(255 255 255 / .1); border: 2px solid rgb(255 255 255 / .25); }
  .c3 .thermo i { position: absolute; left: 4px; right: 4px; bottom: 4px; border-radius: 10px; background: linear-gradient(to top, #38bdf8, #fde047, #f97316); animation: rise 1.4s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes rise { from { height: 0 !important; } }
  .c3 .thermo::after { content: ""; position: absolute; left: 50%; bottom: -16px; width: 40px; height: 40px; margin-left: -20px; border-radius: 50%; background: #f97316; box-shadow: 0 0 20px rgb(249 115 22 / .6); }
  .c3 .temp { font-size: 58px; font-weight: 700; line-height: 1; }

  /* ----- daily 1: iPhone week (current) ----- */
  .d1 .main { display: flex; align-items: center; gap: 12px; }
  .d1 .ic { font-size: 48px; filter: drop-shadow(0 0 16px rgb(253 224 71 / .5)); } .d1 .temp { font-size: 40px; font-weight: 600; line-height: 1; }
  .d1 ul { list-style: none; margin: auto 0 0; padding: 0; display: flex; flex-direction: column; gap: 7px; font-size: 13px; }
  .d1 li { display: grid; grid-template-columns: 40px 22px 30px 1fr 30px; align-items: center; gap: 8px; }
  .range { position: relative; height: 6px; border-radius: 999px; background: rgb(255 255 255 / .1); }
  .range i { position: absolute; top: 0; bottom: 0; border-radius: inherit; background: linear-gradient(90deg, #38bdf8, #fde047, #fb923c); }
  /* ----- daily 2: day tiles ----- */
  .d2 .tiles { flex: 1; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 8px; }
  .d2 .tile { border-radius: 18px; padding: 12px 4px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; text-align: center;
    background: linear-gradient(to top, rgb(var(--glow) / .35), rgb(255 255 255 / .05)); border: 1px solid rgb(255 255 255 / .1); }
  .d2 .tile:first-child { background: linear-gradient(to top, var(--a1), var(--a2)); box-shadow: 0 10px 30px -10px rgb(var(--glow) / .9); border: 0; }
  .d2 .tile .ic { font-size: 30px; } .d2 .tile b { font-size: 20px; } .d2 .rain { font-size: 11px; color: #bae6fd; }
  /* ----- daily 3: temperature bars chart ----- */
  .d3 svg { width: 100%; flex: 1; min-height: 150px; overflow: visible; }

  /* ----- hourly 1: curve ----- */
  .h1 svg, .h3 svg { width: 100%; flex: 1; min-height: 140px; overflow: visible; }
  /* ----- hourly 2: timeline chips ----- */
  .h2 .strip { display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x mandatory; flex: 1; align-items: stretch; scrollbar-width: none; }
  .h2 .chip { flex: 0 0 64px; scroll-snap-align: start; border-radius: 999px; padding: 14px 0; display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    background: rgb(255 255 255 / .06); border: 1px solid rgb(255 255 255 / .1); }
  .h2 .chip.now { background: linear-gradient(to bottom, var(--a1), var(--a2)); border: 0; box-shadow: 0 8px 22px -8px rgb(var(--glow) / .9); }
  .h2 .chip .ic { font-size: 26px; } .h2 .chip b { font-size: 17px; }
  .h2 .drop { font-size: 10px; color: #bae6fd; }
  /* ----- hourly 3: rain bars + temp line ----- */
</style>
</head>
<body>
<h1>Widgets Météo, 3 propositions chacun</h1>
<p class="lead">Avec les vraies données que votre backend a renvoyées. Dis-moi par exemple « Actuelle 1, Semaine 2, Heures 3 »</p>
<div id="app"></div>
<script>
const W = {"current": {"low": 70, "city": "Tokyo", "high": 80, "unit": "fahrenheit", "isDay": false, "country": "Japan", "windKmh": 4, "humidity": 77, "condition": "partly_cloudy", "feelsLike": 78, "temperature": 73}, "daily": {"now": {"condition": "partly_cloudy", "temperature": 28}, "city": "Cotonou", "days": [{"max": 28, "min": 25, "date": "2026-09-26", "condition": "drizzle", "rainChance": 86}, {"max": 28, "min": 25, "date": "2026-09-27", "condition": "rain", "rainChance": 75}, {"max": 27, "min": 24, "date": "2026-09-28", "condition": "rain", "rainChance": 78}, {"max": 27, "min": 25, "date": "2026-09-29", "condition": "drizzle", "rainChance": 78}, {"max": 28, "min": 25, "date": "2026-09-30", "condition": "drizzle", "rainChance": 63}], "unit": "celsius", "country": "Benin"}, "hourly": {"city": "Paris", "unit": "celsius", "hours": [{"time": "2026-09-25T12:00", "condition": "clear", "rainChance": 0, "temperature": 21}, {"time": "2026-09-25T13:00", "condition": "clear", "rainChance": 0, "temperature": 23}, {"time": "2026-09-25T14:00", "condition": "clear", "rainChance": 0, "temperature": 25}, {"time": "2026-09-25T15:00", "condition": "clear", "rainChance": 0, "temperature": 26}, {"time": "2026-09-25T16:00", "condition": "clear", "rainChance": 0, "temperature": 27}, {"time": "2026-09-25T17:00", "condition": "clear", "rainChance": 0, "temperature": 28}, {"time": "2026-09-25T18:00", "condition": "clear", "rainChance": 0, "temperature": 28}, {"time": "2026-09-25T19:00", "condition": "clear", "rainChance": 0, "temperature": 27}], "country": "France"}}
const IC = { clear: ['☀️', '🌙'], partly_cloudy: ['⛅', '☁️'], cloudy: ['☁️', '☁️'], fog: ['🌫️', '🌫️'], drizzle: ['🌦️', '🌧️'], rain: ['🌧️', '🌧️'], snow: ['❄️', '❄️'], thunderstorm: ['⛈️', '⛈️'] }
const LB = { clear: 'Ensoleillé', partly_cloudy: 'Éclaircies', cloudy: 'Nuageux', fog: 'Brouillard', drizzle: 'Bruine', rain: 'Pluie', snow: 'Neige', thunderstorm: 'Orage' }
const ic = (c, day = true) => (IC[c] ?? IC.cloudy)[day ? 0 : 1]
const dayName = (d) => new Date(`${d}T12:00`).toLocaleDateString('fr-FR', { weekday: 'short' }).replace('.', '')
const hour = (t) => `${new Date(t).getHours()} h`
const foot = (r) => `<div class="foot"><span>Toutes les ${r}</span><span>Mis à jour à ${new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })}</span></div>`
const C = W.current, D = W.daily, H = W.hourly
const u = C.unit === 'fahrenheit' ? '°F' : '°'

// shared scale for the week
const lows = D.days.map((d) => d.min), highs = D.days.map((d) => d.max), lo = Math.min(...lows), hi = Math.max(...highs), span = Math.max(1, hi - lo)
// hourly geometry
const HT = H.hours.map((h) => h.temperature), hmn = Math.min(...HT), hmx = Math.max(...HT)
const hx = (i) => 16 + (i / (HT.length - 1)) * 268, hy = (t) => 70 - ((t - hmn) / (hmx - hmn || 1)) * 46
const hpath = HT.map((t, i) => `${i ? 'L' : 'M'}${hx(i)} ${hy(t)}`).join(' ')
// thermometer fill: -10° → 45° (C) mapped to 0–100 %
const tc = C.unit === 'fahrenheit' ? (C.temperature - 32) * 5 / 9 : C.temperature
const fill = Math.max(8, Math.min(100, ((tc + 10) / 55) * 100))

const stars = Array.from({ length: 18 }, (_, i) => `<i class="star" style="left:${(i * 37) % 100}%;top:${(i * 23) % 60}%;animation-delay:-${i * .3}s"></i>`).join('')
const sections = [
  ['🌡️ Météo actuelle', 'current_weather', [
    ['Ciel vivant', 'la carte devient le ciel : bleu et soleil le jour, nuit étoilée et lune le soir (ici Tokyo, il fait nuit)', `<div class="card c1 ${C.isDay ? 'day' : 'night'}"><div class="orb"></div>${C.isDay ? '' : stars}
      ${['partly_cloudy', 'cloudy', 'rain', 'drizzle', 'thunderstorm'].includes(C.condition) ? `<span class="cloud" style="left:18px;top:70px">${C.condition === 'rain' ? '🌧️' : '☁️'}</span><span class="cloud" style="left:150px;top:36px;font-size:30px;animation-delay:-5s">☁️</span>` : ''}
      <div class="line">${C.city}</div><div class="big tab">${C.temperature}${u}</div><div class="line">${LB[C.condition]} · ↑${C.high}° ↓${C.low}°</div></div>`],
    ['Détails', 'grande icône, puis 4 cases : ressenti, humidité, vent, max/min', `<div class="card c2"><div class="s">${C.city}${C.country ? ', ' + C.country : ''}</div>
      <div class="top"><span class="ic">${ic(C.condition, C.isDay)}</span><div><div class="temp tab">${C.temperature}${u}</div><div class="s">${LB[C.condition]}</div></div></div>
      <div class="grid4"><div><span class="s">Ressenti</span><b>${C.feelsLike}°</b></div><div><span class="s">Humidité</span><b>${C.humidity} %</b></div><div><span class="s">Vent</span><b>${C.windKmh} km/h</b></div><div><span class="s">Max / min</span><b>${C.high}° / ${C.low}°</b></div></div></div>`],
    ['Thermomètre', 'un thermomètre qui se remplit du bleu au orange selon la chaleur', `<div class="card c3"><div class="t">${C.city}</div>
      <div class="body"><div class="thermo"><i style="height:calc(${fill}% - 8px)"></i></div>
      <div><div class="temp tab">${C.temperature}${u}</div><div class="s">${ic(C.condition, C.isDay)} ${LB[C.condition]}</div><div class="s" style="margin-top:10px">Ressenti ${C.feelsLike}° · 💧 ${C.humidity} % · 💨 ${C.windKmh} km/h</div></div></div>${foot('10 min')}</div>`],
  ]],
  ['📅 Météo de la semaine', 'daily_forecast', [
    ['Semaine iPhone', 'celle qui est dans la maquette : barres min / max sur une échelle commune', `<div class="card d1"><div class="main"><span class="ic">${ic(D.now.condition)}</span><div><div class="temp tab">${D.now.temperature}°</div><div class="s">${D.city} · ${LB[D.now.condition]}</div></div></div>
      <ul>${D.days.map((d) => `<li><span style="text-transform:capitalize">${dayName(d.date)}</span><span>${ic(d.condition)}</span><span class="s tab">${d.min}°</span>
        <span class="range"><i style="left:${((d.min - lo) / span) * 100}%;right:${100 - ((d.max - lo) / span) * 100}%"></i></span><span class="tab">${d.max}°</span></li>`).join('')}</ul></div>`],
    ['Tuiles', 'une colonne par jour, demain en couleur, le risque de pluie en bas', `<div class="card d2"><div class="t">${D.city}</div>
      <div class="tiles">${D.days.map((d) => `<div class="tile"><span class="s" style="text-transform:capitalize;color:#fff">${dayName(d.date)}</span><span class="ic">${ic(d.condition)}</span>
        <div><b class="tab">${d.max}°</b><div class="s tab">${d.min}°</div></div><span class="rain">💧 ${d.rainChance ?? 0}%</span></div>`).join('')}</div></div>`],
    ['Graphique', 'des barres de température (min → max) comme un graphique d’appli météo', `<div class="card d3"><div class="t">${D.city} · ${D.days.length} jours</div>
      <svg viewBox="0 0 300 170" role="img" aria-label="Températures des prochains jours">${D.days.map((d, i) => {
        const cx = 30 + i * (240 / (D.days.length - 1 || 1)), y = (t) => 130 - ((t - lo) / span) * 90
        return `<rect x="${cx - 11}" y="${y(d.max)}" width="22" height="${Math.max(6, y(d.min) - y(d.max))}" rx="11" fill="url(#bar)"/>
          <text x="${cx}" y="${y(d.max) - 6}" fill="#fff" font-size="11" text-anchor="middle">${d.max}°</text>
          <text x="${cx}" y="${y(d.min) + 14}" fill="rgb(255 255 255 / .6)" font-size="10" text-anchor="middle">${d.min}°</text>
          <text x="${cx}" y="164" fill="#fff" font-size="15" text-anchor="middle">${ic(d.condition)}</text>`
      }).join('')}<defs><linearGradient id="bar" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#fb923c"/></linearGradient></defs></svg></div>`],
  ]],
  ['⏱️ Météo heure par heure', 'hourly_forecast', [
    ['Courbe', 'celle du dashboard : la température qui monte et descend, la pluie en bleu', `<div class="card h1"><div class="t">${H.city}</div>
      <svg viewBox="0 0 300 130" role="img" aria-label="Températures des prochaines heures"><path d="${hpath} L${hx(HT.length - 1)} 98 L${hx(0)} 98Z" fill="var(--a2)" fill-opacity=".15"/><path d="${hpath}" fill="none" stroke="var(--a2)" stroke-width="2"/>
      ${H.hours.map((h, i) => `<circle cx="${hx(i)}" cy="${hy(HT[i])}" r="3.5" fill="#fff"/><text x="${hx(i)}" y="${hy(HT[i]) - 9}" fill="#fff" font-size="11" text-anchor="middle">${HT[i]}°</text>
        <text x="${hx(i)}" y="114" fill="rgb(255 255 255 / .55)" font-size="10" text-anchor="middle">${hour(h.time)}</text>${h.rainChance ? `<text x="${hx(i)}" y="127" fill="#7dd3fc" font-size="9" text-anchor="middle">${h.rainChance}%</text>` : ''}`).join('')}</svg>${foot('30 min')}</div>`],
    ['Pastilles', 'une pastille par heure qu’on fait défiler, la plus proche en couleur', `<div class="card h2"><div class="t">${H.city}</div>
      <div class="strip">${H.hours.map((h, i) => `<div class="chip ${i === 0 ? 'now' : ''}"><span class="s" style="color:#fff">${i === 0 ? 'Maint.' : hour(h.time)}</span><span class="ic">${ic(h.condition, new Date(h.time).getHours() >= 6 && new Date(h.time).getHours() < 19)}</span><b class="tab">${h.temperature}°</b><span class="drop">💧${h.rainChance ?? 0}%</span></div>`).join('')}</div></div>`],
    ['Pluie + température', 'des barres bleues pour la pluie, la courbe de température par-dessus', `<div class="card h3"><div class="t">${H.city}</div>
      <svg viewBox="0 0 300 130" role="img" aria-label="Pluie et température des prochaines heures">${H.hours.map((h, i) => `<rect x="${hx(i) - 9}" y="${98 - (h.rainChance ?? 0) * .7}" width="18" height="${Math.max(2, (h.rainChance ?? 0) * .7)}" rx="4" fill="#38bdf8" fill-opacity=".45"/>
        <text x="${hx(i)}" y="114" fill="rgb(255 255 255 / .55)" font-size="10" text-anchor="middle">${hour(h.time)}</text><text x="${hx(i)}" y="127" fill="#7dd3fc" font-size="9" text-anchor="middle">${h.rainChance ?? 0}%</text>`).join('')}
        <path d="${hpath}" fill="none" stroke="#fb923c" stroke-width="2.5"/>${HT.map((t, i) => `<circle cx="${hx(i)}" cy="${hy(t)}" r="3" fill="#fb923c"/><text x="${hx(i)}" y="${hy(t) - 8}" fill="#fff" font-size="10" text-anchor="middle">${t}°</text>`).join('')}</svg>
      <div class="s">🟧 température · 🟦 risque de pluie</div></div>`],
  ]],
]
document.getElementById('app').innerHTML = sections.map(([title, key, opts]) => `<section><h2>${title}<code>${key}</code></h2><div class="row">${opts.map(([name, desc, html], i) => `<div class="opt">${html}<p><b>${i + 1} · ${name}</b> : ${desc}</p></div>`).join('')}</div></section>`).join('') + '<div style="height:50px"></div>'
</script>
</body>
</html>
