<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Morex page modération</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/src/styles/morex.css">
<link rel="stylesheet" href="/src/styles/admin.css">
<style>
  .switch { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 50; display: flex; gap: 6px; padding: 8px; border-radius: 999px; background: rgb(15 23 42 / .92); border: 1px solid rgb(255 255 255 / .2); box-shadow: 0 10px 30px rgb(0 0 0 / .5); backdrop-filter: blur(12px); }
  .switch span { align-self: center; font-size: 12.5px; color: rgb(255 255 255 / .6); padding: 0 8px; }
  .switch button { font: inherit; font-size: 13px; padding: 8px 15px; border-radius: 999px; border: 0; background: transparent; color: #fff; cursor: pointer; } .switch button.on { background: #fff; color: #1e1b4b; font-weight: 600; }
  .av { width: 48px; height: 48px; border-radius: 50%; flex: none; background: rgb(255 255 255 / .1); box-shadow: 0 0 0 2px rgb(255 255 255 / .15); }
  .who b { display: block; font-size: 15.5px; } .who small { color: rgb(255 255 255 / .55); font-size: 13px; }
  .reason { margin-top: 6px; font-size: 13.5px; font-style: italic; color: #fecaca; }
  .sum { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-bottom: 24px; }
  .sum > div { padding: 22px 24px; border-radius: 22px; background: rgb(255 255 255 / .08); border: 1px solid rgb(255 255 255 / .14); backdrop-filter: blur(22px); position: relative; overflow: hidden; }
  .sum > div::before { content: ''; position: absolute; inset: 0 0 auto; height: 3px; background: var(--k); box-shadow: 0 0 12px var(--k); }
  .sum b { display: block; font-size: 36px; font-weight: 600; line-height: 1.1; } .sum span { font-size: 14px; color: rgb(255 255 255 / .65); }
  /* 1 deux colonnes avec sabliers */
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: start; }
  .row { display: flex; align-items: center; gap: 16px; padding: 16px 18px; border-radius: 20px; background: rgb(255 255 255 / .05); border: 1px solid rgb(255 255 255 / .07); margin-bottom: 12px; }
  .row .g { flex: 1; min-width: 0; }
  .ring { position: relative; width: 62px; height: 62px; flex: none; } .ring svg { position: absolute; inset: 0; } .ring span { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; font-size: 15px; font-weight: 700; line-height: 1; } .ring small { display: block; font-size: 10px; font-weight: 500; opacity: .7; }
  .acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  /* 2 file unique */
  .tabs2 { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .item { display: grid; grid-template-columns: 6px 48px 1fr auto auto; gap: 16px; align-items: center; padding: 16px 20px 16px 0; border-radius: 20px; background: rgb(255 255 255 / .05); border: 1px solid rgb(255 255 255 / .07); margin-bottom: 12px; overflow: hidden; }
  .item .bar { align-self: stretch; background: var(--c); box-shadow: 0 0 12px var(--c); }
  .tag { padding: 4px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 600; white-space: nowrap; } .t-hot { background: rgb(248 113 113 / .2); color: #fecaca; } .t-wait { background: rgb(251 191 36 / .2); color: #fde68a; } .t-ban { background: rgb(167 139 250 / .22); color: #ddd6fe; }
  /* 3 kanban */
  .kan { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; align-items: start; }
  .col { padding: 18px; border-radius: 24px; background: rgb(255 255 255 / .06); border: 1px solid rgb(255 255 255 / .12); border-top: 3px solid var(--c); }
  .col h4 { margin: 0 0 4px; font-size: 17px; display: flex; align-items: center; gap: 10px; } .col h4 span { margin-left: auto; font-size: 13px; padding: 2px 10px; border-radius: 999px; background: color-mix(in srgb, var(--c) 25%, transparent); }
  .col p { margin: 0 0 14px; font-size: 12.5px; color: rgb(255 255 255 / .55); }
  .kc { padding: 14px; border-radius: 18px; background: rgb(2 6 23 / .45); border: 1px solid rgb(255 255 255 / .08); margin-bottom: 10px; }
  .kc .top { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; } .kc .av { width: 40px; height: 40px; }
  .kc .acts { justify-content: flex-start; }
  .empty { padding: 18px; text-align: center; color: rgb(255 255 255 / .5); font-size: 13.5px; border: 1px dashed rgb(255 255 255 / .15); border-radius: 16px; }
  /* 4 trou noir */
  .bh { position: relative; height: 520px; border-radius: 26px; overflow: hidden; background: radial-gradient(circle at 50% 50%, #000 0 60px, rgb(124 58 237 / .45) 70px, rgb(56 189 248 / .12) 160px, transparent 260px), rgb(2 6 23 / .7); border: 1px solid rgb(255 255 255 / .12); }
  .bh .disk { position: absolute; left: 50%; top: 50%; width: 360px; height: 120px; transform: translate(-50%, -50%) rotate(-12deg); border-radius: 50%; border: 3px solid rgb(251 191 36 / .5); box-shadow: 0 0 40px rgb(251 191 36 / .4); }
  .bh .p { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; cursor: pointer; }
  .bh .p .av { width: var(--s); height: var(--s); box-shadow: 0 0 0 3px var(--c), 0 0 22px var(--c); }
  .bh .p b { font-size: 13px; } .bh .p small { font-size: 12px; color: var(--c); font-weight: 600; }
  .bh .legend { position: absolute; left: 20px; bottom: 16px; font-size: 13px; color: rgb(255 255 255 / .6); }
  .bh .ban { position: absolute; right: 20px; top: 20px; width: 300px; padding: 16px; border-radius: 20px; background: rgb(15 23 42 / .8); border: 1px solid rgb(255 255 255 / .12); }
</style>
</head>
<body class="morex" data-theme="galaxy">
<div id="app"></div>
<div class="switch" id="switch"></div>
<script>
const AV = (s) => `https://api.dicebear.com/9.x/avataaars/svg?seed=${encodeURIComponent(s)}&backgroundColor=c0aede,b6e3f4,ffd5dc,d1d4f9`
const WAIT = [{ n: 'Lucía Gómez', e: 'lucia@example.com', h: 2 }, { n: 'Alan Turing', e: 'alan@example.com', h: 9 }, { n: 'Tim Berners-Lee', e: 'tim@example.com', h: 18 }]
const BAN = [{ n: 'Yuki Tanaka', e: 'yuki@example.com', r: 'Faux compte signalé par plusieurs utilisateurs' }, { n: 'Grace Hopper', e: 'grace@example.com', r: 'Création de dizaines de widgets RSS identiques' }]
const col = (h) => h <= 3 ? '#f87171' : h <= 12 ? '#fbbf24' : '#34d399'
const ring = (h) => { const C = 2 * Math.PI * 27, p = h / 24; return `<span class="ring"><svg viewBox="0 0 62 62"><circle cx="31" cy="31" r="27" fill="none" stroke="rgb(255 255 255 / .1)" stroke-width="6"/><circle cx="31" cy="31" r="27" fill="none" stroke="${col(h)}" stroke-width="6" stroke-linecap="round" stroke-dasharray="${p * C} ${C}" transform="rotate(-90 31 31)" style="filter:drop-shadow(0 0 6px ${col(h)})"/></svg><span>${h} h<small>restantes</small></span></span>` }
const who = (u) => `<img class="av" src="${AV(u.n)}" alt=""><div class="g who"><b>${u.n}</b><small>${u.e}</small>${u.r ? `<div class="reason">« ${u.r} »</div>` : ''}</div>`
const btnC = '<button class="adm-btn sm">✉ Confirmer l\'e-mail</button>', btnU = '<button class="adm-btn sm">↺ Réactiver</button>', btnD = '<button class="adm-btn sm danger">🗑 Supprimer</button>'
const sum = () => `<div class="sum"><div style="--k:#f87171"><b>${WAIT.filter((u) => u.h <= 3).length}</b><span>expire${WAIT.filter((u) => u.h <= 3).length > 1 ? 'nt' : ''} dans moins de 3 h</span></div><div style="--k:#fbbf24"><b>${WAIT.length}</b><span>comptes à confirmer</span></div><div style="--k:#a78bfa"><b>${BAN.length}</b><span>comptes suspendus</span></div></div>`
let v = +(location.hash.slice(1) || 1)
const V = {
  1: ['Deux colonnes + sabliers', () => `${sum()}<div class="two"><div class="adm-glass adm-card"><h3>À confirmer avant expiration</h3><p class="adm-muted adm-note">Le serveur supprime un compte non confirmé 24 h après l'inscription. L'anneau montre le temps qui reste.</p>
      ${WAIT.map((u) => `<div class="row">${ring(u.h)}${who(u)}<div class="acts">${btnC}</div></div>`).join('')}</div>
    <div class="adm-glass adm-card"><h3>Comptes suspendus</h3><p class="adm-muted adm-note">Ils ne peuvent plus se connecter. Le motif leur a été envoyé par e-mail.</p>
      ${BAN.map((u) => `<div class="row">${who(u)}<div class="acts">${btnU}${btnD}</div></div>`).join('')}</div></div>`],
  2: ['Une seule file', () => { const items = [...WAIT.map((u) => ({ ...u, k: u.h <= 3 ? 'hot' : 'wait' })), ...BAN.map((u) => ({ ...u, k: 'ban' }))].sort((a, b) => ({ hot: 0, wait: 1, ban: 2 })[a.k] - ({ hot: 0, wait: 1, ban: 2 })[b.k] || (a.h ?? 0) - (b.h ?? 0))
    return `${sum()}<div class="adm-glass adm-card"><h3>À traiter, du plus urgent au moins urgent</h3><div class="tabs2"><button class="adm-chip on">Tout <b>5</b></button><button class="adm-chip">Urgent <b>1</b></button><button class="adm-chip">À confirmer <b>3</b></button><button class="adm-chip">Suspendus <b>2</b></button></div>
      ${items.map((u) => { const c = u.k === 'hot' ? '#f87171' : u.k === 'wait' ? '#fbbf24' : '#a78bfa'
        return `<div class="item" style="--c:${c}"><span class="bar"></span><img class="av" src="${AV(u.n)}" alt=""><div class="who"><b>${u.n}</b><small>${u.e}</small>${u.r ? `<div class="reason">« ${u.r} »</div>` : ''}</div>
          <span class="tag ${u.k === 'hot' ? 't-hot' : u.k === 'wait' ? 't-wait' : 't-ban'}">${u.k === 'ban' ? '⛔ suspendu' : `⏳ expire dans ${u.h} h`}</span><div class="acts">${u.k === 'ban' ? btnU + btnD : btnC}</div></div>` }).join('')}</div>` }],
  3: ['Colonnes par urgence', () => { const hot = WAIT.filter((u) => u.h <= 3), wait = WAIT.filter((u) => u.h > 3)
    const card = (u, acts, extra = '') => `<div class="kc"><div class="top"><img class="av" src="${AV(u.n)}" alt=""><div class="who"><b>${u.n}</b><small>${u.e}</small></div></div>${extra}<div class="acts">${acts}</div></div>`
    return `${sum()}<div class="kan">
      <div class="col" style="--c:#f87171"><h4>🔥 Urgent <span>${hot.length}</span></h4><p>Supprimés dans moins de 3 h si personne ne confirme</p>${hot.map((u) => card(u, btnC, `<div class="tag t-hot" style="display:inline-block;margin-bottom:10px">⏳ ${u.h} h restantes</div>`)).join('') || '<div class="empty">Rien d\'urgent ✨</div>'}</div>
      <div class="col" style="--c:#fbbf24"><h4>⏳ En attente <span>${wait.length}</span></h4><p>Pas encore confirmés, il reste du temps</p>${wait.map((u) => card(u, btnC, `<div class="tag t-wait" style="display:inline-block;margin-bottom:10px">⏳ ${u.h} h restantes</div>`)).join('')}</div>
      <div class="col" style="--c:#a78bfa"><h4>⛔ Suspendus <span>${BAN.length}</span></h4><p>Ne peuvent plus se connecter</p>${BAN.map((u) => card(u, btnU + btnD, `<div class="reason" style="margin:0 0 10px">« ${u.r} »</div>`)).join('')}</div></div>` }],
  4: ['Le trou noir', () => `${sum()}<div class="bh"><div class="disk"></div>
      ${WAIT.map((u, i) => { const d = 70 + u.h / 24 * 170, a = [-.6, 2.2, 4.1][i]; return `<div class="p" style="--c:${col(u.h)};--s:${u.h <= 3 ? 56 : 48}px;left:calc(50% + ${Math.cos(a) * d * 1.3}px);top:calc(50% + ${Math.sin(a) * d * .85}px)"><img class="av" src="${AV(u.n)}" alt=""><b>${u.n}</b><small>⏳ ${u.h} h</small></div>` }).join('')}
      <span class="legend">Plus un compte est près du trou noir, plus il est près d'être supprimé. Clique pour confirmer son e-mail.</span>
      <div class="ban"><b style="display:block;margin-bottom:10px">⛔ Suspendus · ${BAN.length}</b>${BAN.map((u) => `<div style="display:flex;gap:10px;align-items:center;margin-bottom:10px"><img class="av" style="width:36px;height:36px" src="${AV(u.n)}" alt=""><div class="who" style="flex:1;min-width:0"><b style="font-size:14px">${u.n}</b><small>${u.r}</small></div>${btnU}</div>`).join('')}</div></div>`],
}
const ICON = { overview: '<circle cx="12" cy="12" r="3.2" fill="currentColor"/><ellipse cx="12" cy="12" rx="9.5" ry="3.6" fill="none" stroke="currentColor" stroke-width="1.5" transform="rotate(-20 12 12)"/>', accounts: '<circle cx="7" cy="8" r="2" fill="currentColor"/><circle cx="17" cy="7" r="1.6" fill="currentColor"/><circle cx="13" cy="16" r="2.2" fill="currentColor"/><circle cx="5" cy="17" r="1.3" fill="currentColor"/>', services: '<circle cx="12" cy="12" r="2.6" fill="currentColor"/><circle cx="12" cy="12" r="6" fill="none" stroke="currentColor" opacity=".5"/><circle cx="18" cy="12" r="1.5" fill="currentColor"/>', moderation: '<path d="M12 2.5 19.5 5.5v6c0 4.6-3.2 8.3-7.5 10-4.3-1.7-7.5-5.4-7.5-10v-6Z" fill="none" stroke="currentColor" stroke-width="1.5"/>' }
function draw() {
  const nav = [['overview', 'Vue d’ensemble'], ['accounts', 'Comptes'], ['services', 'Services'], ['moderation', 'Modération']].map(([k, l]) => `<button class="${k === 'moderation' ? 'on' : ''}"><span><svg viewBox="0 0 24 24">${ICON[k]}</svg><span class="adm-label-txt">${l}</span></span></button>`).join('')
  document.getElementById('app').innerHTML = `<div class="adm"><aside class="adm-glass adm-side"><div class="adm-brand"><img src="/logo.svg" alt=""><span class="adm-label-txt">Morex<small>console admin</small></span><button class="adm-fold"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2"/></svg></button></div>${nav}
    <div class="adm-me"><img src="${AV('Morayo')}" alt=""><div class="adm-label-txt"><b>Morayo</b><small>admin</small></div></div><a class="adm-back" href="#"><span>←</span><span class="adm-label-txt">Retour au dashboard</span></a></aside>
    <main class="adm-main"><div class="adm-crumb"><div class="adm-langs"><button class="on">FR</button><button>EN</button><button>ES</button></div></div>${V[v][1]()}</main></div>`
  document.getElementById('switch').innerHTML = '<span>Page Modération :</span>' + Object.entries(V).map(([k, [n]]) => `<button class="${+k === v ? 'on' : ''}" data-v="${k}">${k} · ${n}</button>`).join('')
}
document.addEventListener('click', (e) => { const b = e.target.closest('[data-v]'); if (b) { v = +b.dataset.v; location.hash = v; draw() } })
draw()
</script>
</body>
</html>
