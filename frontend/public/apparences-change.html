<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Morex exchange rate</title>
<link rel="icon" type="image/svg+xml" href="/logo.svg" />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
<style>
  :root { --a1: #818cf8; --a2: #38bdf8; --glow: 99 102 241; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; font-family: Poppins, system-ui, sans-serif; color: #fff; background-color: #020617;
    background: linear-gradient(rgb(2 6 23 / .6), rgb(15 12 50 / .78)), url(/accueil_photo.jpg) 50% 28%/cover fixed; }
  h1 { text-align: center; font-weight: 600; margin: 0; padding-top: 36px; }
  .lead { text-align: center; color: rgb(255 255 255 / .65); margin: 8px auto 30px; max-width: 760px; }
  .lead code { background: rgb(255 255 255 / .1); padding: 2px 8px; border-radius: 8px; font-size: 13px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 24px; max-width: 1250px; margin: 0 auto; padding: 0 20px 60px; }
  .opt > p { margin: 10px 0 0; font-size: 13px; color: rgb(255 255 255 / .65); }
  .opt > p b { color: #fff; }
  .card { position: relative; overflow: hidden; border-radius: 24px; padding: 20px; height: 270px; display: flex; flex-direction: column; gap: 10px;
    background: rgb(255 255 255 / .08); border: 1px solid rgb(255 255 255 / .14); backdrop-filter: blur(22px); }
  .head { display: flex; align-items: center; gap: 12px; }
  .ico { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: linear-gradient(135deg, rgb(var(--glow) / .5), rgb(255 255 255 / .06)); }
  .title { font-weight: 600; font-size: 15px; } .sub { font-size: 12px; color: rgb(255 255 255 / .55); }
  .foot { width: 100%; margin-top: auto; display: flex; justify-content: space-between; font-size: 11px; color: rgb(255 255 255 / .45); }
  .tab { font-variant-numeric: tabular-nums; }
  .coin { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; font-size: 30px; font-weight: 800; flex: none;
    box-shadow: 0 0 26px var(--c-glow), inset -6px -8px 14px rgb(0 0 0 / .25); }
  .coin.base { background: radial-gradient(circle at 35% 30%, #fde68a, #f59e0b 70%); color: #7c2d12; --c-glow: rgb(245 158 11 / .6); }
  .coin.quote { background: radial-gradient(circle at 35% 30%, #bbf7d0, #22c55e 70%); color: #14532d; --c-glow: rgb(34 197 94 / .5); }
  .live { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: #6ee7b7; }
  .live i { width: 7px; height: 7px; border-radius: 50%; background: #34d399; box-shadow: 0 0 8px #34d399; animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }

  /* 1 · Deux pièces */
  .p1 .pair { display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 6px; }
  .p1 .pair .coin { animation: spinY 5s linear infinite; }
  .p1 .pair .coin.quote { animation-delay: -2.5s; }
  @keyframes spinY { to { transform: rotateY(360deg); } }
  .p1 .eq { font-size: 26px; color: rgb(255 255 255 / .5); }
  .p1 .big { text-align: center; font-size: 40px; font-weight: 700; letter-spacing: -.02em; }
  .p1 .big small { font-size: 18px; font-weight: 500; color: rgb(255 255 255 / .7); margin-left: 6px; }

  /* 2 · Convertisseur express (multiples calculés depuis rate) */
  .p2 .rows { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
  .p2 .row { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-radius: 14px; background: rgb(255 255 255 / .06); }
  .p2 .row:first-child { background: linear-gradient(135deg, rgb(var(--glow) / .45), rgb(255 255 255 / .06)); }
  .p2 .row b { font-size: 18px; } .p2 .row span { color: rgb(255 255 255 / .7); font-size: 14px; }

  /* 3 · Compteur rétro (flip) */
  .p3 { align-items: center; }
  .p3 .flip { display: flex; gap: 5px; margin: auto 0 4px; perspective: 400px; }
  .p3 .d { width: 40px; height: 60px; border-radius: 9px; display: grid; place-items: center; font-size: 36px; font-weight: 700; position: relative;
    background: linear-gradient(#1e1b4b 50%, #17153d 50%); box-shadow: 0 8px 20px -6px rgb(0 0 0 / .6); animation: flipIn .6s cubic-bezier(.3,.6,.4,1) both; }
  .p3 .d::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: rgb(0 0 0 / .5); }
  .p3 .sep { width: 10px; }
  @keyframes flipIn { from { transform: rotateX(90deg); filter: brightness(1.8); } }
  .p3 .pairline { font-size: 13px; letter-spacing: .25em; text-transform: uppercase; color: rgb(255 255 255 / .6); margin-bottom: auto; }

  /* 4 · Néon */
  .p4 { background: rgb(2 6 23 / .6); border: 1px solid var(--a1); box-shadow: 0 0 22px rgb(var(--glow) / .45), inset 0 0 22px rgb(var(--glow) / .12); justify-content: center; align-items: center; text-align: center; }
  .p4 .n { font-size: 56px; font-weight: 700; color: #e0f2fe; text-shadow: 0 0 6px #fff, 0 0 18px var(--a2), 0 0 40px var(--a2), 0 0 80px var(--a1); }
  .p4 .pills { display: flex; gap: 8px; }
  .p4 .pills span { padding: 5px 12px; border-radius: 999px; border: 1px solid var(--a2); color: var(--a2); font-size: 12px; letter-spacing: .15em; text-transform: uppercase; text-shadow: 0 0 8px var(--a2); }

  /* 5 · Carte bancaire holographique */
  .p5 { border: 1.5px solid transparent;
    background: linear-gradient(rgb(15 15 35 / .85), rgb(15 15 35 / .85)) padding-box, linear-gradient(135deg, #f0abfc, #93c5fd, #6ee7b7, #fde68a) border-box; }
  .p5 .shine { position: absolute; inset: 0; background: linear-gradient(115deg, transparent 30%, rgb(255 255 255 / .12) 45%, transparent 60%); animation: shine 4.5s ease-in-out infinite; pointer-events: none; }
  @keyframes shine { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
  .p5 .chip { width: 44px; height: 32px; border-radius: 7px; background: linear-gradient(135deg, #fde68a, #d97706); }
  .p5 .mono { font-family: 'JetBrains Mono', monospace; letter-spacing: .12em; color: rgb(255 255 255 / .75); font-size: 13px; }
  .p5 .amt { font-size: 38px; font-weight: 700; margin-top: auto; }

  /* 6 · Balance */
  .p6 .scale { flex: 1; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; text-align: center; }
  .p6 .side { padding: 14px 8px; border-radius: 18px; background: rgb(255 255 255 / .06); }
  .p6 .side .coin { width: 52px; height: 52px; font-size: 24px; margin: 0 auto 8px; }
  .p6 .side b { display: block; font-size: 22px; } .p6 .side span { font-size: 12px; color: rgb(255 255 255 / .6); text-transform: uppercase; }
  .p6 .beam { font-size: 26px; color: var(--a2); text-shadow: 0 0 12px var(--a2); animation: sway 3s ease-in-out infinite alternate; }
  @keyframes sway { from { transform: rotate(-6deg); } to { transform: rotate(6deg); } }
</style>
</head>
<body>
<h1>Taux de change, 6 propositions</h1>
<p class="lead">Chacune n'utilise que ce que le backend renvoie aujourd'hui :
  <code>{ base, quote, rate, asOf }</code>. Les montants des propositions 2 et 6 sont juste <code>rate</code> multiplié, rien de plus</p>

<div class="grid" id="grid"></div>

<script>
// What GET /widgets gives for this widget (sample of a real answer)
const data = { base: 'bitcoin', quote: 'usd', rate: 84402, asOf: new Date(Date.now() - 42000).toISOString() }

const SYMBOL = { usd: '$', eur: '€', gbp: '£', jpy: '¥', chf: 'Fr', xof: 'F' }
const COIN = { bitcoin: '₿', ethereum: 'Ξ', solana: '◎', dogecoin: 'Ð', tether: '₮' }
const base = data.base, quote = data.quote
const bSym = COIN[base] ?? base.charAt(0).toUpperCase()
const qSym = SYMBOL[quote] ?? quote.toUpperCase()
const fmt = (n, max = 2) => n.toLocaleString('fr-FR', { maximumFractionDigits: max })
const ago = Math.round((Date.now() - new Date(data.asOf)) / 1000)
const updated = `<span class="live"><i></i>il y a ${ago} s</span>`
const head = (t) => `<div class="head"><div class="ico">⇄</div><div><div class="title">${t}</div><div class="sub">${base.toUpperCase()} → ${quote.toUpperCase()}</div></div></div>`
const foot = `<div class="foot"><span>Toutes les 60 s</span>${updated}</div>`

const cards = [
  ['Deux pièces', 'les deux monnaies en pièces qui tournent, le taux en dessous', `<div class="card p1">${head('Taux de change')}
    <div class="pair"><div class="coin base">${bSym}</div><span class="eq">=</span><div class="coin quote">${qSym}</div></div>
    <div class="big tab">${fmt(data.rate)}<small>${quote.toUpperCase()}</small></div>${foot}</div>`],
  ['Convertisseur express', '1, 0,1 et 0,01 bitcoin déjà convertis : pratique d’un coup d’œil', `<div class="card p2">${head('Taux de change')}
    <div class="rows">${[1, 0.1, 0.01].map((m) => `<div class="row"><span>${fmt(m, 2)} ${bSym}</span><b class="tab">${fmt(data.rate * m)} ${qSym}</b></div>`).join('')}</div>${foot}</div>`],
  ['Compteur rétro', 'les chiffres arrivent en basculant comme un panneau d’aéroport à chaque mise à jour', `<div class="card p3">${head('Taux de change')}
    <div class="flip">${fmt(data.rate, 0).split('').map((c, i) => /\d/.test(c) ? `<span class="d tab" style="animation-delay:${i * 0.08}s">${c}</span>` : '<span class="sep"></span>').join('')}</div>
    <div class="pairline">1 ${base} en ${quote}</div>${foot}</div>`],
  ['Néon', 'le taux lumineux avec la paire en pastilles', `<div class="card p4">
    <div class="pills"><span>${base}</span><span>→</span><span>${quote}</span></div>
    <div class="n tab">${fmt(data.rate)} ${qSym}</div>${foot}</div>`],
  ['Carte holographique', 'façon carte bancaire avec un reflet qui passe', `<div class="card p5"><div class="shine"></div>
    <div style="display:flex;justify-content:space-between;align-items:center"><div class="chip"></div><b style="font-size:24px">${bSym}</b></div>
    <div class="mono">1 ${base.toUpperCase()} · ${quote.toUpperCase()}</div>
    <div class="amt tab">${fmt(data.rate)} ${qSym}</div>${foot}</div>`],
  ['Balance', 'les deux côtés de l’échange face à face, le fléau oscille doucement', `<div class="card p6">${head('Taux de change')}
    <div class="scale"><div class="side"><div class="coin base">${bSym}</div><b>1</b><span>${base}</span></div>
    <div class="beam">⇌</div>
    <div class="side"><div class="coin quote">${qSym}</div><b class="tab">${fmt(data.rate, 0)}</b><span>${quote}</span></div></div>${foot}</div>`],
]
document.getElementById('grid').innerHTML = cards.map(([name, desc, html], i) => `<div class="opt">${html}<p><b>${i + 1} · ${name}</b> : ${desc}</p></div>`).join('')
</script>
</body>
</html>
