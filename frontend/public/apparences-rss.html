<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="referrer" content="no-referrer" />
<title>Morex RSS widgets</title>
<link rel="icon" type="image/svg+xml" href="/logo.svg" />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet" />
<style>
  :root { --a1: #818cf8; --a2: #38bdf8; --glow: 99 102 241; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; font-family: Poppins, system-ui, sans-serif; color: #fff; background-color: #020617;
    background: linear-gradient(rgb(2 6 23 / .62), rgb(15 12 50 / .8)), url(/accueil_photo.jpg) 50% 28%/cover fixed; }
  h1 { text-align: center; font-weight: 600; margin: 0; padding-top: 36px; }
  .lead { text-align: center; color: rgb(255 255 255 / .65); margin: 8px auto 26px; max-width: 800px; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; max-width: 1150px; margin: 0 auto; padding: 0 20px 60px; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
  .opt { min-width: 0; } .opt > p { margin: 10px 0 0; font-size: 13px; color: rgb(255 255 255 / .65); } .opt > p b { color: #fff; }
  .card { position: relative; overflow: hidden; border-radius: 24px; padding: 18px; height: 360px; display: flex; flex-direction: column; gap: 10px;
    background: rgb(255 255 255 / .08); border: 1px solid rgb(255 255 255 / .14); backdrop-filter: blur(22px); }
  .head { display: flex; align-items: center; gap: 10px; }
  .ico { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: linear-gradient(135deg, #fb923c, #ef4444); font-size: 16px; flex: none; }
  .t { font-weight: 600; font-size: 14px; } .s { font-size: 11.5px; color: rgb(255 255 255 / .6); }
  .clamp2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .clamp3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  a { color: inherit; text-decoration: none; }
  .img { position: relative; overflow: hidden; background: #111; border-radius: 16px; }
  .img img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform .6s; }
  a:hover .img img, .img:hover img { transform: scale(1.05); }
  .foot { margin-top: auto; display: flex; justify-content: space-between; font-size: 11px; color: rgb(255 255 255 / .45); }
  .live { display: inline-flex; align-items: center; gap: 6px; font-size: 10px; font-weight: 700; letter-spacing: .08em; padding: 3px 8px; border-radius: 6px; background: #ef4444; }
  .live i { width: 6px; height: 6px; border-radius: 50%; background: #fff; animation: blink 1.2s infinite; } @keyframes blink { 50% { opacity: .2; } }

  /* 1 magazine */
  .m1 .img { height: 150px; flex: none; }
  .m1 .tag { position: absolute; left: 10px; bottom: 10px; font-size: 11px; padding: 3px 9px; border-radius: 999px; background: rgb(0 0 0 / .55); backdrop-filter: blur(6px); }
  .m1 h3 { margin: 0; font-size: 16px; line-height: 1.3; }
  .m1 ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .m1 li a { display: flex; gap: 10px; align-items: center; font-size: 12.5px; }
  .m1 .mini { width: 54px; height: 36px; border-radius: 8px; flex: none; }
  /* 2 full-bleed slides */
  .m2 { padding: 0; }
  .m2 .slides { position: absolute; inset: 0; }
  .m2 .slide { position: absolute; inset: 0; opacity: 0; transition: opacity .8s; }
  .m2 .slide.on { opacity: 1; }
  .m2 .slide img { width: 100%; height: 100%; object-fit: cover; animation: kb 7s ease-out both; }
  @keyframes kb { from { transform: scale(1.12); } to { transform: scale(1); } }
  .m2 .shade { position: absolute; inset: 0; background: linear-gradient(transparent 25%, rgb(0 0 0 / .92)); }
  .m2 .over { position: absolute; left: 18px; right: 18px; bottom: 18px; display: flex; flex-direction: column; gap: 8px; }
  .m2 .over h3 { margin: 0; font-size: 19px; line-height: 1.25; }
  .m2 .top { position: absolute; left: 18px; right: 18px; top: 16px; display: flex; justify-content: space-between; align-items: center; z-index: 2; }
  .m2 .dots { display: flex; gap: 5px; } .m2 .dots i { width: 7px; height: 7px; border-radius: 50%; background: rgb(255 255 255 / .4); }
  .m2 .dots i.on { background: #fff; width: 18px; border-radius: 4px; }
  /* 3 newspaper */
  .m3 { background: #f5efe3; color: #1f1a17; border: 0; }
  .m3 .mast { text-align: center; font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 800; border-bottom: 3px double #1f1a17; padding-bottom: 6px; }
  .m3 .date { text-align: center; font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: #6b5f55; margin-top: -4px; }
  .m3 .cols { flex: 1; display: grid; grid-template-columns: 1.3fr 1fr; gap: 14px; min-height: 0; }
  .m3 .lead-art .img { height: 110px; border-radius: 4px; filter: grayscale(.2) sepia(.15); }
  .m3 h3 { font-family: 'Playfair Display', serif; font-size: 17px; line-height: 1.2; margin: 8px 0 4px; }
  .m3 p { margin: 0; font-size: 11.5px; line-height: 1.5; color: #4b423b; }
  .m3 .side { border-left: 1px solid #cbbfae; padding-left: 12px; display: flex; flex-direction: column; gap: 10px; overflow: hidden; }
  .m3 .side a { font-family: 'Playfair Display', serif; font-size: 13px; line-height: 1.25; border-bottom: 1px solid #ddd3c4; padding-bottom: 8px; }
  /* 4 AI digest */
  .m4 .pill { align-self: flex-start; font-size: 11px; padding: 3px 10px; border-radius: 999px; background: linear-gradient(135deg, var(--a1), var(--a2)); font-weight: 600; }
  .m4 .item { display: grid; grid-template-columns: 76px 1fr; gap: 12px; padding: 10px; border-radius: 16px; background: rgb(255 255 255 / .05); }
  .m4 .item .img { height: 76px; border-radius: 12px; }
  .m4 .why { font-size: 11.5px; color: #c7d2fe; margin-top: 4px; }
  .m4 .tags { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 6px; } .m4 .tags span { font-size: 10px; padding: 2px 8px; border-radius: 999px; background: rgb(255 255 255 / .1); }
  .m4 .list { display: flex; flex-direction: column; gap: 8px; overflow: hidden; }
</style>
</head>
<body>
<h1>Actualités (RSS), 4 propositions</h1>
<p class="lead">Avec les vrais articles que votre backend a renvoyés (Le Monde), qui ont maintenant leur image et leur résumé. Clique sur un article pour l'ouvrir</p>
<div class="grid" id="app"></div>
<script>
const D = {"items": [{"link": "https://www.lemonde.fr/societe/live/2026/09/25/en-direct-visite-du-pape-a-paris-leon-xiv-encense-l-unesco-un-interlocuteur-privilegie-de-l-eglise-catholique-au-service-du-bien-commun_6782008_3224.html", "image": "https://img.lemde.fr/2026/09/25/35/0/5726/2863/644/322/60/0/cc6cd9b_ftp-1-sgf8q7hl4kx7-5180773-01-06.jpg", "title": "EN DIRECT, visite du pape à Paris | Léon XIV a terminé son discours à l’Unesco et commence sa déambulation parisienne", "summary": "Le pape effectue un voyage de quatre jours en France, à Paris, à Lourdes et à Metz. Dans la capitale, un programme chargé l’attend ce vendredi : il a rencontré Emmanuel Macron à l’Elysée, s’est rendu à l’Unesco. Il ira ensuite à la cathédrale Notre-Dame de Paris et participera à…", "feedTitle": "Le Monde.fr - Actualités et Infos en France et dans le monde", "publishedAt": "Fri, 25 Sep 2026 15:55:18 +0200"}, {"link": "https://www.lemonde.fr/pixels/article/2026/09/25/affaire-thelyson-orelien-le-concepteur-de-pangram-max-spero-n-a-aucun-doute-sur-la-presence-d-ia-dans-le-roman-c-etait-ca-ou-mourir_6782482_4408996.html", "image": "https://img.lemde.fr/2026/09/24/286/0/3000/1500/644/322/60/0/5dbcf92_upload-1-2nxfvhd192kd-ia-edition-pangram.jpg", "title": "Affaire Thélyson Orélien : le concepteur de Pangram, Max Spero, n’a « aucun doute » sur la présence d’IA dans le roman « C’était ça ou mourir »", "summary": "En trois ans, le logiciel de détection d’IA est devenu l’un des plus efficaces de son secteur, déclenchant de multiples controverses aux Etats-Unis. Pour son concepteur, « Pangram pourrait finir par ressembler à une étiquette nutritionnelle ou de certification 100 % bio » de la …", "feedTitle": "Le Monde.fr - Actualités et Infos en France et dans le monde", "publishedAt": "Fri, 25 Sep 2026 15:03:29 +0200"}, {"link": "https://www.lemonde.fr/international/article/2026/09/25/comment-la-georgie-s-est-detournee-de-ses-partenaires-occidentaux-au-profit-de-la-russie_6782471_3210.html", "image": "https://img.lemde.fr/2026/09/22/1601/0/4000/2000/644/322/60/0/c267e91_upload-1-1mhssfwdkfgh-pebrel-georgie-geopolitique-121.jpg", "title": "Comment la Géorgie s’est détournée de ses partenaires occidentaux au profit de la Russie", "summary": "La réorientation géopolitique de cette ex-république soviétique du Caucase est singulière dans la région, où les pays prennent au contraire leurs distances avec Moscou. L’Iran en profite pour accroître son influence.", "feedTitle": "Le Monde.fr - Actualités et Infos en France et dans le monde", "publishedAt": "Fri, 25 Sep 2026 14:00:21 +0200"}, {"link": "https://www.lemonde.fr/economie/article/2026/09/25/pourquoi-le-diesel-francais-flambe-plus-que-la-moyenne-europeenne_6782465_3234.html", "image": "https://img.lemde.fr/2026/09/22/395/0/3333/1666/644/322/60/0/016a2e9_upload-1-7naevhmim15h-lewisjoly-lemonde-22-09-26-022.JPG", "title": "Pourquoi le diesel français flambe plus que la moyenne européenne", "summary": "Sous la menace de Trump, le litre de gazole à l’échelle de l’Union européenne a déjà battu son record, à 2,23 euros en moyenne lundi 21 septembre contre 2,16 euros une semaine plus tôt, et contre 2,38 euros en moyenne dans l’Hexagone.", "feedTitle": "Le Monde.fr - Actualités et Infos en France et dans le monde", "publishedAt": "Fri, 25 Sep 2026 13:30:07 +0200"}], "insight": null}
const A = D.items
const img = (src) => src ? `<img src="${src}" alt="" referrerpolicy="no-referrer" loading="lazy">` : ''
const ago = (iso) => { if (!iso) return ''; const m = Math.round((Date.now() - new Date(iso)) / 60000); return m < 60 ? `il y a ${m} min` : m < 1440 ? `il y a ${Math.round(m / 60)} h` : `il y a ${Math.round(m / 1440)} j` }
// Feeds often name themselves "Site - long tagline": keep the first part
const feed = (A[0].feedTitle || 'Le Monde').split(/ [-–—|] /)[0]
const head = `<div class="head"><span class="ico">📰</span><div><div class="t">Actualités</div><div class="s">${feed}</div></div></div>`
const foot = `<div class="foot"><span>Toutes les 5 min</span><span>Mis à jour à ${new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })}</span></div>`
const isLive = (a) => /en direct|live/i.test(a.title)
// AI recap: the backend fills `insight` only when AI is enabled on the widget. Here: built from the real summaries to show the layout.
const DIGEST = (D.insight?.items?.length ? D.insight.items : A.map((a) => ({ link: a.link, image: a.image,
  summary: (a.summary || a.title).slice(0, 180), whyItMatters: 'Exemple : l’IA explique ici en une phrase pourquoi ça compte pour toi',
  topics: a.title.toLowerCase().includes('pape') ? ['Religion', 'Paris'] : ['Actualité'], readingMinutes: 3 })))

const cards = [
  ['Magazine', 'la une en grande image avec sa source, les autres articles avec leur miniature', `<div class="card m1">${head}
    <a href="${A[0].link}" target="_blank" rel="noopener"><div class="img" style="height:150px">${img(A[0].image)}<span class="tag">${isLive(A[0]) ? '<b class="live"><i></i>DIRECT</b> ' : ''}${ago(A[0].publishedAt)}</span></div></a>
    <a href="${A[0].link}" target="_blank" rel="noopener"><h3 class="clamp2">${A[0].title}</h3></a>
    <ul>${A.slice(1, 3).map((a) => `<li><a href="${a.link}" target="_blank" rel="noopener"><span class="img mini">${img(a.image)}</span><span class="clamp2">${a.title}</span></a></li>`).join('')}</ul></div>`],
  ['Diaporama', 'une photo plein cadre qui zoome doucement, l’article change tout seul toutes les 6 s', `<div class="card m2"><div class="slides" id="slides">${A.map((a, i) => `<a class="slide ${i ? '' : 'on'}" href="${a.link}" target="_blank" rel="noopener">${img(a.image)}<div class="shade"></div>
      <div class="over">${isLive(a) ? '<span class="live" style="align-self:flex-start"><i></i>EN DIRECT</span>' : ''}<h3 class="clamp3">${a.title}</h3><span class="s" style="color:rgb(255 255 255 / .75)">${feed} · ${ago(a.publishedAt)}</span></div></a>`).join('')}</div>
    <div class="top"><span class="t" style="text-shadow:0 1px 6px #000">📰 ${feed}</span><span class="dots" id="dots">${A.map((_, i) => `<i class="${i ? '' : 'on'}"></i>`).join('')}</span></div></div>`],
  ['Journal papier', 'façon quotidien imprimé : titre du journal, grande une avec son chapô, colonne des autres titres', `<div class="card m3"><div class="mast">${feed}</div><div class="date">${new Date().toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' })}</div>
    <div class="cols"><a class="lead-art" href="${A[0].link}" target="_blank" rel="noopener"><div class="img">${img(A[0].image)}</div><h3 class="clamp2">${A[0].title}</h3><p class="clamp3">${A[0].summary ?? ''}</p></a>
    <div class="side">${A.slice(1).map((a) => `<a href="${a.link}" target="_blank" rel="noopener" class="clamp3">${a.title}</a>`).join('')}</div></div></div>`],
  ['Récap IA', 'si l’IA est activée sur le widget : un vrai résumé, pourquoi c’est important, des mots-clés et le temps de lecture', `<div class="card m4">${head}<span class="pill">✨ Récap IA · ${DIGEST.length} articles</span>
    <div class="list">${DIGEST.slice(0, 2).map((x) => `<a class="item" href="${x.link}" target="_blank" rel="noopener"><div class="img">${img(x.image)}</div>
      <div><div class="clamp3" style="font-size:12.5px;line-height:1.4">${x.summary}</div><div class="why clamp2">💡 ${x.whyItMatters}</div>
      <div class="tags">${x.topics.map((t) => `<span>#${t}</span>`).join('')}${x.readingMinutes ? `<span>⏱ ${x.readingMinutes} min</span>` : ''}</div></div></a>`).join('')}</div></div>`],
]
document.getElementById('app').innerHTML = cards.map(([name, desc, html], i) => `<div class="opt">${html}<p><b>${i + 1} · ${name}</b> : ${desc}</p></div>`).join('')

let k = 0
setInterval(() => {
  k = (k + 1) % A.length
  document.querySelectorAll('#slides .slide').forEach((s, i) => { s.classList.toggle('on', i === k); if (i === k) { const im = s.querySelector('img'); if (im) { im.style.animation = 'none'; void im.offsetWidth; im.style.animation = '' } } })
  document.querySelectorAll('#dots i').forEach((d, i) => d.classList.toggle('on', i === k))
}, 6000)
</script>
</body>
</html>
