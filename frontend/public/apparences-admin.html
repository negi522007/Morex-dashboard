<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Morex console admin</title>
<link rel="icon" type="image/svg+xml" href="/logo.svg" />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; font-family: Poppins, system-ui, sans-serif; color: #fff; background-color: #020617;
    background: linear-gradient(rgb(2 6 23 / .5), rgb(15 12 50 / .78)), url(/accueil_photo.jpg) 50% 28%/cover fixed; }
  h1.top { text-align: center; font-weight: 600; margin: 0; padding-top: 30px; }
  .lead { text-align: center; color: rgb(255 255 255 / .75); margin: 8px auto 16px; max-width: 900px; padding: 0 16px; font-size: 14px; }
  .tabs { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-bottom: 22px; }
  .tabs button { font: inherit; font-size: 13px; padding: 8px 16px; border-radius: 999px; border: 1px solid rgb(255 255 255 / .25); background: transparent; color: #fff; cursor: pointer; }
  .tabs button.on { background: #fff; color: #1e1b4b; font-weight: 600; }
  .stage { max-width: 1180px; margin: 0 auto; padding: 0 20px 60px; }
  .desc { text-align: center; font-size: 13px; color: rgb(255 255 255 / .8); margin: -6px auto 18px; max-width: 820px; }
  .glass { background: rgb(15 23 42 / .72); border: 1px solid rgb(255 255 255 / .12); border-radius: 26px; backdrop-filter: blur(18px); }
  .btn { font: inherit; font-size: 12.5px; padding: 7px 13px; border-radius: 999px; border: 1px solid rgb(255 255 255 / .22); background: rgb(255 255 255 / .06); color: #fff; cursor: pointer; }
  .btn:hover:not(:disabled) { background: rgb(255 255 255 / .14); }
  .btn:disabled { opacity: .35; cursor: not-allowed; }
  .btn.danger { border-color: rgb(248 113 113 / .5); color: #fecaca; }
  .btn.primary { background: #fff; color: #1e1b4b; border-color: #fff; font-weight: 600; }
  .badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .b-admin { background: rgb(167 139 250 / .2); color: #ddd6fe; } .b-ban { background: rgb(248 113 113 / .2); color: #fecaca; }
  .b-unconf { background: rgb(251 191 36 / .18); color: #fde68a; cursor: help; } .b-ok { background: rgb(52 211 153 / .16); color: #a7f3d0; }
  .av { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 12px; flex: none; }
  .tools { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .search { flex: 1; min-width: 200px; padding: 10px 16px; border-radius: 999px; border: 1px solid rgb(255 255 255 / .18); background: rgb(255 255 255 / .07); color: #fff; font: inherit; font-size: 13px; outline: none; }
  .chips { display: flex; gap: 6px; } .chips button { font: inherit; font-size: 12px; padding: 7px 13px; border-radius: 999px; border: 1px solid rgb(255 255 255 / .2); background: transparent; color: #fff; cursor: pointer; }
  .chips button.on { background: rgb(167 139 250 / .3); border-color: #c4b5fd; }
  .muted { color: rgb(255 255 255 / .55); font-size: 12px; }
  .num { font-family: 'JetBrains Mono', monospace; font-size: 12px; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(120px); padding: 11px 18px; border-radius: 14px; background: #1e1b4b; border: 1px solid rgb(255 255 255 / .2); font-size: 13px; transition: .3s; z-index: 50; }
  .toast.show { transform: translateX(-50%); }
  /* dialogs */
  .dlg-bg { position: fixed; inset: 0; background: rgb(2 6 23 / .65); display: none; place-items: center; z-index: 40; backdrop-filter: blur(4px); }
  .dlg-bg.open { display: grid; }
  .dlg { width: min(420px, 92vw); padding: 24px; border-radius: 24px; background: #0f172a; border: 1px solid rgb(255 255 255 / .15); }
  .dlg h3 { margin: 6px 0 6px; } .dlg p { font-size: 13px; color: rgb(255 255 255 / .8); line-height: 1.55; }
  .dlg input { width: 100%; padding: 10px 14px; border-radius: 12px; border: 1px solid rgb(255 255 255 / .2); background: rgb(255 255 255 / .06); color: #fff; font: inherit; font-size: 13px; margin: 6px 0 12px; }
  .dlg .row { display: flex; gap: 8px; justify-content: flex-end; }
  .dlg .big { font-size: 34px; }
  /* 1 · table */
  .d1 .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 16px; }
  .d1 .stat { padding: 16px 18px; } .d1 .stat b { display: block; font-size: 28px; } .d1 .stat span { font-size: 12px; opacity: .7; }
  .d1 .panel { padding: 18px; }
  .d1 table { width: 100%; border-collapse: collapse; margin-top: 14px; font-size: 13px; }
  .d1 th { text-align: left; font-weight: 500; font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: rgb(255 255 255 / .55); padding: 8px 10px; border-bottom: 1px solid rgb(255 255 255 / .1); }
  .d1 td { padding: 11px 10px; border-bottom: 1px solid rgb(255 255 255 / .06); vertical-align: middle; }
  .d1 tr:hover td { background: rgb(255 255 255 / .03); }
  .d1 .who { display: flex; align-items: center; gap: 10px; } .d1 .who small { display: block; color: rgb(255 255 255 / .55); font-size: 11.5px; }
  .d1 .acts { display: flex; gap: 5px; justify-content: flex-end; }
  .d1 .ic { width: 32px; height: 32px; padding: 0; display: grid; place-items: center; font-size: 14px; }
  @media (max-width: 900px) { .d1 .stats { grid-template-columns: repeat(2, 1fr); } .d1 .hide-sm { display: none; } }
  /* 2 · cards */
  .d2 .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; margin-top: 16px; }
  .d2 .card { padding: 18px; position: relative; display: flex; flex-direction: column; gap: 10px; }
  .d2 .card.banned { border-color: rgb(248 113 113 / .4); }
  .d2 .card .head { display: flex; gap: 12px; align-items: center; } .d2 .card .head .av { width: 46px; height: 46px; font-size: 15px; }
  .d2 .card b.name { font-size: 15px; } .d2 .card small { display: block; color: rgb(255 255 255 / .6); font-size: 12px; word-break: break-all; }
  .d2 .counts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; text-align: center; }
  .d2 .counts div { padding: 8px 4px; border-radius: 12px; background: rgb(255 255 255 / .05); } .d2 .counts b { display: block; font-size: 16px; } .d2 .counts span { font-size: 10.5px; opacity: .65; }
  .d2 .menu { position: absolute; top: 14px; right: 14px; }
  .d2 .menu > button { width: 32px; height: 32px; padding: 0; }
  .d2 .menu .pop { position: absolute; right: 0; top: 38px; width: 200px; padding: 6px; border-radius: 16px; background: #0f172a; border: 1px solid rgb(255 255 255 / .16); display: none; z-index: 5; }
  .d2 .menu.open .pop { display: block; }
  .d2 .menu .pop button { display: block; width: 100%; text-align: left; border: 0; background: none; color: #fff; font: inherit; font-size: 12.5px; padding: 8px 10px; border-radius: 10px; cursor: pointer; }
  .d2 .menu .pop button:hover:not(:disabled) { background: rgb(255 255 255 / .08); } .d2 .menu .pop button:disabled { opacity: .35; cursor: not-allowed; }
  .d2 .menu .pop button.red { color: #fca5a5; }
  /* 3 · list + side panel */
  .d3 .wrap { display: grid; grid-template-columns: 380px 1fr; gap: 16px; }
  @media (max-width: 900px) { .d3 .wrap { grid-template-columns: 1fr; } }
  .d3 .list { padding: 14px; max-height: 620px; overflow: auto; }
  .d3 .item { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 16px; cursor: pointer; }
  .d3 .item:hover { background: rgb(255 255 255 / .05); } .d3 .item.sel { background: rgb(167 139 250 / .18); }
  .d3 .item .t { flex: 1; min-width: 0; } .d3 .item .t b { display: block; font-size: 13px; } .d3 .item .t small { display: block; font-size: 11.5px; opacity: .6; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .d3 .led { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .d3 .detail { padding: 26px; }
  .d3 .detail .head { display: flex; gap: 16px; align-items: center; } .d3 .detail .head .av { width: 64px; height: 64px; font-size: 20px; }
  .d3 .detail h2 { margin: 0; font-size: 22px; }
  .d3 .facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 20px 0; }
  .d3 .facts div { padding: 12px; border-radius: 16px; background: rgb(255 255 255 / .05); } .d3 .facts b { display: block; font-size: 20px; } .d3 .facts span { font-size: 11.5px; opacity: .65; }
  .d3 .sec { margin-top: 18px; } .d3 .sec h4 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; opacity: .6; font-weight: 500; }
  .d3 .namerow { display: flex; gap: 8px; } .d3 .namerow input { flex: 1; padding: 9px 12px; border-radius: 12px; border: 1px solid rgb(255 255 255 / .2); background: rgb(255 255 255 / .06); color: #fff; font: inherit; font-size: 13px; }
  .d3 .zone { margin-top: 18px; padding: 14px; border-radius: 16px; border: 1px solid rgb(248 113 113 / .35); background: rgb(127 29 29 / .15); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .d3 .zone p { flex: 1 0 100%; margin: 0 0 6px; font-size: 12px; opacity: .8; }
  .note { margin-top: 10px; font-size: 11.5px; opacity: .6; }
</style>
</head>
<body>
<h1 class="top">La console admin</h1>
<p class="lead">L'écran réservé aux administrateurs : la liste des comptes, avec recherche, filtres et actions (renommer, confirmer l'e-mail, bannir / débannir, supprimer). Données d'exemple, mais tout est cliquable : essaie les filtres, la recherche et les actions</p>
<div class="tabs" id="tabs"></div>
<p class="desc" id="desc"></p>
<div class="stage" id="stage"></div>
<div class="dlg-bg" id="dlg"><div class="dlg" id="dlgIn"></div></div>
<div class="toast" id="toast"></div>
<script>
const ME = 'u1'
const COLORS = ['#a78bfa', '#38bdf8', '#f472b6', '#34d399', '#fbbf24', '#fb923c']
let users = [
  { id: 'u1', firstName: 'Morayo', lastName: 'Admin', email: 'admin@morex.app', emailVerified: true, isAdmin: true, isBanned: false, createdAt: '2026-09-20', widgetCount: 12, linkedAccountsCount: 1, sessionCount: 2 },
  { id: 'u2', firstName: 'Ada', lastName: 'Lovelace', email: 'ada@example.com', emailVerified: true, isAdmin: false, isBanned: false, createdAt: '2026-09-28', widgetCount: 7, linkedAccountsCount: 1, sessionCount: 1 },
  { id: 'u3', firstName: 'Alan', lastName: 'Turing', email: 'alan@example.com', emailVerified: false, isAdmin: false, isBanned: false, createdAt: '2026-10-06', widgetCount: 0, linkedAccountsCount: 0, sessionCount: 0 },
  { id: 'u4', firstName: 'Grace', lastName: 'Hopper', email: 'grace@example.com', emailVerified: true, isAdmin: false, isBanned: true, createdAt: '2026-09-25', widgetCount: 3, linkedAccountsCount: 0, sessionCount: 0 },
  { id: 'u5', firstName: 'Linus', lastName: 'Torvalds', email: 'linus@example.com', emailVerified: true, isAdmin: true, isBanned: false, createdAt: '2026-09-21', widgetCount: 9, linkedAccountsCount: 2, sessionCount: 3 },
  { id: 'u6', firstName: 'Margaret', lastName: 'Hamilton', email: 'margaret@example.com', emailVerified: true, isAdmin: false, isBanned: false, createdAt: '2026-10-02', widgetCount: 15, linkedAccountsCount: 1, sessionCount: 1 },
  { id: 'u7', firstName: 'Tim', lastName: 'Berners-Lee', email: 'tim@example.com', emailVerified: false, isAdmin: false, isBanned: false, createdAt: '2026-10-07', widgetCount: 0, linkedAccountsCount: 0, sessionCount: 0 },
]
let q = '', filter = 'all', design = +(location.hash.slice(1) || 1), sel = 'u2'
const ago = (d) => { const n = Math.round((new Date('2026-10-07') - new Date(d)) / 864e5); return n === 0 ? "aujourd'hui" : n === 1 ? 'hier' : `il y a ${n} j` }
const ini = (u) => (u.firstName[0] + (u.lastName[0] || '')).toUpperCase()
const col = (u) => COLORS[[...u.id].reduce((a, c) => a + c.charCodeAt(0), 0) % COLORS.length]
const av = (u) => `<span class="av" style="background:${col(u)}33;color:${col(u)}">${ini(u)}</span>`
const badges = (u) => [u.isAdmin && '<span class="badge b-admin">★ Admin</span>', u.isBanned && '<span class="badge b-ban">⛔ Banni</span>',
  !u.emailVerified && '<span class="badge b-unconf" title="Compte pas encore confirmé : le serveur le supprime tout seul après 24 h">✉ Non confirmé</span>',
  u.emailVerified && !u.isBanned && !u.isAdmin && '<span class="badge b-ok">● Actif</span>'].filter(Boolean).join(' ')
const protectedWhy = (u) => u.id === ME ? "C'est toi : tu ne peux pas te bannir ou te supprimer" : u.isAdmin ? "Un administrateur ne peut pas être banni ni supprimé" : ''
const visible = () => users.filter((u) => (filter === 'all' || (filter === 'unconf' && !u.emailVerified) || (filter === 'ban' && u.isBanned))
  && `${u.firstName} ${u.lastName} ${u.email}`.toLowerCase().includes(q.toLowerCase())).sort((a, b) => b.createdAt.localeCompare(a.createdAt))
const counts = () => ({ all: users.length, unconf: users.filter((u) => !u.emailVerified).length, ban: users.filter((u) => u.isBanned).length, admin: users.filter((u) => u.isAdmin).length })
function toast(t) { const el = document.getElementById('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 2600) }
function tools() {
  const c = counts()
  return `<div class="tools"><input class="search" id="q" placeholder="🔍 Rechercher un nom ou un e-mail…" value="${q}">
    <div class="chips">${[['all', `Tous · ${c.all}`], ['unconf', `Non confirmés · ${c.unconf}`], ['ban', `Bannis · ${c.ban}`]].map(([k, l]) => `<button class="${filter === k ? 'on' : ''}" data-f="${k}">${l}</button>`).join('')}</div></div>`
}
const empty = () => `<p class="muted" style="text-align:center;padding:30px">Aucun compte ne correspond 🔭</p>`
// ---- actions (simulate the API: same rules, same codes)
const act = {
  rename(id) { const u = users.find((x) => x.id === id); openDlg(`<div class="big">✎</div><h3>Renommer</h3><p>PATCH /admin/users/${id}</p><input id="fn" value="${u.firstName}" placeholder="Prénom"><input id="ln" value="${u.lastName}" placeholder="Nom"><div class="row"><button class="btn" data-close>Annuler</button><button class="btn primary" id="ok">Enregistrer</button></div>`,
    () => { const f = document.getElementById('fn').value.trim(), l = document.getElementById('ln').value.trim(); if (!f || !l) return toast('400 · Le prénom et le nom ne peuvent pas être vides'); Object.assign(u, { firstName: f, lastName: l }); closeDlg(); toast('✓ Nom modifié'); draw() }) },
  confirm(id) { const u = users.find((x) => x.id === id); u.emailVerified = true; toast(`✓ E-mail de ${u.firstName} marqué comme confirmé`); draw() },
  ban(id) { const u = users.find((x) => x.id === id); openDlg(`<div class="big">⛔</div><h3>Bannir ${u.firstName} ?</h3><p>Il ne pourra plus se connecter, et <b>toutes ses sessions sont fermées tout de suite</b>. Tu pourras le débannir plus tard.</p><div class="row"><button class="btn" data-close>Annuler</button><button class="btn danger" id="ok">Bannir</button></div>`,
    () => { u.isBanned = true; u.sessionCount = 0; closeDlg(); toast(`⛔ ${u.firstName} est banni · ses sessions sont fermées`); draw() }) },
  unban(id) { const u = users.find((x) => x.id === id); u.isBanned = false; toast(`✓ ${u.firstName} peut se reconnecter`); draw() },
  del(id) { const u = users.find((x) => x.id === id); openDlg(`<div class="big">🗑️</div><h3>Supprimer le compte de ${u.firstName} ?</h3><p><b>C'est définitif</b> : ses widgets, son journal, ses alertes et ses comptes liés partent avec lui. Pour confirmer, tape son e-mail : <b>${u.email}</b></p><input id="cf" placeholder="${u.email}"><div class="row"><button class="btn" data-close>Annuler</button><button class="btn danger" id="ok" disabled>Supprimer définitivement</button></div>`,
    () => { users = users.filter((x) => x.id !== id); closeDlg(); toast(`🗑️ Compte de ${u.firstName} supprimé`); if (sel === id) sel = visible()[0]?.id; draw() },
    () => { const i = document.getElementById('cf'), ok = document.getElementById('ok'); i.oninput = () => (ok.disabled = i.value.trim().toLowerCase() !== u.email) }) },
}
function openDlg(html, onOk, after) { document.getElementById('dlgIn').innerHTML = html; document.getElementById('dlg').classList.add('open'); document.getElementById('ok').onclick = onOk; after?.(); setTimeout(() => document.querySelector('#dlgIn input')?.focus(), 50) }
function closeDlg() { document.getElementById('dlg').classList.remove('open') }
const B = (a, u, label, cls = '', title = '') => { const why = (a === 'ban' || a === 'del') ? protectedWhy(u) : ''; return `<button class="btn ${cls}" data-a="${a}" data-id="${u.id}" ${why ? 'disabled' : ''} title="${why || title}">${label}</button>` }
// ---- the 3 designs
const D = {
  1: ['Tableau de bord', 'Quatre compteurs en haut, puis un tableau clair : une ligne par compte, ses badges, ses chiffres, et des boutons-icônes au bout de la ligne (avec une info-bulle). Les boutons interdits sont grisés avec la raison au survol', () => {
    const c = counts()
    return `<div class="d1"><div class="stats">${[['👥', c.all, 'comptes'], ['✉', c.unconf, 'non confirmés'], ['⛔', c.ban, 'bannis'], ['★', c.admin, 'administrateurs']].map(([i, n, l]) => `<div class="glass stat"><b>${i} ${n}</b><span>${l}</span></div>`).join('')}</div>
    <div class="glass panel">${tools()}${!visible().length ? empty() : `<table><tr><th>Compte</th><th>Statut</th><th class="hide-sm">Inscrit</th><th class="hide-sm">Widgets</th><th class="hide-sm">Comptes liés</th><th class="hide-sm">Sessions</th><th></th></tr>
    ${visible().map((u) => `<tr><td><div class="who">${av(u)}<span>${u.firstName} ${u.lastName}${u.id === ME ? ' <span class="muted">(toi)</span>' : ''}<small>${u.email}</small></span></div></td><td>${badges(u)}</td><td class="hide-sm muted">${ago(u.createdAt)}</td><td class="hide-sm num">${u.widgetCount}</td><td class="hide-sm num">${u.linkedAccountsCount}</td><td class="hide-sm num" title="Sessions enregistrées, pas « en ligne maintenant »">${u.sessionCount}</td>
    <td><div class="acts">${B('rename', u, '✎', 'ic', 'Renommer')}${!u.emailVerified ? B('confirm', u, '✉', 'ic', "Marquer l'e-mail comme confirmé") : ''}${u.isBanned ? B('unban', u, '↺', 'ic', 'Débannir') : B('ban', u, '⛔', 'ic', 'Bannir')}${B('del', u, '🗑', 'ic danger', 'Supprimer')}</div></td></tr>`).join('')}</table>`}</div></div>`
  }],
  2: ['Cartes membres', 'Une carte par compte, comme des badges de membres : initiales, badges, trois chiffres. Les actions sont rangées dans un menu « ⋯ » pour garder les cartes calmes. Un compte banni a un contour rouge', () =>
    `<div class="d2"><div class="glass" style="padding:16px">${tools()}</div>${!visible().length ? empty() : `<div class="grid">${visible().map((u) => `<div class="glass card ${u.isBanned ? 'banned' : ''}">
      <div class="menu" data-menu="${u.id}"><button class="btn" data-toggle="${u.id}">⋯</button><div class="pop">
        <button data-a="rename" data-id="${u.id}">✎ Renommer</button>${!u.emailVerified ? `<button data-a="confirm" data-id="${u.id}">✉ Confirmer l'e-mail</button>` : ''}
        ${u.isBanned ? `<button data-a="unban" data-id="${u.id}">↺ Débannir</button>` : `<button data-a="ban" data-id="${u.id}" ${protectedWhy(u) ? 'disabled' : ''} title="${protectedWhy(u)}">⛔ Bannir</button>`}
        <button class="red" data-a="del" data-id="${u.id}" ${protectedWhy(u) ? 'disabled' : ''} title="${protectedWhy(u)}">🗑 Supprimer</button></div></div>
      <div class="head">${av(u)}<div><b class="name">${u.firstName} ${u.lastName}</b><small>${u.email}</small></div></div>
      <div>${badges(u)}</div>
      <div class="counts"><div><b>${u.widgetCount}</b><span>widgets</span></div><div><b>${u.linkedAccountsCount}</b><span>comptes liés</span></div><div><b>${u.sessionCount}</b><span>sessions</span></div></div>
      <span class="muted">Inscrit ${ago(u.createdAt)}</span></div>`).join('')}</div>`}</div>`],
  3: ['Liste + fiche', 'À gauche, la liste des comptes avec un voyant de couleur (vert actif, jaune non confirmé, rouge banni, violet admin). À droite, la fiche du compte choisi : ses chiffres, renommer directement, et une « zone sensible » rouge pour bannir et supprimer', () => {
    const v = visible(); if (!v.find((u) => u.id === sel)) sel = v[0]?.id
    const u = users.find((x) => x.id === sel)
    const led = (u) => u.isBanned ? '#f87171' : u.isAdmin ? '#a78bfa' : !u.emailVerified ? '#fbbf24' : '#34d399'
    return `<div class="d3"><div class="glass" style="padding:16px;margin-bottom:16px">${tools()}</div><div class="wrap">
      <div class="glass list">${!v.length ? empty() : v.map((x) => `<div class="item ${x.id === sel ? 'sel' : ''}" data-sel="${x.id}">${av(x)}<div class="t"><b>${x.firstName} ${x.lastName}</b><small>${x.email}</small></div><span class="led" style="background:${led(x)};box-shadow:0 0 8px ${led(x)}"></span></div>`).join('')}</div>
      <div class="glass detail">${!u ? empty() : `<div class="head">${av(u)}<div><h2>${u.firstName} ${u.lastName}${u.id === ME ? ' <span class="muted">(toi)</span>' : ''}</h2><div class="muted">${u.email} · inscrit ${ago(u.createdAt)}</div><div style="margin-top:6px">${badges(u)}</div></div></div>
        <div class="facts"><div><b>${u.widgetCount}</b><span>widgets</span></div><div><b>${u.linkedAccountsCount}</b><span>comptes liés</span></div><div><b>${u.sessionCount}</b><span>sessions enregistrées</span></div></div>
        <div class="sec"><h4>Nom</h4><div class="namerow"><input id="ifn" value="${u.firstName}"><input id="iln" value="${u.lastName}"><button class="btn primary" id="saveName">Enregistrer</button></div></div>
        ${!u.emailVerified ? `<div class="sec"><h4>E-mail</h4><p class="muted" style="margin:0 0 8px">L'e-mail de confirmation n'est peut-être jamais arrivé. Sans action, le compte sera supprimé 24 h après l'inscription.</p>${B('confirm', u, "✉ Marquer l'e-mail comme confirmé")}</div>` : ''}
        <div class="zone"><p>Zone sensible${protectedWhy(u) ? ' · ' + protectedWhy(u) : ''}</p>${u.isBanned ? B('unban', u, '↺ Débannir') : B('ban', u, '⛔ Bannir', 'danger')}${B('del', u, '🗑 Supprimer le compte', 'danger')}</div>
        <p class="note">Ce que l'admin ne voit jamais : le mot de passe, les widgets ou le journal de la personne. L'API admin ne les expose pas.</p>`}</div></div></div>`
  }],
}
function draw() {
  document.getElementById('tabs').innerHTML = Object.entries(D).map(([k, [n]]) => `<button class="${+k === design ? 'on' : ''}" data-d="${k}">${k} · ${n}</button>`).join('')
  document.getElementById('desc').textContent = D[design][1]
  document.getElementById('stage').innerHTML = D[design][2]()
  const qi = document.getElementById('q'); if (qi) { qi.oninput = (e) => { q = e.target.value; draw(); const n = document.getElementById('q'); n.focus(); n.setSelectionRange(q.length, q.length) } }
  const sn = document.getElementById('saveName'); if (sn) sn.onclick = () => { const u = users.find((x) => x.id === sel), f = document.getElementById('ifn').value.trim(), l = document.getElementById('iln').value.trim(); if (!f || !l) return toast('400 · Le prénom et le nom ne peuvent pas être vides'); Object.assign(u, { firstName: f, lastName: l }); toast('✓ Nom modifié'); draw() }
}
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-d],[data-f],[data-a],[data-toggle],[data-sel],[data-close]')
  if (!t) { document.querySelectorAll('.menu.open').forEach((m) => m.classList.remove('open')); if (e.target.id === 'dlg') closeDlg(); return }
  if (t.dataset.d) { design = +t.dataset.d; draw() }
  else if (t.dataset.f) { filter = t.dataset.f; draw() }
  else if (t.dataset.toggle) { const m = document.querySelector(`[data-menu="${t.dataset.toggle}"]`); const was = m.classList.contains('open'); document.querySelectorAll('.menu.open').forEach((x) => x.classList.remove('open')); if (!was) m.classList.add('open') }
  else if (t.dataset.sel) { sel = t.dataset.sel; draw() }
  else if (t.dataset.close !== undefined) closeDlg()
  else if (t.dataset.a && !t.disabled) act[t.dataset.a](t.dataset.id)
})
document.addEventListener('keydown', (e) => e.key === 'Escape' && closeDlg())
draw()
</script>
</body>
</html>
