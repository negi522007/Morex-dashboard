<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Morex confirmation galaxie</title>
<link rel="icon" type="image/svg+xml" href="/logo.svg" />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Caveat:wght@500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; font-family: Poppins, system-ui, sans-serif; color: #fff; background: #020617; }
  h1.top { text-align: center; font-weight: 600; margin: 0; padding-top: 34px; }
  .lead { text-align: center; color: rgb(255 255 255 / .75); margin: 8px auto 18px; max-width: 860px; padding: 0 16px; }
  .states { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-bottom: 26px; padding: 0 16px; }
  .states button { font: inherit; font-size: 13px; padding: 8px 16px; border-radius: 999px; border: 1px solid rgb(255 255 255 / .25); background: transparent; color: #fff; cursor: pointer; }
  .states button.on { background: #fff; color: #1e1b4b; font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 26px; max-width: 1200px; margin: 0 auto; padding: 0 20px 60px; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
  .opt > p { margin: 12px 0 0; font-size: 13px; color: rgb(255 255 255 / .75); } .opt > p b { color: #fff; }
  /* the whole page, with the app's own background */
  .stage { position: relative; min-height: 560px; border-radius: 26px; overflow: hidden; display: grid; place-items: center; padding: 28px 18px; border: 1px solid rgb(255 255 255 / .1);
    background: linear-gradient(rgb(2 6 23 / .35), rgb(15 12 50 / .55)), url(/accueil_photo.jpg) 50% 30%/cover; }
  .glass { position: relative; width: 100%; max-width: 400px; padding: 28px 26px 24px; border-radius: 30px; text-align: center; background: rgb(255 255 255 / .1); border: 1px solid rgb(255 255 255 / .16); backdrop-filter: blur(22px); box-shadow: 0 24px 60px rgb(0 0 0 / .45); }
  .brand { display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 700; font-size: 15px; margin-bottom: 4px; } .brand img { width: 30px; }
  .glass h2 { margin: 4px 0 6px; font: 700 32px/1.15 Caveat, cursive; } .glass p { margin: 6px 0; font-size: 13.5px; color: rgb(255 255 255 / .82); }
  .glass strong { color: #fff; }
  .glass small { display: block; font-size: 11.5px; opacity: .6; margin-top: 8px; }
  .glass ul { text-align: left; font-size: 12.5px; color: rgb(255 255 255 / .8); padding-left: 20px; margin: 10px 0 0; } li { margin: 4px 0; }
  .btns { display: grid; gap: 9px; margin: 16px 0 6px; }
  .btns button { font: inherit; font-weight: 600; font-size: 14px; border-radius: 999px; padding: 12px 18px; cursor: pointer; border: 0; }
  .btns .y { background: #fff; color: #1e1b4b; box-shadow: 0 10px 24px rgb(167 139 250 / .3); } .btns .n { background: transparent; color: #fff; border: 1px solid rgb(255 255 255 / .3); }
  .sky { display: block; width: 230px; height: 150px; margin: 0 auto; overflow: visible; }
  .dust { fill: #fff; animation: tw 3s ease-in-out infinite; } @keyframes tw { 50% { opacity: .2; } }

  /* 1 · constellation */
  .c1 line { stroke: rgb(196 181 253 / .85); stroke-width: 1.5; stroke-dasharray: 200; stroke-dashoffset: 200; filter: drop-shadow(0 0 3px #a78bfa); animation: draw 6s ease-in-out infinite; }
  .c1 .st { fill: #fff; filter: drop-shadow(0 0 5px #fff); animation: tw 2.4s ease-in-out infinite; }
  @keyframes draw { 0% { stroke-dashoffset: 200; opacity: 1; } 45%, 85% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }
  .c1.ok line { stroke: #fde047; filter: drop-shadow(0 0 5px #fde047); animation: none; stroke-dashoffset: 0; }
  .c1.ok .st { fill: #fde047; filter: drop-shadow(0 0 8px #fde047); }
  .c1 .burst { transform-box: fill-box; transform-origin: center; animation: burst 1.8s ease-out infinite; fill: none; stroke: #fde047; stroke-width: 1.5; }
  @keyframes burst { from { transform: scale(.3); opacity: 1; } to { transform: scale(2.4); opacity: 0; } }
  .c1.no line { stroke: rgb(255 255 255 / .18); animation: none; stroke-dashoffset: 0; filter: none; } .c1.no .st { fill: rgb(255 255 255 / .25); filter: none; animation: fade 3s ease-in-out infinite; }
  @keyframes fade { 50% { opacity: .1; } }
  .c1.bad line { animation: flick 2.2s steps(1) infinite; stroke-dashoffset: 0; } .c1.bad .st { animation: drift 4s ease-in-out infinite; transform-box: fill-box; }
  @keyframes flick { 0%, 100% { opacity: .8; } 30% { opacity: .1; } 36% { opacity: .8; } 60% { opacity: .2; } }
  @keyframes drift { 50% { transform: translate(4px, 6px); opacity: .5; } }

  /* 2 · planet */
  .c2 .pl { filter: drop-shadow(0 0 18px rgb(167 139 250 / .6)); }
  .c2 .sat { offset-path: path('M 205 78 A 90 22 0 1 1 25 78 A 90 22 0 1 1 205 78'); offset-rotate: 0deg; animation: orb 5s linear infinite; }
  @keyframes orb { to { offset-distance: 100%; } }
  .c2 .rocket { animation: lift 2.6s ease-in infinite; } @keyframes lift { 0% { transform: translate(0, 30px); opacity: 0; } 20% { opacity: 1; } 100% { transform: translate(40px, -90px); opacity: 0; } }
  .c2 .shield { fill: none; stroke: #7dd3fc; stroke-width: 2; stroke-dasharray: 6 5; transform-box: fill-box; transform-origin: center; animation: sp 10s linear infinite; filter: drop-shadow(0 0 6px #38bdf8); }
  @keyframes sp { to { transform: rotate(360deg); } }
  .c2 .comet { animation: away 3s ease-in infinite; } @keyframes away { 0% { transform: translate(0, 0); opacity: 1; } 100% { transform: translate(130px, -60px); opacity: 0; } }

  /* 3 · cockpit */
  .hud { position: relative; width: 100%; max-width: 420px; padding: 22px 22px 20px; border-radius: 22px; background: rgb(2 6 23 / .72); border: 1px solid rgb(125 211 252 / .35); box-shadow: 0 0 0 1px rgb(125 211 252 / .08) inset, 0 24px 60px rgb(0 0 0 / .5); font-family: 'Space Mono', monospace; text-align: left; backdrop-filter: blur(10px); }
  .hud::before, .hud::after { content: ''; position: absolute; width: 18px; height: 18px; border: 2px solid #7dd3fc; } .hud::before { top: -2px; left: -2px; border-right: 0; border-bottom: 0; border-radius: 10px 0 0 0; } .hud::after { bottom: -2px; right: -2px; border-left: 0; border-top: 0; border-radius: 0 0 10px 0; }
  .hud .row { display: flex; justify-content: space-between; font-size: 10.5px; letter-spacing: .15em; color: #7dd3fc; }
  .hud .led { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; animation: tw 1s infinite; }
  .hud h2 { font: 700 22px Poppins; margin: 16px 0 4px; } .hud p { font: 13px/1.6 Poppins; color: rgb(255 255 255 / .8); margin: 4px 0; }
  .hud .data { margin: 14px 0; padding: 10px 12px; border-radius: 12px; background: rgb(125 211 252 / .06); border: 1px dashed rgb(125 211 252 / .3); font-size: 12px; line-height: 1.8; }
  .hud .data span { color: #7dd3fc; }
  .hud .btns .y { background: #7dd3fc; color: #0c4a6e; } .hud .btns button { font-family: 'Space Mono', monospace; letter-spacing: .06em; }
  .hud ul { font: 12.5px Poppins; color: rgb(255 255 255 / .8); padding-left: 18px; }
  .scan { position: absolute; left: 0; right: 0; top: 0; height: 40px; background: linear-gradient(transparent, rgb(125 211 252 / .08), transparent); animation: scan 3s linear infinite; pointer-events: none; }
  @keyframes scan { to { top: 100%; } }

  /* 4 · the note in orbit (current page, but in space) */
  .note { position: relative; width: 100%; max-width: 380px; padding: 38px 28px 24px; border-radius: 6px; color: #3b2f5c; text-align: center; transform: rotate(-1.2deg);
    background: repeating-linear-gradient(#fffaf0 0 29px, #e9dcf7 29px 30px); box-shadow: 0 0 60px rgb(167 139 250 / .35), 0 20px 50px rgb(0 0 0 / .5); animation: float 5s ease-in-out infinite; }
  @keyframes float { 50% { transform: rotate(-.2deg) translateY(-8px); } }
  .note::before { content: ''; position: absolute; top: -12px; left: 50%; width: 110px; height: 26px; margin-left: -55px; background: rgb(167 139 250 / .85); transform: rotate(-3deg); }
  .note h2 { font: 700 34px/1.1 Caveat, cursive; color: #7c3aed; margin: 4px 0 6px; } .note p { font-size: 13.5px; margin: 6px 0; } .note .hand { font: 500 21px Caveat, cursive; }
  .note .btns .y { background: #7c3aed; color: #fff; } .note .btns .n { color: #7c3aed; border: 1.5px dashed #c4b5fd; }
  .note ul { font-size: 12.5px; text-align: left; padding-left: 20px; } .note small { font-size: 11px; opacity: .65; display: block; margin-top: 6px; }
  .orbit-stars { position: absolute; inset: 0; pointer-events: none; }
  .orbit-stars i { position: absolute; font-style: normal; color: #fde68a; text-shadow: 0 0 8px #fde047; animation: tw 2s ease-in-out infinite; }
  .confetti { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .confetti i { position: absolute; top: -12px; font-style: normal; color: #fde047; animation: fall 3s linear infinite; }
  @keyframes fall { to { transform: translateY(600px) rotate(360deg); } }
</style>
</head>
<body>
<h1 class="top">La page « C’est bien toi ? », version galaxie</h1>
<p class="lead">La page qui s’ouvre quand on clique sur le lien de l’email, posée sur le vrai fond de l’app. Choisis le moment en haut, et tu peux cliquer sur les boutons des maquettes</p>
<div class="states" id="st"></div>
<div class="grid" id="g"></div>
<script>
const NAME = 'Morayo', MAIL = 'm***@gmail.com'
const STATES = [['ask', '✉️ La question'], ['ok', '🎉 Oui, c’est moi'], ['no', '🛡️ Ce n’était pas moi'], ['bad', '⏳ Lien expiré']]
let state = 'ask'
const brand = '<div class="brand"><img src="/logo.svg" alt="">Morex</div>'
const tips = ['Ajoute tes premiers widgets : météo, actus, ton GitHub', 'Mets ta date de naissance dans ton profil pour ton horoscope', 'Connecte GitHub ou Microsoft pour plus de widgets']
const safe = ['Personne ne peut utiliser ton adresse sans ce lien', 'Plus aucun email d’inscription pendant 24 h', 'Tu voulais un compte ? Réinscris-toi demain']
const li = (a) => `<ul>${a.map((x) => `<li>${x}</li>`).join('')}</ul>`
const yesNo = (y = 'Oui, c’est moi', n = 'Non, ce n’était pas moi') => `<div class="btns"><button class="y" data-go="ok">${y}</button><button class="n" data-go="no">${n}</button></div>`
const go = (label, to = 'ask') => `<div class="btns"><button class="y" data-go="${to}">${label}</button></div>`
const dust = (n = 14, w = 230, h = 150) => Array.from({ length: n }, (_, i) => `<circle class="dust" cx="${(i * 53) % w}" cy="${(i * 37) % h}" r="${i % 4 ? .8 : 1.3}" style="animation-delay:${(i % 6) * .5}s"/>`).join('')
const P = [[35, 30], [195, 30], [195, 125], [35, 125], [115, 82]]
const L = [[0, 1], [1, 2], [2, 3], [3, 0], [0, 4], [4, 1]]
const cons = (extra = '') => `<svg class="sky" viewBox="0 0 230 150">${dust()}${L.map(([a, b], i) => `<line x1="${P[a][0]}" y1="${P[a][1]}" x2="${P[b][0]}" y2="${P[b][1]}" style="animation-delay:${i * .25}s"/>`).join('')}${P.map(([x, y], i) => `<circle class="st" cx="${x}" cy="${y}" r="3.2" style="animation-delay:${i * .4}s"/>`).join('')}${extra}</svg>`
const planetSvg = (extra) => `<svg class="sky" viewBox="0 0 230 150"><defs><radialGradient id="pg" cx="32%" cy="28%"><stop offset="0" stop-color="#fbcfe8"/><stop offset=".45" stop-color="#a78bfa"/><stop offset="1" stop-color="#4c1d95"/></radialGradient></defs>${dust()}<ellipse cx="115" cy="78" rx="90" ry="22" fill="none" stroke="rgb(255 255 255 / .3)" stroke-dasharray="3 5"/><circle class="pl" cx="115" cy="75" r="40" fill="url(#pg)"/>${extra}</svg>`
const stars = (n = 12) => `<div class="orbit-stars">${Array.from({ length: n }, (_, i) => `<i style="left:${(i * 37 + 5) % 95}%;top:${(i * 53 + 8) % 92}%;font-size:${10 + (i % 4) * 4}px;animation-delay:${(i % 5) * .4}s">✦</i>`).join('')}</div>`
const confetti = () => `<div class="confetti">${Array.from({ length: 22 }, (_, i) => `<i style="left:${(i * 41) % 100}%;font-size:${10 + (i % 3) * 5}px;color:${['#fde047', '#c4b5fd', '#f0abfc', '#7dd3fc'][i % 4]};animation-delay:${(i % 8) * .35}s">✦</i>`).join('')}</div>`

const D = [
  ['Constellation', 'la même constellation que l’écran d’inscription : l’enveloppe se dessine ; « oui » la fait briller en or avec une onde, « non » l’éteint, un lien expiré la fait grésiller', {
    ask: () => `<div class="glass">${brand}<div class="c1">${cons()}</div><h2>C’est bien toi, ${NAME} ?</h2><p>Quelqu’un a utilisé <strong>${MAIL}</strong> pour créer un compte Morex.</p>${yesNo()}<small>Rien ne se passe tant que tu n’as pas choisi · lien valable 24&nbsp;h</small></div>`,
    ok: () => `<div class="glass">${brand}<div class="c1 ok">${cons('<circle class="burst" cx="115" cy="82" r="20"/>')}</div><h2>Ton étoile est allumée ✨</h2><p>Ton compte est confirmé, bienvenue dans l’univers Morex.</p>${go('Me connecter')}${li(tips)}</div>`,
    no: () => `<div class="glass">${brand}<div class="c1 no">${cons()}</div><h2>Étoile éteinte 🛡️</h2><p>Aucun compte n’a été créé, la demande a été supprimée.</p>${li(safe)}<small>Tu peux fermer cette page</small></div>`,
    bad: () => `<div class="glass">${brand}<div class="c1 bad">${cons()}</div><h2>Ce lien s’est perdu dans l’espace</h2><p>Il a déjà servi, ou il a plus de 24 heures. Réinscris-toi avec la même adresse : un nouvel email partira.</p>${go('M’inscrire à nouveau')}</div>`,
  }],
  ['Planète et satellite', 'une planète violette avec la lettre en orbite ; « oui » fait décoller une fusée, « non » entoure la planète d’un bouclier, un lien expiré part comme une comète', {
    ask: () => `<div class="glass c2">${brand}${planetSvg('<text class="sat" font-size="20">💌</text>')}<h2>C’est bien toi, ${NAME} ?</h2><p>Quelqu’un a utilisé <strong>${MAIL}</strong> pour créer un compte Morex.</p>${yesNo()}<small>Lien valable 24&nbsp;h</small></div>`,
    ok: () => `<div class="glass c2">${brand}${planetSvg('<text class="rocket" x="112" y="80" font-size="28">🚀</text>')}<h2>Décollage réussi !</h2><p>Ton compte est confirmé.</p>${go('Me connecter')}${li(tips)}</div>`,
    no: () => `<div class="glass c2">${brand}${planetSvg('<circle class="shield" cx="115" cy="75" r="54"/>')}<h2>Planète protégée 🛡️</h2><p>Aucun compte n’a été créé, la demande a été supprimée.</p>${li(safe)}</div>`,
    bad: () => `<div class="glass c2">${brand}${planetSvg('<g class="comet"><line x1="150" y1="60" x2="128" y2="72" stroke="#fde68a" stroke-width="3" stroke-linecap="round" opacity=".5"/><text x="146" y="66" font-size="18">✉️</text></g>')}<h2>Ce lien a filé comme une comète</h2><p>Il a déjà servi, ou il a plus de 24 heures. Réinscris-toi pour en recevoir un nouveau.</p>${go('M’inscrire à nouveau')}</div>`,
  }],
  ['Poste de pilotage', 'l’écran de bord d’un vaisseau : voyants, données du passager, « autorisation d’embarquement » ; l’écran scanne doucement', {
    ask: () => `<div class="hud"><span class="scan"></span><div class="row"><span><i class="led" style="background:#fde047"></i>MOREX · CONTRÔLE</span><span>24:00:00</span></div><h2>Autorisation d’embarquement</h2><p>Une demande d’accès à l’univers Morex vient d’arriver.</p><div class="data"><span>PASSAGER</span> ${NAME}<br><span>SIGNAL&nbsp;&nbsp;</span> ${MAIL}<br><span>STATUT&nbsp;&nbsp;</span> en attente de ta réponse</div>${yesNo('✓ C’est moi, j’autorise', '✕ Ce n’était pas moi')}</div>`,
    ok: () => `<div class="hud"><span class="scan"></span><div class="row"><span><i class="led" style="background:#34d399"></i>ACCÈS AUTORISÉ</span><span>OK</span></div><h2>Bienvenue à bord, ${NAME}</h2><p>Ton compte est confirmé. Les moteurs sont chauds.</p>${go('Me connecter')}${li(tips)}</div>`,
    no: () => `<div class="hud"><span class="scan"></span><div class="row"><span><i class="led" style="background:#fb7185"></i>ACCÈS REFUSÉ</span><span>SÉCURISÉ</span></div><h2>Demande rejetée</h2><p>Aucun compte n’a été créé, la demande a été supprimée.</p>${li(safe)}</div>`,
    bad: () => `<div class="hud"><span class="scan"></span><div class="row"><span><i class="led" style="background:#fbbf24"></i>SIGNAL PERDU</span><span>00:00:00</span></div><h2>Transmission expirée</h2><p>Ce lien a déjà servi, ou il a plus de 24 heures. Réinscris-toi pour recevoir un nouveau signal.</p>${go('M’inscrire à nouveau')}</div>`,
  }],
  ['Le petit mot en orbite', 'on garde le carnet actuel (que tu as choisi), mais il flotte dans l’espace sur le vrai fond, avec des étoiles autour et un scotch violet', {
    ask: () => `${stars()}<div class="note">${brand.replace('Morex', '<span style="color:#7c3aed">Morex</span>')}<h2>Coucou ${NAME} !</h2><p>Quelqu’un a utilisé <b>${MAIL}</b> pour créer un compte Morex.</p><p class="hand">C’est bien toi ? ✦</p>${yesNo('Oui, c’est moi 💜')}<small>Rien ne se passe tant que tu n’as pas choisi · lien valable 24&nbsp;h</small></div>`,
    ok: () => `${stars()}<div class="note">${brand.replace('Morex', '<span style="color:#7c3aed">Morex</span>')}<h2>Bienvenue à bord ! ✨</h2><p>Ton compte est confirmé, tu peux te connecter.</p>${go('Me connecter')}${li(tips)}</div>`,
    no: () => `${stars(6)}<div class="note">${brand.replace('Morex', '<span style="color:#7c3aed">Morex</span>')}<h2>C’est noté 🛡️</h2><p>Aucun compte n’a été créé et la demande a été supprimée.</p>${li(safe)}</div>`,
    bad: () => `${stars(6)}<div class="note">${brand.replace('Morex', '<span style="color:#7c3aed">Morex</span>')}<h2>Ce lien s’est envolé ☄️</h2><p>Il a déjà servi, ou il a plus de 24 heures.</p><p class="hand">Pas grave, on recommence ?</p>${go('M’inscrire à nouveau')}</div>`,
  }],
]
function draw() {
  document.getElementById('st').innerHTML = STATES.map(([k, l]) => `<button class="${k === state ? 'on' : ''}" data-s="${k}">${l}</button>`).join('')
  document.getElementById('g').innerHTML = D.map(([n, d, v], i) => `<div class="opt"><div class="stage">${state === 'ok' ? confetti() : ''}${v[state]()}</div><p><b>${i + 1} · ${n}</b> : ${d}</p></div>`).join('')
}
document.addEventListener('click', (e) => {
  const s = e.target.closest('[data-s]'), g = e.target.closest('[data-go]')
  if (s) state = s.dataset.s; else if (g) state = g.dataset.go; else return
  draw()
})
draw()
</script>
</body>
</html>
