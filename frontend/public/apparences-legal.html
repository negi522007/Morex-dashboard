<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Morex pages légales</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; font-family: Poppins, system-ui, sans-serif; color: #fff; background-color: #020617;
    background: linear-gradient(rgb(2 6 23 / .45), rgb(2 6 23 / .72)), url(/accueil_photo.jpg) 50% 28%/cover fixed; }
  .switch { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 50; display: flex; gap: 6px; padding: 8px; border-radius: 999px; background: rgb(15 23 42 / .92); border: 1px solid rgb(255 255 255 / .2); box-shadow: 0 10px 30px rgb(0 0 0 / .5); backdrop-filter: blur(12px); flex-wrap: wrap; justify-content: center; max-width: 95vw; }
  .switch span { align-self: center; font-size: 12.5px; color: rgb(255 255 255 / .6); padding: 0 8px; }
  .switch button { font: inherit; font-size: 13px; padding: 8px 15px; border-radius: 999px; border: 0; background: transparent; color: #fff; cursor: pointer; } .switch button.on { background: #fff; color: #1e1b4b; font-weight: 600; }
  .glass { background: rgb(255 255 255 / .08); border: 1px solid rgb(255 255 255 / .14); border-radius: 26px; backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); }
  .grad { background: linear-gradient(90deg, #fff, #818cf8 60%, #38bdf8); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .muted { color: rgb(255 255 255 / .65); }
  .top { display: flex; align-items: center; gap: 14px; padding: 26px 40px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 22px; text-decoration: none; color: #fff; } .brand img { height: 34px; }
  .back { margin-left: auto; color: #c4b5fd; font-size: 14px; text-decoration: none; padding: 9px 16px; border-radius: 999px; border: 1px solid rgb(255 255 255 / .2); background: rgb(255 255 255 / .06); }
  .langs { display: flex; gap: 2px; padding: 4px; border-radius: 999px; background: rgb(255 255 255 / .08); border: 1px solid rgb(255 255 255 / .14); } .langs b { font-size: 12.5px; padding: 6px 12px; border-radius: 999px; color: rgb(255 255 255 / .7); cursor: pointer; } .langs b.on { background: #fff; color: #1e1b4b; }
  .doc-tabs { display: inline-flex; gap: 4px; padding: 5px; border-radius: 999px; background: rgb(255 255 255 / .08); border: 1px solid rgb(255 255 255 / .14); }
  .doc-tabs button { font: inherit; font-size: 14.5px; padding: 10px 20px; border-radius: 999px; border: 0; background: transparent; color: rgb(255 255 255 / .75); cursor: pointer; } .doc-tabs button.on { background: linear-gradient(135deg, #818cf8, #38bdf8); color: #fff; font-weight: 600; box-shadow: 0 6px 20px -6px #818cf8; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 28px 110px; }
  h1.h { font-size: clamp(36px, 4vw, 54px); font-weight: 700; letter-spacing: -.03em; margin: 6px 0 8px; line-height: 1.1; }
  .sub { font-size: 16px; color: rgb(255 255 255 / .72); max-width: 680px; line-height: 1.6; margin: 0; }
  .meta { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; } .chip { padding: 6px 13px; border-radius: 999px; font-size: 13px; background: rgb(255 255 255 / .08); border: 1px solid rgb(255 255 255 / .14); }
  .sec h2 { display: flex; align-items: center; gap: 12px; font-size: 21px; margin: 0 0 12px; } .sec h2 .ic { width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center; font-size: 19px; flex: none; background: linear-gradient(135deg, color-mix(in srgb, var(--c) 70%, transparent), color-mix(in srgb, var(--c) 25%, transparent)); box-shadow: 0 8px 20px -8px var(--c); }
  .sec p, .sec li { font-size: 15.5px; line-height: 1.7; color: rgb(255 255 255 / .82); } .sec ul { margin: 0; padding-left: 0; list-style: none; } .sec li { position: relative; padding-left: 26px; margin: 8px 0; }
  .sec li::before { content: '✦'; position: absolute; left: 2px; color: var(--c); text-shadow: 0 0 8px var(--c); }
  .sec li b { color: #fff; }
  /* 1 livre de bord */
  .v1 { display: grid; grid-template-columns: 270px 1fr; gap: 28px; align-items: start; margin-top: 30px; }
  .toc { position: sticky; top: 20px; padding: 20px; } .toc p { margin: 0 0 10px; font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: #38bdf8; font-weight: 600; }
  .toc a { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 14px; color: rgb(255 255 255 / .75); text-decoration: none; font-size: 14.5px; } .toc a.on { background: rgb(255 255 255 / .1); color: #fff; box-shadow: inset 3px 0 0 #38bdf8; } .toc a span { font-size: 16px; }
  .v1 .paper { padding: 40px 46px; } .v1 .sec + .sec { margin-top: 34px; padding-top: 30px; border-top: 1px solid rgb(255 255 255 / .08); }
  /* 2 en bref + détail */
  .bref { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; margin: 30px 0 26px; } @media (max-width: 900px) { .bref { grid-template-columns: 1fr 1fr; } }
  .bref div { padding: 22px; border-radius: 22px; background: rgb(255 255 255 / .08); border: 1px solid rgb(255 255 255 / .14); position: relative; overflow: hidden; }
  .bref div::before { content: ''; position: absolute; inset: 0 0 auto; height: 3px; background: var(--c); box-shadow: 0 0 12px var(--c); }
  .bref .big { font-size: 30px; } .bref b { display: block; font-size: 16px; margin: 10px 0 4px; } .bref span { font-size: 13.5px; color: rgb(255 255 255 / .65); line-height: 1.5; }
  .v2 .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; } @media (max-width: 900px) { .v2 .cols { grid-template-columns: 1fr; } } .v2 .sec { padding: 28px 30px; }
  /* 3 accordéon constellation */
  .v3 { margin-top: 30px; display: flex; flex-direction: column; gap: 14px; }
  .acc { overflow: hidden; } .acc summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 16px; padding: 22px 28px; font-size: 18px; font-weight: 600; } .acc summary::-webkit-details-marker { display: none; }
  .acc summary .ic { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font-size: 21px; background: radial-gradient(circle at 34% 30%, #fff, var(--c) 45%, color-mix(in srgb, var(--c) 30%, #0f172a)); box-shadow: 0 0 22px var(--c); flex: none; }
  .acc summary small { display: block; font-size: 13px; font-weight: 400; color: rgb(255 255 255 / .6); }
  .acc summary::after { content: '+'; margin-left: auto; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: rgb(255 255 255 / .08); font-size: 20px; transition: transform .3s; } .acc[open] summary::after { transform: rotate(45deg); }
  .acc .in { padding: 0 30px 26px 92px; }
  /* 4 lettre */
  .v4 { max-width: 820px; margin: 30px auto 0; }
  .letter { padding: 54px 60px; border-radius: 30px; background: #fbf5e9; color: #2a2346; box-shadow: 0 30px 80px -30px rgb(0 0 0 / .7); position: relative; background-image: repeating-linear-gradient(transparent 0 33px, #e9dff3 33px 34px); background-position: 0 120px; }
  .letter::before { content: ''; position: absolute; inset: 0; border-radius: 30px; border: 1px solid rgb(124 58 237 / .15); pointer-events: none; }
  .letter .seal { position: absolute; right: 44px; top: 40px; width: 74px; height: 74px; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 35% 30%, #a78bfa, #6d28d9); box-shadow: 0 8px 20px -6px #6d28d9; transform: rotate(-12deg); } .letter .seal img { height: 34px; filter: brightness(10); }
  .letter h1 { font-family: Caveat, cursive; font-size: 46px; margin: 0 0 6px; color: #4c3f78; } .letter .date { color: #7c6f99; font-size: 14px; margin-bottom: 26px; }
  .letter h2 { font-family: Caveat, cursive; font-size: 30px; color: #6d28d9; margin: 28px 0 6px; } .letter p, .letter li { font-size: 16px; line-height: 34px; color: #3b3355; margin: 0; } .letter ul { padding-left: 20px; margin: 0; } .letter li b { color: #2a2346; }
  .letter .sign { font-family: Caveat, cursive; font-size: 30px; color: #4c3f78; margin-top: 30px; text-align: right; }
</style>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>
<div id="app"></div>
<div class="switch" id="switch"></div>
<script>
const DOCS = {
  terms: { title: 'Conditions d’utilisation', intro: 'Morex est un projet étudiant réalisé dans le cadre d’un cursus Epitech, pas un produit commercial. Ces conditions sont volontairement courtes et en langage clair.', updated: '9 octobre 2026', read: '2 min',
    bref: [['🎁', 'Gratuit', 'Sans publicité, tes données ne sont jamais revendues', '#34d399'], ['🛠', 'Projet étudiant', 'Le service peut changer ou s’arrêter', '#38bdf8'], ['🤝', 'Respect', 'Pas de contenu illégal, pas de triche', '#fbbf24'], ['🗑', 'Tu pars quand tu veux', 'Suppression immédiate depuis ton profil', '#f472b6']],
    secs: [
      ['🌌', 'Ce que tu peux attendre', '#38bdf8', ['Un compte <b>gratuit</b>, sans publicité, sans revente de tes données à qui que ce soit.', 'Le code source est disponible sur le dépôt GitHub du projet.', 'Le service peut être interrompu, modifié ou arrêté à tout moment : c’est un projet pédagogique, sans engagement de disponibilité.']],
      ['🤝', 'Ce qu’on attend de toi', '#fbbf24', ['Ne pas utiliser l’appli pour du <b>contenu illégal</b> ou pour nuire à d’autres utilisateurs.', 'Ne pas essayer de contourner les protections de sécurité (limites de requêtes, quotas, filtrage des adresses).', '<b>Un compte, une personne</b> : pas de comptes créés en masse.']],
      ['🛡', 'Modération', '#a78bfa', ['Un administrateur peut <b>suspendre</b> ou <b>supprimer</b> un compte qui ne respecte pas ces règles.', 'Tu reçois toujours un <b>e-mail avec le motif</b>, et tu peux y répondre pour t’expliquer : une vraie personne le lira.']],
      ['🗑', 'Supprimer ton compte', '#f472b6', ['Depuis ton profil, à tout moment : suppression <b>immédiate et définitive</b> de ton compte et de toutes tes données.', 'Avant de partir, tu peux <b>télécharger tes données</b> en un fichier JSON.']],
    ] },
  privacy: { title: 'Politique de confidentialité', intro: 'Une note en langage simple sur ce que Morex collecte et pourquoi. Pas un document juridique : c’est un projet étudiant (Epitech), pas une entreprise.', updated: '9 octobre 2026', read: '3 min',
    bref: [['🔒', 'Chiffré', 'Mot de passe haché, tokens et journal chiffrés', '#34d399'], ['🙈', 'Ton journal est à toi', 'Même un admin ne peut pas le lire', '#a78bfa'], ['🤖', 'IA optionnelle', 'Rien n’est envoyé sans ton accord', '#38bdf8'], ['📦', 'Tes données', 'Télécharge-les ou supprime-les quand tu veux', '#f472b6']],
    secs: [
      ['📥', 'Ce qu’on collecte', '#38bdf8', ['<b>E-mail et nom</b>, pour identifier ton compte et le personnaliser.', '<b>Mot de passe</b> : jamais stocké en clair (haché avec scrypt, personne ne peut le retrouver).', '<b>Comptes liés</b> (GitHub, Google, Microsoft, My Epitech) : leurs accès sont chiffrés, et on garde leur nom public (ton pseudo GitHub, ton e-mail).', 'Ce que tes <b>widgets</b> récupèrent (actus, cours…), mis en cache pour ne pas tout re-télécharger.', 'Ton <b>journal</b>, si tu en écris un : chiffré.', '<b>Date de naissance</b> (optionnelle) : uniquement pour ton signe et vérifier que tu as 13 ans ou plus.', '<b>Tes connexions</b> : quand tu t’es connecté, ta dernière activité et le navigateur de chaque session (ex. « Chrome · Linux »). Pas d’adresse IP, pas de localisation.']],
      ['🤖', 'IA (optionnelle)', '#a78bfa', ['Seulement si tu actives l’IA sur un widget : certaines données partent vers le fournisseur d’IA pour générer un résumé.', '<b>Jamais</b> ton mot de passe, tes tokens, ton journal ou ton e-mail.']],
      ['👀', 'Qui peut voir quoi', '#fbbf24', ['Toi seul vois tes données.', 'Un <b>administrateur</b> voit les informations de ton compte : nom, e-mail, avatar, date de naissance, dernière connexion, navigateurs connectés, comptes liés et la liste de tes widgets (leur type et s’ils fonctionnent).', 'Il ne voit <b>jamais</b> ton mot de passe, tes tokens, les réglages ou le contenu de tes widgets, ni ton journal.']],
      ['📦', 'Tes droits', '#34d399', ['<b>Télécharger</b> toutes tes données en un fichier JSON depuis ton profil.', '<b>Supprimer</b> ton compte et tout ce qu’il contient, à tout moment.', 'Modifier ton nom, ton mot de passe ou ta date de naissance quand tu veux.']],
    ] },
}
let doc = 'terms', v = +(location.hash.slice(1) || 1)
const list = (items) => `<ul>${items.map((x) => `<li>${x}</li>`).join('')}</ul>`
const topbar = () => `<div class="top"><a class="brand" href="#"><img src="/logo.svg" alt="">Morex</a><div class="langs"><b class="on">FR</b><b>EN</b><b>ES</b></div><a class="back" href="#">← Retour à l’inscription</a></div>`
const head = (d) => `<div class="doc-tabs">${Object.entries(DOCS).map(([k, x]) => `<button class="${k === doc ? 'on' : ''}" data-doc="${k}">${x.title}</button>`).join('')}</div>
  <h1 class="h"><span class="grad">${d.title}</span></h1><p class="sub">${d.intro}</p><div class="meta"><span class="chip">🗓 Mis à jour le ${d.updated}</span><span class="chip">⏱ ${d.read} de lecture</span></div>`
const V = {
  1: ['Livre de bord', (d) => `${head(d)}<div class="v1"><nav class="glass toc"><p>Sommaire</p>${d.secs.map(([i, t], k) => `<a class="${k === 0 ? 'on' : ''}" href="#s${k}"><span>${i}</span>${t}</a>`).join('')}</nav>
    <article class="glass paper">${d.secs.map(([i, t, c, items], k) => `<section class="sec" id="s${k}" style="--c:${c}"><h2><span class="ic">${i}</span>${t}</h2>${list(items)}</section>`).join('')}</article></div>`],
  2: ['En bref + détail', (d) => `${head(d)}<div class="bref">${d.bref.map(([i, b, s, c]) => `<div style="--c:${c}"><span class="big">${i}</span><b>${b}</b><span>${s}</span></div>`).join('')}</div>
    <div class="v2"><div class="cols">${d.secs.map(([i, t, c, items]) => `<section class="glass sec" style="--c:${c}"><h2><span class="ic">${i}</span>${t}</h2>${list(items)}</section>`).join('')}</div></div>`],
  3: ['Planètes dépliables', (d) => `${head(d)}<div class="v3">${d.secs.map(([i, t, c, items], k) => `<details class="glass acc" style="--c:${c}" ${k === 0 ? 'open' : ''}><summary><span class="ic">${i}</span><span>${t}<small>${items.length} point${items.length > 1 ? 's' : ''}</small></span></summary><div class="in sec" style="--c:${c}">${list(items)}</div></details>`).join('')}</div>`],
  4: ['Lettre', (d) => `<div style="text-align:center">${head(d).replace('<h1 class="h">', '<h1 class="h" style="display:none">').replace('<p class="sub">', '<p class="sub" style="display:none">').replace('<div class="meta">', '<div class="meta" style="display:none">')}</div>
    <div class="v4"><div class="letter"><span class="seal"><img src="/logo.svg" alt=""></span><h1>${d.title}</h1><div class="date">Mis à jour le ${d.updated} · ${d.read} de lecture</div><p>${d.intro}</p>
      ${d.secs.map(([i, t, c, items]) => `<h2>${i} ${t}</h2><ul>${items.map((x) => `<li>${x}</li>`).join('')}</ul>`).join('')}<div class="sign">— L’équipe Morex ✦</div></div></div>`],
}
function draw() {
  const d = DOCS[doc]
  document.getElementById('app').innerHTML = `${topbar()}<div class="wrap">${V[v][1](d)}</div>`
  document.getElementById('switch').innerHTML = '<span>Proposition :</span>' + Object.entries(V).map(([k, [n]]) => `<button class="${+k === v ? 'on' : ''}" data-v="${k}">${k} · ${n}</button>`).join('')
}
document.addEventListener('click', (e) => { const b = e.target.closest('[data-v]'); if (b) { v = +b.dataset.v; location.hash = v; draw() } const t = e.target.closest('[data-doc]'); if (t) { doc = t.dataset.doc; draw() } })
draw()
</script>
</body>
</html>
