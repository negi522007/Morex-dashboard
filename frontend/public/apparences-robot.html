<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Morex robot IA</title>
<link rel="icon" type="image/svg+xml" href="/logo.svg" />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; font-family: Poppins, system-ui, sans-serif; color: #fff; background-color: #020617;
    background: linear-gradient(rgb(2 6 23 / .62), rgb(15 12 50 / .82)), url(/accueil_photo.jpg) 50% 28%/cover fixed; }
  h1 { text-align: center; font-weight: 600; margin: 0; padding-top: 36px; }
  .lead { text-align: center; color: rgb(255 255 255 / .7); margin: 8px auto 28px; max-width: 820px; padding: 0 16px; }
  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 22px; max-width: 1250px; margin: 0 auto; padding: 0 20px 60px; }
  @media (max-width: 1000px) { .grid { grid-template-columns: 1fr; } }
  .opt > p { margin: 12px 0 0; font-size: 13px; color: rgb(255 255 255 / .7); } .opt > p b { color: #fff; }
  .stage { position: relative; height: 260px; border-radius: 24px; overflow: hidden; border: 1px solid rgb(255 255 255 / .12);
    background: linear-gradient(rgb(2 6 23 / .3), rgb(2 6 23 / .6)), url(/sahara_night.jpeg) 50% 60%/cover; }
  .ghost { position: absolute; inset: 16px 16px 110px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; opacity: .22; } .ghost i { border-radius: 14px; background: rgb(255 255 255 / .25); }
  .zoom { position: absolute; left: 22px; bottom: 18px; width: 84px; height: 84px; }
  .zoom small { position: absolute; left: 0; right: 0; bottom: -2px; text-align: center; font-size: 10px; opacity: .55; }
  .spot { position: absolute; right: 22px; bottom: 22px; }
  /* the golden star, now bigger inside so a robot fits */
  .star { position: relative; width: 70px; height: 70px; cursor: pointer; }
  .zoom .star { transform: scale(1.2); transform-origin: top left; }
  .core { position: absolute; inset: 11px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff7cc, #fde047 50%, #f59e0b); box-shadow: 0 0 22px #fde047; display: grid; place-items: center; overflow: visible; transition: transform .2s; }
  .star:hover .core { transform: scale(1.08); }
  .orbit { position: absolute; inset: 0; border-radius: 50%; border: 1px dashed rgb(253 224 71 / .5); animation: spin 5s linear infinite; }
  .orbit::after { content: '✦'; position: absolute; top: -9px; left: 50%; margin-left: -6px; font-size: 12px; color: #fde047; text-shadow: 0 0 8px #fde047; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .core svg { width: 34px; height: 34px; overflow: visible; }
  .ink { fill: #78350f; } .ink-s { stroke: #78350f; } .eye { fill: #fde047; }
  /* animations */
  .blink { animation: blink 4s infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
  .ant { animation: ant 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: bottom; }
  @keyframes ant { 50% { transform: rotate(14deg); } }
  .bulb { animation: bulb 1.6s infinite; } @keyframes bulb { 50% { fill: #ec4899; } }
  .wave { animation: wave 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: 20% 90%; }
  @keyframes wave { 0%, 40%, 100% { transform: rotate(0); } 10%, 30% { transform: rotate(-28deg); } 20% { transform: rotate(8deg); } }
  .float { animation: float 3s ease-in-out infinite; } @keyframes float { 50% { transform: translateY(-3px); } }
  .scan { animation: scan 2.2s ease-in-out infinite; } @keyframes scan { 0%, 100% { transform: translateX(-4px); } 50% { transform: translateX(4px); } }
  .heart { animation: heart 1.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } @keyframes heart { 50% { transform: scale(1.25); } }
  .emo { font-size: 30px; line-height: 1; filter: drop-shadow(0 2px 2px rgb(120 53 15 / .35)); }
</style>
</head>
<body>
<h1>Un robot dans l’étoile</h1>
<p class="lead">L’étoile dorée reste, mais un petit robot vit dedans : on comprend tout de suite que c’est un assistant qui répond. Six styles (agrandis en bas à gauche, taille réelle en bas à droite)</p>
<div class="grid" id="g"></div>
<script>
const R = {
  // 1 simple line robot
  trait: `<svg viewBox="0 0 32 32" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="ink-s">
    <line x1="16" y1="4" x2="16" y2="8"/><circle cx="16" cy="3.5" r="1.6" class="ink"/>
    <rect x="6" y="8" width="20" height="16" rx="5"/><circle cx="12" cy="15" r="1.8" class="ink blink"/><circle cx="20" cy="15" r="1.8" class="ink blink"/>
    <path d="M12 20h8"/><path d="M3 14v5M29 14v5"/></svg>`,
  // 2 cute robot, blinking eyes, bouncing antenna
  mignon: `<svg viewBox="0 0 32 32" class="float">
    <g class="ant"><rect x="15" y="3" width="2" height="5" class="ink"/><circle cx="16" cy="3" r="2.2" class="bulb" fill="#a78bfa"/></g>
    <rect x="5" y="8" width="22" height="18" rx="8" class="ink"/>
    <rect x="8" y="12" width="16" height="9" rx="4.5" fill="#1e1b4b"/>
    <ellipse cx="12.5" cy="16.5" rx="2" ry="2.4" class="eye blink"/><ellipse cx="19.5" cy="16.5" rx="2" ry="2.4" class="eye blink"/>
    <circle cx="8.5" cy="23" r="1.3" fill="#fb7185" opacity=".8"/><circle cx="23.5" cy="23" r="1.3" fill="#fb7185" opacity=".8"/></svg>`,
  // 3 emoji
  emoji: `<span class="emo">🤖</span>`,
  // 4 robot with a headset (help desk)
  casque: `<svg viewBox="0 0 32 32">
    <rect x="7" y="9" width="18" height="15" rx="6" class="ink"/>
    <circle cx="12.5" cy="15.5" r="2" class="eye blink"/><circle cx="19.5" cy="15.5" r="2" class="eye blink"/>
    <path d="M13 20.5q3 2 6 0" stroke="#fde047" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <path d="M5 17v-3a11 11 0 0 1 22 0v3" stroke="#1e1b4b" stroke-width="2.2" fill="none"/>
    <rect x="3" y="14" width="4" height="7" rx="2" fill="#7c3aed"/><rect x="25" y="14" width="4" height="7" rx="2" fill="#7c3aed"/>
    <path d="M27 21q0 5-6 5" stroke="#1e1b4b" stroke-width="1.6" fill="none"/><circle cx="20" cy="26" r="1.6" fill="#7c3aed"/></svg>`,
  // 5 robot waving hello
  coucou: `<svg viewBox="0 0 32 32">
    <rect x="15" y="3" width="2" height="4" class="ink"/><circle cx="16" cy="3" r="1.8" class="ink"/>
    <rect x="6" y="7" width="18" height="15" rx="6" class="ink"/>
    <circle cx="11.5" cy="13.5" r="2" class="eye blink"/><circle cx="18.5" cy="13.5" r="2" class="eye blink"/>
    <path d="M12 18q3 2.2 6 0" stroke="#fde047" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <g class="wave"><rect x="25" y="12" width="3.2" height="9" rx="1.6" class="ink" transform="rotate(-20 26 20)"/><circle cx="29" cy="11" r="2.4" class="ink"/></g>
    <rect x="9" y="23" width="12" height="5" rx="2.5" class="ink"/></svg>`,
  // 6 visor robot, scanning eye + heart
  visiere: `<svg viewBox="0 0 32 32">
    <rect x="5" y="7" width="22" height="19" rx="9" class="ink"/>
    <rect x="8" y="12" width="16" height="6" rx="3" fill="#1e1b4b"/>
    <g class="scan"><rect x="13" y="13.5" width="6" height="3" rx="1.5" fill="#22d3ee"/></g>
    <path class="heart" d="M16 24.2l-2.3-2.1a1.4 1.4 0 0 1 2.3-1.6 1.4 1.4 0 0 1 2.3 1.6z" fill="#fb7185"/>
    <circle cx="5" cy="16" r="2" class="ink"/><circle cx="27" cy="16" r="2" class="ink"/></svg>`,
}
const star = (k) => `<div class="star"><span class="orbit"></span><span class="core">${R[k]}</span></div>`
const ghost = `<div class="ghost">${'<i></i>'.repeat(6)}</div>`
const P = [
  ['trait', 'Robot au trait', 'une icône simple et nette, dessinée en lignes, avec les yeux qui clignent : sobre, dans le style des icônes de l’app'],
  ['mignon', 'Petit robot mignon', 'tête ronde, écran sombre avec deux yeux dorés qui clignent, antenne qui se balance avec une lumière violette ↔ rose, joues roses, il flotte doucement'],
  ['emoji', 'Emoji 🤖', 'le robot emoji tel quel : tout le monde le reconnaît, mais il change selon le téléphone ou l’ordinateur'],
  ['casque', 'Robot au casque', 'un robot avec un casque-micro violet, comme un conseiller : on comprend « aide / support » en plus de « robot »'],
  ['coucou', 'Robot qui fait coucou', 'il sourit et agite la main de temps en temps, comme pour dire « je suis là, parle-moi »'],
  ['visiere', 'Robot à visière', 'une visière avec un œil cyan qui balaie de gauche à droite et un petit cœur qui bat : plus « futuriste »'],
]
document.getElementById('g').innerHTML = P.map(([k, n, d], i) => `<div class="opt"><div class="stage">${ghost}<div class="zoom">${star(k)}<small>agrandi</small></div><div class="spot">${star(k)}</div></div><p><b>${i + 1} · ${n}</b> : ${d}</p></div>`).join('')
</script>
</body>
</html>
