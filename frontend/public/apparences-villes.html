const fold = (s) => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase()
// Local stand-in for GET /services/worldclock/places?q=…: prefix matches first, then anywhere
const search = (q, n = 7) => { const f = fold(q.trim()); if (!f) return PLACES.slice(0, n)
  return PLACES.map((p) => { const l = fold(p.label), i = l.indexOf(f); return [i < 0 ? 99 : i === 0 ? 0 : l[i - 1] === ' ' ? 1 : 5, p] }).filter(([s]) => s < 99).sort((a, b) => a[0] - b[0]).slice(0, n).map(([, p]) => p) }
const timeIn = (tz) => new Date().toLocaleTimeString('fr-FR', { timeZone: tz, hour: '2-digit', minute: '2-digit' })
const hourIn = (tz) => { const [h, m] = new Intl.DateTimeFormat('en-GB', { timeZone: tz, hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).format(new Date()).split(':').map(Number); return h + m / 60 }
const KIND = { city: '🏙️', country: '🌍', zone: '🕐' }
const hl = (label, q) => { const f = fold(q.trim()), i = fold(label).indexOf(f); return !f || i < 0 ? label : label.slice(0, i) + '<mark>' + label.slice(i, i + f.length) + '</mark>' + label.slice(i + f.length) }
const HOME = { value: 'Africa/Porto-Novo', label: 'Cotonou, Bénin', offset: 'UTC+1' }

// A reusable search field with a suggestion list; `showTime` adds the live local time on each suggestion
function picker(el, onPick, showTime) {
  const input = el.querySelector('input'), drop = el.querySelector('.drop'); let sel = 0, hits = []
  // Real suggestions from GET /services/worldclock/places (logged-in session); the embedded list is only a fallback
  let ticket = 0
  const draw = async () => { const my = ++ticket
    try { const r = await fetch(`/services/worldclock/places?${new URLSearchParams({ q: input.value.trim(), lang: 'fr', limit: '7' })}`, { credentials: 'include' }); if (!r.ok) throw 0; hits = await r.json() } catch { hits = search(input.value) }
    if (my !== ticket) return
    drop.innerHTML = hits.map((p, i) => `<div class="opt-row ${i === sel ? 'on' : ''}" data-i="${i}"><span class="k">${KIND[p.kind]}</span><span class="t">${hl(p.label, input.value)}<small>${p.offset}${p.kind === 'zone' ? ' · fuseau' : p.kind === 'country' ? ' · pays' : ''}</small></span>${showTime ? `<span class="h">${timeIn(p.value)}</span>` : ''}</div>`).join('') || '<div class="sm" style="padding:10px">Aucun lieu trouvé</div>' }
  input.onfocus = () => { el.classList.add('open'); draw() }
  input.oninput = () => { sel = 0; el.classList.add('open'); draw() }
  input.onkeydown = (e) => { if (e.key === 'ArrowDown') { sel = Math.min(sel + 1, hits.length - 1); draw(); e.preventDefault() } if (e.key === 'ArrowUp') { sel = Math.max(sel - 1, 0); draw(); e.preventDefault() }
    if (e.key === 'Enter' && hits[sel]) { onPick(hits[sel]); input.value = ''; draw(); e.preventDefault() } if (e.key === 'Escape') el.classList.remove('open') }
  drop.onmousedown = (e) => { const r = e.target.closest('[data-i]'); if (r) { onPick(hits[+r.dataset.i]); input.value = ''; draw(); e.preventDefault() } }
  input.onblur = () => setTimeout(() => el.classList.remove('open'), 120)
}
const field = (ph) => `<div class="field"><input placeholder="${ph}"><div class="drop"></div></div>`
const homeBox = `<div class="lbl">Ta ville</div><div class="home">📍 <b>${HOME.label}</b><span class="sm">${HOME.offset}</span><button>changer</button></div><div class="sm" style="margin-top:-8px">Devinée depuis le fuseau de ton appareil</div>`

const P = [
  ['Étiquettes', 'tu tapes, tu choisis dans la liste, et chaque ville devient une petite étiquette avec son heure, qu’on retire d’un ✕', 'p1',
    `${homeBox}<div class="lbl">Villes à afficher</div>${field('Ajoute une ville, un pays…')}<div class="chips"></div><button class="add">Ajouter à mon dashboard</button>`],
  ['Aperçu en direct', 'chaque ville ajoutée apparaît tout de suite sur la frise des 24 h, exactement comme sur la carte finale', 'p2',
    `${homeBox}<div class="lbl">Villes à afficher</div>${field('Ajoute une ville, un pays…')}<div class="tl"><div class="bar"></div></div><button class="add">Ajouter à mon dashboard</button>`],
  ['Horloges', 'les suggestions montrent déjà l’heure qu’il est là-bas, et chaque ville choisie a sa petite horloge qui tourne', 'p3',
    `${homeBox}<div class="lbl">Villes à afficher</div>${field('Ajoute une ville, un pays…')}<div class="rows"></div><button class="add">Ajouter à mon dashboard</button>`],
]
document.getElementById('g').innerHTML = P.map(([n, d, cls, h], i) => `<div class="opt"><div class="form ${cls}">${h}</div><p><b>${i + 1} · ${n}</b> : ${d}</p></div>`).join('')

const start = () => ['Paris, France', 'New York, États-Unis', 'Tokyo, Japon'].map((l) => PLACES.find((p) => p.label === l)).filter(Boolean)
// 1 · chips
{ const root = document.querySelector('.p1'); let list = start()
  const draw = () => { root.querySelector('.chips').innerHTML = list.map((p, i) => `<span class="chip">${p.label.split(',')[0]} <small>${timeIn(p.value)}</small><button data-x="${i}">✕</button></span>`).join('') }
  root.onclick = (e) => { const x = e.target.closest('[data-x]'); if (x) { list.splice(+x.dataset.x, 1); draw() } }
  picker(root.querySelector('.field'), (p) => { if (!list.some((q) => q.value === p.value && q.label === p.label)) list.push(p); draw() }, false); draw() }
// 2 · timeline
{ const root = document.querySelector('.p2'); let list = start()
  const draw = () => { const all = [{ ...HOME, me: true }, ...list].map((p) => ({ ...p, h: hourIn(p.value) })).sort((a, b) => a.h - b.h)
    root.querySelector('.tl').innerHTML = '<div class="bar"></div>' + all.map((p, i) => `<div class="pin ${i % 2 ? 'down' : 'up'}${p.me ? ' me' : ''}" style="left:${Math.min(92, Math.max(8, p.h / 24 * 100))}%">${i % 2 ? '<i></i>' : ''}<span>${p.me ? '📍 ' : ''}${p.label.split(',')[0]}<br><b>${timeIn(p.value)}</b></span>${i % 2 ? '' : '<i></i>'}</div>`).join('') }
  picker(root.querySelector('.field'), (p) => { if (!list.some((q) => q.label === p.label)) list.push(p); draw() }, false); draw() }
// 3 · clocks
{ const root = document.querySelector('.p3'); let list = start()
  const hand = (deg, len, w) => `<i style="height:${len}px;width:${w}px;transform:rotate(${deg}deg)"></i>`
  const draw = () => { root.querySelector('.rows').innerHTML = list.map((p, i) => { const h = hourIn(p.value); return `<div class="crow"><span class="clk">${hand((h % 12) * 30, 10, 2)}${hand((h % 1) * 360, 14, 1.5)}</span><span class="t">${p.label}<small>${p.offset}</small></span><span class="h">${timeIn(p.value)}</span><button data-x="${i}">✕</button></div>` }).join('') }
  root.onclick = (e) => { const x = e.target.closest('[data-x]'); if (x) { list.splice(+x.dataset.x, 1); draw() } }
  picker(root.querySelector('.field'), (p) => { if (!list.some((q) => q.label === p.label)) list.push(p); draw() }, true); draw() }
