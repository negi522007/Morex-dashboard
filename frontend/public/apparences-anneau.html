<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Morex anneau</title>
<link rel="icon" type="image/svg+xml" href="/logo.svg" />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; font-family: Poppins, system-ui, sans-serif; color: #fff; background-color: #020617;
    background: linear-gradient(rgb(2 6 23 / .62), rgb(15 12 50 / .82)), url(/accueil_photo.jpg) 50% 28%/cover fixed; }
  h1 { text-align: center; font-weight: 600; margin: 0; padding-top: 34px; }
  .lead { text-align: center; color: rgb(255 255 255 / .7); margin: 8px auto 16px; max-width: 820px; padding: 0 16px; }
  .rates { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-bottom: 26px; }
  .rates button { font: inherit; font-size: 13px; padding: 7px 15px; border-radius: 999px; border: 1px solid rgb(255 255 255 / .25); background: transparent; color: #fff; cursor: pointer; }
  .rates button.on { background: #fff; color: #1e1b4b; font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; max-width: 1150px; margin: 0 auto; padding: 0 20px 60px; }
  @media (max-width: 1000px) { .grid { grid-template-columns: 1fr; max-width: 420px; } }
  .opt > p { margin: 12px 0 0; font-size: 13px; color: rgb(255 255 255 / .7); } .opt > p b { color: #fff; }
  .w { position: relative; height: 250px; display: flex; flex-direction: column; padding: 18px 20px 16px; border-radius: 26px; overflow: hidden; background: rgb(15 23 42 / .72); border: 1px solid rgb(255 255 255 / .12); backdrop-filter: blur(18px); }
  .w-head { font-size: 13px; opacity: .7; } .w-big { font-size: 46px; font-weight: 600; line-height: 1.1; margin-top: 8px; } .w-sub { opacity: .7; font-size: 13px; }
  .w.flash .w-big { animation: flash .8s; } @keyframes flash { 40% { opacity: .25; transform: translateY(3px); } }
  .foot { margin-top: auto; font-size: 12px; color: rgb(255 255 255 / .6); display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .tag { position: absolute; right: 16px; top: 14px; font-size: 10.5px; opacity: .5; }
  svg.r { transform: rotate(-90deg); overflow: visible; } svg.r circle { fill: none; } .bgc { stroke: rgb(255 255 255 / .12); }
  .fg { stroke-linecap: round; transition: stroke-dashoffset 1s linear, stroke .6s; }
  .spin { display: inline-block; animation: sp .9s linear infinite; } @keyframes sp { to { transform: rotate(360deg); } }
  .done { animation: pop .5s cubic-bezier(.2, .9, .2, 1.5); } @keyframes pop { from { transform: scale(.4); } }
  .lbl { display: flex; flex-direction: column; line-height: 1.25; } .lbl small { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; opacity: .55; } .lbl b { font-weight: 600; color: #fff; font-size: 12.5px; }
  .right { text-align: right; align-items: flex-end; }

  /* 1 · number inside */
  .n1 { position: relative; width: 36px; height: 36px; } .n1 svg { width: 36px; height: 36px; filter: drop-shadow(0 0 5px rgb(167 139 250 / .6)); }
  .n1 span { position: absolute; inset: 0; display: grid; place-items: center; font-size: 11px; font-weight: 600; color: #fff; }
  /* 2 · comet */
  .n2 { width: 26px; height: 26px; }
  /* 3 · glass pills */
  .gp { display: inline-flex; align-items: center; gap: 7px; padding: 5px 11px 5px 6px; border-radius: 999px; background: rgb(255 255 255 / .07); border: 1px solid rgb(255 255 255 / .1); color: #fff; }
  .gp.ok { background: rgb(52 211 153 / .15); border-color: rgb(52 211 153 / .35); color: #6ee7b7; }
  .gp svg { width: 18px; height: 18px; } .gp.t { padding-left: 11px; }
  /* 4 · ring around ↻, colour warms up */
  .n4 { position: relative; width: 30px; height: 30px; display: grid; place-items: center; } .n4 svg { position: absolute; inset: 0; width: 30px; height: 30px; }
  .n4 i { font-style: normal; font-size: 13px; color: #fff; }
  /* 5 · corner */
  .corner { position: absolute; right: 14px; top: 12px; width: 44px; height: 44px; display: grid; place-items: center; }
  .corner svg { position: absolute; inset: 0; width: 44px; height: 44px; }
  .corner span { font-size: 11.5px; font-weight: 600; } .corner small { position: absolute; bottom: -14px; font-size: 9px; opacity: .5; white-space: nowrap; }
  /* 6 · clock ticks */
  .n6 { width: 30px; height: 30px; }
  .n6 line { stroke-width: 2.2; stroke-linecap: round; transition: stroke .3s; }
</style>
</head>
<body>
<h1>L’anneau, en mieux</h1>
<p class="lead">Six façons d’améliorer l’anneau : plus lisible, plus joli, et un vrai moment quand la mise à jour arrive. Tout tourne en direct</p>
<div class="rates" id="rates"></div>
<div class="grid" id="g"></div>
<script>
const RATES = [[30, '30 s'], [300, '5 min'], [3600, 'heures']]
let rate = 30, left = 12, last = new Date(), phase = '', temp = 30 // phase: '' | 'busy' | 'ok'
const hm = (d) => d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })
const short = (s) => s >= 3600 ? `${Math.floor(s / 3600)}h${String(Math.floor(s % 3600 / 60)).padStart(2, '0')}` : s >= 60 ? `${Math.ceil(s / 60)}m` : `${s}s`
const dur = (s) => s >= 3600 ? `${Math.floor(s / 3600)} h ${String(Math.floor(s % 3600 / 60)).padStart(2, '0')}` : s >= 60 ? `${Math.floor(s / 60)} min ${String(s % 60).padStart(2, '0')}` : `${s} s`
const frac = () => phase ? 0 : left / rate
const ring = (size, r, w, stroke, extra = '') => { const C = 2 * Math.PI * r; return `<svg class="r" viewBox="0 0 ${size} ${size}"><circle class="bgc" cx="${size / 2}" cy="${size / 2}" r="${r}" stroke-width="${w}"/><circle class="fg" cx="${size / 2}" cy="${size / 2}" r="${r}" stroke-width="${w}" stroke="${stroke}" stroke-dasharray="${C}" stroke-dashoffset="${phase ? 0 : C * (1 - frac())}"/>${extra}</svg>` }
const GRAD = (id, a, b) => `<defs><linearGradient id="${id}"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs>`
const status = (txt) => phase === 'busy' ? '<span class="spin">↻</span> Mise à jour…' : phase === 'ok' ? '<span class="done">✓</span> À jour' : txt
// colour that warms up as the update gets close: violet → pink → amber
const warm = () => { const f = frac(); return phase === 'ok' ? '#34d399' : f > .5 ? '#a78bfa' : f > .2 ? '#f472b6' : '#fbbf24' }

const P = [
  ['Chiffre dans l’anneau', 'l’anneau est plus grand, en dégradé violet → bleu qui brille, et le temps restant est écrit dedans ; à droite l’heure en deux lignes bien lisibles', () =>
    `<span style="display:flex;align-items:center;gap:9px"><span class="n1">${ring(36, 15, 3, 'url(#g1)', GRAD('g1', '#a78bfa', '#38bdf8'))}<span>${phase === 'busy' ? '<span class="spin">↻</span>' : phase === 'ok' ? '<span class="done">✓</span>' : short(left)}</span></span><span class="lbl"><small>Prochaine</small><b>${phase ? status('') : 'dans ' + dur(left)}</b></span></span><span class="lbl right"><small>Mis à jour</small><b>${hm(last)}</b></span>`],
  ['Comète', 'l’anneau a une petite bille lumineuse au bout qui fait le tour, comme une comète ; textes sur deux lignes avec un petit titre', () => {
    const r = 10, C = 2 * Math.PI * r, a = 2 * Math.PI * (phase ? 1 : frac())
    const dot = phase ? '' : `<circle cx="${13 + r * Math.cos(a)}" cy="${13 + r * Math.sin(a)}" r="5" fill="rgb(56 189 248 / .35)"/><circle cx="${13 + r * Math.cos(a)}" cy="${13 + r * Math.sin(a)}" r="3" fill="#fff"/>`
    return `<span style="display:flex;align-items:center;gap:9px"><span class="n2">${ring(26, r, 2.5, 'url(#g2)', GRAD('g2', '#38bdf8', '#a78bfa') + dot)}</span><span class="lbl"><small>Prochaine</small><b>${phase ? status('') : dur(left)}</b></span></span><span class="lbl right"><small>Dernière</small><b>${hm(last)}</b></span>`
  }],
  ['Deux pastilles', 'le compte à rebours et l’heure sont chacun dans une pastille de verre ; au moment de la mise à jour la pastille passe au vert avec un ✓', () =>
    `<span class="gp ${phase === 'ok' ? 'ok' : ''}">${ring(18, 7, 2.5, phase === 'ok' ? '#34d399' : '#a78bfa')}${phase ? status('') : dur(left)}</span><span class="gp t">🕒 ${hm(last)}</span>`],
  ['L’anneau qui chauffe', 'une flèche ↻ au centre, et l’anneau change de couleur en approchant : violet, puis rose, puis doré juste avant ; il passe au vert à la mise à jour', () =>
    `<span style="display:flex;align-items:center;gap:9px"><span class="n4">${ring(30, 12.5, 2.5, warm())}<i class="${phase === 'busy' ? 'spin' : ''}">${phase === 'ok' ? '✓' : '↻'}</i></span><span>${phase ? status('') : `dans <b style="color:${warm()}">${dur(left)}</b>`}</span></span><span>à jour à <b style="color:#fff">${hm(last)}</b></span>`],
  ['Dans le coin', 'l’anneau remplace « Toutes les 30 s » en haut à droite, avec le temps dedans ; le bas de la carte ne garde que l’heure', () => `<span>${phase === 'busy' ? status('') : `Mis à jour à <b style="color:#fff">${hm(last)}</b>`}</span><span style="opacity:.6">${rate === 3600 ? 'toutes les heures' : 'toutes les ' + dur(rate)}</span>`,
    () => `<div class="corner">${ring(44, 18, 3, 'url(#g5)', GRAD('g5', '#f472b6', '#a78bfa'))}<span>${phase === 'busy' ? '<span class="spin">↻</span>' : phase === 'ok' ? '<span class="done">✓</span>' : short(left)}</span></div>`],
  ['Cadran de montre', 'au lieu d’un trait continu, 12 petits traits comme une montre, qui s’éteignent un à un', () => {
    const on = phase ? 12 : Math.ceil(frac() * 12)
    const ticks = Array.from({ length: 12 }, (_, i) => { const a = (i / 12) * 2 * Math.PI - Math.PI / 2; return `<line x1="${15 + 9 * Math.cos(a)}" y1="${15 + 9 * Math.sin(a)}" x2="${15 + 13 * Math.cos(a)}" y2="${15 + 13 * Math.sin(a)}" stroke="${phase === 'ok' ? '#34d399' : i < on ? '#c4b5fd' : 'rgb(255 255 255 / .12)'}"/>` }).join('')
    return `<span style="display:flex;align-items:center;gap:9px"><svg class="n6" viewBox="0 0 30 30">${ticks}</svg><span class="lbl"><small>Prochaine</small><b>${phase ? status('') : dur(left)}</b></span></span><span class="lbl right"><small>Mis à jour</small><b>${hm(last)}</b></span>`
  }],
]
function draw() {
  document.getElementById('rates').innerHTML = RATES.map(([r, l]) => `<button class="${r === rate ? 'on' : ''}" data-r="${r}">Toutes les ${l}</button>`).join('')
  document.getElementById('g').innerHTML = P.map(([n, d, foot, extra], i) => `<div class="opt"><div class="w ${phase === 'busy' ? 'flash' : ''}">${i === 4 ? '' : `<span class="tag">Toutes les ${RATES.find(([r]) => r === rate)[1]}</span>`}<div class="w-head">☀️ Météo · Cotonou</div><div class="w-big">${temp}°</div><div class="w-sub">Ensoleillé · ressenti ${temp + 3}°</div><div class="foot">${foot()}</div>${extra ? extra() : ''}</div><p><b>${i + 1} · ${n}</b> : ${d}</p></div>`).join('')
}
setInterval(() => {
  if (phase === 'busy') { phase = 'ok'; last = new Date(); temp = 29 + Math.floor(Math.random() * 4) }
  else if (phase === 'ok') { phase = ''; left = rate }
  else if (--left <= 0) phase = 'busy'
  draw()
}, 1000)
document.addEventListener('click', (e) => { const b = e.target.closest('[data-r]'); if (!b) return; rate = +b.dataset.r; phase = ''; left = rate === 30 ? 12 : rate - 7; draw() })
draw()
</script>
</body>
</html>
