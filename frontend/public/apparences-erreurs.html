<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Morex erreurs et aide</title>
<link rel="icon" type="image/svg+xml" href="/logo.svg" />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; font-family: Poppins, system-ui, sans-serif; color: #fff; background-color: #020617;
    background: linear-gradient(rgb(2 6 23 / .5), rgb(15 12 50 / .75)), url(/accueil_photo.jpg) 50% 28%/cover fixed; }
  h1.top { text-align: center; font-weight: 600; margin: 0; padding-top: 34px; }
  .lead { text-align: center; color: rgb(255 255 255 / .75); margin: 8px auto 18px; max-width: 860px; padding: 0 16px; }
  .tabs { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-bottom: 26px; padding: 0 16px; }
  .tabs button { font: inherit; font-size: 13px; padding: 8px 16px; border-radius: 999px; border: 1px solid rgb(255 255 255 / .25); background: transparent; color: #fff; cursor: pointer; }
  .tabs button.on { background: #fff; color: #1e1b4b; font-weight: 600; }
  .intro { max-width: 820px; margin: -10px auto 22px; text-align: center; font-size: 13.5px; color: rgb(255 255 255 / .8); padding: 0 16px; }
  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 30px 24px; max-width: 1180px; margin: 0 auto; padding: 0 20px 70px; }
  @media (max-width: 1000px) { .grid { grid-template-columns: 1fr; max-width: 420px; } }
  .opt > p { margin: 22px 0 0; font-size: 13px; color: rgb(255 255 255 / .78); } .opt > p b { color: #fff; }
  .hint { font-size: 11px; opacity: .55; margin-top: 4px; }

  /* widget card like the dashboard */
  .w { position: relative; height: 240px; display: flex; flex-direction: column; padding: 18px 20px 16px; border-radius: 26px; background: rgb(15 23 42 / .78); border: 1px solid rgb(255 255 255 / .12); backdrop-filter: blur(18px); font-family: 'JetBrains Mono', monospace; }
  .w .hd { display: flex; justify-content: space-between; font-size: 12.5px; font-weight: 700; } .w .hd span { opacity: .55; font-weight: 400; }
  .w .big { font-size: 34px; font-weight: 700; margin-top: 10px; } .w .big small { font-size: 13px; color: #fb7185; margin-left: 6px; }
  .w svg.ch { width: 100%; height: 80px; margin-top: auto; }
  .w.stale .big, .w.stale svg.ch { opacity: .6; }
  .w .sans { font-family: Poppins, sans-serif; }
  /* countdown pill */
  .tab { position: absolute; z-index: 3; left: 50%; bottom: -13px; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; padding: 2px 12px 2px 3px; border-radius: 999px; white-space: nowrap; font: 11.5px Poppins; background: rgb(15 23 42 / .95); border: 1px solid rgb(255 255 255 / .14); box-shadow: 0 6px 16px rgb(0 0 0 / .35); }
  .tab .ring { width: 20px; height: 20px; border-radius: 50%; border: 2.5px solid rgb(255 255 255 / .12); border-top-color: #38bdf8; border-right-color: #a78bfa; }
  .tab b { font-weight: 600; } .tab .at { opacity: .55; }
  .tab.warn { border-color: rgb(251 191 36 / .55); }
  .tab .wi { color: #fbbf24; font-size: 13px; cursor: help; }
  .tip { position: absolute; z-index: 5; left: 50%; bottom: 20px; transform: translateX(-50%); width: 230px; padding: 10px 12px; border-radius: 14px; background: #1e1b4b; border: 1px solid rgb(251 191 36 / .4); font: 11.5px/1.45 Poppins; color: rgb(255 255 255 / .9); box-shadow: 0 12px 30px rgb(0 0 0 / .5); white-space: normal; }
  .tip b { display: block; color: #fde68a; margin-bottom: 3px; }
  .tip::after { content: ''; position: absolute; left: 50%; bottom: -6px; margin-left: -6px; border: 6px solid transparent; border-top-color: #1e1b4b; border-bottom: 0; }
  .ribbon { position: absolute; left: 14px; right: 14px; bottom: 22px; display: flex; gap: 8px; align-items: center; padding: 7px 10px; border-radius: 12px; background: rgb(251 191 36 / .12); border: 1px solid rgb(251 191 36 / .3); font: 11px/1.4 Poppins; color: #fde68a; }
  .dot { position: absolute; top: 58px; right: 16px; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: rgb(251 191 36 / .18); color: #fbbf24; font: 12px Poppins; animation: pulse 2s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgb(251 191 36 / .5); } 100% { box-shadow: 0 0 0 10px rgb(251 191 36 / 0); } }
  .dotlabel { position: absolute; top: 62px; right: 46px; font: 10.5px Poppins; color: #fde68a; opacity: .8; }

  /* empty card */
  .empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 6px; font-family: Poppins; }
  .empty .ico { font-size: 34px; } .empty b { font-size: 14px; } .empty small { font-size: 12px; opacity: .7; line-height: 1.45; max-width: 240px; }
  .empty .err { font: 11px 'JetBrains Mono', monospace; padding: 6px 10px; border-radius: 10px; background: rgb(251 113 133 / .12); color: #fda4af; max-width: 100%; }
  .link { font: 600 12px Poppins; color: #c4b5fd; text-decoration: none; margin-top: 4px; }
  .pill { display: inline-block; padding: 7px 14px; border-radius: 999px; background: #fff; color: #1e1b4b; font: 600 12px Poppins; margin-top: 6px; }
  .pill.ghost { background: transparent; color: #fff; border: 1px solid rgb(255 255 255 / .3); }
  .cons { width: 90px; height: 58px; } .cons line { stroke: rgb(196 181 253 / .6); stroke-width: 1.3; stroke-dasharray: 3 3; } .cons circle { fill: #fff; }
  .cons .off { fill: rgb(255 255 255 / .25); }
  .flip { perspective: 800px; flex: 1; display: flex; } .flip .face { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 6px; font-family: Poppins; padding: 4px 2px; }
  .flip ol { margin: 0; padding-left: 18px; font-size: 12px; line-height: 1.55; opacity: .85; }

  /* chat panel */
  .chat { height: 400px; display: flex; flex-direction: column; border-radius: 24px; overflow: hidden; background: rgb(15 23 42 / .96); border: 1px solid rgb(255 255 255 / .16); }
  .chat .hd { display: flex; align-items: center; gap: 10px; padding: 13px 14px; background: linear-gradient(135deg, rgb(129 140 248 / .35), rgb(236 72 153 / .2)); }
  .chat .av { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: rgb(255 255 255 / .15); }
  .chat .hd b { font-size: 13.5px; } .chat .hd small { display: block; font-size: 10.5px; opacity: .7; }
  .chat .ic { margin-left: auto; display: flex; gap: 6px; } .chat .ic span { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: rgb(255 255 255 / .14); font-size: 13px; }
  .chat .ic span.hl { background: #fff; color: #1e1b4b; }
  .chat .bd { flex: 1; padding: 12px; display: flex; flex-direction: column; gap: 8px; overflow: hidden; }
  .m { max-width: 86%; padding: 8px 12px; border-radius: 14px; font-size: 12px; line-height: 1.45; } .m.it { background: rgb(255 255 255 / .08); align-self: flex-start; } .m.me { background: linear-gradient(135deg, #6366f1, #ec4899); align-self: flex-end; }
  .chat .cmp { display: flex; gap: 6px; padding: 10px; border-top: 1px solid rgb(255 255 255 / .08); } .chat .cmp span { flex: 1; height: 34px; border-radius: 999px; background: rgb(255 255 255 / .08); font-size: 12px; opacity: .6; display: flex; align-items: center; padding: 0 12px; } .chat .cmp i { width: 34px; height: 34px; border-radius: 50%; background: #fff; color: #1e1b4b; display: grid; place-items: center; font-style: normal; }
  .newbar { display: flex; justify-content: center; } .newbar span { padding: 6px 14px; border-radius: 999px; border: 1px dashed rgb(255 255 255 / .3); font-size: 11.5px; }
  .sep { display: flex; align-items: center; gap: 8px; font-size: 10.5px; opacity: .55; } .sep::before, .sep::after { content: ''; flex: 1; border-top: 1px solid rgb(255 255 255 / .2); }

  /* robot corner */
  .corner { position: relative; height: 240px; border-radius: 26px; overflow: hidden; background: linear-gradient(rgb(2 6 23 / .3), rgb(2 6 23 / .6)), url(/sahara_night.jpeg) 50% 60%/cover; border: 1px solid rgb(255 255 255 / .12); }
  .corner .ghost { position: absolute; inset: 14px 14px 90px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; opacity: .2; } .ghost i { border-radius: 14px; background: rgb(255 255 255 / .25); }
  .star { position: absolute; right: 20px; bottom: 20px; width: 64px; height: 64px; }
  .star .core { position: absolute; inset: 10px; border-radius: 50%; display: grid; place-items: center; font-size: 22px; background: radial-gradient(circle at 35% 30%, #fff7cc, #fde047 50%, #f59e0b); box-shadow: 0 0 22px #fde047; }
  .star .orbit { position: absolute; inset: 0; border-radius: 50%; border: 1px dashed rgb(253 224 71 / .5); }
  .star.sleep .core { filter: grayscale(.85) brightness(.75); box-shadow: none; }
  .star.sleep .orbit { border-color: rgb(255 255 255 / .2); }
  .zzz { position: absolute; right: 18px; bottom: 80px; font: 700 13px Poppins; color: #c7d2fe; animation: zz 2.4s ease-in-out infinite; }
  @keyframes zz { 0% { transform: translate(0, 6px); opacity: 0; } 30% { opacity: 1; } 100% { transform: translate(10px, -14px); opacity: 0; } }
  .bubble { position: absolute; right: 92px; bottom: 28px; max-width: 190px; padding: 9px 12px; border-radius: 14px 14px 4px 14px; background: #fff; color: #1e1b4b; font-size: 11.5px; line-height: 1.4; }
  .helpstar .core { background: radial-gradient(circle at 35% 30%, #e0e7ff, #a5b4fc 50%, #6366f1); box-shadow: 0 0 22px #818cf8; }
  .gone { position: absolute; inset: 0; display: grid; place-items: center; font-size: 12.5px; opacity: .6; }
</style>
</head>
<body>
<h1 class="top">Erreurs, widgets vides, aide et robot</h1>
<p class="lead">Les 4 points qui restent côté frontend. Choisis le sujet en haut</p>
<div class="tabs" id="t"></div>
<p class="intro" id="intro"></p>
<div class="grid" id="g"></div>
<script>
const CHART = (c = '#fb7185') => `<svg class="ch" viewBox="0 0 200 80" preserveAspectRatio="none"><path d="M0 40 L15 30 L30 45 L45 20 L60 38 L75 32 L90 55 L105 48 L120 60 L135 45 L150 62 L165 50 L180 66 L200 58" fill="none" stroke="${c}" stroke-width="2"/></svg>`
const CARD = (extra = '', cls = '') => `<div class="w ${cls}"><div class="hd">DOGE/USD<span>24h · 7j · 30j</span></div><div class="big">0,09461<small>-5.05%</small></div>${CHART()}${extra}</div>`
const ERR = 'Market data API returned HTTP 429'
const ERR_FR = 'CoinGecko reçoit trop de demandes, il refuse pour l’instant (erreur 429).'
const TAB = (warn = '', cls = '') => `<div class="tab ${cls}"><span class="ring"></span><b>12 s</b><span class="at">19:57</span>${warn}</div>`
const EMPTY = (inner) => `<div class="w"><div class="hd sans">☀️ Météo heure par heure<span></span></div>${inner}${TAB()}</div>`
const S = {
  stale: { label: '⚠ Données pas à jour', intro: `Le widget a déjà marché, mais son dernier rafraîchissement a échoué : il affiche encore les anciennes données (c’est voulu). Il faut juste le signaler sans rien cacher. Exemple : « ${ERR} »`, opts: [
    ['⚠ dans la pastille', 'un petit ⚠ doré s’ajoute dans la pastille du décompte, et son contour devient doré ; au survol, une bulle explique en français ce qui se passe', CARD(TAB('<span class="wi">⚠</span>', 'warn') + `<div class="tip"><b>Données de 19:42</b>${ERR_FR} On réessaie tout seul.</div>`), '(bulle montrée en permanence ici pour l’exemple)'],
    ['Bandeau doré', 'un petit bandeau doré en bas de la carte, au-dessus de la pastille : « Pas à jour depuis 19:42 · CoinGecko sature » ; le graphique est légèrement estompé', CARD(`<div class="ribbon">⚠ Pas à jour depuis 19:42 · CoinGecko reçoit trop de demandes</div>` + TAB('', 'warn'), 'stale'), ''],
    ['Point qui pulse', 'un point doré qui pulse dans le coin de la carte avec « ancien » à côté ; le détail de l’erreur s’affiche au survol du point', CARD(`<span class="dotlabel">données de 19:42</span><span class="dot">!</span>` + TAB()), ''],
  ] },
  empty: { label: '🔍 Widget vide', intro: 'Le widget n’a encore jamais marché. Exaucé affiche déjà l’erreur exacte ; on ajoute le lien « Pourquoi mon widget est vide ? » qui ouvre la bonne page d’aide', opts: [
    ['Simple et clair', 'une icône, un titre, l’erreur en petit dans une pastille rose, et le lien violet vers l’aide', EMPTY(`<div class="empty"><span class="ico">🔍</span><b>Rien à afficher pour l’instant</b><span class="err">Could not reach the weather API</span><a class="link" href="#">Pourquoi mon widget est vide ? →</a></div>`), ''],
    ['Constellation incomplète', 'dans l’esprit de la page : une petite constellation à qui il manque des étoiles, une phrase simple, et deux boutons « Comprendre » et « Modifier »', EMPTY(`<div class="empty"><svg class="cons" viewBox="0 0 90 58"><line x1="10" y1="10" x2="45" y2="8"/><line x1="45" y1="8" x2="80" y2="22"/><line x1="80" y1="22" x2="62" y2="50"/><circle cx="10" cy="10" r="2.6"/><circle cx="45" cy="8" r="2.6"/><circle cx="80" cy="22" r="2.6"/><circle class="off" cx="62" cy="50" r="2.6"/><circle class="off" cx="22" cy="46" r="2.6"/></svg><b>Il manque encore des étoiles</b><small>La météo n’a pas pu être jointe.</small><div><span class="pill">Comprendre</span> <span class="pill ghost">✎ Modifier</span></div></div>`), ''],
    ['Mini guide dans la carte', 'la carte montre directement les 3 causes les plus fréquentes, avec le lien vers l’aide complète', EMPTY(`<div class="flip"><div class="face"><b style="font-size:13px">Pourquoi c’est vide ?</b><ol><li>Le service ne répond pas (connexion)</li><li>Un réglage est faux (ville, lien…)</li><li>Un compte n’est pas connecté</li></ol><a class="link" href="#">Voir l’aide complète →</a></div></div>`), ''],
  ] },
  chat: { label: '💬 Nouvelle conversation', intro: 'Un bouton dans le chat d’aide (❔) pour effacer la discussion et repartir de zéro', opts: [
    ['Icône dans l’en-tête', 'un petit bouton ✎ (nouvelle discussion) à côté de la croix, comme dans les messageries', `<div class="chat"><div class="hd"><span class="av">✨</span><div><b>Assistant Morex</b><small>Répond à partir de l’aide</small></div><div class="ic"><span class="hl" title="Nouvelle conversation">✎</span><span>✕</span></div></div><div class="bd"><div class="m me">Comment ajouter la météo ?</div><div class="m it">Clique sur « Widgets », puis choisis Météo…</div><div class="m me">Et changer la ville ?</div></div><div class="cmp"><span>Pose ta question…</span><i>➤</i></div></div>`, ''],
    ['Bouton sous la discussion', 'un bouton pointillé « ↺ Nouvelle conversation » juste au-dessus de la zone d’écriture, visible dès qu’il y a des messages', `<div class="chat"><div class="hd"><span class="av">✨</span><div><b>Assistant Morex</b><small>Répond à partir de l’aide</small></div><div class="ic"><span>✕</span></div></div><div class="bd"><div class="m me">Comment ajouter la météo ?</div><div class="m it">Clique sur « Widgets », puis choisis Météo…</div><div style="flex:1"></div><div class="newbar"><span>↺ Nouvelle conversation</span></div></div><div class="cmp"><span>Pose ta question…</span><i>➤</i></div></div>`, ''],
    ['Séparateur « nouveau sujet »', 'on ne supprime rien : le bouton ajoute une ligne « nouveau sujet » et l’assistant oublie ce qui est au-dessus', `<div class="chat"><div class="hd"><span class="av">✨</span><div><b>Assistant Morex</b><small>Répond à partir de l’aide</small></div><div class="ic"><span class="hl">＋</span><span>✕</span></div></div><div class="bd" style="opacity:1"><div class="m me" style="opacity:.45">Comment ajouter la météo ?</div><div class="m it" style="opacity:.45">Clique sur « Widgets »…</div><div class="sep">nouveau sujet · 20:14</div><div class="m it">Salut ! Pose-moi ta question ✨</div></div><div class="cmp"><span>Pose ta question…</span><i>➤</i></div></div>`, ''],
  ] },
  robot: { label: '🤖 Robot sans IA', intro: 'Le serveur n’a plus de clé IA : le robot ne peut ni créer de widgets ni faire le brief. Que faire de lui ?', opts: [
    ['Il disparaît', 'ce que demande Exaucé : pas de clé, pas de robot. Il revient tout seul le jour où une clé est ajoutée', `<div class="corner"><div class="ghost">${'<i></i>'.repeat(6)}</div><div class="gone">(plus de robot en bas à droite)</div></div>`, ''],
    ['Il dort 💤', 'le robot reste mais en gris, avec des « z » qui s’envolent ; au clic : « Je dors : l’IA n’est pas encore branchée sur ce serveur »', `<div class="corner"><div class="ghost">${'<i></i>'.repeat(6)}</div><span class="zzz">z z</span><div class="star sleep"><span class="orbit"></span><span class="core">🤖</span></div><div class="bubble">Je dors 💤 l’IA n’est pas encore branchée ici</div></div>`, ''],
    ['Il devient l’aide', 'le rond passe en bleu et ne garde que la partie « J’ai une question », qui marche sans IA (réponses tirées de l’aide)', `<div class="corner"><div class="ghost">${'<i></i>'.repeat(6)}</div><div class="star helpstar"><span class="orbit" style="border-color:rgb(165 180 252 / .5)"></span><span class="core">❔</span></div><div class="bubble">Une question sur Morex ? Je t’aide ✨</div></div>`, ''],
  ] },
}
let cur = 'stale'
function draw() {
  document.getElementById('t').innerHTML = Object.entries(S).map(([k, v]) => `<button class="${k === cur ? 'on' : ''}" data-k="${k}">${v.label}</button>`).join('')
  document.getElementById('intro').textContent = S[cur].intro
  document.getElementById('g').innerHTML = S[cur].opts.map(([n, d, h, hint], i) => `<div class="opt">${h}<p><b>${i + 1} · ${n}</b> : ${d}${hint ? `<span class="hint" style="display:block">${hint}</span>` : ''}</p></div>`).join('')
}
document.addEventListener('click', (e) => { const b = e.target.closest('[data-k]'); if (b) { cur = b.dataset.k; draw() } })
draw()
</script>
</body>
</html>
