<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Morex calendar</title>
<link rel="icon" type="image/svg+xml" href="/logo.svg" />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet" />
<style>
  :root { --a1: #818cf8; --a2: #38bdf8; --glow: 99 102 241; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; font-family: Poppins, system-ui, sans-serif; color: #fff; background-color: #020617;
    background: linear-gradient(rgb(2 6 23 / .62), rgb(15 12 50 / .8)), url(/accueil_photo.jpg) 50% 28%/cover fixed; }
  h1 { text-align: center; font-weight: 600; margin: 0; padding-top: 36px; }
  .lead { text-align: center; color: rgb(255 255 255 / .65); margin: 8px auto 14px; max-width: 820px; }
  .switch { display: flex; justify-content: center; gap: 6px; margin: 0 auto 24px; padding: 5px; border-radius: 999px; background: rgb(0 0 0 / .4); width: fit-content; }
  .switch button { border: 0; padding: 8px 16px; border-radius: 999px; background: none; color: #fff; font: inherit; font-size: 13px; cursor: pointer; }
  .switch button.on { background: #fff; color: #111; font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 22px; max-width: 1250px; margin: 0 auto; padding: 0 20px 60px; }
  @media (max-width: 1000px) { .grid { grid-template-columns: 1fr; } }
  .opt { min-width: 0; } .opt > p { margin: 10px 0 0; font-size: 13px; color: rgb(255 255 255 / .65); } .opt > p b { color: #fff; }
  .card { position: relative; overflow: hidden; border-radius: 24px; padding: 18px; height: 380px; display: flex; flex-direction: column; gap: 10px;
    background: rgb(255 255 255 / .08); border: 1px solid rgb(255 255 255 / .14); backdrop-filter: blur(22px); }
  .head { display: flex; align-items: center; gap: 10px; }
  .ico { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: linear-gradient(135deg, #f43f5e, #fb923c); flex: none; font-size: 15px; }
  .t { font-weight: 600; font-size: 14px; } .s { font-size: 11.5px; color: rgb(255 255 255 / .6); } .tab { font-variant-numeric: tabular-nums; }
  .empty { margin: auto; text-align: center; color: rgb(255 255 255 / .6); font-size: 13px; }

  /* 1 agenda */
  .ag { display: flex; flex-direction: column; gap: 10px; overflow: hidden; }
  .ag .day { font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--a2); margin-top: 2px; }
  .ag .ev { display: grid; grid-template-columns: 52px 4px 1fr; gap: 10px; align-items: stretch; }
  .ag .time { font-size: 12px; font-weight: 600; text-align: right; padding-top: 1px; } .ag .time small { display: block; font-weight: 400; color: rgb(255 255 255 / .5); }
  .ag .bar { border-radius: 4px; }
  .ag .ev b { font-size: 13px; font-weight: 500; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  /* 2 week strip */
  .strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
  .strip div { border-radius: 14px; padding: 8px 0; text-align: center; font-size: 10.5px; color: rgb(255 255 255 / .6); background: rgb(255 255 255 / .05); position: relative; }
  .strip b { display: block; font-size: 16px; color: #fff; }
  .strip .today { background: linear-gradient(160deg, var(--a1), var(--a2)); color: #fff; }
  .strip i { position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%); display: flex; gap: 2px; } .strip i span { width: 4px; height: 4px; border-radius: 50%; background: #fb7185; }
  .next { margin-top: 4px; padding: 14px; border-radius: 18px; background: linear-gradient(135deg, rgb(244 63 94 / .28), rgb(251 146 60 / .15)); border: 1px solid rgb(251 146 60 / .3); }
  .next .when { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: #fed7aa; }
  .next h3 { margin: 4px 0; font-size: 18px; line-height: 1.25; }
  .later { display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; overflow: hidden; }
  .later div { display: flex; justify-content: space-between; gap: 8px; } .later span:last-child { color: rgb(255 255 255 / .55); white-space: nowrap; }
  /* 3 countdown */
  .cd { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 6px; }
  .cd .units { display: flex; gap: 8px; }
  .cd .units div { width: 62px; padding: 10px 0; border-radius: 14px; background: rgb(0 0 0 / .3); border: 1px solid rgb(255 255 255 / .12); }
  .cd .units b { display: block; font: 700 26px 'JetBrains Mono', monospace; } .cd .units span { font-size: 10px; color: rgb(255 255 255 / .6); text-transform: uppercase; letter-spacing: .1em; }
  .cd h3 { margin: 6px 0 0; font-size: 17px; }
  .ring-card { background: radial-gradient(circle at 50% 40%, rgb(244 63 94 / .25), transparent 60%), rgb(255 255 255 / .06); }
</style>
</head>
<body>
<h1>Calendrier, 3 propositions</h1>
<p class="lead">Le widget lit n’importe quel agenda .ics (Google Agenda, Outlook, ton emploi du temps…) et renvoie titre, début, fin, « toute la journée » et lieu</p>
<div class="switch"><button data-src="real" class="on">📅 Vraies données · jours fériés FR</button><button data-src="demo">🧪 Exemple d’agenda perso</button></div>
<div class="grid" id="app"></div>
<script>
const REAL = {"events": [{"end": "2026-10-26T00:00:00.000Z", "start": "2026-10-25T00:00:00.000Z", "title": "Heure d'hiver", "allDay": true, "location": null}, {"end": "2026-11-02T00:00:00.000Z", "start": "2026-11-01T00:00:00.000Z", "title": "La Toussaint", "allDay": true, "location": null}, {"end": "2026-11-12T00:00:00.000Z", "start": "2026-11-11T00:00:00.000Z", "title": "L'Armistice", "allDay": true, "location": null}], "generatedAt": "2026-09-25T16:25:06.576Z"}
// Example only (clearly labelled): a personal agenda with timed events and places, in the exact shape the backend returns
const base = new Date(); base.setMinutes(0, 0, 0)
const at = (dayOffset, h, m = 0) => { const d = new Date(base); d.setDate(d.getDate() + dayOffset); d.setHours(h, m); return d.toISOString() }
const DEMO = { events: [
  { title: 'Soutenance Dashboard', start: at(0, 18, 30), end: at(0, 19, 30), allDay: false, location: 'Epitech Cotonou · salle Turing' },
  { title: 'Réunion de binôme', start: at(1, 10), end: at(1, 11), allDay: false, location: 'Discord' },
  { title: 'Cours de React avancé', start: at(1, 14), end: at(1, 17), allDay: false, location: 'Salle Lovelace' },
  { title: 'Anniversaire de Tom 🎂', start: at(3, 0), end: at(4, 0), allDay: true, location: null },
  { title: 'Rendu du projet', start: at(5, 23, 42), end: null, allDay: false, location: 'my.epitech.eu' },
], generatedAt: new Date().toISOString() }
let src = 'real'

const COLORS = ['#f43f5e', '#fb923c', '#38bdf8', '#a78bfa', '#34d399']
const dayLabel = (iso) => { const d = new Date(iso), t = new Date(); t.setHours(0, 0, 0, 0); const diff = Math.round((new Date(d).setHours(0, 0, 0, 0) - t) / 864e5)
  return diff === 0 ? 'Aujourd’hui' : diff === 1 ? 'Demain' : d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' }) }
const time = (e) => e.allDay ? 'Journée' : new Date(e.start).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })
const endTime = (e) => !e.allDay && e.end ? new Date(e.end).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }) : ''
const head = `<div class="head"><span class="ico">📅</span><div><div class="t">Agenda</div><div class="s" data-sub></div></div></div>`

function render() {
  const D = src === 'real' ? REAL : DEMO, E = D.events, sub = src === 'real' ? 'Jours fériés en France' : 'Mon agenda (exemple)'
  if (!E.length) { document.getElementById('app').innerHTML = `<div class="card">${head}<p class="empty">Rien de prévu dans les prochains jours ✨</p></div>`; return }
  // 1 agenda grouped by day
  let agenda = '', lastDay = ''
  E.slice(0, 6).forEach((e, i) => { const dl = dayLabel(e.start); if (dl !== lastDay) { agenda += `<div class="day">${dl}</div>`; lastDay = dl }
    agenda += `<div class="ev"><div class="time tab">${time(e)}${endTime(e) ? `<small>${endTime(e)}</small>` : ''}</div><span class="bar" style="background:${COLORS[i % COLORS.length]}"></span>
      <div><b>${e.title}</b>${e.location ? `<div class="s">📍 ${e.location}</div>` : ''}</div></div>` })
  // 2 week strip + next
  const today = new Date(); today.setHours(0, 0, 0, 0)
  const strip = Array.from({ length: 7 }, (_, i) => { const d = new Date(today); d.setDate(d.getDate() + i)
    const n = E.filter((e) => new Date(e.start).toDateString() === d.toDateString()).length
    return `<div class="${i === 0 ? 'today' : ''}">${d.toLocaleDateString('fr-FR', { weekday: 'short' }).replace('.', '')}<b>${d.getDate()}</b>${n ? `<i>${'<span></span>'.repeat(Math.min(n, 3))}</i>` : ''}</div>` }).join('')
  const nx = E[0]
  // 3 countdown to the next event
  const ms = Math.max(0, new Date(nx.start) - Date.now()), dd = Math.floor(ms / 864e5), hh = Math.floor(ms / 36e5) % 24, mm = Math.floor(ms / 6e4) % 60
  document.getElementById('app').innerHTML = [
    ['Agenda', 'les événements groupés par jour (« Aujourd’hui », « Demain »…), l’heure, une couleur par événement et le lieu', `<div class="card">${head}<div class="ag">${agenda}</div></div>`],
    ['Semaine + prochain', 'les 7 prochains jours avec un point par événement, puis le prochain en grand et les suivants en dessous', `<div class="card">${head}<div class="strip">${strip}</div>
      <div class="next"><div class="when">${dayLabel(nx.start)} · ${time(nx)}</div><h3>${nx.title}</h3>${nx.location ? `<div class="s">📍 ${nx.location}</div>` : ''}</div>
      <div class="later">${E.slice(1, 4).map((e) => `<div><span>${e.title}</span><span>${dayLabel(e.start).replace(/^(\w)/, (c) => c.toUpperCase())}</span></div>`).join('')}</div></div>`],
    ['Compte à rebours', 'combien de temps avant le prochain événement, en jours, heures et minutes, qui défile en direct', `<div class="card ring-card">${head}<div class="cd"><span class="s" style="letter-spacing:.2em;text-transform:uppercase">Prochain événement dans</span>
      <div class="units"><div><b class="tab">${dd}</b><span>jours</span></div><div><b class="tab">${String(hh).padStart(2, '0')}</b><span>heures</span></div><div><b class="tab">${String(mm).padStart(2, '0')}</b><span>min</span></div></div>
      <h3>${nx.title}</h3><div class="s">${dayLabel(nx.start)}${nx.allDay ? '' : ' · ' + time(nx)}${nx.location ? ' · 📍 ' + nx.location : ''}</div></div>
      <div class="later">${E.slice(1, 3).map((e) => `<div><span>${e.title}</span><span>${dayLabel(e.start)}</span></div>`).join('')}</div></div>`],
  ].map(([n, d, h], i) => `<div class="opt">${h}<p><b>${i + 1} · ${n}</b> : ${d}</p></div>`).join('')
  document.querySelectorAll('[data-sub]').forEach((el) => (el.textContent = sub))
}
document.querySelector('.switch').addEventListener('click', (e) => { const b = e.target.closest('[data-src]'); if (!b) return; src = b.dataset.src
  document.querySelectorAll('.switch button').forEach((x) => x.classList.toggle('on', x === b)); render() })
render(); setInterval(render, 30000)
</script>
</body>
</html>
