<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Morex parcours admin</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; font-family: Poppins, system-ui, sans-serif; color: #fff; background-color: #020617;
    background: linear-gradient(rgb(2 6 23 / .45), rgb(2 6 23 / .7)), url(/accueil_photo.jpg) 50% 28%/cover fixed; }
  h1 { text-align: center; font-weight: 600; margin: 0; padding-top: 28px; }
  .lead { text-align: center; color: rgb(255 255 255 / .75); margin: 8px auto 28px; font-size: 14px; max-width: 900px; padding: 0 16px; }
  .wrap { max-width: 1450px; margin: 0 auto; padding: 0 28px 80px; display: flex; flex-direction: column; gap: 30px; }
  h2.part { font-size: 22px; font-weight: 600; margin: 14px 6px -6px; } .part-sub { margin: 0 6px; color: rgb(255 255 255 / .65); font-size: 14px; }
  .num { display: inline-block; font-size: 13px; font-weight: 700; padding: 4px 12px; border-radius: 999px; background: #fff; color: #1e1b4b; margin: 0 0 10px 6px; }
  .num span { font-weight: 400; margin-left: 6px; }
  .glass { background: rgb(255 255 255 / .08); border: 1px solid rgb(255 255 255 / .14); border-radius: 24px; backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); }
  .card { padding: 26px 28px; }
  .card h3 { margin: 0 0 22px; font-size: 20px; font-weight: 600; letter-spacing: -.01em; display: flex; align-items: center; gap: 12px; }
  .card h3::before { content: ''; width: 4px; height: 22px; border-radius: 4px; background: linear-gradient(#818cf8, #38bdf8); box-shadow: 0 0 12px rgb(99 102 241 / .7); }
  .card h3 small { margin-left: auto; font-size: 13px; font-weight: 500; color: rgb(255 255 255 / .6); }
  .muted { color: rgb(255 255 255 / .65); }

  /* 1 voyage spatial */
  .trip { position: relative; height: 230px; }
  .trip svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .stop { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; text-align: center; width: 180px; }
  .stop .pl { width: var(--s); height: var(--s); border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 20px;
    background: radial-gradient(circle at 32% 28%, rgb(255 255 255 / .6), var(--c) 40%, rgb(15 23 42) 110%); box-shadow: 0 0 26px var(--c); }
  .stop b { margin-top: 10px; font-size: 14.5px; } .stop small { font-size: 12.5px; color: rgb(255 255 255 / .65); }
  .loss { position: absolute; transform: translate(-50%, -50%); font-size: 12px; font-weight: 600; color: #fca5a5; background: rgb(127 29 29 / .5); padding: 3px 9px; border-radius: 999px; }

  /* 2 marches */
  .steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; align-items: end; height: 260px; }
  .step { display: flex; flex-direction: column; align-items: center; gap: 10px; height: 100%; justify-content: flex-end; }
  .step .bar { width: 100%; border-radius: 18px 18px 8px 8px; background: linear-gradient(180deg, var(--c), rgb(15 23 42 / .3)); box-shadow: 0 0 24px -6px var(--c); position: relative; display: flex; align-items: flex-start; justify-content: center; padding-top: 12px; font-size: 26px; font-weight: 700; }
  .step span { font-size: 14px; text-align: center; } .step em { font-style: normal; font-size: 12.5px; color: rgb(255 255 255 / .6); }

  /* 3 cercles concentriques */
  .rings { display: flex; align-items: center; gap: 40px; flex-wrap: wrap; }
  .rings svg { width: 260px; height: 260px; flex: none; }
  .rl { list-style: none; margin: 0; padding: 0; flex: 1; min-width: 260px; }
  .rl li { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; background: rgb(255 255 255 / .04); margin-bottom: 8px; font-size: 15px; }
  .rl i { width: 12px; height: 12px; border-radius: 50%; flex: none; } .rl b { margin-left: auto; font-size: 17px; } .rl em { font-style: normal; color: rgb(255 255 255 / .55); width: 52px; text-align: right; font-size: 13px; }

  /* 4 classement */
  .top { display: flex; flex-direction: column; gap: 10px; }
  .row { display: grid; grid-template-columns: 40px 44px 1fr 2fr 60px; gap: 14px; align-items: center; padding: 10px 14px; border-radius: 16px; background: rgb(255 255 255 / .04); }
  .rank { font-size: 20px; text-align: center; font-weight: 700; color: rgb(255 255 255 / .5); }
  .av { width: 44px; height: 44px; border-radius: 50%; background-size: cover; box-shadow: 0 0 0 2px rgb(255 255 255 / .2); }
  .row b { display: block; font-size: 15px; } .row small { font-size: 12.5px; color: rgb(255 255 255 / .6); }
  .track { height: 10px; border-radius: 99px; background: rgb(255 255 255 / .08); overflow: hidden; } .track i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, #a78bfa, #38bdf8); }
  .row .n { text-align: right; font-size: 18px; font-weight: 700; }

  /* 5 engagement */
  .eng { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; } @media (max-width: 1000px) { .eng { grid-template-columns: 1fr 1fr; } }
  .eng > div { padding: 20px; border-radius: 20px; background: rgb(255 255 255 / .05); border: 1px solid rgb(255 255 255 / .08); }
  .eng .v { font-size: 34px; font-weight: 600; letter-spacing: -.02em; } .eng .l { font-size: 14px; color: rgb(255 255 255 / .7); margin-top: 2px; }
  .eng .hint { margin-top: 12px; font-size: 12.5px; color: #fde68a; }
</style>
</head>
<body>
<h1>« Parcours des nouveaux » : d'autres idées</h1>
<p class="lead">Le parcours montre jusqu'où vont les inscrits : confirmer son e-mail, ajouter un widget, lier un compte (GitHub, Google…). Les 3 premières propositions l'affichent autrement, les 2 suivantes le remplacent par autre chose. Données d'exemple : 12 comptes.</p>
<div class="wrap" id="w"></div>
<script>
const STEPS = [['Inscrits', 12, '#a78bfa', 'ont créé un compte'], ['E-mail confirmé', 10, '#38bdf8', 'ont cliqué sur le lien'], ['Au moins 1 widget', 10, '#34d399', 'utilisent leur dashboard'], ['Un compte lié', 5, '#f472b6', 'GitHub, Google…']]
const AV = (s) => `https://api.dicebear.com/9.x/avataaars/svg?seed=${s}&backgroundColor=c0aede,b6e3f4,ffd5dc`
const pct = (v) => Math.round(v / STEPS[0][1] * 100)
const sec = (n, name, why, html) => `<section><span class="num">${n} · ${name}<span>${why}</span></span>${html}</section>`

function trip() {
  const xs = [10, 37, 63, 90], ys = [62, 34, 62, 34]
  const path = `M${xs[0]},${ys[0]} C${xs[0] + 13},${ys[0]} ${xs[1] - 13},${ys[1]} ${xs[1]},${ys[1]} S${xs[2] - 13},${ys[2]} ${xs[2]},${ys[2]} S${xs[3] - 13},${ys[3]} ${xs[3]},${ys[3]}`
  return `<div class="trip"><svg viewBox="0 0 100 100" preserveAspectRatio="none"><path d="${path}" fill="none" stroke="rgb(255 255 255 / .3)" stroke-width="2" stroke-dasharray="1 2.4" vector-effect="non-scaling-stroke"/></svg>
    ${STEPS.map(([l, v, c, d], i) => `<div class="stop" style="left:${xs[i]}%;top:${ys[i]}%;--c:${c};--s:${40 + v / 12 * 36}px"><div class="pl">${v}</div><b>${l}</b><small>${pct(v)} % · ${d}</small></div>`).join('')}
    ${STEPS.slice(1).map(([, v], i) => { const lost = STEPS[i][1] - v; return lost ? `<span class="loss" style="left:${(xs[i] + xs[i + 1]) / 2}%;top:${(ys[i] + ys[i + 1]) / 2 - 2}%">−${lost} en route</span>` : '' }).join('')}</div>`
}
function rings() {
  const R = [118, 94, 70, 46]
  return `<div class="rings"><svg viewBox="0 0 260 260">${STEPS.map(([l, v, c], i) => { const r = R[i], C = 2 * Math.PI * r; return `<circle cx="130" cy="130" r="${r}" fill="none" stroke="rgb(255 255 255 / .06)" stroke-width="16"/><circle cx="130" cy="130" r="${r}" fill="none" stroke="${c}" stroke-width="16" stroke-linecap="round" stroke-dasharray="${v / 12 * C} ${C}" transform="rotate(-90 130 130)" style="filter:drop-shadow(0 0 6px ${c})"><title>${l} : ${v}</title></circle>` }).join('')}
    <text x="130" y="138" text-anchor="middle" font-size="26" font-weight="700" fill="#fff">${pct(STEPS[3][1])} %</text></svg>
    <ul class="rl">${STEPS.map(([l, v, c]) => `<li><i style="background:${c};box-shadow:0 0 8px ${c}"></i>${l}<b>${v}</b><em>${pct(v)} %</em></li>`).join('')}</ul></div>`
}
const TOP = [['Margaret Hamilton', 15, 'Margaret'], ['Morayo Elegbede', 12, 'Morayo'], ['Aïcha Diallo', 9, 'Aicha'], ['Exaucé N.', 9, 'Exauce'], ['Ada Lovelace', 7, 'Ada']]

const V = [
  ['Le voyage', 'chaque étape est une planète, plus elle est grosse plus il y a de monde, et on voit combien se perdent en route',
    `<div class="glass card"><h3>Le voyage des nouveaux <small>sur 12 inscrits</small></h3>${trip()}</div>`],
  ['Les marches', 'quatre colonnes qui descendent, comme un escalier, très faciles à comparer',
    `<div class="glass card"><h3>Parcours des nouveaux <small>sur 12 inscrits</small></h3><div class="steps">${STEPS.map(([l, v, c]) => `<div class="step" style="--c:${c}"><div class="bar" style="height:${30 + v / 12 * 70}%">${v}</div><span>${l}</span><em>${pct(v)} %</em></div>`).join('')}</div></div>`],
  ['Les anneaux', 'un anneau par étape, de l\'extérieur vers l\'intérieur, avec le % qui va jusqu\'au bout au centre',
    `<div class="glass card"><h3>Parcours des nouveaux <small>sur 12 inscrits</small></h3>${rings()}</div>`],
  ['À la place : les plus actifs', 'le classement des comptes qui ont le plus de widgets',
    `<div class="glass card"><h3>Les comptes les plus actifs <small>par nombre de widgets</small></h3><div class="top">${TOP.map(([n, w, s], i) => `<div class="row"><span class="rank">${['🥇', '🥈', '🥉'][i] ?? i + 1}</span><span class="av" style="background-image:url(${AV(s)})"></span><span><b>${n}</b><small>${w} widgets</small></span><span class="track"><i style="width:${w / 15 * 100}%"></i></span><span class="n">${w}</span></div>`).join('')}</div></div>`],
  ['À la place : l\'engagement', '4 chiffres sur la façon dont Morex est utilisé, avec un conseil quand il y a quelque chose à faire',
    `<div class="glass card"><h3>Comment Morex est utilisé</h3><div class="eng">
      <div><div class="v">8,9</div><div class="l">widgets par compte en moyenne</div></div>
      <div><div class="v">2</div><div class="l">comptes sans aucun widget</div><div class="hint">💡 peut-être leur envoyer un petit mot</div></div>
      <div><div class="v">42 %</div><div class="l">ont lié un compte externe</div></div>
      <div><div class="v">15</div><div class="l">widgets pour le plus gros dashboard</div></div></div></div>`],
]
document.getElementById('w').innerHTML = `<h2 class="part">Le même parcours, affiché autrement</h2><p class="part-sub">Les vraies données : inscrits, e-mail confirmé, au moins 1 widget, un compte lié.</p>`
  + V.slice(0, 3).map(([n, w, h], i) => sec(i + 1, n, w, h)).join('')
  + `<h2 class="part">Ou autre chose à la place</h2><p class="part-sub">Calculé aussi avec ce que le serveur renvoie déjà.</p>`
  + V.slice(3).map(([n, w, h], i) => sec(i + 4, n, w, h)).join('')
</script>
</body>
</html>
