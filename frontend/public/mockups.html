<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Morex mockups</title>
<link rel="icon" type="image/svg+xml" href="/logo.svg" />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@700;800&family=Caveat:wght@500;700&family=JetBrains+Mono:wght@400;600&family=Cormorant+Garamond:ital,wght@1,500&family=Cinzel:wght@500&family=Special+Elite&display=swap" rel="stylesheet" />
<style>
  /* ---------- Themes (colour palettes, independent of light/dark) ---------- */
  :root, [data-theme="galaxy"] {
    --bg: linear-gradient(rgb(2 6 23 / .45), rgb(2 6 23 / .7)), url(/accueil_photo.jpg) 50% 28%/cover;
    --a1: #818cf8; --a2: #38bdf8; --glow: 99 102 241; --img: url(/accueil_photo.jpg);
  }
  [data-theme="aurora"] {
    --bg: linear-gradient(rgb(2 6 23 / .45), rgb(2 6 23 / .7)), url(/aurore_boreale.jpeg) 50% 30%/cover;
    --a1: #2dd4bf; --a2: #a78bfa; --glow: 45 212 191; --img: url(/aurore_boreale.jpeg);
  }
  [data-theme="moon"] {
    --bg: linear-gradient(rgb(2 6 23 / .45), rgb(2 6 23 / .7)), url(/cheval.jpeg) 50% 28%/cover;
    --a1: #60a5fa; --a2: #e2e8f0; --glow: 59 130 246; --img: url(/cheval.jpeg);
  }
  [data-theme="dolphins"] {
    --bg: linear-gradient(rgb(2 6 23 / .45), rgb(2 6 23 / .7)), url(/dauphins_theme.jpeg) 50% 58%/cover;
    --a1: #fb7185; --a2: #fb923c; --glow: 251 113 133; --img: url(/dauphins_theme.jpeg);
  }
  [data-theme="forest"] {
    --bg: linear-gradient(rgb(2 6 23 / .45), rgb(2 6 23 / .7)), url(/foret_theme.jpeg) 50% 42%/cover;
    --a1: #4ade80; --a2: #2dd4bf; --glow: 16 185 129; --img: url(/foret_theme.jpeg);
  }
  [data-theme="mystic"] {
    --bg: linear-gradient(rgb(2 6 23 / .45), rgb(2 6 23 / .7)), url(/mystical_theme.jpeg) 50% 42%/cover;
    --a1: #f43f5e; --a2: #fda4af; --glow: 244 63 94; --img: url(/mystical_theme.jpeg);
  }
  [data-theme="ocean"] {
    --bg: linear-gradient(rgb(2 6 23 / .45), rgb(2 6 23 / .7)), url(/ocean_theme.jpeg) 50% 32%/cover;
    --a1: #22d3ee; --a2: #3b82f6; --glow: 34 211 238; --img: url(/ocean_theme.jpeg);
  }
  [data-theme="beach"] {
    --bg: linear-gradient(rgb(2 6 23 / .45), rgb(2 6 23 / .7)), url(/plage_theme.jpeg) 50% 62%/cover;
    --a1: #fb923c; --a2: #f472b6; --glow: 249 115 22; --img: url(/plage_theme.jpeg);
  }
  [data-theme="desertNight"] {
    --bg: linear-gradient(rgb(2 6 23 / .45), rgb(2 6 23 / .7)), url(/sahara_night.jpeg) 50% 68%/cover;
    --a1: #fcd34d; --a2: #d6b370; --glow: 234 179 8; --img: url(/sahara_night.jpeg);
  }
  [data-theme="desertMoon"] {
    --bg: linear-gradient(rgb(2 6 23 / .45), rgb(2 6 23 / .7)), url(/sahara_theme.jpeg) 50% 10%/cover;
    --a1: #c084fc; --a2: #f0abfc; --glow: 168 85 247; --img: url(/sahara_theme.jpeg);
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; min-height: 100vh; font-family: Poppins, system-ui, sans-serif; color: #fff; background: #020617; }
  /* Full-page theme background with a slow drift / zoom, and a fade when the theme changes */
  body::before { content: ""; position: fixed; inset: -6%; z-index: -1; pointer-events: none; background: var(--bg);
    animation: bgDrift 45s ease-in-out infinite alternate; }
  body.theme-in::before { animation: bgDrift 45s ease-in-out infinite alternate, bgFade .9s ease-out; }
  @keyframes bgDrift { from { transform: scale(1) translate3d(0, 0, 0); } to { transform: scale(1.12) translate3d(-2%, -1.5%, 0); } }
  @keyframes bgFade { from { opacity: 0; filter: blur(12px); } to { opacity: 1; filter: none; } }
  button, input, select { font: inherit; color: inherit; }
  .glass { background: rgb(255 255 255 / .08); border: 1px solid rgb(255 255 255 / .14);
    backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); border-radius: 24px; }
  .grad { background: linear-gradient(90deg, #fff, var(--a1) 60%, var(--a2)); -webkit-background-clip: text;
    background-clip: text; color: transparent; }
  .muted { color: rgb(255 255 255 / .65); }
  svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* ---------- Shared pieces ---------- */
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 22px; }
  .brand img { height: 36px; }
  .search { position: relative; flex: 1; max-width: 520px; }
  .search input { width: 100%; height: 50px; padding: 0 22px 0 58px; border-radius: 999px; outline: none; transition: .25s;
    background: linear-gradient(180deg, rgb(255 255 255 / .12), rgb(255 255 255 / .05)); border: 1px solid rgb(255 255 255 / .18);
    box-shadow: inset 0 1px 0 rgb(255 255 255 / .15), 0 10px 30px -12px rgb(var(--glow) / .5); backdrop-filter: blur(20px); }
  .search input:hover { border-color: rgb(255 255 255 / .3); }
  .search input:focus { border-color: rgb(255 255 255 / .5); box-shadow: inset 0 1px 0 rgb(255 255 255 / .2), 0 0 0 4px rgb(var(--glow) / .25), 0 14px 40px -10px rgb(var(--glow) / .7); }
  .search input::placeholder { color: rgb(255 255 255 / .55); }
  .search .lens { position: absolute; z-index: 1; left: 6px; top: 50%; transform: translateY(-50%); width: 36px; height: 36px; border-radius: 50%;
    display: grid; place-items: center; pointer-events: none; color: #fff;
    background: linear-gradient(135deg, var(--a1), var(--a2)); box-shadow: 0 4px 14px rgb(var(--glow) / .6); }
  .search .lens svg { width: 18px; height: 18px; }
  .results { position: absolute; top: calc(100% + 8px); left: 0; right: 0; padding: 8px; display: none; z-index: 20; background: rgb(15 23 42 / .92); }
  .search:focus-within .results { display: block; }
  .results h6 { margin: 8px 12px 4px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: rgb(255 255 255 / .5); font-weight: 500; }
  .results a { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border-radius: 12px; color: #fff; text-decoration: none; font-size: 14px; }
  .results a:hover { background: rgb(255 255 255 / .08); }
  .results a span { font-size: 12px; color: rgb(255 255 255 / .5); }

  .pill-menu { position: relative; }
  .pill-menu > button { height: 44px; padding: 0 14px; border-radius: 14px; display: flex; align-items: center; gap: 8px; cursor: pointer;
    background: rgb(255 255 255 / .08); border: 1px solid rgb(255 255 255 / .14); white-space: nowrap; }
  .menu { position: absolute; right: 0; top: calc(100% + 8px); padding: 8px; min-width: 200px; display: none; z-index: 30; background: rgb(15 23 42 / .92); }
  .pill-menu.open .menu { display: block; }
  .menu button { width: 100%; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 0; background: transparent;
    border-radius: 12px; cursor: pointer; text-align: left; font-size: 14px; }
  .menu button:hover { background: rgb(255 255 255 / .1); }
  .menu.theme-grid { width: 380px; grid-template-columns: 1fr 1fr; gap: 8px; }
  .pill-menu.open .menu.theme-grid { display: grid; }
  .theme-grid button { flex-direction: column; align-items: stretch; gap: 6px; padding: 6px; font-size: 13px; }
  .theme-grid .thumb { height: 64px; border-radius: 10px; background-size: cover; background-position: center; border: 2px solid transparent; }
  .theme-grid button.on .thumb { border-color: #fff; box-shadow: 0 0 14px rgb(var(--glow) / .7); }
  .swatch { width: 18px; height: 18px; border-radius: 50%; flex: none; }

  .avatar { width: 44px; height: 44px; border-radius: 50%; cursor: pointer; overflow: hidden; flex: none; background: rgb(255 255 255 / .1);
    box-shadow: 0 0 0 2px rgb(255 255 255 / .3), 0 0 20px rgb(var(--glow) / .5); }
  .avatar img { width: 100%; height: 100%; display: block; object-fit: cover; }

  .clock { font-weight: 600; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
  .date::first-letter { text-transform: uppercase; }
  .hello { font-weight: 600; letter-spacing: -.02em; margin: 0; }
  .bio { line-height: 1.7; margin: 0; }
  .edit-link { display: inline-flex; gap: 6px; align-items: center; font-size: 14px; color: var(--a2); cursor: pointer; background: none; border: 0; padding: 0; }
  .hint { font-size: 13px; color: rgb(255 255 255 / .5); display: flex; align-items: center; gap: 8px; }

  /* ---------- Widgets ---------- */
  .widgets { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); grid-auto-rows: 128px; grid-auto-flow: dense; gap: 24px; }
  .w { grid-row: span 2; overflow: visible; min-height: 0; position: relative; padding: 22px; display: flex; flex-direction: column; gap: 14px; transition: transform .25s, box-shadow .25s, opacity .25s;
    user-select: none; -webkit-user-select: none; touch-action: manipulation; }
  body:not(.editing) .w:hover { transform: translateY(-4px); box-shadow: 0 20px 40px -12px rgb(var(--glow) / .35); }
  .w.pressing { transform: scale(.97); }
  .w-head { display: flex; align-items: center; gap: 12px; }
  .w-ico { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; flex: none;
    background: linear-gradient(135deg, rgb(var(--glow) / .5), rgb(255 255 255 / .06)); }
  .w-title { font-weight: 600; font-size: 15px; }
  .w-sub { font-size: 12px; color: rgb(255 255 255 / .55); }
  .w-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; font-size: 14px; }
  .w-list li { display: flex; gap: 10px; align-items: baseline; }
  .w-list li::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--a2); flex: none; transform: translateY(-2px); }
  .w-list small { color: rgb(255 255 255 / .5); margin-left: auto; white-space: nowrap; font-size: 12px; }
  .big-num { font-size: 40px; font-weight: 600; letter-spacing: -.02em; }
  .delta { font-size: 13px; padding: 3px 10px; border-radius: 999px; background: rgb(52 211 153 / .15); color: #6ee7b7; }
  .w-foot { margin-top: auto; font-size: 12px; color: rgb(255 255 255 / .45); display: flex; justify-content: space-between; }
  .add { border-style: dashed; align-items: center; justify-content: center; text-align: center; min-height: 220px; cursor: pointer; color: rgb(255 255 255 / .7); }
  .add .plus { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; font-size: 30px; font-weight: 300;
    background: rgb(255 255 255 / .08); border: 1px solid rgb(255 255 255 / .2); }
  .spark { width: 100%; flex: 1; min-height: 50px; }
  .w-list { overflow: hidden; }

  /* World clock widget: list when small, 24 h timeline once it's wide enough */
  .w[data-kind="world"] { grid-column: span 2; grid-row: span 2; }
  .wl-line { position: relative; flex: 1; min-height: 200px; }
  .wl-line .bar { position: absolute; left: 0; right: 0; top: 50%; height: 12px; transform: translateY(-50%); border-radius: 999px;
    background: linear-gradient(90deg, #0b1026 0%, #1e1b4b 20%, #f9a8d4 26%, #fcd34d 32%, #38bdf8 45%, #7dd3fc 60%, #fb7185 74%, #7c3aed 80%, #1e1b4b 88%, #0b1026 100%); }
  .wl-line .hrs { position: absolute; left: 0; right: 0; top: calc(50% + 10px); display: flex; justify-content: space-between; font-size: 10px; color: rgb(255 255 255 / .45); }
  .wl-pin { position: absolute; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; white-space: nowrap; }
  .wl-pin.up { bottom: calc(50% + 8px); } .wl-pin.down { top: calc(50% + 8px); flex-direction: column-reverse; }
  .wl-pin .lbl { padding: 4px 9px; border-radius: 10px; background: rgb(15 23 42 / .85); border: 1px solid rgb(255 255 255 / .15); font-size: 11px; text-align: center; }
  .wl-pin .lbl b { font-size: 14px; font-variant-numeric: tabular-nums; }
  .wl-pin .stem { width: 2px; height: 12px; background: rgb(255 255 255 / .6); }
  .wl-pin .dot { width: 10px; height: 10px; border-radius: 50%; background: #fff; box-shadow: 0 0 10px #fff; }
  .wl-pin.me .dot { background: var(--a2); box-shadow: 0 0 12px var(--a2); width: 13px; height: 13px; }
  .wl-pin.me .lbl { border-color: var(--a2); }

  /* News: newspaper + AI recap */
  .w[data-kind="rss"] { grid-column: span 2; grid-row: span 4; background: #f5efe3 !important; color: #1f1a17; border: 0 !important; backdrop-filter: none !important; }
  .w[data-kind="rss"] .w-foot { color: #8a7d70; }
  .np { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
  .np a { color: inherit; text-decoration: none; }
  .np .mast { text-align: center; font-family: 'Playfair Display', serif; font-size: 24px; font-weight: 800; border-bottom: 3px double #1f1a17; padding-bottom: 4px; }
  .np .sub { display: flex; justify-content: space-between; align-items: center; font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: #6b5f55; }
  .np .ai { display: inline-flex; align-items: center; gap: 5px; letter-spacing: .14em; font-size: 9.5px; color: #6b5f55; }
  .np .ai svg { width: 10px; height: 10px; fill: #8b5cf6; }
  .np .cols { flex: 1; min-height: 0; display: grid; grid-template-columns: 1.35fr 1fr; gap: 14px; }
  .np .lead .img { position: relative; height: 120px; border-radius: 4px; overflow: hidden; background: #ddd; }
  .np .lead .img img { width: 100%; height: 100%; object-fit: cover; filter: sepia(.12); transition: transform .6s; }
  .np .lead:hover .img img { transform: scale(1.04); }
  .np .live { position: absolute; left: 8px; top: 8px; font-size: 9.5px; font-weight: 700; letter-spacing: .08em; padding: 2px 7px; border-radius: 4px; background: #dc2626; color: #fff; }
  .np h3 { font-family: 'Playfair Display', serif; font-size: 17px; line-height: 1.2; margin: 8px 0 5px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .np .kicker { font-size: 9px; letter-spacing: .2em; text-transform: uppercase; color: #8b5cf6; font-weight: 600; margin-bottom: 3px; }
  .np .recap { font-family: Georgia, 'Times New Roman', serif; font-size: 12px; line-height: 1.55; color: #3f3731; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .np .recap::first-letter { float: left; font-family: 'Playfair Display', serif; font-size: 34px; line-height: .85; font-weight: 800; padding: 3px 5px 0 0; color: #1f1a17; }
  .np .why { margin-top: 8px; padding-left: 10px; border-left: 2px solid #8b5cf6; font-family: Georgia, serif; font-style: italic; font-size: 11.5px; line-height: 1.45; color: #4b423b; }
  .np .tags { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; color: #8a7d70; }
  .np .tags span + span::before { content: '·'; margin-right: 10px; color: #cbbfae; }
  .np .side { border-left: 1px solid #cbbfae; padding-left: 12px; display: flex; flex-direction: column; gap: 9px; overflow: hidden; }
  .np .side a { border-bottom: 1px solid #ddd3c4; padding-bottom: 8px; }
  .np .side b { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; font-family: 'Playfair Display', serif; font-size: 13.5px; line-height: 1.25; font-weight: 700; }
  .np .side small { margin-top: 4px; font-family: Georgia, serif; font-style: italic; font-size: 11px; line-height: 1.35; color: #6b5f55; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  body[data-wskin] .w[data-kind="rss"] { box-shadow: 0 20px 40px -18px rgb(0 0 0 / .6); }
  /* Resizable: never let the paper spill out of its card, and fold to one column when narrow */
  .w[data-kind="rss"] { container-type: inline-size; }
  .np { overflow: hidden; }
  .np .lead { min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
  .np .why { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  @container (max-width: 460px) {
    .np .cols { grid-template-columns: 1fr; }
    .np .side { display: none; }
    .np .mast { font-size: 20px; }
    .np .sub span:first-child { display: none; }
    .np .sub { justify-content: center; }
  }
  @container (max-height: 360px) { .np .why, .np .tags { display: none; } }

  /* News: magazine */
  .mag-hero { height: 70px; flex: none; border-radius: 16px; position: relative; overflow: hidden; background: linear-gradient(135deg, #1e1b4b, var(--a1) 60%, var(--a2)); }
  .mag-hero::after { content: "🪐"; position: absolute; right: 14px; top: 12px; font-size: 42px; }
  .mag-hero span { position: absolute; left: 12px; bottom: 10px; font-size: 11px; padding: 3px 9px; border-radius: 999px; background: rgb(0 0 0 / .4); }
  .mag-title { margin: 0; font-size: 15px; line-height: 1.3; }
  .mag-list { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: rgb(255 255 255 / .72); }
  .mag-list li { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mag-list li::before { content: "• "; color: var(--a2); }
  /* Exchange rate: trend */
  .fx-row { display: flex; align-items: center; gap: 10px; }
  .fx-spark { width: 100%; flex: 1; min-height: 50px; }
  .fx-mm { display: flex; justify-content: space-between; font-size: 12px; color: rgb(255 255 255 / .55); }
  /* Exchange rate: trading card */
  .w[data-kind="fx"] { background: rgb(2 6 23 / .78) !important; }
  .trade { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; font-family: 'JetBrains Mono', ui-monospace, monospace; }
  .trade .row1 { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .trade .pair { font-weight: 700; font-size: 14px; }
  .trade .periods { display: flex; gap: 3px; padding: 3px; border-radius: 999px; background: rgb(255 255 255 / .06); }
  .trade .periods button { font: inherit; font-size: 10.5px; padding: 3px 9px; border: 0; border-radius: 999px; background: none; color: rgb(255 255 255 / .6); cursor: pointer; transition: .2s; }
  .trade .periods button:hover { color: #fff; }
  .trade .periods button.on { background: #fff; color: #111; font-weight: 700; }
  .trade svg path { transition: d .5s ease; }
  .trade .price { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .trade .price b { font-size: 34px; font-weight: 700; letter-spacing: -.02em; }
  .trade svg { width: 100%; flex: 1; min-height: 50px; display: block; }
  .trade .hl { display: flex; justify-content: space-between; font-size: 11px; color: rgb(255 255 255 / .55); }

  /* Price history: spinning coin */
  .bt-row { display: flex; align-items: center; gap: 14px; }
  .coin { width: 54px; height: 54px; flex: none; border-radius: 50%; display: grid; place-items: center; font-size: 28px; font-weight: 800; color: #7c2d12;
    background: radial-gradient(circle at 35% 30%, #fde68a, #f59e0b 70%); box-shadow: 0 0 24px rgb(245 158 11 / .6); animation: coinSpin 4s linear infinite; }
  @keyframes coinSpin { to { transform: rotateY(360deg); } }
  .bt-price { white-space: nowrap; font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .bt-chart { width: 100%; flex: 1; min-height: 60px; }
  /* GitHub: daily changes as a notebook page (ruled lines + red margin) */
  .w[data-kind="gh-daily"] { grid-column: span 2; grid-row: span 3; color: #2f2946; border: 0 !important; backdrop-filter: none !important;
    background: radial-gradient(circle at 1px 1px, rgb(76 63 120 / .12) 1px, transparent 0) 0 0 / 18px 18px, #fbf5e9 !important; }
  .w[data-kind="gh-daily"]::before { content: ""; position: absolute; top: 0; bottom: 0; left: 36px; width: 2px; background: rgb(239 68 68 / .45); pointer-events: none; }
  .w[data-kind="gh-daily"] .w-title { color: #1f1a17; } .w[data-kind="gh-daily"] .w-sub { color: #7a7094; }
  .w[data-kind="gh-daily"] .w-head, .w[data-kind="gh-daily"] .logbook { padding-left: 26px; }
  .w[data-kind="gh-daily"] .gh-ico { background: #1f2328; color: #fff; }
  .logbook { flex: 1; min-height: 0; overflow: hidden; display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 1.4fr); gap: 18px; }
  .logbook .left { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .logbook .count { display: flex; align-items: baseline; gap: 8px; }
  .logbook .count b { font: 700 46px/1 'Caveat', cursive; color: #4c3f78; }
  .logbook .count span { font-family: 'Caveat', cursive; font-size: 20px; color: #6b5f55; }
  .logbook .people { display: flex; } .logbook .people i { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font: 700 11px Poppins; font-style: normal; color: #1f1a17; border: 2px solid #fbf5e9; margin-left: -7px; }
  .logbook .people i:first-child { margin-left: 0; }
  .logbook .ai { display: inline-flex; align-items: center; gap: 5px; font-size: 9.5px; letter-spacing: .16em; text-transform: uppercase; color: #8b5cf6; margin-top: 4px; }
  .logbook .ai svg { width: 10px; height: 10px; fill: #8b5cf6; }
  .logbook .sum { font: 600 17px/26px 'Caveat', cursive; color: #3b3450; display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
  .logbook ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
  .logbook li { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px dashed #d8cdbb; }
  .logbook li:last-child { border-bottom: 0; }

  /* Edit mode: long-press → widgets jiggle, badges appear, drag to reorder */
  .badge { position: absolute; top: -11px; width: 30px; height: 30px; border-radius: 50%; display: none; place-items: center; cursor: pointer;
    border: 0; font-size: 20px; font-weight: 600; line-height: 1; z-index: 2; box-shadow: 0 4px 12px rgb(0 0 0 / .4); }
  .badge.del { left: -11px; background: #ef4444; color: #fff; }
  .badge.edit { right: -11px; background: #fff; color: #111; font-size: 15px; }
  .editing .w:not(.add) .badge { display: grid; animation: pop .25s ease-out; }
  .editing .w:not(.add) { animation: jiggle .26s ease-in-out infinite alternate; cursor: grab; }
  .editing .w:not(.add):nth-child(2n) { animation-duration: .3s; animation-delay: -.13s; }
  .editing .w:not(.add):nth-child(3n) { animation-duration: .24s; animation-delay: -.07s; }
  .resize { position: absolute; right: -11px; bottom: -11px; width: 30px; height: 30px; border-radius: 50%; display: none; place-items: center;
    border: 0; background: #fff; color: #111; cursor: nwse-resize; z-index: 2; box-shadow: 0 4px 12px rgb(0 0 0 / .4); touch-action: none; }
  .resize svg { width: 16px; height: 16px; }

  .w.resizing { animation: none !important; outline: 2px dashed rgb(255 255 255 / .6); outline-offset: 4px; }
  .w.dragging { opacity: .35; animation: none !important; }
  .w.removing { transform: scale(.5) !important; opacity: 0; animation: none !important; }
  .w.appearing { animation: pop .35s ease-out; }
  @keyframes jiggle { from { transform: rotate(-1.1deg) translateY(-1px); } to { transform: rotate(1.1deg) translateY(1px); } }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  /* ---------- Layout A: Cockpit (sidebar) ---------- */

  /* Collapsed: only the magnifier. Click it and the bar unrolls to the left */

  .A .search-row .search.open { width: min(560px, 100%); }

    background: linear-gradient(180deg, rgb(255 255 255 / .12), rgb(255 255 255 / .05)); border: 1px solid rgb(255 255 255 / .18); }
  .A .search-row .search .lens { pointer-events: auto; cursor: pointer; border: 0; padding: 0; }

  .A .hero { display: grid; grid-template-columns: minmax(0, 1fr) 300px 300px; gap: 20px; }

  /* Journal card: a closed book on the dashboard, as big as the clock */
  .journal-card { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 26px; cursor: pointer; perspective: 900px; }
  .mini-title { margin: 0; font: 700 34px/1 Caveat, cursive; }
  .mini-book { position: relative; width: 240px; height: 160px; perspective: 1000px; margin: 10px 0 4px; }
  .mini-book::before { content: ""; position: absolute; inset: -9px -10px; border-radius: 12px; background: linear-gradient(145deg, var(--a1), var(--a2));
    box-shadow: 0 16px 34px -10px rgb(0 0 0 / .7), 0 0 40px rgb(var(--glow) / .4); }
  .mini-book .pg, .mini-book .face { background-color: #fbf5e9; background-image: repeating-linear-gradient(transparent 0 15px, #e3daf1 15px 16px); background-position: 0 30px; }
  .mini-book .pg { position: absolute; top: 0; bottom: 0; width: 50%; }
  .mini-book .l { left: 0; border-radius: 6px 0 0 6px; box-shadow: inset -16px 0 18px -14px rgb(0 0 0 / .4); }
  .mini-book .r { right: 0; border-radius: 0 6px 6px 0; box-shadow: inset 16px 0 18px -14px rgb(0 0 0 / .4); }
  .mini-book .ink { position: absolute; left: 12px; top: 10px; font: 600 15px/16px Caveat, cursive; color: #5b4ea0; }
  .mini-book .leaf { position: absolute; left: 50%; top: 0; bottom: 0; width: 50%; transform-origin: left center; transform-style: preserve-3d;
    animation: leafTurn 3.6s cubic-bezier(.45, .05, .3, 1) infinite; }
  .mini-book .leaf:nth-of-type(4) { animation-delay: -1.2s; }
  .mini-book .leaf:nth-of-type(5) { animation-delay: -2.4s; }
  .mini-book .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 0 6px 6px 0; }
  .mini-book .face.front { background-image: linear-gradient(90deg, rgb(0 0 0 / .16), transparent 20%), repeating-linear-gradient(transparent 0 15px, #e3daf1 15px 16px); }
  .mini-book .face.back { transform: rotateY(180deg); border-radius: 6px 0 0 6px;
    background-image: linear-gradient(-90deg, rgb(0 0 0 / .16), transparent 20%), repeating-linear-gradient(transparent 0 15px, #e3daf1 15px 16px); }
  /* Each leaf turns, then vanishes on the left and quietly comes back on the right (it looks like the page beneath) */
  @keyframes leafTurn {
    0% { transform: rotateY(0); opacity: 1; }
    33% { transform: rotateY(-180deg); opacity: 1; }
    34% { transform: rotateY(-180deg); opacity: 0; }
    35%, 100% { transform: rotateY(0); opacity: 0; }
  }

  .pc-moon i { position: absolute; left: 50%; top: -7px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: #fff; box-shadow: 0 0 14px #fff; }
  .pc-moon b { position: absolute; left: 50%; top: -1px; width: 64px; height: 2px; margin-left: -66px; border-radius: 2px; background: linear-gradient(90deg, transparent, rgb(255 255 255 / .75)); }
  .pc-planet { width: 150px; height: 150px; border-radius: 50%; display: grid; place-content: center; text-align: center;
    background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--a1) 45%, #fff), var(--a1) 55%, #1e1b4b);

  /* Journal: an open book whose pages turn on their own */
  .modal.journal-modal { position: relative; max-width: 1000px; padding: 0; background: none; border: 0; backdrop-filter: none; overflow: visible; }
  .book { position: relative; display: grid; grid-template-columns: 1fr 1fr; min-height: 560px; border-radius: 18px; padding: 14px; perspective: 2400px;
    background: linear-gradient(135deg, var(--a1), var(--a2)); box-shadow: 0 30px 80px -20px rgb(0 0 0 / .8), 0 0 60px rgb(var(--glow) / .35); }
  .page { position: relative; background: #fbf5e9; color: #3b3450; padding: 34px 36px; overflow: hidden; }
  .page.left { border-radius: 10px 0 0 10px; box-shadow: inset -30px 0 40px -30px rgb(0 0 0 / .35); }
  .page.right { border-radius: 0 10px 10px 0; box-shadow: inset 30px 0 40px -30px rgb(0 0 0 / .35); }
  .book .page > * { transition: opacity .35s; }
  .book.opening .page > * { opacity: 0; }
  .book::after { content: ""; position: absolute; top: 14px; bottom: 14px; left: 50%; width: 2px; background: rgb(0 0 0 / .15); }
  /* A flipping leaf sits on the right half and turns around the spine (or the reverse for going back) */
  .flip { position: absolute; top: 14px; bottom: 14px; left: 50%; width: calc(50% - 14px); transform-style: preserve-3d; transform-origin: left center;
    pointer-events: none; animation: flipFwd .75s cubic-bezier(.45, .05, .3, 1) both; }
  .flip.rev { left: 14px; transform-origin: right center; animation-name: flipBack; }
  @keyframes flipFwd { 0% { transform: rotateY(0); z-index: var(--z0, 6); } 50% { z-index: var(--z1, 6); } 100% { transform: rotateY(-180deg); z-index: var(--z1, 6); } }
  @keyframes flipBack { 0% { transform: rotateY(0); z-index: 6; } 100% { transform: rotateY(180deg); z-index: 6; } }
  .flip .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; background-color: #fbf5e9;
    background-image: linear-gradient(90deg, rgb(0 0 0 / .18), transparent 12%), repeating-linear-gradient(transparent 0 33px, #e3daf1 33px 34px);
    background-position: 0 0, 0 150px; border-radius: 0 10px 10px 0; }
  .flip .face.back { transform: rotateY(180deg); border-radius: 10px 0 0 10px;
    background-image: linear-gradient(-90deg, rgb(0 0 0 / .18), transparent 12%), repeating-linear-gradient(transparent 0 33px, #e3daf1 33px 34px); }
  .flip.rev .face { border-radius: 10px 0 0 10px; } .flip.rev .face.back { border-radius: 0 10px 10px 0; }

}
let av = { skinColor: 'ae5d29', top: 'curly', hairColor: '2c1b18', eyes: 'happy', eyebrows: 'defaultNatural', mouth: 'smile',
  accessories: 'none', facialHair: 'none', clothing: 'hoodie', clothesColor: '5199e4', backgroundColor: 'c0aede' }
let draft = { ...av }, photo = null, draftPhoto = null, tab = 'top'
let gender = 'girl', draftGender = gender

// Which hairstyles each choice shows; "all" shows everything. Girls get no beard tab.
const HAIR = {
  girl: ['bigHair', 'bob', 'bun', 'curly', 'curvy', 'dreads01', 'frida', 'fro', 'froBand', 'longButNotTooLong', 'miaWallace',
    'straight01', 'straight02', 'straightAndStrand', 'shavedSides', 'hijab', 'hat', 'winterHat1', 'winterHat02', 'winterHat03', 'winterHat04'],
  boy: ['none', 'shortFlat', 'shortRound', 'shortWaved', 'shortCurly', 'theCaesar', 'theCaesarAndSidePart', 'sides', 'frizzle', 'fro',
    'dreads', 'dreads01', 'dreads02', 'shaggy', 'shaggyMullet', 'turban', 'hat', 'winterHat1', 'winterHat02', 'winterHat03', 'winterHat04'],
}
// Random picks stay pleasant: no crying/dizzy eyes or grimaces, glasses and beards only sometimes
const NICE = {
  eyes: ['default', 'happy', 'wink', 'hearts', 'side', 'squint', 'surprised'],
  eyebrows: ['defaultNatural', 'default', 'raisedExcitedNatural', 'flatNatural'],
  mouth: ['smile', 'default', 'twinkle', 'tongue'],
  accessories: ['none', 'none', 'none', 'prescription01', 'prescription02', 'round', 'sunglasses', 'wayfarers'],
  facialHair: ['none', 'none', 'beardLight', 'beardMedium', 'moustacheFancy'],
}
const optionValues = (k) => {
  if (k === 'top' && draftGender !== 'all') return HAIR[draftGender]
  return AV_OPTIONS[k].values
}
const visibleTabs = () => Object.keys(AV_OPTIONS).filter((k) => !(k === 'facialHair' && draftGender === 'girl'))

function avUrl(o) {
  const q = new URLSearchParams({ seed: 'morex' })
  for (const k of ['skinColor', 'hairColor', 'eyes', 'eyebrows', 'mouth', 'clothing', 'clothesColor', 'backgroundColor']) q.set(k, o[k])
  if (o.top === 'none') q.set('topProbability', '0'); else { q.set('top', o.top); q.set('topProbability', '100') }
  if (o.accessories === 'none') q.set('accessoriesProbability', '0'); else { q.set('accessories', o.accessories); q.set('accessoriesProbability', '100') }
  if (o.facialHair === 'none') q.set('facialHairProbability', '0'); else { q.set('facialHair', o.facialHair); q.set('facialHairProbability', '100') }
  return `${AV_URL}?${q}`
}
const avImg = (src) => `<img src="${src}" alt="" />`

function renderAvatarEditor() {
  document.getElementById('avBig').innerHTML = avImg(draftPhoto || avUrl(draft))
  document.getElementById('avGender').innerHTML = ['girl', 'boy', 'all']
    .map((g) => `<button data-gender="${g}" class="${g === draftGender ? 'on' : ''}">${T[lang].genders[g]}</button>`).join('')
  document.getElementById('avTabs').innerHTML = visibleTabs()
    .map((k) => `<button data-tab="${k}" class="${k === tab ? 'on' : ''}">${T[lang].cats[k]}</button>`).join('')
  const def = AV_OPTIONS[tab]
  document.getElementById('avOpts').innerHTML = optionValues(tab).map((v) => {
    const on = !draftPhoto && draft[tab] === v ? 'on' : ''
    if (def.color) return `<button class="color ${on}" data-opt="${v}" style="background:#${v}" aria-label="${v}"></button>`
    if (v === 'none') return `<button class="none ${on}" data-opt="none">${T[lang].none}</button>`
    return `<button class="${on}" data-opt="${v}">${avImg(avUrl({ ...draft, [tab]: v }))}</button>`
  }).join('')
}
document.getElementById('avTabs').onclick = (e) => { const b = e.target.closest('[data-tab]'); if (b) { tab = b.dataset.tab; renderAvatarEditor() } }
document.getElementById('avOpts').onclick = (e) => { const b = e.target.closest('[data-opt]'); if (b) { draft[tab] = b.dataset.opt; draftPhoto = null; renderAvatarEditor() } }
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)]
document.getElementById('avRandom').onclick = () => {
  for (const k of Object.keys(AV_OPTIONS)) draft[k] = pick(NICE[k] || optionValues(k))
  if (draftGender === 'girl') draft.facialHair = 'none'
  draftPhoto = null; renderAvatarEditor()
}
document.getElementById('avGender').onclick = (e) => {
  const b = e.target.closest('[data-gender]'); if (!b) return
  draftGender = b.dataset.gender
  if (!optionValues('top').includes(draft.top)) draft.top = optionValues('top')[draftGender === 'boy' ? 1 : 0]
  if (draftGender === 'girl') draft.facialHair = 'none'
  if (!visibleTabs().includes(tab)) tab = 'top'
  draftPhoto = null; renderAvatarEditor()
}
document.getElementById('file').onchange = (e) => { const f = e.target.files[0]; if (f) { draftPhoto = URL.createObjectURL(f); renderAvatarEditor() } }
document.getElementById('saveAvatar').onclick = () => { av = { ...draft }; photo = draftPhoto; gender = draftGender; closeModals(); render() }

// ---------- Journal ----------
const MOODS = ['😊', '🥰', '😌', '😴', '😢', '😡']
const today = new Date()
const daysAgo = (n) => new Date(today.getFullYear(), today.getMonth(), today.getDate() - n)
let entries = [
  { date: daysAgo(1), mood: '🥰', text: 'Aujourd\u2019hui j\u2019ai enfin fini la page de connexion de Morex. Je suis trop fière du résultat, le fond galaxie est magnifique…' },
  { date: daysAgo(4), mood: '😌', text: 'Journée calme. J\u2019ai lu, j\u2019ai marché un peu. Parfois il faut juste respirer.' },
]
let current = 0
const fmtDay = (d) => d.toLocaleDateString(LOCALE[lang], { weekday: 'long', day: 'numeric', month: 'long' })
function flip(dir, { cover = false, delay = 0, dur = 0.75, z0, z1 } = {}) {
  const book = document.querySelector('.book'), f = document.createElement('div')
  f.className = `flip${dir < 0 ? ' rev' : ''}${cover ? ' cover-leaf' : ''}`
  f.style.animationDelay = `${delay}s`; f.style.animationDuration = `${dur}s`
  if (z0 != null) { f.style.setProperty('--z0', z0); f.style.setProperty('--z1', z1) }
  f.innerHTML = `<div class="face front">${cover ? `<b>${T[lang].journal}</b>` : ''}</div><div class="face back"></div>`
  book.append(f)
  setTimeout(() => f.remove(), (delay + dur) * 1000 + 60)   // timed, so it also cleans up under reduced motion
}
// On opening, a few pages riffle past on their own before settling on today's page
function openBook() {
  const book = document.querySelector('.book')
  book.classList.add('opening')
  for (let i = 0; i < 6; i++) flip(1, { delay: 0.15 + i * 0.14, dur: 0.6, z0: 9 - i, z1: 2 + i })
  setTimeout(() => book.classList.remove('opening'), 1500)
}

function renderJournal(turn) {
  const e = entries[current]
  document.getElementById('jList').innerHTML = entries.map((x, i) =>
    `<li><button data-entry="${i}" class="${i === current ? 'on' : ''}"><span class="mood">${x.mood}</span><span><b>${fmtDay(x.date)}</b><span class="prev">${x.text || T[lang].untitled}</span></span></button></li>`).join('')
  const d = fmtDay(e.date); document.getElementById('jDate').textContent = d.charAt(0).toUpperCase() + d.slice(1)
  document.getElementById('jMoods').innerHTML = `<span>${T[lang].howFeel}</span>` + MOODS.map((m) => `<button data-mood="${m}" class="${m === e.mood ? 'on' : ''}">${m}</button>`).join('')
  const ta = document.getElementById('jText'); ta.value = e.text; ta.placeholder = T[lang].writeHere
  document.getElementById('jSaved').textContent = ''
  if (turn) flip(turn)
}
document.getElementById('journalModal').addEventListener('click', (ev) => {
  const en = ev.target.closest('[data-entry]'); if (en && +en.dataset.entry !== current) { const dir = +en.dataset.entry > current ? 1 : -1; current = +en.dataset.entry; renderJournal(dir) }
  const md = ev.target.closest('[data-mood]'); if (md) { entries[current].mood = md.dataset.mood; renderJournal() }
  if (ev.target.closest('#jNew')) { entries.unshift({ date: new Date(), mood: '😊', text: '' }); current = 0; renderJournal(-1); document.getElementById('jText').focus() }
})
let saveTimer
document.getElementById('jText').addEventListener('input', (ev) => {
  entries[current].text = ev.target.value
  clearTimeout(saveTimer); document.getElementById('jSaved').textContent = '…'

condition", "title": "Conditions météo et « ressenti »"}, {"id": "guide-alerts", "title": "Alertes"}]}, {"id": "weather/daily_forecast", "kind": "widget", "title": "Prévisions par jour", "body": "Les prochains jours : ciel, température min/max et probabilité de pluie. Réglages : « city », « days » (5 par défaut, 16 max) et « unit ». Avec l’IA : un conseil d’organisation.", "related": [{"id": "weather", "title": "Météo"}, {"id": "term-weather-condition", "title": "Conditions météo et « ressenti »"}]}, {"id": "weather/hourly_forecast", "kind": "widget", "title": "Prévisions heure par heure", "body": "Température, ciel et probabilité de pluie pour les prochaines heures (heure locale de la ville). Réglages : « city », « hours » (12 par défaut, 48 max) et « unit ».", "related": [{"id": "weather", "title": "Météo"}, {"id": "term-weather-condition", "title": "Conditions météo et « ressenti »"}]}, {"id": "youtube", "kind": "service", "title": "YouTube", "body": "Statistiques de chaîne, dernières vidéos, tendances par pays et statistiques d’une vidéo. Pas de compte de ton côté : le serveur utilise sa propre clé YouTube (si l’administrateur en a configuré une — sinon ces widgets restent vides). Quota quotidien partagé entre tous les utilisateurs.", "related": [{"id": "youtube/channel_stats", "title": "Statistiques de la chaîne"}, {"id": "youtube/latest_videos", "title": "Dernières vidéos"}, {"id": "youtube/trending", "title": "Vidéos tendance"}, {"id": "youtube/video_stats", "title": "Statistiques de la vidéo"}, {"id": "term-youtube-ids", "title": "Pseudo (@handle), ID de chaîne, ID de vidéo"}, {"id": "term-quota", "title": "Quota / limite de requêtes"}, {"id": "term-api-key", "title": "Clé d’API"}]}, {"id": "youtube/channel_stats", "kind": "widget", "title": "Statistiques de la chaîne", "body": "Abonnés, vues totales et nombre de vidéos. Réglage : « channel » (@pseudo, ID de chaîne ou URL). Certaines chaînes masquent leur nombre d’abonnés. Ce nombre peut déclencher une alerte (ex. à 1 million).", "related": [{"id": "youtube", "title": "YouTube"}, {"id": "term-youtube-ids", "title": "Pseudo (@handle), ID de chaîne, ID de vidéo"}]}, {"id": "youtube/latest_videos", "kind": "widget", "title": "Dernières vidéos", "body": "Les vidéos les plus récentes d’une chaîne avec miniature et vues. Réglages : « channel » et « number » (5 par défaut, 25 max).", "related": [{"id": "youtube", "title": "YouTube"}, {"id": "term-youtube-ids", "title": "Pseudo (@handle), ID de chaîne, ID de vidéo"}]}, {"id": "youtube/trending", "kind": "widget", "title": "Vidéos tendance", "body": "Les vidéos les plus populaires du moment dans un pays. Réglages : « country » (code à 2 lettres comme FR, US, BJ — obligatoire) et « number ».", "related": [{"id": "youtube", "title": "YouTube"}, {"id": "term-youtube-ids", "title": "Pseudo (@handle), ID de chaîne, ID de vidéo"}]}, {"id": "youtube/video_stats", "kind": "widget", "title": "Statistiques de la vidéo", "body": "Vues, likes et commentaires d’une vidéo. Réglage : « video » (son adresse ou son ID de 11 caractères). Le nombre de vues peut déclencher une alerte.", "related": [{"id": "youtube", "title": "YouTube"}, {"id": "term-youtube-ids", "title": "Pseudo (@handle), ID de chaîne, ID de vidéo"}]}, {"id": "steam", "kind": "service", "title": "Steam", "body": "Ton profil de joueur Steam : statut en ligne et jeu en cours, jeux joués récemment, taille de la bibliothèque et heures totales. Aucune connexion Steam n’est nécessaire : l’appli lit les profils publics avec sa propre clé Steam (réglée par l’administrateur). Ton profil et tes détails de jeu doivent être en Public dans Steam.", "related": [{"id": "steam/profile", "title": "Profil Steam"}, {"id": "steam/recent_games", "title": "Jeux récents"}, {"id": "steam/library_stats", "title": "Statistiques de la bibliothèque"}, {"id": "term-steam-id", "title": "SteamID, lien de profil, nom personnalisé"}, {"id": "term-api-key", "title": "Clé d’API"}]}, {"id": "steam/profile", "kind": "widget", "title": "Profil Steam", "body": "Nom, avatar, statut en ligne, jeu en cours, niveau Steam et date d’inscription. Réglage : « steamId » (ton SteamID64, le lien de ton profil, ou le nom personnalisé de ton profil — obligatoire). Le niveau peut déclencher une alerte.", "related": [{"id": "steam", "title": "Steam"}, {"id": "term-steam-id", "title": "SteamID, lien de profil, nom personnalisé"}]}, {"id": "steam/recent_games", "kind": "widget", "title": "Jeux récents", "body": "Les jeux joués ces deux dernières semaines avec les heures sur la période et au total. Réglages : « steamId » et « number » (5 par défaut, 10 max). Nécessite « Détails du jeu » en Public dans les paramètres de confidentialité de Steam.", "related": [{"id": "steam", "title": "Steam"}, {"id": "term-steam-id", "title": "SteamID, lien de profil, nom personnalisé"}]}, {"id": "steam/library_stats", "kind": "widget", "title": "Statistiques de la bibliothèque", "body": "Combien de jeux tu possèdes, combien tu as réellement joués, tes heures totales et tes cinq jeux les plus joués. Réglage : « steamId ». Les heures totales sont tracées dans le temps et peuvent déclencher une alerte. Nécessite « Détails du jeu » en Public.", "related": [{"id": "steam", "title": "Steam"}, {"id": "term-steam-id", "title": "SteamID, lien de profil, nom personnalisé"}]}, {"id": "wellbeing", "kind": "service", "title": "Bien-être", "body": "Un groupe calme de widgets quotidiens : une citation du jour, un « le saviez-vous ? » et un horoscope pour ton signe. Ni compte ni clé. Ils changent une fois par jour, une fréquence d’une heure ou plus suffit largement.", "related": [{"id": "wellbeing/daily_quote", "title": "Citation du jour"}, {"id": "wellbeing/did_you_know", "title": "Le saviez-vous ?"}, {"id": "wellbeing/horoscope", "title": "Horoscope"}]}, {"id": "wellbeing/daily_quote", "kind": "widget", "title": "Citation du jour", "body": "Une vraie citation avec son auteur (quelques-unes sont des proverbes), une par jour, affichée dans la langue de l’interface. Aucun réglage.", "related": [{"id": "wellbeing", "title": "Bien-être"}]}, {"id": "wellbeing/did_you_know", "kind": "widget", "title": "Le saviez-vous ?", "body": "Un court fait bien établi pour la journée (nature, espace, science, histoire, technologie, corps humain), dans la langue de l’interface. Aucun réglage.", "related": [{"id": "wellbeing", "title": "Bien-être"}]}, {"id": "wellbeing/horoscope", "kind": "widget", "title": "Horoscope", "body": "Un horoscope quotidien pour un signe du zodiaque, pour le plaisir — toujours indiqué comme tel. Réglage : « sign » (à choisir dans la liste ; la date de naissance de ton profil t’indique le tien). Par défaut le texte est composé de phrases fixes ; avec « Analyse par l’IA », une IA en écrit un nouveau pour ton signe — seuls le signe et la date sont envoyés, jamais ta date de naissance.", "related": [{"id": "wellbeing", "title": "Bien-être"}, {"id": "guide-birthdate", "title": "Pourquoi nous demandons ta date de naissance"}, {"id": "term-ai-insight", "title": "Analyse par l’IA"}]}, {"id": "calendar", "kind": "service", "title": "Agenda", "body": "Tes prochains événements depuis tout agenda qui peut publier un lien iCal (.ics) — Google Agenda, Outlook, Apple, Epitech… Pas de connexion : le lien privé est la clé, stocké chiffré.", "related": [{"id": "calendar/upcoming_events", "title": "Prochains événements"}, {"id": "term-ics", "title": "Lien de calendrier iCal / .ics"}, {"id": "term-secret-param", "title": "Réglage secret (🔒)"}]}, {"id": "calendar/upcoming_events", "kind": "widget", "title": "Prochains événements", "body": "Les prochains événements avec heure et lieu ; les événements récurrents sont développés. Réglages : « url » (🔒 le lien iCal de l’agenda, obligatoire), « days » (jusqu’où, 14 par défaut, 60 max) et « number » (8 par défaut). Ce widget est privé : il ne peut pas figurer sur une page publique partagée.", "related": [{"id": "calendar", "title": "Agenda"}, {"id": "term-ics", "title": "Lien de calendrier iCal / .ics"}]}, {"id": "epitech", "kind": "service", "title": "My Epitech", "body": "Pour les étudiants Epitech : ton planning et ta carte d’identité. Tu peux aussi te connecter avec My Epitech (compte Microsoft). Les notes, crédits et XP ne sont pas disponibles — Epitech ne les propose pas aux applications tierces.", "related": [{"id": "epitech/planning", "title": "Planning My Epitech"}, {"id": "epitech/profile", "title": "Profil My Epitech"}, {"id": "term-oidc", "title": "Connexion My Epitech (OpenID Connect)"}]}, {"id": "epitech/planning", "kind": "widget", "title": "Planning My Epitech", "body": "Tes prochaines activités et salles. Réglages : « calendarToken » (🔒 le jeton de ton lien de calendrier personnel dans My Epitech : c’est la partie après /calendar/ dans ce lien), « days » et « number ». Privé : impossible à partager publiquement.", "related": [{"id": "epitech", "title": "My Epitech"}, {"id": "calendar", "title": "Agenda"}, {"id": "term-secret-param", "title": "Réglage secret (🔒)"}]}, {"id": "epitech/profile", "kind": "widget", "title": "Profil My Epitech", "body": "Ton login, campus, promotion et cursus tels que My Epitech les indique. Aucun réglage : il faut d’abord connecter ton compte My Epitech (profil → comptes connectés).", "related": [{"id": "epitech", "title": "My Epitech"}, {"id": "guide-connect-accounts", "title": "Connecter GitHub ou My Epitech"}]}, {"id": "custom_api", "kind": "service", "title": "API personnalisée", "body": "Affiche des données de n’importe quelle API web publique qui répond en JSON, en donnant son adresse et le chemin vers la valeur. Pour qui connaît une API que l’appli ne couvre pas. Uniquement des API publiques : aucune connexion ne peut être envoyée.", "related": [{"id": "custom_api/json_value", "title": "Une valeur d’une API"}, {"id": "custom_api/json_list", "title": "Une liste d’une API"}, {"id": "term-json", "title": "JSON"}, {"id": "term-json-path", "title": "Chemin JSON"}, {"id": "term-api", "title": "API"}]}, {"id": "custom_api/json_value", "kind": "widget", "title": "Une valeur d’une API", "body": "Un nombre ou un texte issu d’une API. Réglages : « url » (🔒 adresse de l’API, obligatoire), « path » (où se trouve la valeur, ex. data.price, obligatoire), « label » (un nom pour la carte) et « unit » (ex. €). Si la valeur est un nombre, elle est tracée et peut déclencher une alerte.", "related": [{"id": "custom_api", "title": "API personnalisée"}, {"id": "term-json-path", "title": "Chemin JSON"}]}, {"id": "custom_api/json_list", "kind": "widget", "title": "Une liste d’une API", "body": "Une liste d’éléments issue d’une API. Réglages : « url » (🔒), « path » (où se trouve la liste), « titleField » (nom du champ affiché en titre, obligatoire), « subtitleField » (seconde ligne facultative) et « number » (8 par défaut, 30 max).", "related": [{"id": "custom_api", "title": "API personnalisée"}, {"id": "term-json-path", "title": "Chemin JSON"}]}, {"id": "term-widget", "kind": "term", "title": "Widget", "body": "Un widget est une carte de ton tableau de bord qui affiche une information (météo, taux de change, derniers articles…). Tu peux en ajouter plusieurs, les déplacer, les redimensionner et régler chacun séparément.", "related": [{"id": "guide-add-widget", "title": "Ajouter un widget"}, {"id": "term-service", "title": "Service"}]}, {"id": "term-service", "kind": "term", "title": "Service", "body": "Un service est une source d’information que l’appli sait lire (météo, GitHub, YouTube…). Chaque service propose un ou plusieurs widgets. Certains ne demandent rien, d’autres un compte ou une clé.", "related": [{"id": "term-widget", "title": "Widget"}]}, {"id": "term-refresh-rate", "kind": "term", "title": "Fréquence de rafraîchissement", "body": "Le temps entre deux mises à jour d’un widget, en secondes (minimum 10). Plus court n’est pas toujours mieux : beaucoup de sources limitent le nombre de demandes (voir « quota »), et moins d’une minute est rarement utile pour la météo ou les taux de change.", "related": [{"id": "term-quota", "title": "Quota / limite de requêtes"}, {"id": "term-cache", "title": "Cache / « dernières données connues »"}]}, {"id": "term-api", "kind": "term", "title": "API", "body": "Une API est un moyen pour des programmes de demander des données à un site sous une forme structurée (au lieu d’une page pour humains). Les services de l’appli utilisent des API : par exemple la météo interroge l’API d’Open-Meteo.", "related": [{"id": "term-api-key", "title": "Clé d’API"}, {"id": "term-json", "title": "JSON"}]}, {"id": "term-api-key", "kind": "term", "title": "Clé d’API", "body": "Un long code secret qui identifie une application auprès d’un service, comme un mot de passe pour programmes. Il est gratuit pour certains services (YouTube, via Google Cloud). Il est réglé une fois sur le serveur par la personne qui héberge l’appli — tu ne le saisis pas dans un widget. Ne le partage jamais.", "related": [{"id": "term-secret-param", "title": "Réglage secret (🔒)"}, {"id": "youtube", "title": "YouTube"}]}, {"id": "term-oauth", "kind": "term", "title": "OAuth (connecter un compte)", "body": "OAuth te permet de donner à l’appli un accès limité à ton compte sur un autre site (comme GitHub) sans jamais lui donner ton mot de passe : tu valides sur la page du site, qui remet à l’appli une clé d’accès révocable. Tu peux te déconnecter à tout moment.", "related": [{"id": "github", "title": "GitHub"}, {"id": "term-oidc", "title": "Connexion My Epitech (OpenID Connect)"}, {"id": "guide-connect-accounts", "title": "Connecter GitHub ou My Epitech"}]}, {"id": "term-oidc", "kind": "term", "title": "Connexion My Epitech (OpenID Connect)", "body": "OpenID Connect est le standard « Se connecter avec… ». Avec My Epitech, tu te connectes sur la page d’Epitech avec ton compte Microsoft ; l’appli reçoit seulement ton identité (nom, login, campus, promotion) — jamais ton mot de passe. Cela ne donne pas accès aux notes ni aux crédits.", "related": [{"id": "epitech", "title": "My Epitech"}, {"id": "term-oauth", "title": "OAuth (connecter un compte)"}]}, {"id": "term-secret-param", "kind": "term", "title": "Réglage secret (🔒)", "body": "Certains réglages sont des liens ou codes privés (l’adresse secrète d’un agenda, un jeton dans une URL). Ils sont stockés chiffrés et jamais réaffichés — le champ montre des points. Laisse-le vide en modification pour garder la valeur actuelle, ou saisis-en une nouvelle pour la remplacer.", "related": [{"id": "term-encryption", "title": "Chiffrement au repos"}, {"id": "calendar", "title": "Agenda"}]}, {"id": "term-encryption", "kind": "term", "title": "Chiffrement au repos", "body": "Les données sensibles (clés d’accès, réglages secrets, ton journal) sont brouillées avec une clé avant d’être enregistrées : une simple copie de la base est illisible. Les mots de passe, eux, sont « hachés » — transformés en empreinte impossible à inverser, même par un admin.", "related": [{"id": "guide-privacy", "title": "Ce qui est privé, ce qui sort de l’appli"}]}, {"id": "term-rss", "kind": "term", "title": "Flux RSS / Atom", "body": "Un flux est une liste lisible par machine des derniers articles d’un site, publiée par de nombreux blogs et journaux. Tu donnes à l’appli l’adresse du flux (souvent terminée par /feed, /rss ou .xml) et elle affiche les titres récents. Cherche l’icône RSS orange ou « RSS » en bas de page du site.", "related": [{"id": "rss/article_list", "title": "Liste d’articles"}]}, {"id": "term-ics", "kind": "term", "title": "Lien de calendrier iCal / .ics", "body": "iCal (.ics) est le format universel de calendrier. La plupart des agendas peuvent publier un lien privé : dans Google Agenda, ouvre les paramètres de l’agenda et copie « Adresse secrète au format iCal ». Quiconque a ce lien peut lire l’agenda : traite-le comme un mot de passe (l’appli le stocke chiffré). Les liens « webcal:// » fonctionnent aussi.", "related": [{"id": "calendar", "title": "Agenda"}, {"id": "term-secret-param", "title": "Réglage secret (🔒)"}]}, {"id": "term-json", "kind": "term", "title": "JSON", "body": "JSON est le format texte de réponse de la plupart des API : des listes imbriquées et des valeurs nommées, comme {\"price\": 12.5, \"items\": [...]}. Ouvrir l’adresse d’une API dans ton navigateur l’affiche. Le widget « API personnalisée » le lit pour toi.", "related": [{"id": "term-json-path", "title": "Chemin JSON"}, {"id": "custom_api", "title": "API personnalisée"}]}, {"id": "term-json-path", "kind": "term", "title": "Chemin JSON", "body": "Le chemin vers une valeur précise dans une réponse JSON, avec des points et des numéros. Pour {\"data\": {\"items\": [{\"price\": 5}]}}, le chemin vers 5 est data.items[0].price (les listes commencent à 0). Ouvre l’adresse de l’API dans ton navigateur et suis les noms jusqu’à la valeur voulue.", "related": [{"id": "custom_api/json_value", "title": "Une valeur d’une API"}, {"id": "term-json", "title": "JSON"}]}, {"id": "term-quota", "kind": "term", "title": "Quota / limite de requêtes", "body": "Beaucoup de services n’autorisent qu’un nombre limité de requêtes par jour ou par minute, partagé par tous les utilisateurs de l’appli. Si un widget ne se met plus à jour ou reste vide, un quota est peut-être épuisé (celui de YouTube est quotidien ; les prix crypto gratuits sont par minute). Allonge la fréquence de rafraîchissement, ça se rétablit tout seul.", "related": [{"id": "term-refresh-rate", "title": "Fréquence de rafraîchissement"}, {"id": "guide-empty-widget", "title": "Mon widget est vide ou ne se met pas à jour"}]}, {"id": "term-cache", "kind": "term", "title": "Cache / « dernières données connues »", "body": "Le serveur garde le dernier résultat réussi de chaque widget. Si la source est momentanément indisponible, la carte continue d’afficher ce dernier résultat au lieu de se vider : un horodatage ancien (« il y a 2 h ») signifie que la source échoue depuis.", "related": [{"id": "guide-empty-widget", "title": "Mon widget est vide ou ne se met pas à jour"}]}, {"id": "term-timezone", "kind": "term", "title": "Fuseau horaire (nom IANA)", "body": "Le nom officiel des règles horaires d’une région, écrit Continent/Ville : Europe/Paris, Africa/Porto-Novo, America/New_York, Asia/Tokyo. Le widget horloge mondiale accepte ces noms, ainsi que des noms de villes qu’il reconnaît.", "related": [{"id": "worldclock/world_clock", "title": "Horloge mondiale"}]}, {"id": "term-exchange-rate", "kind": "term", "title": "Taux de change : devises vs crypto", "body": "Pour les devises classiques, utilise leur code à 3 lettres (eur, usd, xof, gbp) : les taux viennent de la Banque centrale européenne, publiés une fois par jour ouvré, donc ils ne bougent pas à la minute. Pour la crypto, utilise le nom de l’actif tel qu’écrit par CoinGecko (bitcoin, ethereum) et une devise (usd, eur).", "related": [{"id": "market_data", "title": "Marchés"}]}, {"id": "term-weather-condition", "kind": "term", "title": "Conditions météo et « ressenti »", "body": "Les conditions sont regroupées : dégagé, partiellement nuageux, nuageux, brouillard, bruine, pluie, neige, orage. Le « ressenti » combine température, vent et humidité pour ce qu’on sent sur la peau. La « probabilité de pluie » est une probabilité de précipitations, pas une quantité.", "related": [{"id": "weather", "title": "Météo"}]}, {"id": "term-git", "kind": "term", "title": "Dépôt, commit, issue, étoile", "body": "Un dépôt (repo) est le dossier d’un projet sur GitHub, écrit propriétaire/nom (nestjs/nest). Un commit est une modification enregistrée avec un court message ; une issue est une tâche ou un rapport de bug ; une étoile est un « j’aime » donné à un dépôt. Les dépôts publics fonctionnent avec n’importe quel compte GitHub.", "related": [{"id": "github", "title": "GitHub"}]}, {"id": "term-youtube-ids", "kind": "term", "title": "Pseudo (@handle), ID de chaîne, ID de vidéo", "body": "Une chaîne s’identifie par son @pseudo (@Google), un ID de ch const kbFold = (x) => x.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase()

// ---------- World clock widget ----------
const HERE_TZ = 'Africa/Porto-Novo'
const WORLD = [['🇫🇷', 'Paris', 'Europe/Paris'], ['🇺🇸', 'New York', 'America/New_York'], ['🇯🇵', 'Tokyo', 'Asia/Tokyo'],
  ['🇨🇦', 'Montréal', 'America/Toronto'], ['🇦🇪', 'Dubaï', 'Asia/Dubai']]
const pad2 = (n) => String(n).padStart(2, '0')
function zoned(now, tz) {
  const p = Object.fromEntries(new Intl.DateTimeFormat('en-GB', { timeZone: tz, hour: '2-digit', minute: '2-digit', year: 'numeric', month: '2-digit', day: '2-digit', hourCycle: 'h23' })
    .formatToParts(now).map((x) => [x.type, x.value]))
  return { h: +p.hour, m: +p.minute, key: `${p.year}${p.month}${p.day}`, abs: Date.UTC(p.year, p.month - 1, p.day, p.hour, p.minute) }
}
function renderWorld() {
  const now = new Date(), me = zoned(now, HERE_TZ), t = T[lang]
  const rows = [['📍', 'Cotonou', HERE_TZ, true], ...WORLD].map(([flag, name, tz, isMe]) => {
    const c = zoned(now, tz), d = Math.round((c.abs - me.abs) / 36e5 * 2) / 2
    return { flag, name, isMe, ...c, hm: `${pad2(c.h)}:${pad2(c.m)}`, isDay: c.h >= 6 && c.h < 18,
      off: isMe ? t.here : d === 0 ? t.same : `${d > 0 ? '+' : '−'}${Math.abs(d)} h`,
      day: c.key === me.key ? '' : c.key > me.key ? t.tomorrow : t.yesterday }
  })
  const sorted = [...rows].sort((a, b) => (a.h * 60 + a.m) - (b.h * 60 + b.m))
  const pins = sorted.map((r, i) => `<div class="wl-pin ${i % 2 ? 'down' : 'up'}${r.isMe ? ' me' : ''}" style="left:${Math.min(94, Math.max(6, ((r.h * 60 + r.m) / 1440) * 100))}%">
    <div class="lbl">${r.flag} ${r.name}<br /><b>${r.hm}</b> ${r.isDay ? '☀️' : '🌙'}<small style="display:block;color:rgb(255 255 255 / .55);font-size:10px">${r.off}${r.day ? ' · ' + r.day : ''}</small></div><div class="stem"></div><div class="dot"></div></div>`).join('')
  $$('[data-world-line]').forEach((el) => { el.querySelectorAll('.wl-pin').forEach((p) => p.remove()); el.insertAdjacentHTML('beforeend', pins) })
}

  $$('[data-slot="secs"]').forEach((el) => (el.textContent = String(sec).padStart(2, '0')))
  $$('.dial').forEach((d) => d.classList.toggle('wrap', sec === 0))
  $$('[data-slot="prog"]').forEach((el) => (el.style.strokeDashoffset = 565.49 * (1 - sec / 60)))
  $$('[data-slot="sat"]').forEach((el) => (el.style.transform = `rotate(${sec * 6}deg)`))
  $$('[data-slot="moon"]').forEach((el) => { el.style.transition = sec === 0 ? 'none' : ''; el.style.transform = `rotate(${sec * 6}deg)` })
}
setInterval(tick, 1000)

// ---------- Edit mode: long press → jiggle; drag to reorder ----------
let pressTimer = null, pressStart = null, dragged = null, editingCard = null
const setEditing = (on) => {
  document.body.classList.toggle('editing', on)
  $$('.w:not(.add)').forEach((w) => (w.draggable = on))
}
document.addEventListener('pointerdown', (e) => {
  const w = e.target.closest('.w:not(.add)')
  if (!w || document.body.classList.contains('editing') || e.target.closest('.badge, .resize')) return
  pressStart = { x: e.clientX, y: e.clientY }
  w.classList.add('pressing')
  pressTimer = setTimeout(() => { w.classList.remove('pressing'); setEditing(true); navigator.vibrate?.(30) }, 550)
})
const cancelPress = () => { clearTimeout(pressTimer); pressStart = null; $$('.pressing').forEach((w) => w.classList.remove('pressing')) }
document.addEventListener('pointerup', cancelPress)
document.addEventListener('pointercancel', cancelPress)
document.addEventListener('pointermove', (e) => { if (pressStart && Math.hypot(e.clientX - pressStart.x, e.clientY - pressStart.y) > 8) cancelPress() })

document.addEventListener('dragstart', (e) => { dragged = e.target.closest('.w'); dragged?.classList.add('dragging') })
document.addEventListener('dragend', () => { dragged?.classList.remove('dragging'); dragged = null })
document.addEventListener('dragover', (e) => {
  const over = e.target.closest('.w')
  if (!dragged || !over || over === dragged || over.parentNode !== dragged.parentNode) return
  e.preventDefault()
  if (over.classList.contains('add')) { over.before(dragged); return }
  const items = [...over.parentNode.children]
  items.indexOf(dragged) < items.indexOf(over) ? over.after(dragged) : over.before(dragged)
})

// Resize: drag the ↘ handle, the card snaps to whole grid cells
let rs = null
document.addEventListener('pointerdown', (e) => {
  const h = e.target.closest('.resize'); if (!h) return
  e.preventDefault(); e.stopPropagation()
  const w = h.closest('.w'), cs = getComputedStyle(w.parentNode), cols = cs.gridTemplateColumns.split(' ')
  rs = { w, x: e.clientX, y: e.clientY, rect: w.getBoundingClientRect(), cols: cols.length, colW: parseFloat(cols[0]),
    gap: parseFloat(cs.columnGap), rowH: parseFloat(cs.gridAutoRows), rgap: parseFloat(cs.rowGap) }
  w.draggable = false; w.classList.add('resizing'); h.setPointerCapture(e.pointerId)
}, true)
document.addEventListener('pointermove', (e) => {
  if (!rs) return
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v))
  const c = clamp(Math.round((rs.rect.width + e.clientX - rs.x + rs.gap) / (rs.colW + rs.gap)), rs.w.dataset.kind === 'world' ? 2 : 1, rs.cols)
  const r = clamp(Math.round((rs.rect.height + e.clientY - rs.y + rs.rgap) / (rs.rowH + rs.rgap)), 2, 5)
  rs.w.style.gridColumn = `span ${c}`; rs.w.style.gridRow = `span ${r}`
})
document.addEventListener('pointerup', () => { if (!rs) return; rs.w.classList.remove('resizing'); rs.w.draggable = true; rs = null })

// ---------- Clicks ----------
const closeModals = () => $$('.modal-bg').forEach((m) => m.classList.remove('open'))
const visibleWidgets = () => document.querySelector('.widgets')
document.addEventListener('click', (e) => {
  const menu = e.target.closest('.pill-menu')
  $$('.pill-menu').forEach((m) => m !== menu && m.classList.remove('open'))
  if (menu && e.target.closest('.pill-menu > button')) menu.classList.toggle('open')

  const l = e.target.closest('[data-lang]'); if (l) { lang = l.dataset.lang; render(); menu?.classList.remove('open') }
  const th = e.target.closest('[data-theme-set]'); if (th) { document.body.dataset.theme = th.dataset.themeSet; fadeTheme(); markTheme(); menu?.classList.remove('open') }
  const sk = e.target.closest('[data-wskin-set]'); if (sk) { document.body.dataset.wskin = sk.dataset.wskinSet; menu?.classList.remove('open') }


  if (e.target.closest('[data-open-avatar]')) { $$('.pill-menu').forEach((m) => m.classList.remove('open')); closeModals(); draft = { ...av }; draftPhoto = photo; draftGender = gender; renderAvatarEditor(); document.getElementById('avatarModal').classList.add('open') }
  if (e.target.closest('[data-open-add]')) openDrawer()
  const open = (id) => { e.preventDefault(); $$('.pill-menu').forEach((m) => m.classList.remove('open')); closeModals(); document.getElementById(id).classList.add('open') }
  if (e.target.closest('[data-open-help]')) { open('helpModal'); hcReset() }
  if (e.target.closest('[data-open-logout]')) open('logoutModal')
  if (e.target.closest('[data-open-profile]')) open('profileModal')
  if (e.target.closest('[data-open-journal]')) {
    open('journalModal'); renderJournal(); openBook()
  }
  if (e.target.closest('[data-close]')) closeModals()
  if (e.target.id === 'doLogout') location.href = '/login'
  if (e.target.classList.contains('modal-bg')) closeModals()
  if (document.body.classList.contains('editing') && !e.target.closest('.w, .modal-bg')) setEditing(false)

  const del = e.target.closest('.badge.del')
  if (del) removeWithUndo(del.closest('.w'))
  const ed = e.target.closest('.badge.edit')
  if (ed) {
    editingCard = ed.closest('.w')
    document.getElementById('fTitle').value = editingCard.querySelector('.w-title').textContent
    decoChoice = editingCard.dataset.deco || 'none'; renderDecoPick()
    document.getElementById('editModal').classList.add('open')
  }
})
document.getElementById('sideToggle').onclick = () => document.querySelector('.A').classList.toggle('collapsed')
document.getElementById('saveWidget').onclick = () => {
  if (editingCard) { editingCard.querySelector('.w-title').textContent = document.getElementById('fTitle').value; setDeco(editingCard, decoChoice) }
  closeModals()
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { closeModals(); setEditing(false) }
})
document.addEventListener('input', (e) => {
  if (e.target.matches('[data-bio]')) { bio = e.target.value.trim(); $$('[data-slot="bioCount"]').forEach((el) => (el.textContent = e.target.value.length));
    $$('[data-slot="bio"]').forEach((el) => (el.textContent = bio || T[lang].bio)) }
})
document.addEventListener('change', (e) => {
  if (e.target.matches('[data-lang-select]')) { lang = e.target.value; render() }
  if (e.target.matches('[data-theme-select]')) { document.body.dataset.theme = e.target.value; fadeTheme(); markTheme() }
})

render()
setDeco(document.querySelector('.widgets [data-kind="weather"]'), 'clouds')
setDeco(document.querySelector('.widgets [data-kind="rss"]'), 'flowers')
setDeco(document.querySelector('.widgets [data-kind="price"]'), 'stars')
setDeco(document.querySelector('.widgets [data-kind="gh"]'), 'lights')
</script>
</body>
