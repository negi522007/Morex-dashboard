<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Morex mockups</title>
<link rel="icon" type="image/svg+xml" href="/logo.svg" />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Caveat:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<style>
  /* ---------- Themes (colour palettes, independent of light/dark) ---------- */
  :root, [data-theme="galaxy"] {
    --bg: linear-gradient(rgb(2 6 23 / .45), rgb(2 6 23 / .7)), url(/accueil_photo.jpg) 50% 28%/cover;
    --a1: #818cf8; --a2: #38bdf8; --glow: 99 102 241; --img: url(/accueil_photo.jpg);
  }
  [data-theme="aurora"] {
    --bg: linear-gradient(rgb(2 6 23 / .45), rgb(2 6 23 / .7)), url(/aurore_boreale.jpeg) 50% 30%/cover;
    --a1: #2dd4bf; --a2: #a78bfa; --glow: 45 212 191; --img: url(/aurore_boreale.jpeg);
  }
  [data-theme="moon"] {
    --bg: linear-gradient(rgb(2 6 23 / .45), rgb(2 6 23 / .7)), url(/cheval.jpeg) 50% 28%/cover;
    --a1: #60a5fa; --a2: #e2e8f0; --glow: 59 130 246; --img: url(/cheval.jpeg);
  }
  [data-theme="dolphins"] {
    --bg: linear-gradient(rgb(2 6 23 / .45), rgb(2 6 23 / .7)), url(/dauphins_theme.jpeg) 50% 58%/cover;
    --a1: #fb7185; --a2: #fb923c; --glow: 251 113 133; --img: url(/dauphins_theme.jpeg);
  }
  [data-theme="forest"] {
    --bg: linear-gradient(rgb(2 6 23 / .45), rgb(2 6 23 / .7)), url(/foret_theme.jpeg) 50% 42%/cover;
    --a1: #4ade80; --a2: #2dd4bf; --glow: 16 185 129; --img: url(/foret_theme.jpeg);
  }
  [data-theme="mystic"] {
    --bg: linear-gradient(rgb(2 6 23 / .45), rgb(2 6 23 / .7)), url(/mystical_theme.jpeg) 50% 42%/cover;
    --a1: #f43f5e; --a2: #fda4af; --glow: 244 63 94; --img: url(/mystical_theme.jpeg);
  }
  [data-theme="ocean"] {
    --bg: linear-gradient(rgb(2 6 23 / .45), rgb(2 6 23 / .7)), url(/ocean_theme.jpeg) 50% 32%/cover;
    --a1: #22d3ee; --a2: #3b82f6; --glow: 34 211 238; --img: url(/ocean_theme.jpeg);
  }
  [data-theme="beach"] {
    --bg: linear-gradient(rgb(2 6 23 / .45), rgb(2 6 23 / .7)), url(/plage_theme.jpeg) 50% 62%/cover;
    --a1: #fb923c; --a2: #f472b6; --glow: 249 115 22; --img: url(/plage_theme.jpeg);
  }
  [data-theme="desertNight"] {
    --bg: linear-gradient(rgb(2 6 23 / .45), rgb(2 6 23 / .7)), url(/sahara_night.jpeg) 50% 68%/cover;
    --a1: #fcd34d; --a2: #d6b370; --glow: 234 179 8; --img: url(/sahara_night.jpeg);
  }
  [data-theme="desertMoon"] {
    --bg: linear-gradient(rgb(2 6 23 / .45), rgb(2 6 23 / .7)), url(/sahara_theme.jpeg) 50% 10%/cover;
    --a1: #c084fc; --a2: #f0abfc; --glow: 168 85 247; --img: url(/sahara_theme.jpeg);
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; min-height: 100vh; font-family: Poppins, system-ui, sans-serif; color: #fff; background: #020617; }
  /* Full-page theme background with a slow drift / zoom, and a fade when the theme changes */
  body::before { content: ""; position: fixed; inset: -6%; z-index: -1; pointer-events: none; background: var(--bg);
    animation: bgDrift 45s ease-in-out infinite alternate; }
  body.theme-in::before { animation: bgDrift 45s ease-in-out infinite alternate, bgFade .9s ease-out; }
  @keyframes bgDrift { from { transform: scale(1) translate3d(0, 0, 0); } to { transform: scale(1.12) translate3d(-2%, -1.5%, 0); } }
  @keyframes bgFade { from { opacity: 0; filter: blur(12px); } to { opacity: 1; filter: none; } }
  button, input, select { font: inherit; color: inherit; }
  .glass { background: rgb(255 255 255 / .08); border: 1px solid rgb(255 255 255 / .14);
    backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); border-radius: 24px; }
  .grad { background: linear-gradient(90deg, #fff, var(--a1) 60%, var(--a2)); -webkit-background-clip: text;
    background-clip: text; color: transparent; }
  .muted { color: rgb(255 255 255 / .65); }
  svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* ---------- Shared pieces ---------- */
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 22px; }
  .brand img { height: 36px; }
  .search { position: relative; flex: 1; max-width: 520px; }
  .search input { width: 100%; height: 50px; padding: 0 22px 0 58px; border-radius: 999px; outline: none; transition: .25s;
    background: linear-gradient(180deg, rgb(255 255 255 / .12), rgb(255 255 255 / .05)); border: 1px solid rgb(255 255 255 / .18);
    box-shadow: inset 0 1px 0 rgb(255 255 255 / .15), 0 10px 30px -12px rgb(var(--glow) / .5); backdrop-filter: blur(20px); }
  .search input:hover { border-color: rgb(255 255 255 / .3); }
  .search input:focus { border-color: rgb(255 255 255 / .5); box-shadow: inset 0 1px 0 rgb(255 255 255 / .2), 0 0 0 4px rgb(var(--glow) / .25), 0 14px 40px -10px rgb(var(--glow) / .7); }
  .search input::placeholder { color: rgb(255 255 255 / .55); }
  .search .lens { position: absolute; z-index: 1; left: 6px; top: 50%; transform: translateY(-50%); width: 36px; height: 36px; border-radius: 50%;
    display: grid; place-items: center; pointer-events: none; color: #fff;
    background: linear-gradient(135deg, var(--a1), var(--a2)); box-shadow: 0 4px 14px rgb(var(--glow) / .6); }
  .search .lens svg { width: 18px; height: 18px; }
  .results { position: absolute; top: calc(100% + 8px); left: 0; right: 0; padding: 8px; display: none; z-index: 20; background: rgb(15 23 42 / .92); }
  .search:focus-within .results { display: block; }
  .results h6 { margin: 8px 12px 4px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: rgb(255 255 255 / .5); font-weight: 500; }
  .results a { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border-radius: 12px; color: #fff; text-decoration: none; font-size: 14px; }
  .results a:hover { background: rgb(255 255 255 / .08); }
  .results a span { font-size: 12px; color: rgb(255 255 255 / .5); }

  .pill-menu { position: relative; }
  .pill-menu > button { height: 44px; padding: 0 14px; border-radius: 14px; display: flex; align-items: center; gap: 8px; cursor: pointer;
    background: rgb(255 255 255 / .08); border: 1px solid rgb(255 255 255 / .14); white-space: nowrap; }
  .menu { position: absolute; right: 0; top: calc(100% + 8px); padding: 8px; min-width: 200px; display: none; z-index: 30; background: rgb(15 23 42 / .92); }
  .pill-menu.open .menu { display: block; }
  .menu button { width: 100%; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 0; background: transparent;
    border-radius: 12px; cursor: pointer; text-align: left; font-size: 14px; }
  .menu button:hover { background: rgb(255 255 255 / .1); }
  .menu.theme-grid { width: 380px; grid-template-columns: 1fr 1fr; gap: 8px; }
  .pill-menu.open .menu.theme-grid { display: grid; }
  .theme-grid button { flex-direction: column; align-items: stretch; gap: 6px; padding: 6px; font-size: 13px; }
  .theme-grid .thumb { height: 64px; border-radius: 10px; background-size: cover; background-position: center; border: 2px solid transparent; }
  .theme-grid button.on .thumb { border-color: #fff; box-shadow: 0 0 14px rgb(var(--glow) / .7); }
  .swatch { width: 18px; height: 18px; border-radius: 50%; flex: none; }

  .avatar { width: 44px; height: 44px; border-radius: 50%; cursor: pointer; overflow: hidden; flex: none; background: rgb(255 255 255 / .1);
    box-shadow: 0 0 0 2px rgb(255 255 255 / .3), 0 0 20px rgb(var(--glow) / .5); }
  .avatar img { width: 100%; height: 100%; display: block; object-fit: cover; }

  .clock { font-weight: 600; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
  .date::first-letter { text-transform: uppercase; }
  .hello { font-weight: 600; letter-spacing: -.02em; margin: 0; }
  .bio { line-height: 1.7; margin: 0; }
  .edit-link { display: inline-flex; gap: 6px; align-items: center; font-size: 14px; color: var(--a2); cursor: pointer; background: none; border: 0; padding: 0; }
  .hint { font-size: 13px; color: rgb(255 255 255 / .5); display: flex; align-items: center; gap: 8px; }

  /* ---------- Widgets ---------- */
  .widgets { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); grid-auto-rows: 128px; grid-auto-flow: dense; gap: 24px; }
  .w { grid-row: span 2; overflow: visible; min-height: 0; position: relative; padding: 22px; display: flex; flex-direction: column; gap: 14px; transition: transform .25s, box-shadow .25s, opacity .25s;
    user-select: none; -webkit-user-select: none; touch-action: manipulation; }
  body:not(.editing) .w:hover { transform: translateY(-4px); box-shadow: 0 20px 40px -12px rgb(var(--glow) / .35); }
  .w.pressing { transform: scale(.97); }
  .w-head { display: flex; align-items: center; gap: 12px; }
  .w-ico { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; flex: none;
    background: linear-gradient(135deg, rgb(var(--glow) / .5), rgb(255 255 255 / .06)); }
  .w-title { font-weight: 600; font-size: 15px; }
  .w-sub { font-size: 12px; color: rgb(255 255 255 / .55); }
  .w-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; font-size: 14px; }
  .w-list li { display: flex; gap: 10px; align-items: baseline; }
  .w-list li::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--a2); flex: none; transform: translateY(-2px); }
  .w-list small { color: rgb(255 255 255 / .5); margin-left: auto; white-space: nowrap; font-size: 12px; }
  .big-num { font-size: 40px; font-weight: 600; letter-spacing: -.02em; }
  .delta { font-size: 13px; padding: 3px 10px; border-radius: 999px; background: rgb(52 211 153 / .15); color: #6ee7b7; }
  .w-foot { margin-top: auto; font-size: 12px; color: rgb(255 255 255 / .45); display: flex; justify-content: space-between; }
  .add { border-style: dashed; align-items: center; justify-content: center; text-align: center; min-height: 220px; cursor: pointer; color: rgb(255 255 255 / .7); }
  .add .plus { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; font-size: 30px; font-weight: 300;
    background: rgb(255 255 255 / .08); border: 1px solid rgb(255 255 255 / .2); }
  .spark { width: 100%; flex: 1; min-height: 50px; }
  .w-list { overflow: hidden; }

  /* World clock widget: list when small, 24 h timeline once it's wide enough */
  .w[data-kind="world"] { grid-column: span 2; grid-row: span 2; }
  .wl-line { position: relative; flex: 1; min-height: 170px; }
  .wl-line .bar { position: absolute; left: 0; right: 0; top: 50%; height: 12px; transform: translateY(-50%); border-radius: 999px;
    background: linear-gradient(90deg, #0b1026 0%, #1e1b4b 20%, #f9a8d4 26%, #fcd34d 32%, #38bdf8 45%, #7dd3fc 60%, #fb7185 74%, #7c3aed 80%, #1e1b4b 88%, #0b1026 100%); }
  .wl-line .hrs { position: absolute; left: 0; right: 0; top: calc(50% + 10px); display: flex; justify-content: space-between; font-size: 10px; color: rgb(255 255 255 / .45); }
  .wl-pin { position: absolute; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; white-space: nowrap; }
  .wl-pin.up { bottom: calc(50% + 8px); } .wl-pin.down { top: calc(50% + 8px); flex-direction: column-reverse; }
  .wl-pin .lbl { padding: 4px 9px; border-radius: 10px; background: rgb(15 23 42 / .85); border: 1px solid rgb(255 255 255 / .15); font-size: 11px; text-align: center; }
  .wl-pin .lbl b { font-size: 14px; font-variant-numeric: tabular-nums; }
  .wl-pin .stem { width: 2px; height: 12px; background: rgb(255 255 255 / .6); }
  .wl-pin .dot { width: 10px; height: 10px; border-radius: 50%; background: #fff; box-shadow: 0 0 10px #fff; }
  .wl-pin.me .dot { background: var(--a2); box-shadow: 0 0 12px var(--a2); }

  /* News: magazine */
  .mag-hero { height: 70px; flex: none; border-radius: 16px; position: relative; overflow: hidden; background: linear-gradient(135deg, #1e1b4b, var(--a1) 60%, var(--a2)); }
  .mag-hero::after { content: "🪐"; position: absolute; right: 14px; top: 12px; font-size: 42px; }
  .mag-hero span { position: absolute; left: 12px; bottom: 10px; font-size: 11px; padding: 3px 9px; border-radius: 999px; background: rgb(0 0 0 / .4); }
  .mag-title { margin: 0; font-size: 15px; line-height: 1.3; }
  .mag-list { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: rgb(255 255 255 / .72); }
  .mag-list li { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mag-list li::before { content: "• "; color: var(--a2); }
  /* Exchange rate: trend */
  .fx-row { display: flex; align-items: center; gap: 10px; }
  .fx-spark { width: 100%; flex: 1; min-height: 50px; }
  .fx-mm { display: flex; justify-content: space-between; font-size: 12px; color: rgb(255 255 255 / .55); }
  /* Price history: spinning coin */
  .bt-row { display: flex; align-items: center; gap: 14px; }
  .coin { width: 54px; height: 54px; flex: none; border-radius: 50%; display: grid; place-items: center; font-size: 28px; font-weight: 800; color: #7c2d12;
    background: radial-gradient(circle at 35% 30%, #fde68a, #f59e0b 70%); box-shadow: 0 0 24px rgb(245 158 11 / .6); animation: coinSpin 4s linear infinite; }
  @keyframes coinSpin { to { transform: rotateY(360deg); } }
  .bt-price { white-space: nowrap; font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .bt-chart { width: 100%; flex: 1; min-height: 60px; }
  /* GitHub: terminal */
  body .w.term-card { background: rgb(2 6 23 / .82); font-family: 'JetBrains Mono', ui-monospace, monospace; }
  .term-bar { display: flex; gap: 6px; align-items: center; } .term-bar i { width: 11px; height: 11px; border-radius: 50%; }
  .term-bar span { margin-left: 8px; font-size: 12px; color: rgb(255 255 255 / .45); }
  .term { margin: 0; white-space: pre-wrap; font: 12.5px/1.7 'JetBrains Mono', ui-monospace, monospace; color: #cbd5e1; }
  .term .p { color: #4ade80; } .term .h { color: #fbbf24; }
  .term .cur { display: inline-block; width: 8px; height: 15px; background: #cbd5e1; vertical-align: -2px; animation: termBlink 1s steps(1) infinite; }
  @keyframes termBlink { 50% { opacity: 0; } }

  /* Weather widget: now + next 5 days with a min/max bar on a shared scale */
  .wx-main { display: flex; align-items: center; gap: 14px; }
  .wx-ico { font-size: 50px; line-height: 1; filter: drop-shadow(0 0 16px rgb(253 224 71 / .6)); }
  .wx-t { font-size: 44px; font-weight: 600; line-height: 1; }
  .wx-days { display: flex; flex-direction: column; gap: 7px; margin-top: auto; font-size: 13px; }
  .wx-day { display: grid; grid-template-columns: 40px 22px 28px 1fr 28px; align-items: center; gap: 8px; }
  .wx-day .lo { color: rgb(255 255 255 / .55); }
  .wx-range { height: 6px; border-radius: 999px; background: rgb(255 255 255 / .1); position: relative; }
  .wx-range i { position: absolute; top: 0; bottom: 0; border-radius: inherit; background: linear-gradient(90deg, #38bdf8, #fde047, #fb923c); }
  .w[data-kind="weather"] { grid-row: span 2; }

  /* Widget decorations: stickers that sit on the card's edges */
  .deco { position: absolute; inset: 0; pointer-events: none; z-index: 1; }
  .deco i { font-style: normal; position: absolute; line-height: 1; }
  .dc-flowers i { font-size: 30px; animation: sway 3s ease-in-out infinite alternate; transform-origin: bottom center; }
  .dc-flowers i:nth-child(1) { left: -14px; top: -18px; } .dc-flowers i:nth-child(2) { left: 12px; top: -22px; font-size: 24px; animation-delay: -1s; }
  .dc-flowers i:nth-child(3) { left: -18px; top: 14px; font-size: 22px; animation-delay: -2s; }
  @keyframes sway { from { transform: rotate(-8deg); } to { transform: rotate(8deg); } }
  .dc-balloons svg { position: absolute; left: -14px; top: -86px; width: 74px; animation: bob 3.2s ease-in-out infinite alternate; }
  @keyframes bob { from { transform: translateY(0) rotate(-2deg); } to { transform: translateY(-8px) rotate(3deg); } }
  .dc-stars i { font-size: 20px; animation: twinkle 1.8s ease-in-out infinite; }
  .dc-stars i:nth-child(1) { left: -8px; top: -10px; } .dc-stars i:nth-child(2) { right: 18px; top: -12px; font-size: 14px; animation-delay: -.6s; }
  .dc-stars i:nth-child(3) { right: -8px; bottom: 20px; animation-delay: -1.2s; } .dc-stars i:nth-child(4) { left: 30%; bottom: -10px; font-size: 13px; animation-delay: -.3s; }
  @keyframes twinkle { 0%, 100% { opacity: .35; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.15); } }
  .dc-butterflies i { font-size: 26px; animation: flutter .35s ease-in-out infinite alternate, drift 5s ease-in-out infinite alternate; }
  .dc-butterflies i:nth-child(1) { right: -12px; top: -16px; } .dc-butterflies i:nth-child(2) { right: 34px; top: -26px; font-size: 18px; animation-delay: -.2s, -2s; }
  @keyframes flutter { from { scale: 1 1; } to { scale: .55 1; } }
  @keyframes drift { from { translate: 0 0; } to { translate: -10px -6px; } }
  .dc-hearts i { font-size: 20px; right: 14px; bottom: 10px; opacity: 0; animation: floatUp 3.6s ease-in infinite; }
  .dc-hearts i:nth-child(2) { right: 34px; font-size: 15px; animation-delay: -1.2s; } .dc-hearts i:nth-child(3) { right: 4px; font-size: 17px; animation-delay: -2.4s; }
  @keyframes floatUp { 0% { opacity: 0; transform: translateY(0) scale(.6); } 20% { opacity: 1; } 100% { opacity: 0; transform: translateY(-90px) scale(1.1); } }
  .dc-lights { position: absolute; left: 18px; right: 18px; top: -7px; height: 22px; display: flex; justify-content: space-between; align-items: flex-start;
    border-top: 2px solid rgb(255 255 255 / .3); border-radius: 0 0 50% 50% / 0 0 14px 14px; }
  .dc-lights b { width: 9px; height: 13px; border-radius: 50% 50% 45% 45%; margin-top: 3px; animation: blinkL 1.6s ease-in-out infinite; }
  .dc-lights b:nth-child(4n+1) { background: #fde047; box-shadow: 0 0 10px #fde047; } .dc-lights b:nth-child(4n+2) { background: #f472b6; box-shadow: 0 0 10px #f472b6; animation-delay: -.4s; }
  .dc-lights b:nth-child(4n+3) { background: #38bdf8; box-shadow: 0 0 10px #38bdf8; animation-delay: -.8s; } .dc-lights b:nth-child(4n) { background: #4ade80; box-shadow: 0 0 10px #4ade80; animation-delay: -1.2s; }
  .dc-lights b:nth-child(even) { margin-top: 8px; }
  @keyframes blinkL { 50% { opacity: .35; box-shadow: none; } }
  .dc-clouds i { font-size: 28px; top: -18px; animation: cloud 9s ease-in-out infinite alternate; }
  .dc-clouds i:nth-child(1) { left: 10%; } .dc-clouds i:nth-child(2) { left: 60%; font-size: 20px; top: -12px; animation-delay: -4s; }
  @keyframes cloud { from { translate: -12px 0; } to { translate: 14px 0; } }
  .dc-crown i { font-size: 34px; left: -16px; top: -22px; transform: rotate(-22deg); filter: drop-shadow(0 0 8px rgb(253 224 71 / .6)); }
  .dc-bow i { font-size: 34px; left: 50%; top: -20px; transform: translateX(-50%); }
  .dc-cat i { font-size: 34px; right: 18px; top: -30px; animation: peek 4s ease-in-out infinite; }
  @keyframes peek { 0%, 70%, 100% { transform: translateY(0); } 80% { transform: translateY(-6px) rotate(-6deg); } }
  .deco-pick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 8px; }
  .deco-pick button { padding: 10px 4px; border-radius: 14px; background: rgb(255 255 255 / .06); border: 2px solid transparent; cursor: pointer; font-size: 12px;
    display: flex; flex-direction: column; align-items: center; gap: 4px; color: rgb(255 255 255 / .8); }
  .deco-pick button span { font-size: 24px; }
  .deco-pick button:hover { background: rgb(255 255 255 / .12); }
  .deco-pick button.on { border-color: #fff; background: rgb(255 255 255 / .12); }

  /* Edit mode: long-press → widgets jiggle, badges appear, drag to reorder */
  .badge { position: absolute; top: -11px; width: 30px; height: 30px; border-radius: 50%; display: none; place-items: center; cursor: pointer;
    border: 0; font-size: 20px; font-weight: 600; line-height: 1; z-index: 2; box-shadow: 0 4px 12px rgb(0 0 0 / .4); }
  .badge.del { left: -11px; background: #ef4444; color: #fff; }
  .badge.edit { right: -11px; background: #fff; color: #111; font-size: 15px; }
  .editing .w:not(.add) .badge { display: grid; animation: pop .25s ease-out; }
  .editing .w:not(.add) { animation: jiggle .26s ease-in-out infinite alternate; cursor: grab; }
  .editing .w:not(.add):nth-child(2n) { animation-duration: .3s; animation-delay: -.13s; }
  .editing .w:not(.add):nth-child(3n) { animation-duration: .24s; animation-delay: -.07s; }
  .resize { position: absolute; right: -11px; bottom: -11px; width: 30px; height: 30px; border-radius: 50%; display: none; place-items: center;
    border: 0; background: #fff; color: #111; cursor: nwse-resize; z-index: 2; box-shadow: 0 4px 12px rgb(0 0 0 / .4); touch-action: none; }
  .resize svg { width: 16px; height: 16px; }
  .editing .w:not(.add) .resize { display: grid; animation: pop .25s ease-out; }
  .w.resizing { animation: none !important; outline: 2px dashed rgb(255 255 255 / .6); outline-offset: 4px; }

    background: linear-gradient(180deg, rgb(255 255 255 / .12), rgb(255 255 255 / .05)); border: 1px solid rgb(255 255 255 / .18); }

  /* Journal card: a closed book on the dashboard, as big as the clock */
  .journal-card { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 26px; cursor: pointer; perspective: 900px; }
  .mini-title { margin: 0; font: 700 34px/1 Caveat, cursive; }
  .mini-book { position: relative; width: 240px; height: 160px; perspective: 1000px; margin: 10px 0 4px; }
  .mini-book::before { content: ""; position: absolute; inset: -9px -10px; border-radius: 12px; background: linear-gradient(145deg, var(--a1), var(--a2));
    box-shadow: 0 16px 34px -10px rgb(0 0 0 / .7), 0 0 40px rgb(var(--glow) / .4); }
  .mini-book .pg, .mini-book .face { background-color: #fbf5e9; background-image: repeating-linear-gradient(transparent 0 15px, #e3daf1 15px 16px); background-position: 0 30px; }
  .mini-book .pg { position: absolute; top: 0; bottom: 0; width: 50%; }
  .mini-book .l { left: 0; border-radius: 6px 0 0 6px; box-shadow: inset -16px 0 18px -14px rgb(0 0 0 / .4); }
  .mini-book .r { right: 0; border-radius: 0 6px 6px 0; box-shadow: inset 16px 0 18px -14px rgb(0 0 0 / .4); }
  .mini-book .ink { position: absolute; left: 12px; top: 10px; font: 600 15px/16px Caveat, cursive; color: #5b4ea0; }
  .mini-book .leaf { position: absolute; left: 50%; top: 0; bottom: 0; width: 50%; transform-origin: left center; transform-style: preserve-3d;
    animation: leafTurn 3.6s cubic-bezier(.45, .05, .3, 1) infinite; }
  .mini-book .leaf:nth-of-type(4) { animation-delay: -1.2s; }
  .mini-book .leaf:nth-of-type(5) { animation-delay: -2.4s; }
  .mini-book .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 0 6px 6px 0; }
  .mini-book .face.front { background-image: linear-gradient(90deg, rgb(0 0 0 / .16), transparent 20%), repeating-linear-gradient(transparent 0 15px, #e3daf1 15px 16px); }
  .mini-book .face.back { transform: rotateY(180deg); border-radius: 6px 0 0 6px;
    background-image: linear-gradient(-90deg, rgb(0 0 0 / .16), transparent 20%), repeating-linear-gradient(transparent 0 15px, #e3daf1 15px 16px); }
  /* Each leaf turns, then vanishes on the left and quietly comes back on the right (it looks like the page beneath) */
  @keyframes leafTurn {
    0% { transform: rotateY(0); opacity: 1; }
    33% { transform: rotateY(-180deg); opacity: 1; }
    34% { transform: rotateY(-180deg); opacity: 0; }
    35%, 100% { transform: rotateY(0); opacity: 0; }
  }

  /* Journal: an open book whose pages turn on their own */
  .modal.journal-modal { position: relative; max-width: 1000px; padding: 0; background: none; border: 0; backdrop-filter: none; overflow: visible; }
  .book { position: relative; display: grid; grid-template-columns: 1fr 1fr; min-height: 560px; border-radius: 18px; padding: 14px; perspective: 2400px;
    background: linear-gradient(135deg, var(--a1), var(--a2)); box-shadow: 0 30px 80px -20px rgb(0 0 0 / .8), 0 0 60px rgb(var(--glow) / .35); }
  .page { position: relative; background: #fbf5e9; color: #3b3450; padding: 34px 36px; overflow: hidden; }
  .page.left { border-radius: 10px 0 0 10px; box-shadow: inset -30px 0 40px -30px rgb(0 0 0 / .35); }
  .page.right { border-radius: 0 10px 10px 0; box-shadow: inset 30px 0 40px -30px rgb(0 0 0 / .35); }
  .book .page > * { transition: opacity .35s; }
  .book.opening .page > * { opacity: 0; }
  .book::after { content: ""; position: absolute; top: 14px; bottom: 14px; left: 50%; width: 2px; background: rgb(0 0 0 / .15); }
  /* A flipping leaf sits on the right half and turns around the spine (or the reverse for going back) */
  .flip { position: absolute; top: 14px; bottom: 14px; left: 50%; width: calc(50% - 14px); transform-style: preserve-3d; transform-origin: left center;
    pointer-events: none; animation: flipFwd .75s cubic-bezier(.45, .05, .3, 1) both; }
  .flip.rev { left: 14px; transform-origin: right center; animation-name: flipBack; }
  @keyframes flipFwd { 0% { transform: rotateY(0); z-index: var(--z0, 6); } 50% { z-index: var(--z1, 6); } 100% { transform: rotateY(-180deg); z-index: var(--z1, 6); } }
  @keyframes flipBack { 0% { transform: rotateY(0); z-index: 6; } 100% { transform: rotateY(180deg); z-index: 6; } }
  .flip .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; background-color: #fbf5e9;
    background-image: linear-gradient(90deg, rgb(0 0 0 / .18), transparent 12%), repeating-linear-gradient(transparent 0 33px, #e3daf1 33px 34px);
    background-position: 0 0, 0 150px; border-radius: 0 10px 10px 0; }
  .flip .face.back { transform: rotateY(180deg); border-radius: 10px 0 0 10px;
    background-image: linear-gradient(-90deg, rgb(0 0 0 / .18), transparent 12%), repeating-linear-gradient(transparent 0 33px, #e3daf1 33px 34px); }
  .flip.rev .face { border-radius: 10px 0 0 10px; } .flip.rev .face.back { border-radius: 0 10px 10px 0; }

const NICE = {

  facialHair: ['none', 'none', 'beardLight', 'beardMedium', 'moustacheFancy'],
}
const optionValues = (k) => {
  if (k === 'top' && draftGender !== 'all') return HAIR[draftGender]
  return AV_OPTIONS[k].values
}
const visibleTabs = () => Object.keys(AV_OPTIONS).filter((k) => !(k === 'facialHair' && draftGender === 'girl'))

function avUrl(o) {
  const q = new URLSearchParams({ seed: 'morex' })
  for (const k of ['skinColor', 'hairColor', 'eyes', 'eyebrows', 'mouth', 'clothing', 'clothesColor', 'backgroundColor']) q.set(k, o[k])
  if (o.top === 'none') q.set('topProbability', '0'); else { q.set('top', o.top); q.set('topProbability', '100') }
  if (o.accessories === 'none') q.set('accessoriesProbability', '0'); else { q.set('accessories', o.accessories); q.set('accessoriesProbability', '100') }
  if (o.facialHair === 'none') q.set('facialHairProbability', '0'); else { q.set('facialHair', o.facialHair); q.set('facialHairProbability', '100') }
  return `${AV_URL}?${q}`
}
const avImg = (src) => `<img src="${src}" alt="" />`

function renderAvatarEditor() {
  document.getElementById('avBig').innerHTML = avImg(draftPhoto || avUrl(draft))
  document.getElementById('avGender').innerHTML = ['girl', 'boy', 'all']
    .map((g) => `<button data-gender="${g}" class="${g === draftGender ? 'on' : ''}">${T[lang].genders[g]}</button>`).join('')
  document.getElementById('avTabs').innerHTML = visibleTabs()
    .map((k) => `<button data-tab="${k}" class="${k === tab ? 'on' : ''}">${T[lang].cats[k]}</button>`).join('')
  const def = AV_OPTIONS[tab]
  document.getElementById('avOpts').innerHTML = optionValues(tab).map((v) => {
    const on = !draftPhoto && draft[tab] === v ? 'on' : ''
    if (def.color) return `<button class="color ${on}" data-opt="${v}" style="background:#${v}" aria-label="${v}"></button>`
    if (v === 'none') return `<button class="none ${on}" data-opt="none">${T[lang].none}</button>`
    return `<button class="${on}" data-opt="${v}">${avImg(avUrl({ ...draft, [tab]: v }))}</button>`
  }).join('')
}
document.getElementById('avTabs').onclick = (e) => { const b = e.target.closest('[data-tab]'); if (b) { tab = b.dataset.tab; renderAvatarEditor() } }
document.getElementById('avOpts').onclick = (e) => { const b = e.target.closest('[data-opt]'); if (b) { draft[tab] = b.dataset.opt; draftPhoto = null; renderAvatarEditor() } }
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)]
document.getElementById('avRandom').onclick = () => {
  for (const k of Object.keys(AV_OPTIONS)) draft[k] = pick(NICE[k] || optionValues(k))
  if (draftGender === 'girl') draft.facialHair = 'none'
  draftPhoto = null; renderAvatarEditor()
}
document.getElementById('avGender').onclick = (e) => {
  const b = e.target.closest('[data-gender]'); if (!b) return
  draftGender = b.dataset.gender
  if (!optionValues('top').includes(draft.top)) draft.top = optionValues('top')[draftGender === 'boy' ? 1 : 0]
  if (draftGender === 'girl') draft.facialHair = 'none'
  if (!visibleTabs().includes(tab)) tab = 'top'
  draftPhoto = null; renderAvatarEditor()
}
document.getElementById('file').onchange = (e) => { const f = e.target.files[0]; if (f) { draftPhoto = URL.createObjectURL(f); renderAvatarEditor() } }
document.getElementById('saveAvatar').onclick = () => { av = { ...draft }; photo = draftPhoto; gender = draftGender; closeModals(); render() }

const MOODS = ['😊', '🥰', '😌', '😴', '😢', '😡']

]
let current = 0
const fmtDay = (d) => d.toLocaleDateString(LOCALE[lang], { weekday: 'long', day: 'numeric', month: 'long' })
function flip(dir, { cover = false, delay = 0, dur = 0.75, z0, z1 } = {}) {
  const book = document.querySelector('.book'), f = document.createElement('div')
  f.className = `flip${dir < 0 ? ' rev' : ''}${cover ? ' cover-leaf' : ''}`
  f.style.animationDelay = `${delay}s`; f.style.animationDuration = `${dur}s`
  if (z0 != null) { f.style.setProperty('--z0', z0); f.style.setProperty('--z1', z1) }
  f.innerHTML = `<div class="face front">${cover ? `<b>${T[lang].journal}</b>` : ''}</div><div class="face back"></div>`
  book.append(f)
  setTimeout(() => f.remove(), (delay + dur) * 1000 + 60)   // timed, so it also cleans up under reduced motion
}
// On opening, a few pages riffle past on their own before settling on today's page
function openBook() {
  const book = document.querySelector('.book')
  book.classList.add('opening')
  for (let i = 0; i < 6; i++) flip(1, { delay: 0.15 + i * 0.14, dur: 0.6, z0: 9 - i, z1: 2 + i })
  setTimeout(() => book.classList.remove('opening'), 1500)
}

function renderJournal(turn) {
  const e = entries[current]
  document.getElementById('jList').innerHTML = entries.map((x, i) =>
    `<li><button data-entry="${i}" class="${i === current ? 'on' : ''}"><span class="mood">${x.mood}</span><span><b>${fmtDay(x.date)}</b><span class="prev">${x.text || T[lang].untitled}</span></span></button></li>`).join('')
  const d = fmtDay(e.date); document.getElementById('jDate').textContent = d.charAt(0).toUpperCase() + d.slice(1)
  document.getElementById('jMoods').innerHTML = `<span>${T[lang].howFeel}</span>` + MOODS.map((m) => `<button data-mood="${m}" class="${m === e.mood ? 'on' : ''}">${m}</button>`).join('')
  const ta = document.getElementById('jText'); ta.value = e.text; ta.placeholder = T[lang].writeHere
  document.getElementById('jSaved').textContent = ''
  if (turn) flip(turn)
}
document.getElementById('journalModal').addEventListener('click', (ev) => {
  const en = ev.target.closest('[data-entry]'); if (en && +en.dataset.entry !== current) { const dir = +en.dataset.entry > current ? 1 : -1; current = +en.dataset.entry; renderJournal(dir) }
  const md = ev.target.closest('[data-mood]'); if (md) { entries[current].mood = md.dataset.mood; renderJournal() }
  if (ev.target.closest('#jNew')) { entries.unshift({ date: new Date(), mood: '😊', text: '' }); current = 0; renderJournal(-1); document.getElementById('jText').focus() }
})
let saveTimer
document.getElementById('jText').addEventListener('input', (ev) => {
  entries[current].text = ev.target.value
  clearTimeout(saveTimer); document.getElementById('jSaved').textContent = '…'
  saveTimer = setTimeout(() => {
    document.getElementById('jSaved').textContent = T[lang].saved
    const prev = document.querySelector(`[data-entry="${current}"] .prev`); if (prev) prev.textContent = entries[current].text || T[lang].untitled
  }, 600)
})

// ---------- Weather widget (mock data until a weather service exists) ----------
const WX_DAYS = [['☀️', 24, 32], ['⛅', 23, 30], ['🌧️', 22, 27], ['⛅', 23, 29], ['☀️', 24, 33]]
function renderWeather() {
  const html = WX_DAYS.map(([ico, lo, hi], i) => {
    const d = new Date(); d.setDate(d.getDate() + i + 1)
    const name = d.toLocaleDateString(LOCALE[lang], { weekday: 'short' }).replace('.', '')
    return `<div class="wx-day"><span>${name.charAt(0).toUpperCase() + name.slice(1)}</span><span>${ico}</span><span class="lo">${lo}°</span>
      <span class="wx-range"><i style="left:${(lo - 22) / 11 * 100}%;right:${(33 - hi) / 11 * 100}%"></i></span><span>${hi}°</span></div>`
  }).join('')
  $$('[data-wx-days]').forEach((el) => (el.innerHTML = html))
}

// ---------- Charts + terminal ----------
const sparkPath = (vals, w, h, pd = 6) => {
  const mn = Math.min(...vals), mx = Math.max(...vals)
  return vals.map((v, i) => `${i ? 'L' : 'M'}${(i / (vals.length - 1)) * w} ${h - pd - ((v - mn) / (mx - mn)) * (h - 2 * pd)}`).join(' ')
}
function renderCharts() {
  $$('[data-fx-line]').forEach((el) => el.setAttribute('d', sparkPath([1.0791, 1.0768, 1.0802, 1.0795, 1.0823, 1.0851, 1.0842], 300, 80)))
  const btc = sparkPath([56600, 57100, 56400, 57800, 58200, 57600, 58900, 59400, 58700, 59900, 60300, 59600, 60800, 61240], 300, 110)
  $$('[data-bt-line]').forEach((el) => el.setAttribute('d', btc))
  $$('[data-bt-area]').forEach((el) => el.setAttribute('d', `${btc} L300 110 L0 110Z`))
}
const TERM = ['<span class="p">morayo@morex</span>:~$ git log --oneline -3', '<span class="h">a5f599a</span> feat: Morex glass login',
  '<span class="h">bbec835</span> fix: register name fields', '<span class="h">b007957</span> docs: add PRIVACY.md', '<span class="p">morayo@morex</span>:~$ ']
let termStep = 0
setInterval(() => {
  termStep = (termStep % (TERM.length + 3)) + 1
  $$('[data-term]').forEach((el) => (el.innerHTML = TERM.slice(0, Math.min(termStep, TERM.length)).join('\n') + '<span class="cur"></span>'))
}, 900)

// ---------- World clock widget ----------
const HERE_TZ = 'Africa/Porto-Novo'
const WORLD = [['🇫🇷', 'Paris', 'Europe/Paris'], ['🇺🇸', 'New York', 'America/New_York'], ['🇯🇵', 'Tokyo', 'Asia/Tokyo'],
  ['🇨🇦', 'Montréal', 'America/Toronto'], ['🇦🇪', 'Dubaï', 'Asia/Dubai']]
const pad2 = (n) => String(n).padStart(2, '0')
function zoned(now, tz) {
  const p = Object.fromEntries(new Intl.DateTimeFormat('en-GB', { timeZone: tz, hour: '2-digit', minute: '2-digit', year: 'numeric', month: '2-digit', day: '2-digit', hourCycle: 'h23' })
    .formatToParts(now).map((x) => [x.type, x.value]))
  return { h: +p.hour, m: +p.minute, key: `${p.year}${p.month}${p.day}`, abs: Date.UTC(p.year, p.month - 1, p.day, p.hour, p.minute) }
}
function renderWorld() {
  const now = new Date(), me = zoned(now, HERE_TZ), t = T[lang]
  const rows = [['📍', 'Cotonou', HERE_TZ, true], ...WORLD].map(([flag, name, tz, isMe]) => {
    const c = zoned(now, tz), d = Math.round((c.abs - me.abs) / 36e5 * 2) / 2
    return { flag, name, isMe, ...c, hm: `${pad2(c.h)}:${pad2(c.m)}`, isDay: c.h >= 6 && c.h < 18,
      off: isMe ? t.here : d === 0 ? t.same : `${d > 0 ? '+' : '−'}${Math.abs(d)} h`,
      day: c.key === me.key ? '' : c.key > me.key ? t.tomorrow : t.yesterday }
  })
  const sorted = [...rows].sort((a, b) => (a.h * 60 + a.m) - (b.h * 60 + b.m))
  const pins = sorted.map((r, i) => `<div class="wl-pin ${i % 2 ? 'down' : 'up'}${r.isMe ? ' me' : ''}" style="left:${((r.h * 60 + r.m) / 1440) * 100}%">
    <div class="lbl">${r.flag} ${r.name}<br /><b>${r.hm}</b> <small>${r.isDay ? '☀️' : '🌙'}${r.day ? ' ' + r.day : ''}</small></div><div class="stem"></div><div class="dot"></div></div>`).join('')
  $$('[data-world-line]').forEach((el) => { el.querySelectorAll('.wl-pin').forEach((p) => p.remove()); el.insertAdjacentHTML('beforeend', pins) })
}

// ---------- Widget decorations ----------
const balloon = (x, y, c) => `<path d="M${x} ${y + 26}q-3 22 4 48" stroke="rgb(255 255 255 / .6)" fill="none"/><ellipse cx="${x}" cy="${y}" rx="14" ry="17" fill="${c}"/><path d="M${x - 3} ${y + 16}l3 5 3-5z" fill="${c}"/><ellipse cx="${x - 5}" cy="${y - 7}" rx="3" ry="5" fill="#fff" fill-opacity=".45"/>`
const DECOS = {
  none: ['🚫', ''],
  flowers: ['🌸', '<i>🌸</i><i>🌼</i><i>🌷</i>'],
  balloons: ['🎈', `<svg viewBox="0 0 80 120">${balloon(22, 30, '#f472b6')}${balloon(50, 20, '#38bdf8')}${balloon(62, 44, '#fde047')}</svg>`],
  stars: ['✨', '<i>✨</i><i>⭐</i><i>✨</i><i>⭐</i>'],
  butterflies: ['🦋', '<i>🦋</i><i>🦋</i>'],
  hearts: ['💖', '<i>💖</i><i>💕</i><i>💗</i>'],
  lights: ['💡', '<b></b>'.repeat(12)],
  clouds: ['☁️', '<i>☁️</i><i>☁️</i>'],
  crown: ['👑', '<i>👑</i>'],
  bow: ['🎀', '<i>🎀</i>'],
  cat: ['🐱', '<i>🐱</i>'],
}
function setDeco(card, key) {
  card.querySelector('.deco')?.remove()
  card.dataset.deco = key
  if (key && key !== 'none') card.insertAdjacentHTML('afterbegin', `<div class="deco dc-${key}" aria-hidden="true">${DECOS[key][1]}</div>`)
}
let decoChoice = 'none'
function renderDecoPick() {
  document.getElementById('decoPick').innerHTML = Object.entries(DECOS)
    .map(([k, [icon]]) => `<button data-deco="${k}" class="${k === decoChoice ? 'on' : ''}"><span>${icon}</span>${T[lang].deco[k]}</button>`).join('')
}
document.getElementById('decoPick').onclick = (e) => { const b = e.target.closest('[data-deco]'); if (b) { decoChoice = b.dataset.deco; renderDecoPick() } }

// ---------- Shared slots ----------
$$('[data-slot="toolbar"]').forEach((el) => el.append(document.getElementById('toolbar').content.cloneNode(true)))
$$('[data-slot="widgets"]').forEach((el) => el.append(document.getElementById('widgets').content.cloneNode(true)))
$$('[data-slot="searchRow"]').forEach((row) => { const box = document.querySelector('.top .search'); if (box) row.append(box) })
// The magnifier toggles the bar; Escape or a click elsewhere rolls it back up
const closeSearch = (box) => { box.classList.remove('open'); box.querySelector('input').value = ''; box.querySelector('input').blur() }
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-search-toggle]')
  $$('.search-row .search.open').forEach((box) => { if (!box.contains(e.target)) closeSearch(box) })
  if (!t) return
  const box = t.closest('.search')
  if (box.classList.contains('open')) closeSearch(box)
  else { box.classList.add('open'); setTimeout(() => box.querySelector('input').focus(), 200) }
})
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') $$('.search-row .search.open').forEach(closeSearch) })

function greeting() {
  const h = new Date().getHours(), t = T[lang]
  if (h >= 18 || h < 5) return t.evening
  if (h >= 12 && t.afternoon) return t.afternoon
  return t.morning
}
const fadeTheme = () => { document.body.classList.remove('theme-in'); void document.body.offsetWidth; document.body.classList.add('theme-in') }
const markTheme = () => $$('[data-theme-set]').forEach((b) => b.classList.toggle('on', b.dataset.themeSet === document.body.dataset.theme))
function render() {
  const t = T[lang]
  document.documentElement.lang = lang
  $$('[data-t]').forEach((el) => (el.textContent = t[el.dataset.t]))
  $$('[data-ph]').forEach((el) => (el.placeholder = t[el.dataset.ph]))
  $$('[data-slot="hello"]').forEach((el) => (el.textContent = greeting()))
  $$('[data-slot="bio"]').forEach((el) => (el.textContent = bio || t.bio))
  $$('[data-slot="faq"]').forEach((el) => (el.innerHTML = t.faq.map(([q, a]) => `<details><summary>${q}</summary><p>${a}</p></details>`).join('')))
  $$('[data-bio]').forEach((el) => { el.placeholder = t.bio; el.value = bio })
  $$('[data-slot="bioCount"]').forEach((el) => (el.textContent = bio.length))
  $$('[data-lang-select]').forEach((el) => (el.value = lang))
  $$('[data-theme-select]').forEach((el) => (el.value = document.body.dataset.theme))
  $$('.A aside nav a').forEach((a) => (a.title = a.textContent.trim()))
  $$('[data-slot="langCode"]').forEach((el) => (el.textContent = lang.toUpperCase()))
  $$('[data-slot="avatar"]').forEach((el) => (el.innerHTML = avImg(photo || avUrl(av))))
  renderWorld()
  renderWeather()
  renderCharts()
  markTheme()
  tick()
}
function tick() {
  const now = new Date()
  const time = now.toLocaleTimeString(LOCALE[lang], { hour: '2-digit', minute: '2-digit' })
  const date = now.toLocaleDateString(LOCALE[lang], { weekday: 'long', day: 'numeric', month: 'long' })
  $$('[data-slot="clock"]').forEach((el) => (el.textContent = time))
  $$('[data-slot="date"]').forEach((el) => (el.textContent = date))
  $$('[data-slot="dayNum"]').forEach((el) => (el.textContent = now.getDate()))
  $$('[data-slot="weekday"]').forEach((el) => (el.textContent = now.toLocaleDateString(LOCALE[lang], { weekday: 'long' })))
  $$('[data-slot="month"]').forEach((el) => (el.textContent = now.toLocaleDateString(LOCALE[lang], { month: 'long' })))
  if (now.getSeconds() === 0) renderWorld()
  const sec = now.getSeconds()
  $$('[data-slot="secs"]').forEach((el) => (el.textContent = String(sec).padStart(2, '0')))
  $$('.dial').forEach((d) => d.classList.toggle('wrap', sec === 0))
  $$('[data-slot="prog"]').forEach((el) => (el.style.strokeDashoffset = 565.49 * (1 - sec / 60)))
  $$('[data-slot="sat"]').forEach((el) => (el.style.transform = `rotate(${sec * 6}deg)`))
  $$('[data-slot="moon"]').forEach((el) => { el.style.transition = sec === 0 ? 'none' : ''; el.style.transform = `rotate(${sec * 6}deg)` })
}
setInterval(tick, 1000)

// ---------- Edit mode: long press → jiggle; drag to reorder ----------
let pressTimer = null, pressStart = null, dragged = null, editingCard = null
const setEditing = (on) => {
  document.body.classList.toggle('editing', on)
  $$('.w:not(.add)').forEach((w) => (w.draggable = on))
}
document.addEventListener('pointerdown', (e) => {
  const w = e.target.closest('.w:not(.add)')
  if (!w || document.body.classList.contains('editing') || e.target.closest('.badge, .resize')) return
  pressStart = { x: e.clientX, y: e.clientY }
  w.classList.add('pressing')
  pressTimer = setTimeout(() => { w.classList.remove('pressing'); setEditing(true); navigator.vibrate?.(30) }, 550)
})
const cancelPress = () => { clearTimeout(pressTimer); pressStart = null; $$('.pressing').forEach((w) => w.classList.remove('pressing')) }
document.addEventListener('pointerup', cancelPress)
document.addEventListener('pointercancel', cancelPress)
document.addEventListener('pointermove', (e) => { if (pressStart && Math.hypot(e.clientX - pressStart.x, e.clientY - pressStart.y) > 8) cancelPress() })

document.addEventListener('dragstart', (e) => { dragged = e.target.closest('.w'); dragged?.classList.add('dragging') })
document.addEventListener('dragend', () => { dragged?.classList.remove('dragging'); dragged = null })
document.addEventListener('dragover', (e) => {
  const over = e.target.closest('.w')
  if (!dragged || !over || over === dragged || over.parentNode !== dragged.parentNode) return
  e.preventDefault()
  if (over.classList.contains('add')) { over.before(dragged); return }
  const items = [...over.parentNode.children]
  items.indexOf(dragged) < items.indexOf(over) ? over.after(dragged) : over.before(dragged)
})

// Resize: drag the ↘ handle, the card snaps to whole grid cells
let rs = null
document.addEventListener('pointerdown', (e) => {
  const h = e.target.closest('.resize'); if (!h) return
  e.preventDefault(); e.stopPropagation()
  const w = h.closest('.w'), cs = getComputedStyle(w.parentNode), cols = cs.gridTemplateColumns.split(' ')
  rs = { w, x: e.clientX, y: e.clientY, rect: w.getBoundingClientRect(), cols: cols.length, colW: parseFloat(cols[0]),
    gap: parseFloat(cs.columnGap), rowH: parseFloat(cs.gridAutoRows), rgap: parseFloat(cs.rowGap) }
  w.draggable = false; w.classList.add('resizing'); h.setPointerCapture(e.pointerId)
}, true)
document.addEventListener('pointermove', (e) => {
  if (!rs) return
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v))
  const c = clamp(Math.round((rs.rect.width + e.clientX - rs.x + rs.gap) / (rs.colW + rs.gap)), rs.w.dataset.kind === 'world' ? 2 : 1, rs.cols)
  const r = clamp(Math.round((rs.rect.height + e.clientY - rs.y + rs.rgap) / (rs.rowH + rs.rgap)), 2, 5)
  rs.w.style.gridColumn = `span ${c}`; rs.w.style.gridRow = `span ${r}`
})
document.addEventListener('pointerup', () => { if (!rs) return; rs.w.classList.remove('resizing'); rs.w.draggable = true; rs = null })

// ---------- Clicks ----------
const closeModals = () => $$('.modal-bg').forEach((m) => m.classList.remove('open'))
const visibleWidgets = () => document.querySelector('.widgets')
document.addEventListener('click', (e) => {
  const menu = e.target.closest('.pill-menu')
  $$('.pill-menu').forEach((m) => m !== menu && m.classList.remove('open'))
  if (menu && e.target.closest('.pill-menu > button')) menu.classList.toggle('open')

  const l = e.target.closest('[data-lang]'); if (l) { lang = l.dataset.lang; render(); menu?.classList.remove('open') }
  const th = e.target.closest('[data-theme-set]'); if (th) { document.body.dataset.theme = th.dataset.themeSet; fadeTheme(); markTheme(); menu?.classList.remove('open') }
  const sk = e.target.closest('[data-wskin-set]'); if (sk) { document.body.dataset.wskin = sk.dataset.wskinSet; menu?.classList.remove('open') }


  if (e.target.closest('[data-open-avatar]')) { $$('.pill-menu').forEach((m) => m.classList.remove('open')); closeModals(); draft = { ...av }; draftPhoto = photo; draftGender = gender; renderAvatarEditor(); document.getElementById('avatarModal').classList.add('open') }
  if (e.target.closest('[data-open-add]')) document.getElementById('addModal').classList.add('open')
  const open = (id) => { e.preventDefault(); $$('.pill-menu').forEach((m) => m.classList.remove('open')); closeModals(); document.getElementById(id).classList.add('open') }
  if (e.target.closest('[data-open-help]')) open('helpModal')
  if (e.target.closest('[data-open-logout]')) open('logoutModal')
  if (e.target.closest('[data-open-profile]')) open('profileModal')
  if (e.target.closest('[data-open-journal]')) {
    open('journalModal'); renderJournal(); openBook()
  }
  if (e.target.closest('[data-close]')) closeModals()
  if (e.target.id === 'doLogout') location.href = '/login'
  if (e.target.classList.contains('modal-bg')) closeModals()
  if (document.body.classList.contains('editing') && !e.target.closest('.w, .modal-bg')) setEditing(false)

  const del = e.target.closest('.badge.del')
  if (del) { const w = del.closest('.w'); w.classList.add('removing'); setTimeout(() => w.remove(), 250) }
  const ed = e.target.closest('.badge.edit')
  if (ed) {
    editingCard = ed.closest('.w')
    document.getElementById('fTitle').value = editingCard.querySelector('.w-title').textContent
    decoChoice = editingCard.dataset.deco || 'none'; renderDecoPick()
    document.getElementById('editModal').classList.add('open')
  }
  const kind = e.target.closest('[data-add-kind]')
  if (kind) {
    const card = document.getElementById('widgets').content.querySelector(`[data-kind="${kind.dataset.addKind}"]`).cloneNode(true)
    card.querySelectorAll('[data-t]').forEach((el) => (el.textContent = T[lang][el.dataset.t]))
    card.classList.add('appearing'); card.draggable = document.body.classList.contains('editing')
    visibleWidgets().querySelector('.add').before(card)
    renderWorld(); renderWeather(); renderCharts()
    setTimeout(() => card.classList.remove('appearing'), 400)
    closeModals()
  }
})
document.getElementById('sideToggle').onclick = () => document.querySelector('.A').classList.toggle('collapsed')
document.getElementById('saveWidget').onclick = () => {
  if (editingCard) { editingCard.querySelector('.w-title').textContent = document.getElementById('fTitle').value; setDeco(editingCard, decoChoice) }
  closeModals()
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { closeModals(); setEditing(false) }
})
document.addEventListener('input', (e) => {
  if (e.target.matches('[data-bio]')) { bio = e.target.value.trim(); $$('[data-slot="bioCount"]').forEach((el) => (el.textContent = e.target.value.length));
    $$('[data-slot="bio"]').forEach((el) => (el.textContent = bio || T[lang].bio)) }
})
document.addEventListener('change', (e) => {
  if (e.target.matches('[data-lang-select]')) { lang = e.target.value; render() }
  if (e.target.matches('[data-theme-select]')) { document.body.dataset.theme = e.target.value; fadeTheme(); markTheme() }
})

render()
setDeco(document.querySelector('.widgets [data-kind="weather"]'), 'clouds')
setDeco(document.querySelector('.widgets [data-kind="rss"]'), 'flowers')
setDeco(document.querySelector('.widgets [data-kind="price"]'), 'balloons')
setDeco(document.querySelector('.widgets [data-kind="gh"]'), 'lights')
</script>
