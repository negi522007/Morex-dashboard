<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Morex page comptes</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; font-family: Poppins, system-ui, sans-serif; color: #fff; background-color: #020617;
    background: linear-gradient(rgb(2 6 23 / .45), rgb(2 6 23 / .7)), url(/accueil_photo.jpg) 50% 28%/cover fixed; }
  h1 { text-align: center; font-weight: 600; margin: 0; padding-top: 28px; }
  .lead { text-align: center; color: rgb(255 255 255 / .75); margin: 8px auto 18px; font-size: 14px; max-width: 900px; padding: 0 16px; }
  .tabs { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tabs button { font: inherit; font-size: 13.5px; padding: 8px 18px; border-radius: 999px; border: 1px solid rgb(255 255 255 / .25); background: transparent; color: #fff; cursor: pointer; }
  .tabs button.on { background: #fff; color: #1e1b4b; font-weight: 600; }
  .stage { max-width: 1440px; margin: 0 auto; padding: 0 28px 80px; }
  .glass { background: rgb(255 255 255 / .08); border: 1px solid rgb(255 255 255 / .14); border-radius: 24px; backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); }
  .muted { color: rgb(255 255 255 / .62); }
  .head { display: flex; align-items: baseline; gap: 16px; margin: 0 4px 22px; flex-wrap: wrap; }
  .head h2 { margin: 0; font-size: 40px; font-weight: 700; letter-spacing: -.03em; background: linear-gradient(90deg, #fff, #818cf8 60%, #38bdf8); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .tools { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 18px; }
  .search { flex: 1; min-width: 240px; height: 48px; padding: 0 22px; border-radius: 999px; border: 1px solid rgb(255 255 255 / .18); background: rgb(255 255 255 / .07); color: #fff; font: inherit; font-size: 15px; outline: none; }
  .chip { font: inherit; font-size: 14px; padding: 9px 16px; border-radius: 999px; border: 1px solid rgb(255 255 255 / .2); background: transparent; color: #fff; cursor: pointer; }
  .chip.on { background: rgb(167 139 250 / .3); border-color: rgb(196 181 253 / .6); }
  .chip b { margin-left: 6px; opacity: .7; }
  .btn { font: inherit; font-size: 13px; padding: 7px 14px; border-radius: 999px; border: 1px solid rgb(255 255 255 / .22); background: rgb(255 255 255 / .06); color: #fff; cursor: pointer; white-space: nowrap; }
  .btn:hover { background: rgb(255 255 255 / .14); } .btn.danger { border-color: rgb(248 113 113 / .55); color: #fecaca; } .btn:disabled { opacity: .35; cursor: not-allowed; }
  .av { border-radius: 50%; flex: none; object-fit: cover; background: rgb(255 255 255 / .1); box-shadow: 0 0 0 2px rgb(255 255 255 / .15); }
  .badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 11px; border-radius: 999px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
  .b-admin { background: rgb(167 139 250 / .22); color: #ddd6fe; } .b-ok { background: rgb(52 211 153 / .16); color: #a7f3d0; } .b-wait { background: rgb(251 191 36 / .2); color: #fde68a; } .b-ban { background: rgb(248 113 113 / .22); color: #fecaca; }
  .num { font-family: 'JetBrains Mono', monospace; }

  /* 1 tableau aéré */
  .t1 { width: 100%; border-collapse: separate; border-spacing: 0 10px; font-size: 15px; }
  .t1 th { text-align: left; font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: .1em; color: rgb(255 255 255 / .5); padding: 0 16px 4px; cursor: pointer; }
  .t1 td { padding: 14px 16px; background: rgb(255 255 255 / .05); border-top: 1px solid rgb(255 255 255 / .06); border-bottom: 1px solid rgb(255 255 255 / .06); }
  .t1 td:first-child { border-radius: 18px 0 0 18px; border-left: 1px solid rgb(255 255 255 / .06); } .t1 td:last-child { border-radius: 0 18px 18px 0; border-right: 1px solid rgb(255 255 255 / .06); }
  .t1 tr:hover td { background: rgb(255 255 255 / .09); }
  .t1 .who { display: flex; align-items: center; gap: 14px; } .t1 .who b { display: block; font-weight: 600; } .t1 .who small { color: rgb(255 255 255 / .55); font-size: 13px; }
  .mini { display: flex; align-items: center; gap: 10px; } .mini .bar { width: 90px; height: 7px; border-radius: 99px; background: rgb(255 255 255 / .08); overflow: hidden; } .mini .bar i { display: block; height: 100%; background: linear-gradient(90deg, #a78bfa, #38bdf8); border-radius: 99px; }
  .acts { display: flex; gap: 6px; justify-content: flex-end; opacity: .35; transition: opacity .2s; } .t1 tr:hover .acts { opacity: 1; }

  /* 2 grille de cartes */
  .grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 20px; }
  .acard { padding: 24px; display: flex; flex-direction: column; gap: 14px; position: relative; overflow: hidden; transition: transform .2s; }
  .acard:hover { transform: translateY(-4px); }
  .acard::before { content: ''; position: absolute; inset: 0 0 auto 0; height: 80px; background: linear-gradient(135deg, var(--c), transparent); opacity: .35; }
  .acard .top { display: flex; align-items: center; gap: 14px; position: relative; }
  .acard .top b { display: block; font-size: 17px; } .acard .top small { color: rgb(255 255 255 / .6); font-size: 13px; }
  .acard .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .acard .stats div { padding: 10px; border-radius: 14px; background: rgb(255 255 255 / .05); text-align: center; } .acard .stats b { display: block; font-size: 20px; } .acard .stats span { font-size: 11.5px; color: rgb(255 255 255 / .6); }
  .acard .foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }

  /* 3 liste + fiche */
  .md { display: grid; grid-template-columns: 420px 1fr; gap: 20px; } @media (max-width: 1000px) { .md { grid-template-columns: 1fr; } }
  .list { padding: 12px; display: flex; flex-direction: column; gap: 6px; }
  .li { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px; cursor: pointer; border: 1px solid transparent; transition: background .2s; }
  .li:hover { background: rgb(255 255 255 / .06); } .li.on { background: rgb(167 139 250 / .2); border-color: rgb(196 181 253 / .45); }
  .li b { display: block; font-size: 15px; } .li small { color: rgb(255 255 255 / .55); font-size: 12.5px; } .li .g { flex: 1; min-width: 0; }
  .sheet { padding: 34px; position: relative; overflow: hidden; }
  .sheet .orb { position: absolute; right: -120px; top: -140px; width: 400px; height: 400px; border-radius: 50%; background: radial-gradient(circle, rgb(99 102 241 / .5), transparent 65%); }
  .sheet .id { display: flex; align-items: center; gap: 24px; position: relative; }
  .sheet .id h3 { margin: 0; font-size: 32px; letter-spacing: -.02em; } .sheet .id p { margin: 4px 0 10px; color: rgb(255 255 255 / .65); }
  .kv { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin: 28px 0; } .kv div { padding: 18px; border-radius: 18px; background: rgb(255 255 255 / .05); } .kv b { display: block; font-size: 28px; } .kv span { font-size: 13px; color: rgb(255 255 255 / .6); }
  .sheet .actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .sheet .line { display: flex; gap: 10px; align-items: center; padding: 12px 0; border-bottom: 1px solid rgb(255 255 255 / .07); font-size: 14px; } .sheet .line span:first-child { width: 160px; color: rgb(255 255 255 / .55); }

  /* 4 badges d'équipage */
  .crew { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 22px; }
  .badgecard { border-radius: 22px; overflow: hidden; background: linear-gradient(170deg, rgb(30 27 75 / .9), rgb(2 6 23 / .9)); border: 1px solid rgb(255 255 255 / .14); box-shadow: 0 18px 40px -18px var(--c); position: relative; transition: transform .25s; }
  .badgecard:hover { transform: rotate(-1.2deg) translateY(-4px); }
  .badgecard .strap { height: 34px; background: linear-gradient(90deg, var(--c), #38bdf8); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; font-size: 11px; font-weight: 700; letter-spacing: .2em; color: #0f172a; }
  .badgecard .hole { position: absolute; top: 10px; left: 50%; width: 46px; height: 10px; margin-left: -23px; border-radius: 99px; background: #0f172a; }
  .badgecard .bd { padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
  .badgecard .ph { width: 92px; height: 92px; border-radius: 22px; object-fit: cover; box-shadow: 0 0 0 3px var(--c), 0 0 24px var(--c); background: rgb(255 255 255 / .1); }
  .badgecard b { font-size: 17px; margin-top: 6px; } .badgecard small { color: rgb(255 255 255 / .6); font-size: 12.5px; }
  .badgecard .mrow { display: flex; gap: 16px; margin-top: 8px; font-size: 12.5px; color: rgb(255 255 255 / .7); } .badgecard .mrow b { font-size: 15px; color: #fff; margin: 0; }
  .badgecard .idn { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: rgb(255 255 255 / .4); margin-top: 6px; letter-spacing: .1em; }
</style>
</head>
<body>
<h1>La page Comptes : propositions</h1>
<p class="lead">4 façons d'afficher les comptes, avec tes 6 comptes et leurs vrais avatars. Partout on garde la recherche, les filtres, le tri, l'export CSV et les actions (renommer, confirmer, suspendre, supprimer), qui sont grisées sur ton compte.</p>
<div class="tabs" id="tabs"></div>
<div class="stage" id="stage"></div>
<script>
const AV = (cfg) => 'https://api.dicebear.com/9.x/avataaars/svg?' + new URLSearchParams({ skinColor: 'ae5d29', top: 'curly', hairColor: '2c1b18', eyes: 'happy', eyebrows: 'defaultNatural', mouth: 'smile', accessories: 'none', facialHair: 'none', clothing: 'hoodie', clothesColor: '5199e4', backgroundColor: 'c0aede', ...cfg })
const D = 864e5, NOW = Date.now()
const U = [
  { n: 'Morayo ELEGBEDE', e: 'bachiratou09@gmail.com', st: 'admin', at: NOW - 57 * 6e4, w: 0, l: 0, s: 2, me: true, av: {}, c: '#a78bfa' },
  { n: 'Morayo09 Morayo09', e: 'morayo.elegbede@epitech.eu', st: 'ok', at: NOW - 10 * D, w: 7, l: 1, s: 1, av: { top: 'bigHair', backgroundColor: 'b6e3f4' }, c: '#38bdf8' },
  { n: 'Morayo Demo', e: 'demo.morex@example.com', st: 'ok', at: NOW - 15 * D, w: 18, l: 0, s: 26, av: { top: 'curvy' }, c: '#34d399' },
  { n: 'loic45@gmail.com', e: 'loic45@gmail.com', st: 'ok', at: NOW - 19 * D, w: 1, l: 0, s: 2, av: { top: 'shortFlat', skinColor: 'ffdbb4', backgroundColor: 'd1d4f9' }, c: '#fbbf24' },
  { n: 'exauce12@gmail.com', e: 'exauce12@gmail.com', st: 'ok', at: NOW - 19 * D, w: 0, l: 0, s: 1, av: { top: 'fro' }, c: '#f472b6' },
  { n: 'morayo688@gmail.com', e: 'morayo688@gmail.com', st: 'ok', at: NOW - 19 * D, w: 0, l: 0, s: 0, av: { top: 'bob', skinColor: 'edb98a', backgroundColor: 'a7f3d0', accessories: 'round' }, c: '#2dd4bf' },
]
const MAXW = Math.max(...U.map((u) => u.w), 1)
const rel = (t) => { const m = (NOW - t) / 6e4; return m < 60 ? `il y a ${Math.round(m)} min` : m < 1440 ? `il y a ${Math.round(m / 60)} h` : `il y a ${Math.round(m / 1440)} j` }
const date = (t) => new Date(t).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' })
const badge = (u) => u.st === 'admin' ? '<span class="badge b-admin">★ Admin</span>' : u.st === 'wait' ? '<span class="badge b-wait">⏳ Non confirmé</span>' : u.st === 'ban' ? '<span class="badge b-ban">⛔ Suspendu</span>' : '<span class="badge b-ok">● Actif</span>'
const img = (u, s, cls = 'av') => `<img class="${cls}" src="${AV(u.av)}" width="${s}" height="${s}" alt="">`
const acts = (u, full = false) => `<button class="btn">✎ Renommer</button>${u.st === 'wait' ? '<button class="btn">✉ Confirmer</button>' : ''}<button class="btn danger" ${u.me ? 'disabled title="C\'est ton compte"' : ''}>⛔ Suspendre</button>${full ? `<button class="btn danger" ${u.me ? 'disabled' : ''}>🗑 Supprimer</button>` : ''}`
const tools = () => `<div class="tools"><input class="search" placeholder="🔍 Nom ou e-mail…"><button class="chip on">Tous<b>6</b></button><button class="chip">Non confirmés<b>0</b></button><button class="chip">Suspendus<b>0</b></button><button class="chip">Admins<b>1</b></button><button class="btn">⬇ CSV</button></div>`
const head = () => `<div class="head"><h2>Comptes</h2><span class="muted">6 comptes · 1 admin · 26 widgets au total</span></div>`
let sel = 1

const V = {
  1: ['Tableau aéré', () => `${head()}<div class="glass" style="padding:20px 24px">${tools()}<table class="t1"><tr><th>Compte</th><th>Statut</th><th>Inscrit ↓</th><th>Widgets</th><th>Liés</th><th>Sessions</th><th></th></tr>
    ${U.map((u) => `<tr><td><div class="who">${img(u, 46)}<div><b>${u.n}${u.me ? ' <span class="muted" style="font-weight:400">(toi)</span>' : ''}</b><small>${u.e}</small></div></div></td><td>${badge(u)}</td><td class="muted">${rel(u.at)}</td>
      <td><div class="mini"><span class="num">${u.w}</span><span class="bar"><i style="width:${u.w / MAXW * 100}%"></i></span></div></td><td class="num">${u.l}</td><td class="num">${u.s}</td><td><div class="acts">${acts(u)}</div></td></tr>`).join('')}</table></div>`],
  2: ['Grille de cartes', () => `${head()}${tools()}<div class="grid2">${U.map((u) => `<div class="glass acard" style="--c:${u.c}"><div class="top">${img(u, 64)}<div style="min-width:0"><b>${u.n}${u.me ? ' <span class="muted" style="font-weight:400;font-size:13px">(toi)</span>' : ''}</b><small>${u.e}</small></div></div>
    <div class="stats"><div><b>${u.w}</b><span>widgets</span></div><div><b>${u.l}</b><span>liés</span></div><div><b>${u.s}</b><span>sessions</span></div></div>
    <div class="foot">${badge(u)}<span class="muted" style="font-size:12.5px">inscrit ${rel(u.at)}</span></div><div style="display:flex;gap:6px;flex-wrap:wrap">${acts(u)}</div></div>`).join('')}</div>`],
  3: ['Liste + fiche', () => { const u = U[sel]; return `${head()}${tools()}<div class="md"><div class="glass list">${U.map((x, i) => `<div class="li ${i === sel ? 'on' : ''}" data-sel="${i}">${img(x, 42)}<div class="g"><b>${x.n}</b><small>${x.e}</small></div>${badge(x)}</div>`).join('')}</div>
    <div class="glass sheet"><div class="orb"></div><div class="id">${img(u, 120)}<div><h3>${u.n}</h3><p>${u.e}</p>${badge(u)}</div></div>
      <div class="kv"><div><b>${u.w}</b><span>widgets</span></div><div><b>${u.l}</b><span>comptes liés</span></div><div><b>${u.s}</b><span>sessions</span></div><div><b>${Math.round((NOW - u.at) / D)}</b><span>jours sur Morex</span></div></div>
      <div class="line"><span>Inscrit le</span><span>${date(u.at)}</span></div><div class="line"><span>E-mail</span><span>${u.st === 'wait' ? 'pas encore confirmé' : 'confirmé ✓'}</span></div><div class="line" style="border:0;margin-bottom:18px"><span>Rôle</span><span>${u.st === 'admin' ? 'administrateur' : 'utilisateur'}</span></div>
      <div class="actions">${acts(u, true)}<button class="btn">⬇ Exporter</button></div></div></div>` }],
  4: ['Badges d\'équipage', () => `${head()}${tools()}<div class="crew">${U.map((u, i) => `<div class="badgecard" style="--c:${u.c}"><div class="strap"><span>MOREX</span><span>${u.st === 'admin' ? 'COMMANDANT' : 'ÉQUIPAGE'}</span></div><span class="hole"></span>
    <div class="bd">${img(u, 92, 'ph')}<b>${u.n}</b><small>${u.e}</small>${badge(u)}<div class="mrow"><span><b>${u.w}</b> widgets</span><span><b>${u.l}</b> liés</span><span><b>${u.s}</b> sessions</span></div>
    <div class="idn">MRX-${String(i + 1).padStart(4, '0')} · DEPUIS LE ${new Date(u.at).toLocaleDateString('fr-FR')}</div><div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:6px">${acts(u)}</div></div></div>`).join('')}</div>`],
}
let cur = 1
function draw() {
  document.getElementById('tabs').innerHTML = Object.entries(V).map(([k, [n]]) => `<button class="${+k === cur ? 'on' : ''}" data-v="${k}">${k} · ${n}</button>`).join('')
  document.getElementById('stage').innerHTML = V[cur][1]()
}
document.addEventListener('click', (e) => { const v = e.target.closest('[data-v]'); if (v) { cur = +v.dataset.v; draw() } const s = e.target.closest('[data-sel]'); if (s) { sel = +s.dataset.sel; draw() } })
cur = +(location.hash.slice(1) || 1); draw()
</script>
</body>
</html>
