      <div style="display:flex;align-items:center;gap:10px"><span class="big tab">${fmt(FX.rate, FX.quote)}</span>${pct(FX.changePct)}</div>
      ${hoverChart(FX.history, fxKey, FX.quote, fxColor, 'fx1', `Taux sur ${FX.days} jours`)}
      <div class="mm"><span>min ${fmt(FX.min, FX.quote)}</span><span>max ${fmt(FX.max, FX.quote)}</span></div></div>`],
    ['Carte boursière', 'façon appli de trading : police de terminal, onglets de période, courbe verte ou rouge selon la tendance', `<div class="card" style="background:rgb(2 6 23 / .75)">
      <div style="display:flex;justify-content:space-between;align-items:center"><div class="ticker"><span style="font-weight:700">${TICK[FX.base] ?? FX.base.slice(0, 3).toUpperCase()}/${FX.quote.toUpperCase()}</span></div><div class="periods"><span>24h</span><span class="on">${FX.days}j</span><span>30j</span></div></div>
      <div class="ticker"><span class="big" style="font-family:inherit">${FX.rate.toLocaleString('fr-FR')}</span><span style="color:${fxColor};font-weight:700">${up ? '+' : ''}${FX.changePct.toFixed(2)}%</span></div>
      ${area(fxVals, fxColor, 'fx2')}
      <div class="mm" style="font-family:'JetBrains Mono',monospace"><span>L ${Math.round(FX.min).toLocaleString('fr-FR')}</span><span>H ${Math.round(FX.max).toLocaleString('fr-FR')}</span></div></div>`],
    ['Jauge min / max', 'où se situe le taux actuel entre le plus bas et le plus haut de la période', `<div class="card">
      <div class="s">${cap(FX.base)} en ${FX.quote.toUpperCase()} · ${FX.days} derniers jours</div>
      <div style="display:flex;align-items:center;gap:10px"><span class="big tab">${fmt(FX.rate, FX.quote)}</span>${pct(FX.changePct)}</div>
      <div class="gauge"><span class="cursor" style="left:${pos}%"></span><span class="lbl" style="left:${pos}%">maintenant</span></div>
      <div class="mm"><span>▼ plus bas<br><b class="tab" style="color:#fff">${fmt(FX.min, FX.quote)}</b></span><span style="text-align:right">plus haut ▲<br><b class="tab" style="color:#fff">${fmt(FX.max, FX.quote)}</b></span></div>
      <div class="s" style="margin-top:auto">À ${Math.round(pos)} % entre le plus bas et le plus haut</div></div>`],
  ]],
  ['📈 Historique de prix', 'price_history', [
    ['Pièce qui tourne', 'celle que tu avais choisie : la pièce, le prix, la courbe orange', `<div class="card">
      <div style="display:flex;align-items:center;gap:12px"><div class="coin">${COIN.bitcoin}</div><div><div style="font-weight:600">Bitcoin ${pct(phChange)}</div><div class="big tab" style="font-size:28px">${fmt(phVals.at(-1), 'usd')}</div></div></div>
      ${area(phVals, '#f59e0b', 'ph1')}<div class="s">30 derniers jours</div></div>`],
    ['Courbe interactive', 'survole la courbe : un curseur suit la souris et affiche le prix et la date exacts', `<div class="card">
      <div style="display:flex;justify-content:space-between;align-items:baseline"><div><div class="s">Bitcoin · 30 j</div><div class="big tab" style="font-size:30px">${fmt(phVals.at(-1), 'usd')}</div></div>${pct(phChange)}</div>
      ${hoverChart(PH, 'price', 'usd', '#f59e0b', 'ph2', 'Prix du Bitcoin sur 30 jours')}
      <div class="mm"><span>${new Date(PH[0].timestamp).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' })}</span><span>aujourd’hui</span></div></div>`],
    ['Calendrier des variations', 'une case par jour : verte quand ça a monté, rouge quand ça a baissé (survole une case)', `<div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center"><div><div class="s">Bitcoin · 30 j</div><div class="big tab" style="font-size:26px">${fmt(phVals.at(-1), 'usd')}</div></div>${pct(phChange)}</div>
      <div class="heat">${deltas.map(([d, x]) => `<i style="background:${heatColor(x)}" data-t="${new Date(d).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' })} : ${x >= 0 ? '+' : ''}${x.toFixed(1)} %"></i>`).join('')}</div>
      <div class="legend"><span>${deltas.filter(([, x]) => x >= 0).length} jours en hausse</span><span>baisse<b></b>hausse</span></div></div>`],
  ]],
]
document.getElementById('app').innerHTML = sections.map(([title, key, opts]) => `<section><h2>${title}<code>${key}</code></h2><div class="row">${opts.map(([name, desc, html], i) => `<div class="opt">${html}<p><b>${i + 1} · ${name}</b> : ${desc}</p></div>`).join('')}</div></section>`).join('') + '<div style="height:50px"></div>'

// hover layer: crosshair + dot + tooltip
document.querySelectorAll('.hover').forEach((el) => {
  const { series, key, cur } = SERIES[el.dataset.series]
  const vals = series.map((p) => p[key]), { pts } = path(vals)
  const line = el.querySelector('.xline'), dot = el.querySelector('.dot'), tip = el.querySelector('.tip')
  el.addEventListener('pointermove', (e) => {
    const r = el.getBoundingClientRect(), i = Math.round(((e.clientX - r.left) / r.width) * (pts.length - 1))
    const [x, y] = pts[Math.max(0, Math.min(pts.length - 1, i))], p = series[Math.max(0, Math.min(series.length - 1, i))]
    const px = (x / 300) * r.width, py = (y / 90) * r.height
    line.setAttribute('x1', x); line.setAttribute('x2', x); line.setAttribute('opacity', 1)
    dot.style.left = `${px}px`; dot.style.top = `${py}px`; dot.style.opacity = 1
    tip.style.left = `${px}px`; tip.style.top = `${py}px`
    tip.innerHTML = `<b>${fmt(p[key], cur)}</b><br>${new Date(p.timestamp).toLocaleString('fr-FR', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })}`
  })
  el.addEventListener('pointerleave', () => { line.setAttribute('opacity', 0); dot.style.opacity = 0 })
})
</script>
</body>
</html>
