<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Morex lumières</title>
<link rel="icon" type="image/svg+xml" href="/logo.svg" />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; font-family: Poppins, system-ui, sans-serif; color: #fff; background-color: #020617;
    background: linear-gradient(rgb(2 6 23 / .62), rgb(15 12 50 / .82)), url(/accueil_photo.jpg) 50% 28%/cover fixed; }
  h1 { text-align: center; font-weight: 600; margin: 0; padding-top: 34px; }
  .lead { text-align: center; color: rgb(255 255 255 / .7); margin: 8px auto 16px; max-width: 820px; padding: 0 16px; }
  .ctl { display: flex; justify-content: center; margin-bottom: 26px; }
  .ctl button { font: inherit; font-size: 13px; padding: 8px 16px; border-radius: 999px; border: 0; background: #fff; color: #1e1b4b; font-weight: 600; cursor: pointer; }
  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 30px; max-width: 1150px; margin: 0 auto; padding: 10px 24px 60px; }
  @media (max-width: 1000px) { .grid { grid-template-columns: 1fr; max-width: 420px; } }
  .opt > p { margin: 14px 0 0; font-size: 13px; color: rgb(255 255 255 / .7); } .opt > p b { color: #fff; }

  .w { position: relative; height: 250px; border-radius: 26px; transition: box-shadow .4s, transform .4s; }
  .in { position: relative; z-index: 1; height: 100%; display: flex; flex-direction: column; padding: 18px 20px 16px; border-radius: 26px; overflow: hidden; background: rgb(15 23 42 / .82); border: 1px solid rgb(255 255 255 / .12); backdrop-filter: blur(18px); }
  .w-head { font-size: 13px; opacity: .7; } .w-big { font-size: 46px; font-weight: 600; line-height: 1.1; margin-top: 8px; } .w-sub { opacity: .7; font-size: 13px; }
  .w.busy .w-big { animation: flash .8s; } @keyframes flash { 40% { opacity: .25; transform: translateY(3px); } }
  /* the chosen footer: comet ring + time, no labels */
  .foot { margin-top: auto; font-size: 12.5px; display: flex; align-items: center; justify-content: space-between; }
  .cd { display: flex; align-items: center; gap: 8px; font-weight: 600; }
  .cd svg { width: 26px; height: 26px; transform: rotate(-90deg); overflow: visible; }
  .cd circle.b { fill: none; stroke: rgb(255 255 255 / .12); } .cd circle.f { fill: none; stroke-linecap: round; transition: stroke-dashoffset 1s linear; }
  .at { font-weight: 600; color: rgb(255 255 255 / .8); }
  .spin { display: inline-block; animation: sp .9s linear infinite; } @keyframes sp { to { transform: rotate(360deg); } }
  .ok { color: #34d399; }
  .w.hot .cd { color: #fde68a; }

  /* 1 · rotating light border */
  .e1 .glow { position: absolute; inset: -2px; border-radius: 28px; opacity: 0; transition: opacity .4s; overflow: hidden; }
  .e1 .glow::before { content: ''; position: absolute; inset: -60%; background: conic-gradient(from 0deg, transparent 0 60%, #38bdf8 75%, #a78bfa 85%, #f472b6 92%, transparent 100%); animation: sp 1.2s linear infinite; }
  .e1.hot .glow { opacity: 1; } .e1.hot { box-shadow: 0 0 30px rgb(56 189 248 / .25); }
  /* 2 · breathing halo that grows each second */
  .e2.hot { animation: breathe 1s ease-in-out infinite; }
  @keyframes breathe { 0%, 100% { box-shadow: 0 0 calc(var(--k) * 6px) rgb(167 139 250 / .35); } 50% { box-shadow: 0 0 calc(var(--k) * 14px) calc(var(--k) * 2px) rgb(167 139 250 / .6); } }
  .e2.busy { box-shadow: 0 0 60px 10px rgb(52 211 153 / .5); }
  /* 3 · sparkles around the card */
  .e3 .spk { position: absolute; z-index: 2; font-size: 22px; color: #fde68a; text-shadow: 0 0 10px #fde047; opacity: 0; pointer-events: none; }
  .e3.hot .spk { animation: twinkle 1s ease-in-out infinite; }
  @keyframes twinkle { 0%, 100% { opacity: 0; transform: scale(.3) rotate(0); } 50% { opacity: 1; transform: scale(1.2) rotate(90deg); } }
  /* 4 · light sweeping across */
  .e4 .sweep { position: absolute; inset: 0; z-index: 2; border-radius: 26px; overflow: hidden; pointer-events: none; }
  .e4 .sweep::after { content: ''; position: absolute; top: -20%; bottom: -20%; left: -60%; width: 45%; background: linear-gradient(100deg, transparent, rgb(255 255 255 / .22), transparent); transform: skewX(-18deg); opacity: 0; }
  .e4.hot .sweep::after { animation: sweep 1s ease-in-out infinite; opacity: 1; }
  @keyframes sweep { to { left: 120%; } }
  .e4.hot .in { border-color: rgb(255 255 255 / .35); }
  /* 5 · corners lighting up one per second */
  .e5 .cn { position: absolute; z-index: 2; width: 26px; height: 26px; border: 3px solid transparent; transition: border-color .3s, filter .3s; pointer-events: none; }
  .e5 .cn.on { border-color: #f472b6; filter: drop-shadow(0 0 6px #f472b6); }
  .e5 .c1 { top: -6px; left: -6px; border-right: 0 !important; border-bottom: 0 !important; border-radius: 14px 0 0 0; }
  .e5 .c2 { top: -6px; right: -6px; border-left: 0 !important; border-bottom: 0 !important; border-radius: 0 14px 0 0; }
  .e5 .c3 { bottom: -6px; right: -6px; border-left: 0 !important; border-top: 0 !important; border-radius: 0 0 14px 0; }
  .e5 .c4 { bottom: -6px; left: -6px; border-right: 0 !important; border-top: 0 !important; border-radius: 0 0 0 14px; }
  .e5.busy .cn { border-color: #34d399; filter: drop-shadow(0 0 8px #34d399); }
  /* 6 · marquee bulbs around the border */
  .e6 .bulbs { position: absolute; inset: -9px; z-index: 2; pointer-events: none; opacity: 0; transition: opacity .3s; }
  .e6.hot .bulbs, .e6.busy .bulbs { opacity: 1; }
  .e6 .bulbs i { position: absolute; width: 6px; height: 6px; margin: -3px; border-radius: 50%; background: #fde047; box-shadow: 0 0 6px #fde047; animation: chase .6s steps(1) infinite; }
  .e6 .bulbs i:nth-child(even) { animation-delay: .3s; }
  @keyframes chase { 0% { opacity: 1; } 50% { opacity: .15; } }
  .e6.busy .bulbs i { background: #34d399; box-shadow: 0 0 6px #34d399; animation: none; }
  .hint { position: absolute; left: 50%; bottom: -26px; transform: translateX(-50%); font-size: 11px; opacity: .5; white-space: nowrap; }
</style>
</head>
<body>
<h1>Les lumières des 5 dernières secondes</h1>
<p class="lead">L’anneau comète, sans les petits textes. À 5 secondes de la mise à jour, le widget s’illumine pour attirer l’œil, puis passe au vert quand les nouvelles données arrivent</p>
<div class="ctl"><button id="again">▶ Revoir les 5 dernières secondes</button></div>
<div class="grid" id="g"></div>
<script>
const RATE = 30
let left = 9, last = new Date(), phase = '', temp = 30
const hm = (d) => d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })
const dur = (s) => `${s} s`
const hot = () => !phase && left <= 5
function comet() {
  const r = 10, C = 2 * Math.PI * r, f = phase ? 1 : left / RATE, a = 2 * Math.PI * f
  const col = hot() ? '#fde047' : 'url(#cg)'
  const dot = phase ? '' : `<circle cx="${13 + r * Math.cos(a)}" cy="${13 + r * Math.sin(a)}" r="5" fill="${hot() ? 'rgb(253 224 71 / .35)' : 'rgb(56 189 248 / .35)'}"/><circle cx="${13 + r * Math.cos(a)}" cy="${13 + r * Math.sin(a)}" r="3" fill="#fff"/>`
  return `<svg viewBox="0 0 26 26"><defs><linearGradient id="cg"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs><circle class="b" cx="13" cy="13" r="${r}" stroke-width="2.5"/><circle class="f" cx="13" cy="13" r="${r}" stroke-width="2.5" stroke="${phase === 'ok' ? '#34d399' : col}" stroke-dasharray="${C}" stroke-dashoffset="${phase ? 0 : C * (1 - f)}"/>${dot}</svg>`
}
const foot = () => `<div class="foot"><span class="cd">${comet()}${phase === 'busy' ? '<span class="spin">↻</span>' : phase === 'ok' ? '<span class="ok">✓</span>' : dur(left)}</span><span class="at">${hm(last)}</span></div>`
const SPARKS = [[-10, -8], [40, -14], [-14, 55], [104, 30], [96, -10], [102, 88], [-8, 96], [55, 104]]
const bulbs = () => { const out = [], n = 9; for (let i = 0; i <= n; i++) { const t = i / n * 100; out.push([t, 0], [t, 100]); if (i && i < n) out.push([0, t], [100, t]) } return out.map(([x, y]) => `<i style="left:${x}%;top:${y}%"></i>`).join('') }
const corners = () => { const on = phase ? 4 : hot() ? 5 - left + 1 : 0; return [1, 2, 3, 4].map((i) => `<span class="cn c${i} ${i <= on ? 'on' : ''}"></span>`).join('') }

const P = [
  ['e1', 'Contour qui tourne', 'une lumière bleu-violet-rose fait le tour du bord de la carte, comme un néon', () => '<span class="glow"></span>'],
  ['e2', 'Halo qui respire', 'la carte s’entoure d’un halo violet qui respire, un peu plus fort à chaque seconde', () => ''],
  ['e3', 'Étincelles', 'de petites étoiles dorées scintillent autour de la carte', () => SPARKS.map(([x, y], i) => `<span class="spk" style="left:${x}%;top:${y}%;animation-delay:${(i % 4) * .25}s">✦</span>`).join('')],
  ['e4', 'Reflet qui passe', 'un reflet de lumière traverse la carte chaque seconde, comme sur une vitre', () => '<span class="sweep"></span>'],
  ['e5', 'Coins qui s’allument', 'un coin rose s’allume à chaque seconde (5, 4, 3, 2…) ; les 4 coins passent au vert à la mise à jour', corners],
  ['e6', 'Guirlande', 'des ampoules dorées clignotent tout autour de la carte, comme une enseigne de fête foraine', () => `<span class="bulbs">${bulbs()}</span>`],
]
function draw() {
  document.getElementById('g').innerHTML = P.map(([cls, n, d, extra], i) => `<div class="opt"><div class="w ${cls} ${hot() ? 'hot' : ''} ${phase === 'busy' ? 'busy' : ''}" style="--k:${hot() ? 6 - left : 0}">${extra()}<div class="in"><div class="w-head">☀️ Météo · Cotonou</div><div class="w-big">${temp}°</div><div class="w-sub">Ensoleillé · ressenti ${temp + 3}°</div>${foot()}</div></div><p><b>${i + 1} · ${n}</b> : ${d}</p></div>`).join('')
}
setInterval(() => {
  if (phase === 'busy') { phase = 'ok'; last = new Date(); temp = 29 + Math.floor(Math.random() * 4) }
  else if (phase === 'ok') { phase = ''; left = RATE }
  else if (--left <= 0) phase = 'busy'
  draw()
}, 1000)
document.getElementById('again').onclick = () => { phase = ''; left = 7; draw() }
draw()
</script>
</body>
</html>
