<!doctype html>
<html lang="fr">
<head>
<meta name="referrer" content="no-referrer" />
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Morex YouTube widgets</title>
<link rel="icon" type="image/svg+xml" href="/logo.svg" />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root { --a1: #818cf8; --a2: #38bdf8; --glow: 99 102 241; --yt: #ff0033; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; font-family: Poppins, system-ui, sans-serif; color: #fff; background-color: #020617;
    background: linear-gradient(rgb(2 6 23 / .62), rgb(15 12 50 / .8)), url(/accueil_photo.jpg) 50% 28%/cover fixed; }
  h1 { text-align: center; font-weight: 600; margin: 0; padding-top: 36px; }
  .lead { text-align: center; color: rgb(255 255 255 / .65); margin: 8px auto 6px; max-width: 760px; }
  section { max-width: 1250px; margin: 0 auto; padding: 26px 20px 8px; }
  h2 { font-size: 19px; font-weight: 600; margin: 0 0 14px; } h2 code { font-size: 12px; font-weight: 400; color: rgb(255 255 255 / .55); margin-left: 8px; }
  .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  @media (max-width: 1000px) { .row { grid-template-columns: 1fr; } }
  .opt > p { margin: 10px 0 0; font-size: 13px; color: rgb(255 255 255 / .65); } .opt > p b { color: #fff; }
  .card { position: relative; overflow: hidden; border-radius: 24px; padding: 18px; height: 280px; display: flex; flex-direction: column; gap: 10px;
    background: rgb(255 255 255 / .08); border: 1px solid rgb(255 255 255 / .14); backdrop-filter: blur(22px); }
  .head { display: flex; align-items: center; gap: 10px; }
  .yt { width: 34px; height: 24px; border-radius: 7px; background: var(--yt); display: grid; place-items: center; flex: none; box-shadow: 0 4px 14px rgb(255 0 51 / .45); }
  .yt::after { content: ""; border-left: 9px solid #fff; border-top: 6px solid transparent; border-bottom: 6px solid transparent; margin-left: 2px; }
  .t { font-weight: 600; font-size: 14px; } .s { font-size: 11.5px; color: rgb(255 255 255 / .55); }
  .tab { font-variant-numeric: tabular-nums; }
  .clamp2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  a { color: inherit; text-decoration: none; }
  .foot { margin-top: auto; display: flex; justify-content: space-between; font-size: 11px; color: rgb(255 255 255 / .45); }
  .thumb { display: block; position: relative; border-radius: 14px; overflow: hidden; background: #111 center/cover; flex: none; }
  .thumb .play { position: absolute; inset: 0; display: grid; place-items: center; opacity: 0; transition: .25s; background: rgb(0 0 0 / .3); }
  .thumb:hover .play { opacity: 1; }
  .play i { width: 48px; height: 34px; border-radius: 10px; background: var(--yt); display: grid; place-items: center; }
  .play i::after { content: ""; border-left: 13px solid #fff; border-top: 8px solid transparent; border-bottom: 8px solid transparent; margin-left: 3px; }
  .dur { position: absolute; right: 8px; bottom: 8px; font-size: 11px; padding: 2px 7px; border-radius: 6px; background: rgb(0 0 0 / .7); }

  /* channel 1: hero */
  .ch1 .banner { position: absolute; inset: 0 0 auto; height: 90px; background: linear-gradient(120deg, var(--yt), #7c3aed 70%, var(--a2)); opacity: .75; }
  .ch1 .ava { position: relative; width: 74px; height: 74px; border-radius: 50%; margin: 44px auto 0; background: #222 center/cover; box-shadow: 0 0 0 4px rgb(15 23 42), 0 0 26px rgb(255 0 51 / .5); }
  .ch1 .name { text-align: center; font-weight: 700; font-size: 18px; margin-top: 4px; } .ch1 .handle { text-align: center; }
  .ch1 .nums { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; text-align: center; margin-top: auto; }
  .ch1 .nums div { padding: 8px 2px; border-radius: 14px; background: rgb(255 255 255 / .06); } .ch1 .nums b { display: block; font-size: 17px; }
  /* channel 2: big counter */
  .ch2 { align-items: center; justify-content: center; text-align: center; }
  .ch2 .ava { width: 54px; height: 54px; border-radius: 50%; background: #222 center/cover; box-shadow: 0 0 0 3px var(--yt); }
  .ch2 .count { font-size: 50px; font-weight: 800; letter-spacing: -.03em; line-height: 1; }
  .ch2 .label { letter-spacing: .3em; font-size: 11px; text-transform: uppercase; color: rgb(255 255 255 / .6); }
  .ch2 .sub-btn { margin-top: 6px; padding: 7px 18px; border-radius: 999px; background: #fff; color: #111; font-weight: 600; font-size: 13px; }
  /* channel 3: ring */
  .ch3 .body { flex: 1; display: grid; grid-template-columns: 130px 1fr; gap: 14px; align-items: center; }
  .ch3 .ring { position: relative; width: 130px; height: 130px; }
  .ch3 .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ch3 .ring .ava { position: absolute; inset: 18px; border-radius: 50%; background: #222 center/cover; }
  .ch3 dl { margin: 0; display: grid; gap: 8px; } .ch3 dt { font-size: 11px; color: rgb(255 255 255 / .55); } .ch3 dd { margin: 0; font-size: 20px; font-weight: 600; }

  /* latest 1: featured */
  .lv1 .thumb { height: 128px; }
  .lv1 .rest { display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; }
  .lv1 .rest a { display: flex; gap: 8px; align-items: center; } .lv1 .mini { width: 52px; height: 30px; border-radius: 6px; background: #111 center/cover; flex: none; }
  /* latest 2: carousel */
  .lv2 .track { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; flex: 1; scrollbar-width: none; }
  .lv2 .slide { flex: 0 0 82%; scroll-snap-align: start; display: flex; flex-direction: column; gap: 6px; }
  .lv2 .thumb { height: 140px; }
  .lv2 .new { position: absolute; left: 8px; top: 8px; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 6px; background: var(--yt); letter-spacing: .05em; }
  /* latest 3: timeline */
  .lv3 ol { list-style: none; margin: 0; padding: 0 0 0 16px; border-left: 2px solid rgb(255 0 51 / .5); display: flex; flex-direction: column; gap: 12px; }
  .lv3 li { position: relative; display: flex; gap: 10px; align-items: center; }
  .lv3 li::before { content: ""; position: absolute; left: -22px; width: 10px; height: 10px; border-radius: 50%; background: var(--yt); box-shadow: 0 0 10px var(--yt); }
  .lv3 .mini { width: 72px; height: 42px; border-radius: 8px; background: #111 center/cover; flex: none; }

  /* trending 1: podium list */
  .tr1 ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 9px; }
  .tr1 li { display: grid; grid-template-columns: 26px 60px 1fr; gap: 10px; align-items: center; font-size: 12.5px; }
  .tr1 .rank { font-size: 20px; font-weight: 800; color: transparent; -webkit-text-stroke: 1.5px rgb(255 255 255 / .6); text-align: center; }
  .tr1 li:first-child .rank { -webkit-text-stroke: 0; color: #fbbf24; text-shadow: 0 0 12px rgb(251 191 36 / .6); }
  .tr1 .mini { width: 60px; height: 34px; border-radius: 7px; background: #111 center/cover; }
  /* trending 2: mosaic */
  .tr2 .mosaic { flex: 1; display: grid; grid-template-columns: 2fr 1fr; grid-template-rows: 1fr 1fr 1fr; gap: 6px; }
  .tr2 .tile { position: relative; border-radius: 12px; background: #111 center/cover; overflow: hidden; }
  .tr2 .tile:first-child { grid-row: span 3; }
  .tr2 .tile span { position: absolute; left: 0; right: 0; bottom: 0; padding: 20px 8px 6px; font-size: 11px; background: linear-gradient(transparent, rgb(0 0 0 / .85)); }
  .tr2 .fire { position: absolute; top: 8px; left: 8px; font-size: 11px; padding: 2px 8px; border-radius: 999px; background: rgb(0 0 0 / .6); }
  /* trending 3: ticker */
  .tr3 .big { position: relative; flex: 1; border-radius: 16px; background: #111 center/cover; overflow: hidden; transition: background-image .6s; }
  .tr3 .big .shade { position: absolute; inset: 0; background: linear-gradient(transparent 30%, rgb(0 0 0 / .9)); }
  .tr3 .big .info { position: absolute; left: 12px; right: 12px; bottom: 10px; }
  .tr3 .big .num { font-size: 40px; font-weight: 800; line-height: 1; color: #fff; text-shadow: 0 2px 12px rgb(0 0 0 / .6); }
  .tr3 .bars { display: flex; gap: 5px; } .tr3 .bars i { flex: 1; height: 3px; border-radius: 2px; background: rgb(255 255 255 / .25); overflow: hidden; }
  .tr3 .bars i.on::after { content: ""; display: block; height: 100%; background: #fff; animation: fill 3.5s linear forwards; }
  @keyframes fill { from { width: 0; } to { width: 100%; } }

  /* video 1: big counters */
  .vs1 .thumb { height: 120px; }
  .vs1 .counts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: auto; }
  .vs1 .counts div { padding: 8px 4px; border-radius: 12px; background: rgb(255 255 255 / .06); text-align: center; font-size: 11px; color: rgb(255 255 255 / .6); }
  .vs1 .counts b { display: block; font-size: 16px; color: #fff; }
  /* video 2: player */
  .vs2 { padding: 0; }
  .vs2 .thumb { height: 170px; border-radius: 0; }
  .vs2 .bar { height: 4px; background: rgb(255 255 255 / .2); } .vs2 .bar i { display: block; height: 100%; width: 38%; background: var(--yt); }
  .vs2 .meta { padding: 10px 16px 14px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .vs2 .chips { display: flex; gap: 8px; flex-wrap: wrap; } .vs2 .chips span { font-size: 12px; padding: 4px 10px; border-radius: 999px; background: rgb(255 255 255 / .1); }
  /* video 3: like ratio */
  .vs3 .ratio { display: flex; flex-direction: column; gap: 6px; }
  .vs3 .gauge { height: 10px; border-radius: 999px; background: rgb(255 255 255 / .1); overflow: hidden; } .vs3 .gauge i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--yt), #fb7185); }
  .vs3 .odo { font-size: 40px; font-weight: 800; letter-spacing: -.02em; line-height: 1; }
</style>
</head>
<body>
<h1>Widgets YouTube, 3 propositions chacun</h1>
<p class="lead">Toutes les données viennent de ce que votre backend a vraiment renvoyé tout à l'heure. Dis-moi par exemple « Chaîne 1, Vidéos 2, Tendances 3, Vidéo 1 »</p>
<div id="app"></div>
<script>
const DATA = {"channel_stats": {"url": "https://www.youtube.com/channel/UCWeg2Pkate69NFdBeuRFTAw", "title": "SQUEEZIE", "views": 12038256497, "avatar": "https://yt3.ggpht.com/ytc/AIdro_mPZvx-xk6pbAYdC7G8jUZzgCNDDTg1ZfF0_Lwd8UpJT4M=s800-c-k-c0x00ffffff-no-rj", "handle": "@squeezie", "videos": 1876, "subscribers": 20200000}, "latest_videos": [{"id": "2QcaDwpvl7s", "url": "https://www.youtube.com/watch?v=2QcaDwpvl7s", "likes": 36195, "title": "Essayez de ne pas rire | Séquence inédite (Partie 3/3)", "views": 798278, "channel": "SQUEEZIE", "comments": 85, "thumbnail": "https://i.ytimg.com/vi/2QcaDwpvl7s/hqdefault.jpg", "publishedAt": "2026-09-04T20:27:43Z"}, {"id": "EdNjkLG9UbE", "url": "https://www.youtube.com/watch?v=EdNjkLG9UbE", "likes": 18788, "title": "Essayez de ne pas rire | Séquence inédite (Partie 2/3)", "views": 393526, "channel": "SQUEEZIE", "comments": 57, "thumbnail": "https://i.ytimg.com/vi/EdNjkLG9UbE/hqdefault.jpg", "publishedAt": "2026-09-04T20:24:28Z"}, {"id": "f7w2FjD151s", "url": "https://www.youtube.com/watch?v=f7w2FjD151s", "likes": 27893, "title": "Essayez de ne pas rire | Séquence inédite (Partie 1/3)", "views": 482992, "channel": "SQUEEZIE", "comments": 124, "thumbnail": "https://i.ytimg.com/vi/f7w2FjD151s/hqdefault.jpg", "publishedAt": "2026-09-04T20:21:47Z"}], "trending": [{"id": "7y2ibQtuxmw", "url": "https://www.youtube.com/watch?v=7y2ibQtuxmw", "likes": 7004, "title": "Tiakola, Kuluna, TVLM & Nooche - Bottega (Track5)", "views": 85228, "channel": "TIAKOLA", "comments": 307, "thumbnail": "https://i.ytimg.com/vi/7y2ibQtuxmw/hqdefault.jpg", "publishedAt": "2026-09-24T22:00:34Z"}, {"id": "U3X5JiEPATk", "url": "https://www.youtube.com/watch?v=U3X5JiEPATk", "likes": 144, "title": "CAMEMBERT Bande Annonce (2026) Alex Lutz", "views": 60013, "channel": "Allociné | Bandes Annonces", "comments": 25, "thumbnail": "https://i.ytimg.com/vi/U3X5JiEPATk/hqdefault.jpg", "publishedAt": "2026-09-24T13:01:30Z"}, {"id": "mMi0WRH10FY", "url": "https://www.youtube.com/watch?v=mMi0WRH10FY", "likes": 8566, "title": "Un jeu où je dois trouver une Aiguille dans un Tas de Foin (ça m'a prit 4 jours...)", "views": 265899, "channel": "Fiouze", "comments": 330, "thumbnail": "https://i.ytimg.com/vi/mMi0WRH10FY/hqdefault.jpg", "publishedAt": "2026-09-24T16:48:15Z"}, {"id": "V-uIp-WuD60", "url": "https://www.youtube.com/watch?v=V-uIp-WuD60", "likes": 39333, "title": "Patient Zero", "views": 589431, "channel": "Taylor Swift - Topic", "comments": 2783, "thumbnail": "https://i.ytimg.com/vi/V-uIp-WuD60/hqdefault.jpg", "publishedAt": "2026-09-25T04:02:10Z"}], "video_stats": {"id": "dQw4w9WgXcQ", "url": "https://www.youtube.com/watch?v=dQw4w9WgXcQ", "likes": 19413304, "title": "Rick Astley - Never Gonna Give You Up (Official Video) (4K Remaster)", "views": 1819731902, "channel": "Rick Astley", "comments": 2457632, "thumbnail": "https://i.ytimg.com/vi/dQw4w9WgXcQ/hqdefault.jpg", "publishedAt": "2009-10-25T06:57:33Z"}}
const fmt = (n) => n == null ? '—' : n >= 1e9 ? `${(n / 1e9).toLocaleString('fr-FR', { maximumFractionDigits: 1 })} Md` : n >= 1e6 ? `${(n / 1e6).toLocaleString('fr-FR', { maximumFractionDigits: 1 })} M` : n >= 1e3 ? `${(n / 1e3).toLocaleString('fr-FR', { maximumFractionDigits: 1 })} k` : String(n)
const full = (n) => n == null ? '—' : n.toLocaleString('fr-FR')
const ago = (iso) => {
  const s = (Date.now() - new Date(iso)) / 1000, rtf = new Intl.RelativeTimeFormat('fr', { numeric: 'auto' })
  for (const [lim, unit, div] of [[3600, 'minute', 60], [86400, 'hour', 3600], [2592000, 'day', 86400], [31536000, 'month', 2592000]]) if (s < lim) return rtf.format(-Math.round(s / div), unit)
  return rtf.format(-Math.round(s / 31536000), 'year')
}
const ava = () => `<img src="${C.avatar}" alt="" referrerpolicy="no-referrer" style="width:100%;height:100%;border-radius:50%;object-fit:cover;display:block">`
const bg = (url) => `style="background-image:url('${url}')"`
const head = (t, s) => `<div class="head"><span class="yt" aria-hidden="true"></span><div><div class="t">${t}</div><div class="s">${s}</div></div></div>`
const foot = (rate) => `<div class="foot"><span>Toutes les ${rate}</span><span>Mis à jour à ${new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })}</span></div>`
const thumb = (v, h = '') => `<a class="thumb" href="${v.url}" target="_blank" rel="noopener" ${bg(v.thumbnail)} ${h} aria-label="${v.title.replace(/"/g, '')}"><span class="play"><i></i></span></a>`

const C = DATA.channel_stats, L = DATA.latest_videos, T = DATA.trending, V = DATA.video_stats
const ringPct = Math.min(1, (C.subscribers ?? 0) / 20e6), R = 2 * Math.PI * 58

const sections = [
  ['📺 Statistiques de la chaîne', 'channel_stats', [
    ['Carte profil', 'bannière, avatar au centre, 3 chiffres en dessous', `<div class="card ch1"><div class="banner"></div><a href="${C.url}" target="_blank" rel="noopener" class="ava" aria-label="${C.title}">${ava()}</a>
      <div><div class="name">${C.title}</div><div class="s handle">${C.handle ?? ''}</div></div>
      <div class="nums"><div><b class="tab">${fmt(C.subscribers)}</b><span class="s">abonnés</span></div><div><b class="tab">${fmt(C.views)}</b><span class="s">vues</span></div><div><b class="tab">${fmt(C.videos)}</b><span class="s">vidéos</span></div></div></div>`],
    ['Compteur géant', 'le nombre d’abonnés en énorme, comme un compteur en direct', `<div class="card ch2"><div class="ava">${ava()}</div><div class="t">${C.title}</div>
      <div class="count tab">${full(C.subscribers)}</div><div class="label">abonnés</div><a class="sub-btn" href="${C.url}" target="_blank" rel="noopener">Voir la chaîne</a></div>`],
    ['Anneau', 'l’avatar entouré d’un anneau rouge qui montre la progression vers 20 M d’abonnés', `<div class="card ch3">${head(C.title, C.handle ?? '')}
      <div class="body"><div class="ring"><svg viewBox="0 0 130 130" aria-hidden="true"><circle cx="65" cy="65" r="58" fill="none" stroke="rgb(255 255 255 / .1)" stroke-width="8"/><circle cx="65" cy="65" r="58" fill="none" stroke="#ff0033" stroke-width="8" stroke-linecap="round" stroke-dasharray="${R}" stroke-dashoffset="${R * (1 - ringPct)}"/></svg><div class="ava">${ava()}</div></div>
      <dl><div><dt>Abonnés</dt><dd class="tab">${fmt(C.subscribers)}</dd></div><div><dt>Vues totales</dt><dd class="tab">${fmt(C.views)}</dd></div><div><dt>Vidéos</dt><dd class="tab">${full(C.videos)}</dd></div></dl></div>${foot('5 min')}</div>`],
  ]],
  ['🎬 Dernières vidéos', 'latest_videos', [
    ['À la une', 'la dernière vidéo en grand, les suivantes en petit', `<div class="card lv1">${head('Dernières vidéos', C.title)}${thumb(L[0])}
      <div class="t clamp2" style="font-size:13px">${L[0].title}</div>
      <div class="rest">${L.slice(1).map((v) => `<a href="${v.url}" target="_blank" rel="noopener"><span class="mini" ${bg(v.thumbnail)}></span><span class="clamp2">${v.title}</span></a>`).join('')}</div></div>`],
    ['Carrousel', 'on fait défiler les vidéos au doigt, badge NOUVEAU sur la plus récente', `<div class="card lv2">${head('Dernières vidéos', C.title)}
      <div class="track">${L.map((v, i) => `<div class="slide"><div style="position:relative">${thumb(v)}${i === 0 ? '<span class="new">NOUVEAU</span>' : ''}</div>
        <div class="t clamp2" style="font-size:12.5px">${v.title}</div><div class="s">${fmt(v.views)} vues · ${ago(v.publishedAt)}</div></div>`).join('')}</div></div>`],
    ['Frise', 'une ligne du temps rouge avec la date de chaque vidéo', `<div class="card lv3">${head('Dernières vidéos', C.title)}
      <ol>${L.map((v) => `<li><a class="mini" href="${v.url}" target="_blank" rel="noopener" ${bg(v.thumbnail)} aria-label="${v.title.replace(/"/g, '')}"></a><div><div class="clamp2" style="font-size:12.5px;font-weight:500">${v.title}</div><div class="s">${ago(v.publishedAt)} · ${fmt(v.views)} vues</div></div></li>`).join('')}</ol>${foot('10 min')}</div>`],
  ]],
  ['🔥 Tendances', 'trending', [
    ['Classement', 'numéros en contour, le n°1 en or', `<div class="card tr1">${head('Tendances', 'France 🇫🇷')}
      <ol>${T.map((v, i) => `<li><span class="rank">${i + 1}</span><a class="mini" href="${v.url}" target="_blank" rel="noopener" ${bg(v.thumbnail)} aria-label="${v.title.replace(/"/g, '')}"></a><div><div class="clamp2">${v.title}</div><div class="s">${v.channel} · ${fmt(v.views)} vues</div></div></li>`).join('')}</ol></div>`],
    ['Mosaïque', 'la n°1 en grand, les autres empilées à côté', `<div class="card tr2">${head('Tendances', 'France 🇫🇷')}
      <div class="mosaic">${T.slice(0, 4).map((v, i) => `<a class="tile" href="${v.url}" target="_blank" rel="noopener" ${bg(v.thumbnail)}>${i === 0 ? '<b class="fire">🔥 n°1</b>' : ''}<span class="clamp2">${v.title}</span></a>`).join('')}</div></div>`],
    ['Stories', 'une tendance à la fois, qui change toute seule comme une story Instagram', `<div class="card tr3">${head('Tendances', 'France 🇫🇷')}
      <div class="bars" id="trBars">${T.map((_, i) => `<i class="${i === 0 ? 'on' : ''}"></i>`).join('')}</div>
      <a class="big" id="trBig" target="_blank" rel="noopener"><div class="shade"></div><div class="info"><div class="num" id="trNum">#1</div><div class="clamp2 t" id="trTitle"></div><div class="s" id="trMeta"></div></div></a></div>`],
  ]],
  ['▶️ Statistiques d’une vidéo', 'video_stats', [
    ['Trois compteurs', 'la miniature puis vues, likes et commentaires', `<div class="card vs1">${head(V.channel, 'Statistiques vidéo')}${thumb(V)}
      <div class="t clamp2" style="font-size:12.5px">${V.title}</div>
      <div class="counts"><div><b class="tab">${fmt(V.views)}</b>👁 vues</div><div><b class="tab">${fmt(V.likes)}</b>👍 likes</div><div><b class="tab">${fmt(V.comments)}</b>💬 comm.</div></div></div>`],
    ['Lecteur', 'façon lecteur YouTube avec sa barre rouge, les chiffres en pastilles', `<div class="card vs2">${thumb(V)}<div class="bar"><i></i></div>
      <div class="meta"><div class="t clamp2">${V.title}</div><div class="s">${V.channel} · ${ago(V.publishedAt)}</div>
      <div class="chips"><span>👁 ${fmt(V.views)}</span><span>👍 ${fmt(V.likes)}</span><span>💬 ${fmt(V.comments)}</span></div></div></div>`],
    ['Jauge de likes', 'le nombre de vues en énorme et la part de likes par rapport aux vues', `<div class="card vs3">${head(V.channel, V.title)}
      <div class="odo tab">${full(V.views)}</div><div class="s">vues</div>
      <div class="ratio"><div style="display:flex;justify-content:space-between" class="s"><span>👍 ${fmt(V.likes)} likes</span><span>${((V.likes / V.views) * 100).toLocaleString('fr-FR', { maximumFractionDigits: 1 })} % des vues</span></div>
      <div class="gauge"><i style="width:${Math.min(100, (V.likes / V.views) * 100 * 10)}%"></i></div><div class="s">💬 ${full(V.comments)} commentaires</div></div>${foot('10 min')}</div>`],
  ]],
]
let n = 0
document.getElementById('app').innerHTML = sections.map(([title, key, opts]) => `<section><h2>${title}<code>${key}</code></h2><div class="row">${opts.map(([name, desc, html], i) => `<div class="opt">${html}<p><b>${i + 1} · ${name}</b> : ${desc}</p></div>`).join('')}</div></section>`).join('') + '<div style="height:50px"></div>'

// Stories: rotate through the trending videos
let k = 0
function showTrend() {
  const v = T[k]
  const big = document.getElementById('trBig'); big.href = v.url; big.style.backgroundImage = `url('${v.thumbnail}')`
  document.getElementById('trNum').textContent = `#${k + 1}`
  document.getElementById('trTitle').textContent = v.title
  document.getElementById('trMeta').textContent = `${v.channel} · ${fmt(v.views)} vues`
  document.querySelectorAll('#trBars i').forEach((b, i) => { b.className = i < k ? 'on done' : i === k ? '' : ''; if (i === k) { void b.offsetWidth; b.className = 'on' } })
}
showTrend(); setInterval(() => { k = (k + 1) % T.length; showTrend() }, 3500)
</script>
</body>
