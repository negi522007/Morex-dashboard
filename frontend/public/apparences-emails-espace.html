<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Morex emails galaxie</title>
<link rel="icon" type="image/svg+xml" href="/logo.svg" />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; font-family: Poppins, system-ui, sans-serif; color: #fff; background-color: #020617;
    background: linear-gradient(rgb(2 6 23 / .45), rgb(15 12 50 / .7)), url(/accueil_photo.jpg) 50% 28%/cover fixed; }
  h1.top { text-align: center; font-weight: 600; margin: 0; padding-top: 34px; }
  .lead { text-align: center; color: rgb(255 255 255 / .78); margin: 8px auto 18px; max-width: 900px; padding: 0 16px; font-size: 14.5px; }
  .kinds { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-bottom: 26px; }
  .kinds button { font: inherit; font-size: 13px; padding: 8px 16px; border-radius: 999px; border: 1px solid rgb(255 255 255 / .25); background: transparent; color: #fff; cursor: pointer; }
  .kinds button.on { background: #fff; color: #1e1b4b; font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px; max-width: 1200px; margin: 0 auto; padding: 0 20px 60px; }
  @media (max-width: 1000px) { .grid { grid-template-columns: 1fr; max-width: 620px; } }
  .opt > p { margin: 12px 0 0; font-size: 13px; color: rgb(255 255 255 / .78); } .opt > p b { color: #fff; }
  /* a mail client around the email */
  .client { border-radius: 18px; overflow: hidden; background: #f1f3f4; color: #202124; box-shadow: 0 20px 50px rgb(0 0 0 / .45); }
  .client .hd { padding: 14px 18px; background: #fff; border-bottom: 1px solid #e5e7eb; font-family: Arial, sans-serif; }
  .client .subj { font-size: 17px; margin-bottom: 8px; } .client .from { display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: #5f6368; }
  .client .from i { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-style: normal; background: #4f46e5; color: #fff; font-weight: 700; }
  .client .from b { color: #202124; }
  .client .bd { padding: 18px; max-height: 640px; overflow: auto; }
  /* everything inside .mail uses email-safe CSS only: tables, inline colours, border-radius, text stars (no SVG, no animation) */
  .mail { font-family: Arial, Helvetica, sans-serif; }
</style>
</head>
<body>
<h1 class="top">Les emails, version galaxie</h1>
<p class="lead">Les emails que Morex envoie, dans l’univers de la page. Point important : Gmail n’affiche ni les animations ni les dessins SVG dans un email. Ces maquettes n’utilisent donc que ce qui marche partout (couleurs, dégradés, arrondis, étoiles en caractères ✦ · ★ et emojis)</p>
<div class="kinds" id="k"></div>
<div class="grid" id="g"></div>
<script>
const NAME = 'Axelle'
const BTN = (label, bg = '#7c3aed', fg = '#fff') => `<table role="presentation" style="margin:22px auto 10px"><tr><td style="border-radius:999px;background:${bg}"><a href="#" style="display:inline-block;padding:13px 30px;font:700 15px Arial;color:${fg};text-decoration:none;border-radius:999px">${label}</a></td></tr></table>`
const WORD = (c = '#c4b5fd') => `<div style="letter-spacing:.3em;font-size:11px;font-weight:700;color:${c};text-transform:uppercase">✦ Morex ✦</div>`
// scattered stars as text, positioned with a table: works in every mail client
const SKY = (rows = 2, c = '#c7d2fe') => Array.from({ length: rows }, (_, r) => `<tr>${Array.from({ length: 7 }, (_, i) => `<td style="text-align:center;font-size:${[8, 11, 6, 13, 7, 9, 10][(i + r * 3) % 7]}px;color:${c};opacity:${[.9, .5, .7, 1, .4, .8, .6][(i + r * 2) % 7]};height:18px">${(i + r) % 3 === 0 ? '✦' : (i + r) % 3 === 1 ? '·' : '★'}</td>`).join('')}</tr>`).join('')
const skyTable = (rows, c) => `<table role="presentation" width="100%" style="border-collapse:collapse">${SKY(rows, c)}</table>`
const DARK = 'background:#0b1026;background-image:linear-gradient(180deg,#1e1b4b 0%,#0b1026 55%,#020617 100%);'
// envelope constellation drawn with a table: 4 corner stars, violet border lines, star in the middle
const ENV_CONS = `<table role="presentation" style="margin:6px auto 0;border-collapse:collapse"><tr><td style="width:14px;font-size:14px;color:#fff;text-align:center;line-height:14px">✦</td><td style="border-top:1.5px solid #a78bfa;width:130px"></td><td style="width:14px;font-size:14px;color:#fff;text-align:center;line-height:14px">✦</td></tr>
  <tr><td style="border-left:1.5px solid #a78bfa;height:64px"></td><td style="text-align:center;vertical-align:top;color:#c4b5fd;font-size:13px;line-height:16px">╲&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;╱<br><span style="color:#fde047;font-size:16px">★</span></td><td style="border-right:1.5px solid #a78bfa"></td></tr>
  <tr><td style="font-size:14px;color:#fff;text-align:center;line-height:14px">✦</td><td style="border-bottom:1.5px solid #a78bfa"></td><td style="font-size:14px;color:#fff;text-align:center;line-height:14px">✦</td></tr></table>`

const KINDS = {
  confirm: { label: '💌 Email de confirmation', subject: 'Un petit mot de Morex 💌', designs: [
    ['Constellation', 'la suite logique de l’écran d’inscription : sur un ciel de nuit, des étoiles dessinent la même enveloppe, avec l’étoile dorée au centre', `
      <div class="mail" style="max-width:520px;margin:0 auto;border-radius:22px;overflow:hidden;${DARK}color:#e0e7ff;text-align:center">
        ${skyTable(2)}
        <div style="padding:0 34px 30px">${WORD()}${ENV_CONS}
          <h1 style="font:700 30px Georgia,serif;margin:22px 0 8px;color:#fff">Salut ${NAME} ✨</h1>
          <p style="font-size:15px;line-height:1.6;margin:0;color:#c7d2fe">Une nouvelle étoile vient d’apparaître dans l’univers Morex : la tienne. Dis-nous que c’est bien toi et on l’allume.</p>
          ${BTN('Oui, c’est moi')}
          <p style="font-size:12px;color:#94a3b8;margin:14px 0 0;line-height:1.6">Pas toi ? Ignore simplement ce message : rien n’est activé, et la demande disparaît au bout de 24 heures.</p>
        </div>${skyTable(1, '#818cf8')}
      </div>`],
    ['Planète', 'une grande planète violette en haut de l’email avec la lettre 💌 à côté (pas d’animation possible dans un email) ; le texte en blanc sur le ciel', `
      <div class="mail" style="max-width:520px;margin:0 auto;border-radius:22px;overflow:hidden;${DARK}color:#e0e7ff;text-align:center">
        ${skyTable(1)}
        <div style="padding:6px 34px 30px">
          <table role="presentation" style="margin:0 auto"><tr><td style="position:relative;width:170px;height:120px;text-align:center;vertical-align:middle">
            <div style="width:96px;height:96px;margin:0 auto;border-radius:50%;background:#8b5cf6;background-image:radial-gradient(circle at 32% 28%,#fbcfe8,#a78bfa 45%,#4c1d95 85%);box-shadow:0 0 40px rgba(167,139,250,.55)"></div>
          </td><td style="vertical-align:top;font-size:26px;padding-top:6px">💌</td></tr></table>
          <div style="height:2px;width:220px;margin:-58px auto 60px;border-radius:50%;border-top:1.5px dashed rgba(255,255,255,.35)"></div>
          ${WORD()}
          <h1 style="font:700 28px Arial;margin:14px 0 8px;color:#fff">Bienvenue en orbite, ${NAME} !</h1>
          <p style="font-size:15px;line-height:1.6;margin:0;color:#c7d2fe">Ton univers Morex est prêt à décoller. Un clic pour confirmer que c’est bien toi.</p>
          ${BTN('Oui, c’est moi', '#fff', '#1e1b4b')}
          <p style="font-size:12px;color:#94a3b8;margin:14px 0 0">Pas toi ? Ignore ce message, rien n’est activé.</p>
        </div>
      </div>`],
    ['Carte d’embarquement', 'un billet « Morex Airlines » pour ton univers : passager, destination, validité 24 h, et le bouton pour embarquer', `
      <div class="mail" style="max-width:520px;margin:0 auto;padding:26px;border-radius:22px;${DARK}text-align:center">
        ${WORD()}
        <table role="presentation" width="100%" style="margin-top:16px;border-collapse:separate;border-radius:18px;overflow:hidden;background:#fff;color:#0f172a;text-align:left">
          <tr><td colspan="2" style="padding:14px 20px;background:#4f46e5;background-image:linear-gradient(135deg,#4f46e5,#0ea5e9);color:#fff;font:700 12px Arial;letter-spacing:.2em">✈ BOARDING PASS · MOREX</td></tr>
          <tr><td style="padding:18px 20px 4px"><div style="font:700 26px 'Courier New',monospace">TERRE</div><div style="font-size:11px;color:#64748b">Ta boîte mail</div></td>
              <td style="padding:18px 20px 4px;text-align:right"><div style="font:700 26px 'Courier New',monospace">MRX</div><div style="font-size:11px;color:#64748b">Ton univers</div></td></tr>
          <tr><td style="padding:10px 20px"><div style="font:700 10px Arial;letter-spacing:.12em;color:#94a3b8">PASSAGER</div>${NAME}</td><td style="padding:10px 20px;text-align:right"><div style="font:700 10px Arial;letter-spacing:.12em;color:#94a3b8">VALIDITÉ</div>24 heures</td></tr>
          <tr><td colspan="2" style="padding:6px 20px 20px;border-top:2px dashed #e2e8f0;text-align:center">${BTN('Oui, j’embarque ✈', '#4f46e5')}<div style="font-size:11.5px;color:#64748b">Pas toi ? Ignore ce message, rien n’est activé.</div></td></tr>
        </table>
      </div>`],
    ['Petit mot étoilé', 'on garde le carnet crème actuel (que tu aimes bien), mais posé sur le ciel de nuit, avec des étoiles autour et un scotch violet', `
      <div class="mail" style="max-width:520px;margin:0 auto;padding:18px 26px 30px;border-radius:22px;${DARK}text-align:center">
        ${skyTable(1)}
        <div style="margin:10px auto 0;max-width:420px;padding:34px 30px 26px;border-radius:6px;background:#fffaf0;background-image:repeating-linear-gradient(#fffaf0 0 29px,#e9dcf7 29px 30px);color:#3b2f5c;box-shadow:0 18px 40px rgba(0,0,0,.5)">
          <div style="width:110px;height:22px;margin:-46px auto 18px;background:#a78bfa;opacity:.85"></div>
          ${WORD('#7c3aed')}
          <h1 style="font:700 34px 'Caveat','Segoe Script','Comic Sans MS',cursive;margin:10px 0 8px;color:#7c3aed">Coucou ${NAME} !</h1>
          <p style="font-size:15px;line-height:1.6;margin:0">Ton univers Morex t’attend. Clique juste ici pour nous dire que c’est bien toi, et on allume les étoiles ✦</p>
          ${BTN('Oui, c’est moi')}
          <p style="font-size:12px;opacity:.7;margin:10px 0 0">Pas toi ? Ignore simplement ce message.</p>
        </div>
        ${skyTable(1, '#818cf8')}
      </div>`],
  ] },
  alert: { label: '🔔 Email d’alerte (seuil dépassé)', subject: 'Alerte Morex : Bitcoin', designs: [
    ['Étoile filante', 'un ciel de nuit avec une étoile filante, le nom du widget et la valeur en très grand, le seuil juste dessous', `
      <div class="mail" style="max-width:520px;margin:0 auto;border-radius:22px;overflow:hidden;${DARK}color:#e0e7ff;text-align:center">
        ${skyTable(1)}
        <div style="padding:4px 34px 30px">${WORD()}
          <div style="font-size:34px;margin:14px 0 4px">☄️</div>
          <p style="font-size:14px;color:#c7d2fe;margin:0">Ton alerte vient de se déclencher</p>
          <h1 style="font:700 22px Arial;margin:6px 0 16px;color:#fff">Bitcoin</h1>
          <div style="display:inline-block;padding:16px 30px;border-radius:18px;background:rgba(255,255,255,.07);border:1px solid rgba(167,139,250,.4)">
            <div style="font:700 38px Arial;color:#fde047">84 210 $</div>
            <div style="font-size:13px;color:#a5b4fc;margin-top:4px">▲ au-dessus de ton seuil de 80 000 $</div>
          </div>
          ${BTN('Voir mon dashboard')}
          <p style="font-size:11.5px;color:#94a3b8;margin:10px 0 0">Tu reçois cet email car tu as créé cette alerte dans Morex. Tu peux la couper depuis le widget.</p>
        </div>
      </div>`],
    ['Radar du vaisseau', 'un écran de bord : voyant qui clignote (rouge ou vert selon le sens), jauge qui montre où est la valeur par rapport au seuil', `
      <div class="mail" style="max-width:520px;margin:0 auto;padding:26px 30px;border-radius:22px;${DARK}color:#e0e7ff">
        <table role="presentation" width="100%"><tr><td>${WORD()}</td><td style="text-align:right;font:700 11px Arial;letter-spacing:.2em;color:#34d399">● SIGNAL REÇU</td></tr></table>
        <h1 style="font:700 24px Arial;margin:18px 0 4px;color:#fff">🛰️ Bitcoin a franchi ton seuil</h1>
        <p style="margin:0;color:#c7d2fe;font-size:14px">Il vaut maintenant <b style="color:#fff">84 210 $</b>.</p>
        <table role="presentation" width="100%" style="margin:20px 0 6px;border-collapse:collapse"><tr>
          <td style="width:62%;height:10px;background:#8b5cf6;background-image:linear-gradient(90deg,#38bdf8,#a78bfa);border-radius:999px 0 0 999px"></td>
          <td style="width:4px;background:#fde047"></td>
          <td style="height:10px;background:rgba(255,255,255,.12);border-radius:0 999px 999px 0"></td></tr></table>
        <table role="presentation" width="100%" style="font-size:11.5px;color:#94a3b8"><tr><td>0</td><td style="text-align:center;color:#fde047">seuil 80 000 $</td><td style="text-align:right">▲ 84 210 $</td></tr></table>
        ${BTN('Ouvrir le widget')}
        <p style="font-size:11.5px;color:#94a3b8;margin:10px 0 0;text-align:center">Prochaine alerte possible dans 60 min au plus tôt.</p>
      </div>`],
    ['Carte postale de l’espace', 'une carte postale envoyée « depuis l’orbite du Bitcoin » : un mot à la main à gauche, la valeur et le seuil à droite, timbre planète', `
      <div class="mail" style="max-width:520px;margin:0 auto;padding:22px;border-radius:22px;${DARK}">
        <table role="presentation" width="100%" style="border-collapse:collapse;border-radius:14px;overflow:hidden;background:#fffaf0;color:#3b2f5c"><tr>
          <td style="width:52%;padding:20px;vertical-align:top;border-right:1px solid #e9dcf7">
            <div style="font:700 26px 'Caveat','Segoe Script','Comic Sans MS',cursive;color:#7c3aed">Salut ${NAME} !</div>
            <div style="font:500 19px/1.3 'Caveat','Segoe Script','Comic Sans MS',cursive;margin-top:6px">Petite nouvelle depuis l’orbite du Bitcoin : il vient de passer au-dessus de ton seuil ✦</div>
          </td>
          <td style="padding:20px;vertical-align:top;text-align:right">
            <div style="display:inline-block;width:44px;height:50px;line-height:50px;text-align:center;font-size:24px;background:#fde68a;border:2px dashed #f59e0b">🪐</div>
            <div style="font:700 26px Arial;margin-top:14px;color:#1e1b4b">84 210 $</div>
            <div style="font-size:12px;color:#64748b">seuil : 80 000 $</div>
          </td></tr></table>
        <div style="text-align:center">${BTN('Voir mon dashboard')}</div>
      </div>`],
    ['Notification discrète', 'une version courte et sobre, pour une alerte qu’on reçoit souvent : bandeau étoilé fin, une ligne, un bouton', `
      <div class="mail" style="max-width:520px;margin:0 auto;border-radius:18px;overflow:hidden;background:#fff;color:#1e1b4b;border:1px solid #e5e7eb">
        <div style="padding:14px 22px;${DARK}color:#c7d2fe;font-size:12px;letter-spacing:.2em;font-weight:700">✦ · MOREX · ALERTE · ✦ · ★ ·</div>
        <div style="padding:22px">
          <table role="presentation"><tr><td style="font-size:28px;padding-right:14px">☄️</td><td><div style="font:700 17px Arial">Bitcoin : 84 210 $</div><div style="font-size:13px;color:#64748b;margin-top:2px">au-dessus de ton seuil de 80 000 $</div></td></tr></table>
          <a href="#" style="display:inline-block;margin-top:16px;font:700 13px Arial;color:#7c3aed;text-decoration:none">Voir le widget →</a>
        </div>
      </div>`],
  ] },
}
let cur = 'confirm'
function draw() {
  document.getElementById('k').innerHTML = Object.entries(KINDS).map(([k, v]) => `<button class="${k === cur ? 'on' : ''}" data-k="${k}">${v.label}</button>`).join('')
  const K = KINDS[cur]
  document.getElementById('g').innerHTML = K.designs.map(([n, d, h], i) => `<div class="opt"><div class="client"><div class="hd"><div class="subj">${K.subject}</div><div class="from"><i>M</i><span><b>Morex</b> &lt;noreply@morex.app&gt; · à moi</span></div></div><div class="bd">${h}</div></div><p><b>${i + 1} · ${n}</b> : ${d}</p></div>`).join('')
}
document.addEventListener('click', (e) => { const b = e.target.closest('[data-k]'); if (b) { cur = b.dataset.k; draw() } })
draw()
</script>
</body>
</html>
