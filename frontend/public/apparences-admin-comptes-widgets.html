<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Morex comptes et widgets</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<!-- The real console styles, so this mockup looks exactly like the page (served by Vite in dev) -->
<link rel="stylesheet" href="/src/styles/morex.css">
<link rel="stylesheet" href="/src/styles/admin.css">
<style>
  .switch { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 50; display: flex; gap: 6px; padding: 8px; border-radius: 999px; background: rgb(15 23 42 / .92); border: 1px solid rgb(255 255 255 / .2); box-shadow: 0 10px 30px rgb(0 0 0 / .5); backdrop-filter: blur(12px); }
  .switch span { align-self: center; font-size: 12.5px; color: rgb(255 255 255 / .6); padding: 0 8px; }
  .switch button { font: inherit; font-size: 13px; padding: 8px 15px; border-radius: 999px; border: 0; background: transparent; color: #fff; cursor: pointer; }
  .switch button.on { background: #fff; color: #1e1b4b; font-weight: 600; }
  /* widgets section (the 4 proposals) */
  .wsec { margin-top: 28px; padding-top: 22px; border-top: 1px solid rgb(255 255 255 / .08); position: relative; }
  .wsec-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .wsec-head .t { font-size: 12.5px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--a2, #38bdf8); }
  .wsec-head .pill { padding: 4px 11px; border-radius: 999px; font-size: 12.5px; font-weight: 600; } .ok { background: rgb(52 211 153 / .16); color: #a7f3d0; } .bad { background: rgb(248 113 113 / .2); color: #fecaca; }
  .ic { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; font-size: 18px; flex: none; background: color-mix(in srgb, var(--c) 30%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 60%, transparent); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
  .tile { padding: 14px; border-radius: 16px; background: rgb(255 255 255 / .05); border: 1px solid rgb(255 255 255 / .08); display: flex; flex-direction: column; gap: 8px; }
  .tile.err { border-color: rgb(248 113 113 / .5); background: rgb(127 29 29 / .18); }
  .tile .top { display: flex; align-items: center; gap: 10px; } .tile b { font-size: 14px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .tile small { font-size: 12px; color: rgb(255 255 255 / .55); }
  .tile .st { font-size: 12px; display: flex; align-items: center; gap: 6px; } .tile .st i { width: 8px; height: 8px; border-radius: 50%; background: #34d399; box-shadow: 0 0 8px #34d399; } .tile.err .st i { background: #f87171; box-shadow: 0 0 8px #f87171; }
  .tile code { font-size: 11px; color: #fecaca; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .grp { margin-bottom: 12px; border-radius: 16px; background: rgb(255 255 255 / .04); overflow: hidden; }
  .grp .gh { display: flex; align-items: center; gap: 12px; padding: 10px 14px; background: color-mix(in srgb, var(--c) 14%, transparent); } .grp .gh b { font-size: 14.5px; } .grp .gh .n { margin-left: auto; font-size: 12.5px; color: rgb(255 255 255 / .65); }
  .grp .row { display: grid; grid-template-columns: 1fr 130px 160px; gap: 12px; align-items: center; padding: 10px 14px 10px 64px; border-top: 1px solid rgb(255 255 255 / .06); font-size: 13.5px; }
  .grp .row small { color: rgb(255 255 255 / .55); font-size: 12px; } .grp .okk { color: #6ee7b7; font-size: 12.5px; } .grp .ko { color: #fca5a5; font-weight: 600; font-size: 12.5px; }
  .mini { display: grid; grid-template-columns: repeat(6, 1fr); grid-auto-rows: 60px; gap: 9px; padding: 14px; border-radius: 18px; background: rgb(2 6 23 / .55); border: 1px solid rgb(255 255 255 / .08); }
  .mt { border-radius: 13px; padding: 9px 11px; background: linear-gradient(140deg, color-mix(in srgb, var(--c) 45%, transparent), rgb(255 255 255 / .04)); border: 1px solid color-mix(in srgb, var(--c) 50%, transparent); display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; position: relative; }
  .mt b { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .mt span { font-size: 17px; } .mt.w2 { grid-column: span 2; } .mt.h2 { grid-row: span 2; }
  .mt.err::after { content: '!'; position: absolute; top: 6px; right: 8px; width: 18px; height: 18px; border-radius: 50%; background: #ef4444; display: grid; place-items: center; font-size: 11px; font-weight: 800; }
  .orb { position: relative; height: 400px; border-radius: 18px; overflow: hidden; background: radial-gradient(ellipse at 50% 50%, rgb(99 102 241 / .25), transparent 65%), rgb(2 6 23 / .55); }
  .orb .ring { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); border-radius: 50%; border: 1px dashed rgb(255 255 255 / .12); }
  .orb .center { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 86px; height: 86px; border-radius: 50%; box-shadow: 0 0 0 4px var(--c), 0 0 40px var(--c); }
  .orb .pl { position: absolute; transform: translate(-50%, -50%); width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font-size: 18px; background: color-mix(in srgb, var(--c) 40%, #0f172a); border: 1px solid var(--c); box-shadow: 0 0 14px var(--c); cursor: help; }
  .orb .pl.err { outline: 2px solid #f87171; outline-offset: 4px; } .orb .pl b { position: absolute; top: 100%; margin-top: 4px; font-size: 10.5px; font-weight: 500; white-space: nowrap; opacity: .85; }
</style>
</head>
<body class="morex" data-theme="galaxy">
<div id="app"></div>
<div class="switch" id="switch"></div>
<script>
const AV = (seed) => `https://api.dicebear.com/9.x/avataaars/svg?seed=${encodeURIComponent(seed)}&backgroundColor=c0aede,b6e3f4,ffd5dc,d1d4f9`
const D = 864e5, NOW = Date.now()
const U = [
  { n: 'Morayo ELEGBEDE', e: 'bachiratou09@gmail.com', st: 'admin', at: NOW - 57 * 6e4, w: 0, l: [], s: 2, me: true, birth: '2003-04-12', sign: '♈ Bélier' },
  { n: 'Morayo09 Morayo09', e: 'morayo.elegbede@epitech.eu', st: 'ok', at: NOW - 10 * D, w: 7, l: [['github', 'morayo-dev']], s: 1, birth: null },
  { n: 'Morayo Demo', e: 'demo.morex@example.com', st: 'ok', at: NOW - 15 * D, w: 18, l: [['github', 'morayo-demo'], ['microsoft', 'demo@epitech.eu']], s: 26, birth: '2001-09-30', sign: '♎ Balance' },
  { n: 'loic45@gmail.com', e: 'loic45@gmail.com', st: 'ok', at: NOW - 19 * D, w: 1, l: [], s: 2, birth: null },
  { n: 'exauce12@gmail.com', e: 'exauce12@gmail.com', st: 'ok', at: NOW - 19 * D, w: 0, l: [['google', 'exauce12@gmail.com']], s: 1, birth: null },
  { n: 'morayo688@gmail.com', e: 'morayo688@gmail.com', st: 'ok', at: NOW - 19 * D, w: 0, l: [], s: 0, birth: null },
]
const SC = { admin: '#a78bfa', ok: '#34d399', wait: '#fbbf24', ban: '#f87171' }
const SV = { weather: ['Météo', '☀️', '#0ea5e9'], rss: ['Actus', '📰', '#f97316'], market_data: ['Bourse', '₿', '#f59e0b'], github: ['GitHub', '🐙', '#a78bfa'], youtube: ['YouTube', '▶', '#ff0033'], calendar: ['Agenda', '📅', '#f43f5e'], worldclock: ['Horloge', '🌍', '#6366f1'], wellbeing: ['Bien-être', '✨', '#ec4899'], custom_api: ['API perso', '{ }', '#10b981'] }
const ALLW = [
  ['weather', 'Météo actuelle', 'Paris', 300, 2], ['weather', 'Prévisions 5 jours', 'Lagos', 1800, 14], ['rss', 'Dernières actus', 'Le Monde', 600, 4], ['rss', 'Dernières actus', 'TechCrunch', 600, 4, 'Feed returned HTTP 404'],
  ['market_data', 'Cours crypto', 'Bitcoin', 60, 1], ['market_data', 'Historique', 'Ethereum', 300, 3, 'CoinGecko returned HTTP 429'], ['github', 'Dépôts', 'morayo-dev', 900, 9], ['github', 'Activité du jour', null, 900, 9],
  ['youtube', 'Stats chaîne', 'Epitech', 3600, 22], ['calendar', 'Prochains événements', 'Cours', 900, 6], ['worldclock', 'Fuseaux horaires', 'Paris · Lagos · Tokyo', 30, 0],
  ['wellbeing', 'Horoscope', 'Bélier', 86400, 300], ['wellbeing', 'Citation du jour', null, 86400, 300], ['custom_api', 'Requête JSON', 'Mon API', 120, 1],
  ['rss', 'Dernières actus', 'Hacker News', 600, 5], ['weather', 'Qualité de l\'air', 'Paris', 1800, 8], ['market_data', 'Cours crypto', 'Solana', 60, 1], ['github', 'Pull requests', null, 900, 12],
].map(([s, w, title, every, ago, err]) => ({ s, w, title, every, ago, err }))
const widgetsOf = (u) => ALLW.slice(0, u.w)
const PROV = {
  github: '<span class="adm-prov github" style="width:26px;height:26px"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.58 2 12.2c0 4.5 2.87 8.32 6.84 9.67.5.1.68-.22.68-.49 0-.24-.01-1.04-.01-1.88-2.78.51-3.5-.7-3.72-1.34-.13-.34-.68-1.38-1.16-1.66-.4-.22-.97-.77-.01-.78.9-.01 1.55.85 1.76 1.2 1.03 1.75 2.68 1.26 3.33.96.1-.75.4-1.26.72-1.55-2.53-.29-5.18-1.29-5.18-5.72 0-1.26.44-2.3 1.16-3.11-.12-.29-.5-1.48.11-3.08 0 0 .95-.31 3.12 1.19a10.6 10.6 0 0 1 2.84-.39c.96 0 1.93.13 2.84.39 2.17-1.5 3.12-1.19 3.12-1.19.61 1.6.23 2.79.11 3.08.72.81 1.16 1.84 1.16 3.11 0 4.44-2.66 5.43-5.19 5.72.41.36.77 1.07.77 2.17 0 1.57-.01 2.83-.01 3.22 0 .27.18.6.69.49A10.02 10.02 0 0 0 22 12.2C22 6.58 17.52 2 12 2Z"/></svg></span>',
  google: '<span class="adm-prov google" style="width:26px;height:26px"><svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.4 29.3 35 24 35c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l5.7-5.7C34.6 5 29.6 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21 21-9.4 21-21c0-1.2-.1-2.3-.4-3.5Z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.2-4.3 5.6l6.6 5.6c-.5.4 7.4-5.4 7.4-15.7 0-1.2-.1-2.3-.4-3.5Z"/></svg></span>',
  microsoft: '<span class="adm-prov microsoft" style="width:26px;height:26px"><svg viewBox="0 0 23 23"><path fill="#f25022" d="M1 1h10v10H1z"/><path fill="#7fba00" d="M12 1h10v10H12z"/><path fill="#00a4ef" d="M1 12h10v10H1z"/><path fill="#ffb900" d="M12 12h10v10H12z"/></svg></span>',
}
const big = (html) => html.replace(/width:26px;height:26px/g, 'width:34px;height:34px')
const rel = (t) => { const m = (NOW - t) / 6e4; return m < 60 ? `il y a ${Math.round(m)} minutes` : m < 1440 ? `il y a ${Math.round(m / 60)} heures` : `il y a ${Math.round(m / 1440)} jours` }
const longd = (t) => new Date(t).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' })
const badge = (u) => u.st === 'admin' ? '<span class="adm-badge admin">★ Admin</span>' : '<span class="adm-badge ok">● Actif</span>'
const fq = (n) => n < 60 ? `toutes les ${n} s` : n < 3600 ? `toutes les ${n / 60} min` : n < 86400 ? `toutes les ${n / 3600} h` : '1 fois par jour'
const ago = (m) => m < 1 ? 'à l\'instant' : m < 60 ? `il y a ${m} min` : `il y a ${Math.round(m / 60)} h`
const ic = (s) => `<span class="ic" style="--c:${SV[s][2]}">${SV[s][1]}</span>`

const WV = {
  1: ['Tuiles', (W) => `<div class="tiles">${W.map((x) => `<div class="tile ${x.err ? 'err' : ''}"><div class="top">${ic(x.s)}<div style="min-width:0"><b>${x.title ?? x.w}</b><small>${SV[x.s][0]} · ${x.w}</small></div></div><div class="st"><i></i>${x.err ? 'en erreur' : `à jour · ${ago(x.ago)}`}</div>${x.err ? `<code title="${x.err}">${x.err}</code>` : `<small>${fq(x.every)}</small>`}</div>`).join('')}</div>`],
  2: ['Groupés par service', (W) => { const by = {}; W.forEach((x) => (by[x.s] ??= []).push(x))
    return Object.entries(by).sort((a, b) => b[1].length - a[1].length).map(([s, xs]) => `<div class="grp" style="--c:${SV[s][2]}"><div class="gh">${ic(s)}<b>${SV[s][0]}</b><span class="n">${xs.length} widget${xs.length > 1 ? 's' : ''}${xs.some((x) => x.err) ? ' · <span style="color:#fca5a5">⚠ erreur</span>' : ''}</span></div>${xs.map((x) => `<div class="row"><span><b style="font-weight:500">${x.title ?? x.w}</b><br><small>${x.w}</small></span><small>${fq(x.every)}</small><span class="${x.err ? 'ko' : 'okk'}" title="${x.err ?? ''}">${x.err ? '⚠ ' + x.err.slice(0, 22) + '…' : '● ' + ago(x.ago)}</span></div>`).join('')}</div>`).join('') }],
  3: ['Aperçu du dashboard', (W) => `<div class="mini">${W.map((x, i) => `<div class="mt ${x.err ? 'err' : ''} ${[0, 4, 9].includes(i) ? 'w2' : ''} ${[2, 6].includes(i) ? 'h2' : ''}" style="--c:${SV[x.s][2]}" title="${SV[x.s][0]} · ${x.w}${x.err ? ' · ' + x.err : ''}"><span>${SV[x.s][1]}</span><b>${x.title ?? x.w}</b></div>`).join('')}</div>`],
  4: ['Système solaire', (W, u) => `<div class="orb" style="--c:${SC[u.st]}"><span class="ring" style="width:280px;height:280px"></span><span class="ring" style="width:520px;height:360px"></span><img class="center" src="${AV(u.n)}" alt="">
    ${W.map((x, i) => { const inner = i % 2 === 0, a = (i / W.length) * Math.PI * 2 - Math.PI / 2, rx = inner ? 140 : 260, ry = inner ? 140 : 180
      return `<span class="pl ${x.err ? 'err' : ''}" style="--c:${SV[x.s][2]};left:calc(50% + ${Math.cos(a) * rx}px);top:calc(50% + ${Math.sin(a) * ry}px)" title="${SV[x.s][0]} · ${x.title ?? x.w}${x.err ? ' · ' + x.err : ''}">${SV[x.s][1]}<b>${x.title ?? x.w}</b></span>` }).join('')}</div>`],
}
let sel = 2, wv = +(location.hash.slice(1) || 1)

function sheet(u) {
  const W = widgetsOf(u), errs = W.filter((x) => x.err).length, days = Math.floor((NOW - u.at) / D)
  const links = u.l.map(([p, n]) => `<span class="adm-link">${PROV[p]}<span>${n}</span></span>`).join('')
  return `<div class="adm-glass adm-sheet" style="--c:${SC[u.st]}"><div class="adm-sheet-orb"></div>
    <div class="adm-sheet-id"><span class="adm-sheet-av"><img class="adm-av" src="${AV(u.n)}" width="124" height="124" alt=""></span><div class="adm-grow"><h3>${u.n}${u.me ? ' <span class="adm-muted">(toi)</span>' : ''}</h3><p>${u.e}</p><div class="adm-sheet-badges">${badge(u)}<span class="adm-muted">actif il y a 20 minutes</span></div></div></div>
    <div class="adm-kv"><div style="--k:#a78bfa"><b>${u.w}</b><span>Widgets</span></div><div style="--k:#f472b6" class="adm-kv-links">${u.l.length ? `<span class="adm-links">${u.l.map(([p]) => big(PROV[p])).join('')}</span>` : '<span class="adm-muted">aucun</span>'}<span>Comptes liés</span></div><div style="--k:#38bdf8"><b>${u.s}</b><span>Sessions</span></div><div style="--k:#34d399"><b>${days}</b><span>jours sur Morex</span></div></div>
    <div class="adm-sheet-cols"><div class="adm-lines">
      <div><span>Inscrit le</span><b>${longd(u.at)}</b></div>
      <div><span>Date de naissance</span><b>${u.birth ? `${new Date(u.birth).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' })} · ${new Date().getFullYear() - +u.birth.slice(0, 4)} ans · ${u.sign}` : 'non renseignée'}</b></div>
      <div><span>Dernière connexion</span><b>il y a 3 heures</b></div><div><span>E-mail</span><b>confirmé ✓</b></div><div><span>Rôle</span><b>${u.st === 'admin' ? 'administrateur' : 'utilisateur'}</b></div>
      ${u.l.length ? `<div><span>Comptes liés</span><span class="adm-links">${links}</span></div>` : ''}</div>
      <div class="adm-sessions"><div class="adm-sessions-title">Connexions ouvertes</div>
        <div class="adm-session"><span class="adm-session-ic">💻</span><span class="adm-grow"><b>Chrome · Linux</b><small>ouverte il y a 3 heures · active il y a 20 minutes</small></span></div>
        ${u.s > 1 ? '<div class="adm-session"><span class="adm-session-ic">📱</span><span class="adm-grow"><b>Safari · iOS</b><small>ouverte il y a 30 heures · active il y a 5 heures</small></span></div>' : ''}</div></div>
    <div class="wsec"><div class="wsec-head"><span class="t">Ses widgets</span>${W.length ? `<span class="pill ok">● ${W.length - errs} fonctionnent</span>${errs ? `<span class="pill bad">⚠ ${errs} en erreur</span>` : ''}` : ''}</div>
      ${W.length ? WV[wv][1](W, u) : '<div class="adm-muted">Aucun widget pour l\'instant</div>'}</div>
    <div class="adm-sheet-acts"><button class="adm-btn">✎ Renommer</button><button class="adm-btn">⬇ Exporter</button><span class="adm-sheet-danger"><button class="adm-btn danger" ${u.me ? 'disabled' : ''}>⛔ Suspendre</button><button class="adm-btn danger" ${u.me ? 'disabled' : ''}>🗑 Supprimer</button></span></div></div>`
}
const ICON = { overview: '<circle cx="12" cy="12" r="3.2" fill="currentColor"/><ellipse cx="12" cy="12" rx="9.5" ry="3.6" fill="none" stroke="currentColor" stroke-width="1.5" transform="rotate(-20 12 12)"/>', accounts: '<circle cx="7" cy="8" r="2" fill="currentColor"/><circle cx="17" cy="7" r="1.6" fill="currentColor"/><circle cx="13" cy="16" r="2.2" fill="currentColor"/><circle cx="5" cy="17" r="1.3" fill="currentColor"/><path d="M7 8 17 7 13 16 5 17 7 8" fill="none" stroke="currentColor" stroke-width="1" opacity=".55"/>', services: '<circle cx="12" cy="12" r="2.6" fill="currentColor"/><circle cx="12" cy="12" r="6" fill="none" stroke="currentColor" opacity=".5"/><circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" opacity=".35"/><circle cx="18" cy="12" r="1.5" fill="currentColor"/>', moderation: '<path d="M12 2.5 19.5 5.5v6c0 4.6-3.2 8.3-7.5 10-4.3-1.7-7.5-5.4-7.5-10v-6Z" fill="none" stroke="currentColor" stroke-width="1.5"/>' }
function draw() {
  const nav = [['overview', 'Vue d’ensemble'], ['accounts', 'Comptes'], ['services', 'Services'], ['moderation', 'Modération']].map(([k, l]) => `<button class="${k === 'accounts' ? 'on' : ''}"><span><svg viewBox="0 0 24 24">${ICON[k]}</svg><span class="adm-label-txt">${l}</span></span></button>`).join('')
  document.getElementById('app').innerHTML = `<div class="adm"><aside class="adm-glass adm-side"><div class="adm-brand"><img src="/logo.svg" alt=""><span class="adm-label-txt">Morex<small>console admin</small></span><button class="adm-fold"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2"/></svg></button></div>${nav}
    <div class="adm-me"><img src="${AV('Morayo ELEGBEDE')}" alt=""><div class="adm-label-txt"><b>Morayo</b><small>admin</small></div></div><a class="adm-back" href="#"><span>←</span><span class="adm-label-txt">Retour au dashboard</span></a></aside>
    <main class="adm-main"><div class="adm-crumb"><div class="adm-langs"><button class="on">FR</button><button>EN</button><button>ES</button></div></div>
    <div class="adm-tools"><button class="adm-chip on">Tous <b>6</b></button><button class="adm-chip">Non confirmés <b>0</b></button><button class="adm-chip">Suspendus <b>0</b></button><button class="adm-chip">Admins <b>1</b></button><button class="adm-btn">⬇ CSV</button><div class="adm-find" id="find"><button class="adm-find-lens" data-find><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button><input placeholder="Nom ou e-mail…"></div></div>
    <div class="adm-md"><div class="adm-glass adm-list">${U.map((u, i) => `<button class="adm-li ${i === sel ? 'on' : ''}" data-sel="${i}"><span class="adm-li-av"><img class="adm-av" src="${AV(u.n)}" width="46" height="46" alt=""><i style="background:${SC[u.st]}"></i></span><span class="adm-grow"><b>${u.n}${u.me ? ' <span class="adm-muted">(toi)</span>' : ''}</b><small>${u.e}</small></span><span class="adm-li-w"><b>${u.w}</b>widgets</span></button>`).join('')}<div class="adm-kbd"><i>↑</i><i>↓</i> pour passer d’un compte à l’autre</div></div>${sheet(U[sel])}</div></main></div>`
  document.getElementById('switch').innerHTML = '<span>Ses widgets :</span>' + Object.entries(WV).map(([k, [n]]) => `<button class="${+k === wv ? 'on' : ''}" data-wv="${k}">${k} · ${n}</button>`).join('')
}
document.addEventListener('click', (e) => { if (e.target.closest('[data-find]')) { const f = document.getElementById('find'); f.classList.add('open'); f.querySelector('input').focus(); return } const a = e.target.closest('[data-sel]'); if (a) { sel = +a.dataset.sel; draw() } const b = e.target.closest('[data-wv]'); if (b) { wv = +b.dataset.wv; location.hash = wv; draw() } })
draw()
</script>
</body>
</html>
