<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Morex horoscope</title>
<link rel="icon" type="image/svg+xml" href="/logo.svg" />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,500&family=Cinzel:wght@500;600&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; font-family: Poppins, system-ui, sans-serif; color: #fff; background-color: #020617;
    background: linear-gradient(rgb(2 6 23 / .62), rgb(15 12 50 / .8)), url(/accueil_photo.jpg) 50% 28%/cover fixed; }
  h1 { text-align: center; font-weight: 600; margin: 0; padding-top: 36px; }
  .lead { text-align: center; color: rgb(255 255 255 / .65); margin: 8px auto 26px; max-width: 820px; padding: 0 16px; }
  .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 22px; max-width: 1300px; margin: 0 auto; padding: 0 20px 50px; }
  @media (max-width: 1100px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 620px) { .grid { grid-template-columns: 1fr; } }
  .opt > p { margin: 12px 0 0; font-size: 13px; color: rgb(255 255 255 / .65); } .opt > p b { color: #fff; }
  .hint { margin-top: 6px; font-size: 11.5px; color: #c4b5fd; }

  /* Every card: a dreamy front, and a back with the details, revealed on tap */
  .card { position: relative; height: 380px; border-radius: 28px; cursor: pointer; perspective: 1100px; }
  .in { position: absolute; inset: 0; transition: transform .9s cubic-bezier(.3, .1, .2, 1); transform-style: preserve-3d; }
  .card.open .in { transform: rotateY(180deg); }
  .face { position: absolute; inset: 0; border-radius: 28px; overflow: hidden; backface-visibility: hidden; -webkit-backface-visibility: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 26px 22px; }
  .back { transform: rotateY(180deg); justify-content: flex-start; gap: 14px; }
  .glyph { font-family: 'Segoe UI Symbol', 'DejaVu Sans', serif; line-height: 1; }
  .name { font: 500 13px Cinzel, serif; letter-spacing: .45em; text-transform: uppercase; }
  .msg { font: italic 500 19px/1.38 'Cormorant Garamond', serif; max-width: 250px; }
  .front { padding-bottom: 50px !important; }
  .tap { position: absolute; bottom: 16px; left: 0; right: 0; font-size: 10.5px; letter-spacing: .25em; text-transform: uppercase; opacity: .55; }
  .tap::before { content: "✦ "; }
  .face > .tap { position: absolute !important; }
  .disc { margin-top: auto; font-size: 10px; opacity: .45; }

  /* The back: three soft rows + the lucky charms */
  .row { width: 100%; display: flex; align-items: center; gap: 12px; text-align: left; }
  .row .o { width: 40px; height: 40px; flex: none; border-radius: 50%; display: grid; place-items: center; font-size: 17px; background: rgb(255 255 255 / .08); position: relative; }
  .row .o::after { content: ''; position: absolute; inset: -3px; border-radius: 50%; background: conic-gradient(var(--c) calc(var(--p) * 1%), transparent 0); -webkit-mask: radial-gradient(closest-side, transparent 88%, #000 90%); mask: radial-gradient(closest-side, transparent 88%, #000 90%); }
  .row b { display: block; font: 600 12px Poppins; letter-spacing: .08em; text-transform: uppercase; opacity: .85; }
  .row span { font: italic 500 15px/1.3 'Cormorant Garamond', serif; }
  .charms { display: flex; gap: 22px; justify-content: center; font: 500 13px Poppins; opacity: .9; margin-top: 4px; }
  .charms i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; vertical-align: -1px; margin-right: 6px; box-shadow: 0 0 12px currentColor; }
  .back h4 { margin: 0; font: 500 12px Cinzel, serif; letter-spacing: .35em; opacity: .8; }

  /* 1 · Nébuleuse */
  .neb .face { background: #0b0620; }
  .neb .front::before, .neb .back::before { content: ''; position: absolute; inset: -40%; background: radial-gradient(circle at 30% 30%, rgb(236 72 153 / .55), transparent 40%), radial-gradient(circle at 70% 60%, rgb(99 102 241 / .6), transparent 45%), radial-gradient(circle at 50% 90%, rgb(56 189 248 / .35), transparent 40%); filter: blur(30px); animation: swirl 18s linear infinite; }
  @keyframes swirl { to { transform: rotate(360deg); } }
  .neb .face > * { position: relative; }
  .neb .glyph { font-size: 96px; color: #fff; text-shadow: 0 0 20px #f9a8d4, 0 0 60px #a78bfa; animation: breathe 5s ease-in-out infinite; }
  @keyframes breathe { 50% { transform: scale(1.06); text-shadow: 0 0 30px #f9a8d4, 0 0 90px #a78bfa; } }
  .neb .name { margin: 18px 0 14px; }
  .dust { position: absolute !important; inset: 0; pointer-events: none; }
  .dust i { position: absolute; width: 2px; height: 2px; border-radius: 50%; background: #fff; box-shadow: 0 0 6px #fff; animation: float 9s linear infinite; }
  @keyframes float { from { transform: translateY(40px); opacity: 0; } 20%, 80% { opacity: 1; } to { transform: translateY(-340px); opacity: 0; } }

  /* 2 · Lune d'or */
  .moon .face { background: radial-gradient(circle at 50% 38%, #1d2350, #080a1f 70%); }
  .moon .orb { position: relative; width: 150px; height: 150px; border-radius: 50%; display: grid; place-items: center;
    background: radial-gradient(circle at 35% 35%, #fff7d6, #f5d77a 45%, #b8892e 100%); box-shadow: 0 0 40px rgb(245 215 122 / .55), 0 0 120px rgb(245 215 122 / .25); animation: glow 6s ease-in-out infinite; }
  @keyframes glow { 50% { box-shadow: 0 0 60px rgb(245 215 122 / .7), 0 0 160px rgb(245 215 122 / .35); } }
  .moon .orb::after { content: ''; position: absolute; inset: -14px; border-radius: 50%; border: 1px solid rgb(245 215 122 / .35); animation: halo 8s linear infinite; border-top-color: transparent; }
  @keyframes halo { to { transform: rotate(360deg); } }
  .moon .glyph { font-size: 64px; color: #5b3d0a; opacity: .75; }
  .moon .name { margin: 26px 0 10px; color: #f5d77a; }
  .moon .msg { color: #f3ecd6; }

  /* 3 · Aurore */
  .aur .face { background: #06131f; }
  .aur .front::before, .aur .back::before { content: ''; position: absolute; inset: 0; background: linear-gradient(115deg, transparent 20%, rgb(45 212 191 / .55) 40%, rgb(167 139 250 / .55) 55%, transparent 75%); filter: blur(24px); animation: wave 9s ease-in-out infinite alternate; }
  @keyframes wave { from { transform: translateX(-30%) skewY(-8deg); } to { transform: translateX(30%) skewY(6deg); } }
  .aur .face > * { position: relative; }
  .aur .glyph { font-size: 150px; color: rgb(255 255 255 / .1); position: absolute !important; top: 22px; }
  .aur .name { font-size: 20px; letter-spacing: .3em; margin-bottom: 14px; margin-top: 40px; }
  .aur .msg { font-size: 21px; }

  /* 4 · Carte d'oracle (minimal) */
  .ora .face { background: linear-gradient(170deg, #fdf6ff, #efe4ff); color: #3b2a63; }
  .ora .frame { position: absolute; inset: 12px; border: 1px solid rgb(59 42 99 / .25); border-radius: 20px; pointer-events: none; }
  .ora .frame::before, .ora .frame::after { content: '✦'; position: absolute; left: 50%; transform: translateX(-50%); font-size: 12px; color: #8b5cf6; background: #f6eeff; padding: 0 8px; }
  .ora .frame::before { top: -9px; } .ora .frame::after { bottom: -9px; }
  .ora .glyph { font-size: 72px; color: #8b5cf6; }
  .ora .name { color: #6d4fb0; margin: 16px 0 14px; }
  .ora .msg { color: #3b2a63; }
  .ora .tap { color: #6d4fb0; }
  .ora .row .o { background: rgb(139 92 246 / .1); }
  .ora .row span { color: #3b2a63; }
</style>
</head>
<body>
<h1>Horoscope, propositions « rêve »</h1>
<p class="lead">Une seule phrase et de la lumière sur la face visible. Touche une carte : elle se retourne et révèle l’amour, le travail, l’énergie et tes porte-bonheur (vraies données du backend, Capricorne)</p>
<div class="grid" id="g"></div>
<script>
const H = {"sign": "capricorn", "text": {"en": "Discipline gets you further than speed today. Keep your plans flexible; a pleasant surprise is possible.", "es": "La disciplina te lleva más lejos que la velocidad hoy. Mantén tus planes flexibles; es posible una sorpresa agradable.", "fr": "La discipline te mène plus loin que la vitesse aujourd’hui. Garde tes plans souples ; une bonne surprise est possible."}, "areas": {"love": {"text": {"en": "Great day to plan something fun with someone you love.", "es": "Gran día para planear algo divertido con alguien que quieres.", "fr": "Super journée pour prévoir un moment sympa avec quelqu’un que tu aimes."}, "stars": 5}, "work": {"text": {"en": "You are in the zone: tackle the big project.", "es": "Estás en tu mejor momento: ataca el gran proyecto.", "fr": "Tu es dans ta zone : attaque le gros projet."}, "stars": 4}, "energy": {"text": {"en": "Great day for sport or a new challenge.", "es": "Gran día para el deporte o un nuevo reto.", "fr": "Super journée pour le sport ou un nouveau défi."}, "stars": 4}}, "lucky": {"color": {"hex": "#facc15", "name": {"en": "Yellow", "es": "Amarillo", "fr": "Jaune"}}, "number": 74}, "source": "library", "forDate": "2026-09-27", "disclaimer": {"en": "For entertainment only — not advice.", "es": "Solo por entretenimiento — no es un consejo.", "fr": "Pour le plaisir uniquement — pas un conseil."}}
const L = 'fr'
const GL = { aries: '♈', taurus: '♉', gemini: '♊', cancer: '♋', leo: '♌', virgo: '♍', libra: '♎', scorpio: '♏', sagittarius: '♐', capricorn: '♑', aquarius: '♒', pisces: '♓' }
const NAME = { capricorn: 'Capricorne' }
const gl = GL[H.sign] + '︎', nm = NAME[H.sign] ?? H.sign
// The day's message only (the sign trait + day theme): short and soft
const msg = H.text[L]
const AREA = { love: ['❤', 'Amour', '#f472b6'], work: ['✎', 'Travail', '#38bdf8'], energy: ['✺', 'Énergie', '#fde047'] }
const back = (title) => `<div class="face back"><h4>${title}</h4>
  ${Object.entries(H.areas).map(([k, a]) => `<div class="row"><div class="o" style="--c:${AREA[k][2]};--p:${a.stars * 20}">${AREA[k][0]}</div><div><b>${AREA[k][1]}</b><span>${a.text[L]}</span></div></div>`).join('')}
  <div class="charms"><span>✦ ${H.lucky.number}</span><span><i style="background:${H.lucky.color.hex};color:${H.lucky.color.hex}"></i>${H.lucky.color.name[L]}</span></div>
  <div class="disc">${H.disclaimer[L]}</div></div>`
const dust = `<div class="dust">${Array.from({ length: 22 }, (_, i) => `<i style="left:${(i * 43) % 100}%;top:${60 + (i * 17) % 40}%;animation-delay:-${(i * 0.7).toFixed(1)}s;animation-duration:${7 + (i % 5)}s"></i>`).join('')}</div>`
const card = (cls, front) => `<div class="card ${cls}" onclick="this.classList.toggle('open')"><div class="in">${front}${back('Aujourd’hui')}</div></div>`
const list = [
  ['Nébuleuse', 'ton symbole brille au cœur d’une nébuleuse rose et violette qui tourne lentement, avec de la poussière d’étoiles qui monte',
    card('neb', `<div class="face front">${dust}<div class="glyph">${gl}</div><div class="name">${nm}</div><div class="msg">${msg}</div><div class="tap">touche pour ta journée</div></div>`)],
  ['Lune d’or', 'une lune dorée qui respire doucement, entourée d’un halo, ton signe gravé dedans',
    card('moon', `<div class="face front"><div class="orb"><div class="glyph">${gl}</div></div><div class="name">${nm}</div><div class="msg">${msg}</div><div class="tap">touche pour ta journée</div></div>`)],
  ['Aurore', 'une aurore boréale qui ondule derrière ton signe écrit en grand, presque transparent',
    card('aur', `<div class="face front"><div class="glyph">${gl}</div><div class="name">${nm}</div><div class="msg">${msg}</div><div class="tap">touche pour ta journée</div></div>`)],
  ['Carte d’oracle', 'une carte claire et épurée, fine bordure et étoiles, comme une carte d’oracle',
    card('ora', `<div class="face front"><span class="frame"></span><div class="glyph">${gl}</div><div class="name">${nm}</div><div class="msg">${msg}</div><div class="tap">touche pour ta journée</div></div>`)],
]
// ?dos shows every card from the back (used to check them)
const showBack = location.search.includes('dos')
document.getElementById('g').innerHTML = list.map(([n, d, h], i) => `<div class="opt">${h}<p><b>${i + 1} · ${n}</b> : ${d}</p><div class="hint">↻ Touche-la pour voir le dos</div></div>`).join('')
if (showBack) document.querySelectorAll('.card').forEach((c) => c.classList.add('open'))
</script>
</body>
</html>
