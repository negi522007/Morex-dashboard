<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Morex bandeau admin</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; font-family: Poppins, system-ui, sans-serif; color: #fff; background-color: #020617;
    background: linear-gradient(rgb(2 6 23 / .45), rgb(2 6 23 / .7)), url(/accueil_photo.jpg) 50% 28%/cover fixed; }
  h1 { text-align: center; font-weight: 600; margin: 0; padding-top: 28px; }
  .lead { text-align: center; color: rgb(255 255 255 / .75); margin: 8px auto 28px; font-size: 14px; }
  .wrap { max-width: 1400px; margin: 0 auto; padding: 0 28px 80px; display: flex; flex-direction: column; gap: 34px; }
  .num { display: inline-block; font-size: 13px; font-weight: 700; padding: 4px 12px; border-radius: 999px; background: #fff; color: #1e1b4b; margin: 0 0 10px 6px; }
  .num span { font-weight: 400; margin-left: 6px; }
  .glass { background: rgb(255 255 255 / .08); border: 1px solid rgb(255 255 255 / .14); border-radius: 24px; backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); }
  .banner { display: flex; align-items: center; gap: 24px; padding: 26px 30px; flex-wrap: wrap; position: relative; overflow: hidden; }
  .av { width: 64px; height: 64px; border-radius: 50%; flex: none; background: #c0aede url("https://api.dicebear.com/9.x/avataaars/svg?seed=Morayo&skinColor=ae5d29&top=curly&hairColor=2c1b18&eyes=happy&mouth=smile&clothing=hoodie&clothesColor=5199e4&backgroundColor=c0aede") center/cover;
    box-shadow: 0 0 0 2px rgb(255 255 255 / .3), 0 0 20px rgb(99 102 241 / .5); }
  .hi { margin: 0; font-size: 34px; font-weight: 600; letter-spacing: -.02em; }
  .grad { background: linear-gradient(90deg, #fff, #818cf8 60%, #38bdf8); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .calm { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 999px; background: rgb(52 211 153 / .15); color: #a7f3d0; font-size: 14.5px; font-weight: 600; }
  .calm i { width: 9px; height: 9px; border-radius: 50%; background: #34d399; animation: pl 1.8s infinite; }
  @keyframes pl { 0% { box-shadow: 0 0 0 0 rgb(52 211 153 / .7); } 100% { box-shadow: 0 0 0 10px rgb(52 211 153 / 0); } }
  .muted { color: rgb(255 255 255 / .65); }
  .mono { font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; }

  /* 1 Horloge du cockpit */
  .b1 .clock { font-size: 64px; font-weight: 300; letter-spacing: -.04em; line-height: 1; font-variant-numeric: tabular-nums; }
  .b1 .clock small { font-size: 26px; opacity: .55; }
  .b1 .sep { width: 1px; align-self: stretch; background: rgb(255 255 255 / .15); }
  .b1 .date { font-size: 17px; } .b1 .date::first-letter { text-transform: uppercase; }

  /* 2 Page de calendrier */
  .b2 .cal { width: 92px; flex: none; border-radius: 18px; overflow: hidden; text-align: center; background: #fff; color: #1e1b4b; box-shadow: 0 12px 30px -10px rgb(129 140 248 / .8); }
  .b2 .cal .m { background: linear-gradient(90deg, #818cf8, #38bdf8); color: #fff; font-size: 12px; font-weight: 700; letter-spacing: .14em; padding: 6px 0; text-transform: uppercase; }
  .b2 .cal .d { font-size: 42px; font-weight: 700; line-height: 1.1; padding-top: 4px; }
  .b2 .cal .w { font-size: 11.5px; font-weight: 600; opacity: .6; padding-bottom: 8px; text-transform: uppercase; letter-spacing: .08em; }
  .b2 .sub { font-size: 15px; margin-top: 4px; }

  /* 3 Lune et date */
  .b3 .moon { width: 74px; height: 74px; flex: none; position: relative; }
  .b3 .moon svg { width: 100%; height: 100%; filter: drop-shadow(0 0 16px rgb(254 243 199 / .55)); }
  .b3 .line { font-size: 16px; margin-top: 4px; } .b3 .line b { font-weight: 600; } .b3 .line::first-letter { text-transform: uppercase; }
  .b3 .phase { font-size: 13px; color: #fde68a; margin-top: 2px; }

  /* 4 Orbite de l'année */
  .b4 .orbit { width: 96px; height: 96px; flex: none; position: relative; }
  .b4 .orbit svg { width: 100%; height: 100%; }
  .b4 .orbit .c { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; line-height: 1.05; }
  .b4 .orbit .c b { font-size: 26px; display: block; } .b4 .orbit .c small { font-size: 10px; opacity: .65; text-transform: uppercase; letter-spacing: .08em; }
  .b4 .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .chip { display: inline-flex; gap: 6px; align-items: center; padding: 6px 12px; border-radius: 999px; background: rgb(255 255 255 / .08); border: 1px solid rgb(255 255 255 / .12); font-size: 13px; }
  .chip::first-letter { text-transform: uppercase; }

  /* 5 Grande date éditoriale */
  .b5 { padding: 30px 34px; }
  .b5 .big { font-size: 15px; letter-spacing: .3em; text-transform: uppercase; color: rgb(255 255 255 / .6); }
  .b5 .day { font-size: 54px; font-weight: 700; letter-spacing: -.03em; line-height: 1; margin: 6px 0 8px; }
  .b5 .day::first-letter { text-transform: uppercase; }
  .b5 .hello { font-size: 18px; display: flex; gap: 10px; align-items: center; }
  .b5 .hello .av { width: 34px; height: 34px; }
  .b5 .right { margin-left: auto; text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 12px; }
  .b5 .clock { font-size: 34px; font-weight: 300; }
  .stars::before { content: ''; position: absolute; inset: 0; pointer-events: none; opacity: .5;
    background-image: radial-gradient(1.5px 1.5px at 20% 30%, #fff, transparent), radial-gradient(1px 1px at 70% 20%, #fff, transparent), radial-gradient(1px 1px at 85% 70%, #fff, transparent), radial-gradient(1.5px 1.5px at 45% 80%, #fff, transparent), radial-gradient(1px 1px at 60% 50%, #fff, transparent); }
</style>
</head>
<body>
<h1>Le bandeau de la console admin</h1>
<p class="lead">5 propositions, toutes avec la date mise en valeur et sans « voici l'état de Morex ». L'heure et la date sont en direct.</p>
<div class="wrap" id="w"></div>
<script>
const now = () => new Date()
const pad = (n) => String(n).padStart(2, '0')
const hello = () => { const h = now().getHours(); return h < 12 ? 'Bonjour' : h < 18 ? 'Bon après-midi' : 'Bonsoir' }
const longDate = (d) => d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })
const weekNo = (d) => { const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day); const y = new Date(Date.UTC(t.getUTCFullYear(), 0, 1)); return Math.ceil(((t - y) / 864e5 + 1) / 7) }
const dayOfYear = (d) => Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 864e5)
const daysInYear = (d) => (new Date(d.getFullYear(), 1, 29).getMonth() === 1 ? 366 : 365)
// Lune : âge en jours depuis une nouvelle lune connue (6 janv. 2000), cycle de 29,53 j
function moon(d) {
  const age = (((d - new Date(Date.UTC(2000, 0, 6, 18, 14))) / 864e5) % 29.530588 + 29.530588) % 29.530588, f = age / 29.530588
  const names = ['Nouvelle lune', 'Premier croissant', 'Premier quartier', 'Lune gibbeuse croissante', 'Pleine lune', 'Lune gibbeuse décroissante', 'Dernier quartier', 'Dernier croissant']
  return { f, name: names[Math.round(f * 8) % 8], light: Math.round((1 - Math.cos(f * 2 * Math.PI)) / 2 * 100) }
}
function moonSvg(f) {
  // côté éclairé : à droite quand la lune croît, à gauche quand elle décroît
  const r = 30, k = Math.cos(f * 2 * Math.PI), sweepOuter = f < .5 ? 1 : 0, rx = Math.abs(k) * r, sweepInner = (f < .5) === (k > 0) ? 0 : 1
  return `<svg viewBox="0 0 74 74"><circle cx="37" cy="37" r="${r}" fill="#1e1b4b" stroke="rgb(255 255 255 / .15)"/>
    <path d="M37 7 A${r} ${r} 0 0 ${sweepOuter} 37 67 A${rx} ${r} 0 0 ${sweepInner} 37 7Z" fill="#fef3c7"/></svg>`
}
const calm = '<span class="calm"><i></i>Tout est calme ✨</span>'
const V = [
  ['Horloge du cockpit', 'la grande horloge du dashboard, la date à côté', (d) => `<div class="glass banner b1"><div class="av"></div><div><h2 class="hi">${hello()}, <span class="grad">Morayo</span></h2></div><span class="sep"></span>
    <div><div class="clock">${pad(d.getHours())}:${pad(d.getMinutes())}<small>:${pad(d.getSeconds())}</small></div><div class="date muted">${longDate(d)}</div></div>${calm}</div>`],
  ['Page de calendrier', 'une petite page d\'éphéméride avec le jour en grand', (d) => `<div class="glass banner b2"><div class="cal"><div class="m">${d.toLocaleDateString('fr-FR', { month: 'long' })}</div><div class="d">${d.getDate()}</div><div class="w">${d.toLocaleDateString('fr-FR', { weekday: 'long' })}</div></div>
    <div><h2 class="hi">${hello()}, <span class="grad">Morayo</span></h2><div class="sub muted">${d.getFullYear()} · semaine ${weekNo(d)} · <span class="mono">${pad(d.getHours())}:${pad(d.getMinutes())}</span></div></div>${calm}</div>`],
  ['Sous la lune', 'la vraie phase de la lune du jour, dans l\'univers Morex', (d) => { const m = moon(d); return `<div class="glass banner b3 stars"><div class="moon">${moonSvg(m.f)}</div>
    <div><h2 class="hi">${hello()}, <span class="grad">Morayo</span></h2><div class="line"><b>${longDate(d)}</b> · <span class="mono">${pad(d.getHours())}:${pad(d.getMinutes())}</span></div><div class="phase">🌙 ${m.name} · ${m.light} % éclairée</div></div>${calm}</div>` }],
  ['Orbite de l\'année', 'un anneau qui montre où on en est dans l\'année', (d) => { const n = dayOfYear(d), T = daysInYear(d), p = n / T, C = 2 * Math.PI * 42, a = p * 2 * Math.PI - Math.PI / 2
    return `<div class="glass banner b4"><div class="orbit"><svg viewBox="0 0 96 96"><circle cx="48" cy="48" r="42" fill="none" stroke="rgb(255 255 255 / .1)" stroke-width="5"/>
      <circle cx="48" cy="48" r="42" fill="none" stroke="url(#g4)" stroke-width="5" stroke-linecap="round" stroke-dasharray="${p * C} ${C}" transform="rotate(-90 48 48)"/>
      <circle cx="${48 + Math.cos(a) * 42}" cy="${48 + Math.sin(a) * 42}" r="6" fill="#fde047" style="filter:drop-shadow(0 0 6px #fde047)"/>
      <defs><linearGradient id="g4"><stop offset="0" stop-color="#818cf8"/><stop offset="1" stop-color="#38bdf8"/></linearGradient></defs></svg>
      <div class="c"><div><b>${d.getDate()}</b><small>${d.toLocaleDateString('fr-FR', { month: 'short' })}</small></div></div></div>
      <div><h2 class="hi">${hello()}, <span class="grad">Morayo</span></h2><div class="chips"><span class="chip">📅 ${longDate(d)}</span><span class="chip">🕐 <span class="mono">${pad(d.getHours())}:${pad(d.getMinutes())}</span></span><span class="chip">🪐 jour ${n} / ${T} · ${Math.round(p * 100)} % de l'année</span></div></div>${calm}</div>` }],
  ['Grande date', 'la date en titre, façon une de journal, l\'heure à droite', (d) => `<div class="glass banner b5"><div><div class="big">${d.getFullYear()} · semaine ${weekNo(d)}</div><div class="day">${d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' })}</div>
    <div class="hello"><div class="av"></div>${hello()}, <b class="grad">Morayo</b></div></div><div class="right"><div class="clock mono">${pad(d.getHours())}:${pad(d.getMinutes())}</div>${calm}</div></div>`],
]
function draw() { const d = now(); document.getElementById('w').innerHTML = V.map(([n, why, f], i) => `<section><span class="num">${i + 1} · ${n}<span>${why}</span></span>${f(d)}</section>`).join('') }
draw(); setInterval(draw, 1000)
</script>
</body>
</html>
