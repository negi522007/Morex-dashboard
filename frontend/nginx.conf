server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 6m;   # avatar uploads

  # Every backend route prefix — keep in sync with vite.config.ts's dev proxy.
  location ~ ^/(auth|widgets|journal|uploads|services|ai|brief|assistant|alerts|share|public|docs|docs-json|about\.json) {
    proxy_pass http://server:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  # Single-page app: unknown paths (/login, /dashboard…) serve index.html.
  location / {
    try_files $uri /index.html;
  }
}
