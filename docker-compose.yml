services:
  server:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      # Always the in-network hostname, regardless of .env (.env's own
      # DATABASE_URL is for running the server outside Docker instead — see
      # CONTRIBUTING.md). SMTP_* is intentionally NOT overridden here: it
      # comes from .env, so a real provider's credentials actually take
      # effect instead of always being forced back to Mailhog.
      DATABASE_URL: postgresql://dashboard:dashboard@db:5432/dashboard
    volumes:
      # Uploaded avatar photos — a named volume so they survive
      # `docker compose down` (not `-v`) and container rebuilds.
      - uploads_data:/app/uploads
    depends_on:
      - db
      - mailhog

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dashboard
      POSTGRES_PASSWORD: dashboard
      POSTGRES_DB: dashboard
    ports:
      - "55432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  # Local SMTP catcher so `docker-compose up` works out of the box with no
  # real email account. Swap SMTP_HOST/PORT/USER/PASSWORD in .env to point at
  # a real provider (e.g. Brevo, Resend) for actual delivery. Web UI: :8025.
  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025"
      - "8025:8025"

  # frontend service to be added once the frontend build/Dockerfile exists (Phase 1)

volumes:
  db_data:
  uploads_data:
